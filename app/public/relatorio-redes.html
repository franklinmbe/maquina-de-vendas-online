<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relatório das redes sociais — Máquina de Vendas Online</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --accent-hover: #ff7554;
    --cyan: #33d6cb;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
  }
  h1 { font-size: 1.3rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0 0 6px; }
  input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1.05rem;
  }
  input:focus { outline: none; border-color: var(--cyan); }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  #status { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; }
  #status.show { display: block; background: rgba(255, 107, 107, 0.12); border: 1px solid var(--error); color: var(--error); }
  #manual-login { display: none; }
  #report { display: none; margin-top: 20px; }
  #report p {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    margin: 0 0 10px;
  }
</style>
</head>
<body>
  <h1>Relatório das redes sociais</h1>

  <div id="manual-login">
    <label for="identifier">E-mail ou telefone</label>
    <input type="text" id="identifier" autocomplete="username" />
    <label for="password">Senha</label>
    <input type="password" id="password" autocomplete="current-password" />
    <button type="button" id="load-btn">Carregar relatório</button>
  </div>

  <div id="status"></div>
  <div id="report"></div>

  <script>
    const HANDOFF_KEY = 'mvo_report_handoff';
    const statusEl = document.getElementById('status');
    const reportEl = document.getElementById('report');
    const manualLoginEl = document.getElementById('manual-login');

    const PLAN_LABELS = {
      iniciante: 'Iniciante em Social Mídia',
      profissional: 'Profissional em Social Mídia',
      especialista: 'Especialista + Gestor de Tráfego',
      personalizado: 'Projeto Personalizado',
    };

    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = 'show';
    }

    async function loadReport(identifier, password) {
      statusEl.className = '';
      try {
        const response = await fetch('/api/social-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
        });
        const result = await response.json();
        if (!response.ok) {
          showError(`Erro: ${result.error || 'falha desconhecida'}`);
          manualLoginEl.style.display = 'block';
          return;
        }
        const connected = Object.keys(result.connections || {});
        const lines = [];
        if (result.plan) lines.push(`Plano: ${PLAN_LABELS[result.plan] || result.plan}`);
        lines.push(connected.length ? `Redes conectadas: ${connected.join(', ')}` : 'Nenhuma rede conectada ainda.');
        if (result.admin) lines.push(`Clientes cadastrados no app: ${result.admin.totalClientes}`);
        reportEl.innerHTML = lines.map((l) => `<p>${l}</p>`).join('');
        reportEl.style.display = 'block';
      } catch (error) {
        showError(`Erro: ${error.message || error}`);
        manualLoginEl.style.display = 'block';
      }
    }

    document.getElementById('load-btn').addEventListener('click', () => {
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      if (!identifier || !password) {
        showError('Digite e-mail/telefone e senha.');
        return;
      }
      loadReport(identifier, password);
    });

    (function autoLoad() {
      try {
        const handoff = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        if (handoff && handoff.identifier && handoff.password) {
          loadReport(handoff.identifier, handoff.password);
          return;
        }
      } catch (e) {}
      manualLoginEl.style.display = 'block';
    })();
  </script>
</body>
</html>
