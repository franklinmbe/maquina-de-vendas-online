<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liberar acesso — Máquina de Vendas Online</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --accent-hover: #ff7554;
    --cyan: #33d6cb;
    --error: #ff6b6b;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1.05rem;
  }
  input:focus {
    outline: none;
    border-color: var(--cyan);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  .row input[type="checkbox"] {
    width: auto;
  }
  .row label {
    margin: 0;
    color: var(--text);
    font-size: 0.9rem;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: default; }
  #status {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.92rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  #status.show { display: block; }
  #status.ok { background: rgba(74, 222, 128, 0.12); border: 1px solid var(--ok); color: var(--ok); }
  #status.error { background: rgba(255, 107, 107, 0.12); border: 1px solid var(--error); color: var(--error); }
  details {
    margin-top: 20px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  details summary {
    cursor: pointer;
    color: var(--cyan);
  }
  details .adv-field {
    margin-top: 12px;
  }
</style>
</head>
<body>
  <h1>Liberar acesso</h1>

  <form id="release-form">
    <label for="passphrase">Sua senha mestra</label>
    <input type="password" id="passphrase" autocomplete="current-password" required />
    <div class="row">
      <input type="checkbox" id="remember-pass" checked />
      <label for="remember-pass">Manter me logado</label>
    </div>

    <label for="identifier">E-mail do cliente</label>
    <input type="text" id="identifier" placeholder="cliente@email.com" required />

    <label for="password">Senha do cliente</label>
    <input type="password" id="password" placeholder="mínimo 6 caracteres" required />

    <button type="submit" id="submit-btn">Liberar acesso</button>

    <details>
      <summary>Opções avançadas</summary>
      <div class="adv-field">
        <label for="client-name">Nome (padrão: tirado do e-mail)</label>
        <input type="text" id="client-name" placeholder="opcional" />
      </div>
      <div class="adv-field">
        <label for="client">Identificador interno (padrão: tirado do e-mail)</label>
        <input type="text" id="client" placeholder="opcional" />
      </div>
      <div class="adv-field">
        <label for="alt-identifier">Telefone alternativo</label>
        <input type="text" id="alt-identifier" placeholder="opcional" />
      </div>
    </details>
  </form>

  <div id="status"></div>

  <script>
    const form = document.getElementById('release-form');
    const statusEl = document.getElementById('status');
    const passInput = document.getElementById('passphrase');
    const rememberEl = document.getElementById('remember-pass');
    const STORAGE_KEY = 'liberar-cliente-passphrase';

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) passInput.value = saved;
    } catch (e) {}

    function showStatus(message, ok) {
      statusEl.textContent = message;
      statusEl.className = 'show ' + (ok ? 'ok' : 'error');
    }

    function deriveDefaults(identifier) {
      const local = identifier.includes('@') ? identifier.split('@')[0] : identifier;
      const words = local.replace(/[^a-zA-Z0-9]+/g, ' ').trim();
      const name = words.replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.slice(1)) || local;
      const client = local.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cliente';
      return { name, client };
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const passphrase = passInput.value;
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      const altIdentifier = document.getElementById('alt-identifier').value.trim();

      const defaults = deriveDefaults(identifier);
      const name = document.getElementById('client-name').value.trim() || defaults.name;
      const client = document.getElementById('client').value.trim() || defaults.client;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Liberando...';
      try {
        const response = await fetch('/api/admin-set-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passphrase, name, identifier, client, plan: '', altIdentifier, password }),
        });
        const result = await response.json();
        if (!response.ok) {
          showStatus(`Erro: ${result.error || 'falha desconhecida'}`, false);
        } else {
          showStatus(`Liberado! ${result.identifier} já pode entrar direto em "Entrar" no app.`, true);
          try {
            if (rememberEl.checked) {
              localStorage.setItem(STORAGE_KEY, passphrase);
            } else {
              localStorage.removeItem(STORAGE_KEY);
            }
          } catch (e) {}
          document.getElementById('identifier').value = '';
          document.getElementById('password').value = '';
          document.getElementById('alt-identifier').value = '';
          document.getElementById('client-name').value = '';
          document.getElementById('client').value = '';
        }
      } catch (error) {
        showStatus(`Erro: ${error.message || error}`, false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Liberar acesso';
      }
    });
  </script>
</body>
</html>
