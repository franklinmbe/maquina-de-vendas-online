<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Máquina de Vendas Online — Upload</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #8b95a5;
    --accent: #ff5a36;
    --accent-hover: #ff7554;
    --cyan: #33d6cb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 60px;
    background: var(--bg);
    color: var(--text);
  }
  .hero {
    margin: 0 -16px 20px;
    position: relative;
  }
  .hero img {
    width: 100%;
    height: auto;
    display: block;
    border-bottom: 2px solid var(--cyan);
  }
  p.sub {
    color: var(--muted);
    margin-top: 0;
    font-size: 0.9rem;
    border-left: 3px solid var(--cyan);
    padding-left: 10px;
  }
  label {
    display: block;
    margin-top: 20px;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--cyan);
  }
  input[type="password"], input[type="email"], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  input[type="password"]:focus, input[type="email"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(51, 214, 203, 0.2);
  }
  textarea { min-height: 90px; resize: vertical; }
  input[type="file"] {
    width: 100%;
    margin-top: 4px;
    padding: 16px 12px;
    color: var(--text);
    background: var(--panel);
    border: 2px dashed var(--cyan);
    border-radius: 8px;
  }
  input[type="file"]::file-selector-button {
    padding: 12px 20px;
    margin-right: 14px;
    border: none;
    border-radius: 8px;
    background: var(--cyan);
    color: #06201e;
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  input[type="file"]::file-selector-button:hover {
    background: #5be5db;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.05rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  #status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 0.9rem;
    white-space: pre-wrap;
    display: none;
  }
  #status.show { display: block; }
  .file-item { padding: 2px 0; }
  .tabs {
    display: flex;
    margin-top: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
    margin-top: 0;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
  .panel { display: none; }
  .panel.active { display: block; }
  .hint {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="hero">
    <img src="/img/hero-robo-crop.png" alt="Máquina de Vendas Online" />
  </div>
  <p class="sub">Enquanto você cuida do seu negócio, a gente cuida das suas redes sociais.</p>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tab-login-btn">Entrar</button>
    <button type="button" class="tab-btn" id="tab-signup-btn">Cadastrar</button>
  </div>

  <form id="signup-form" class="panel">
    <label for="signup-client">Empresa</label>
    <select id="signup-client">
      <option value="kleber-construcao">Kleber Construção</option>
    </select>

    <label for="signup-identifier">E-mail ou telefone</label>
    <input type="text" id="signup-identifier" required autocomplete="username" placeholder="seuemail@exemplo.com ou (11) 91234-5678" />

    <label for="signup-password">Crie uma senha</label>
    <input type="password" id="signup-password" required autocomplete="new-password" minlength="6" />
    <p class="hint">Pelo menos 6 caracteres.</p>

    <label for="signup-invite">Chave de convite</label>
    <input type="password" id="signup-invite" required autocomplete="off" />
    <p class="hint">A chave que o Franklin te passou.</p>

    <button type="submit" id="signup-btn">Cadastrar</button>
  </form>

  <form id="upload-form" class="panel active">
    <label for="identifier">E-mail ou telefone</label>
    <input type="text" id="identifier" required autocomplete="username" placeholder="seuemail@exemplo.com ou (11) 91234-5678" />

    <label for="password">Senha</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <label for="instruction">O que você quer que seja feito</label>
    <textarea id="instruction" required placeholder="Ex: pega essas fotos, faz 3 banners e 3 vídeos, posta 1 vídeo e 1 banner de manhã, tarde e noite, em todas as redes sociais. Não esqueça de colocar as promoções da semana."></textarea>

    <label for="files">Fotos/vídeos</label>
    <input type="file" id="files" multiple accept="image/*,video/*" required />

    <button type="submit" id="submit-btn">Enviar</button>
  </form>

  <div id="status"></div>

  <script type="module">
    import { upload } from 'https://esm.sh/@vercel/blob@0.27.0/client';

    const statusEl = document.getElementById('status');

    function log(line) {
      statusEl.classList.add('show');
      statusEl.textContent += (statusEl.textContent ? '\n' : '') + line;
    }

    const tabLoginBtn = document.getElementById('tab-login-btn');
    const tabSignupBtn = document.getElementById('tab-signup-btn');
    const loginForm = document.getElementById('upload-form');
    const signupForm = document.getElementById('signup-form');

    tabLoginBtn.addEventListener('click', () => {
      tabLoginBtn.classList.add('active');
      tabSignupBtn.classList.remove('active');
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
    });
    tabSignupBtn.addEventListener('click', () => {
      tabSignupBtn.classList.add('active');
      tabLoginBtn.classList.remove('active');
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      statusEl.classList.add('show');

      const client = document.getElementById('signup-client').value;
      const identifier = document.getElementById('signup-identifier').value;
      const password = document.getElementById('signup-password').value;
      const inviteKey = document.getElementById('signup-invite').value;
      const signupBtn = document.getElementById('signup-btn');

      signupBtn.disabled = true;
      signupBtn.textContent = 'Cadastrando...';
      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inviteKey, client, identifier, password }),
        });
        const result = await response.json();
        if (!response.ok) {
          log(`Erro: ${result.error || 'falha desconhecida'}`);
        } else {
          log(`Cadastro feito! Agora entre com esse e-mail/telefone e senha na aba "Entrar".`);
          signupForm.reset();
          document.getElementById('identifier').value = identifier;
          tabLoginBtn.click();
        }
      } catch (error) {
        log(`Erro: ${error.message || error}`);
      } finally {
        signupBtn.disabled = false;
        signupBtn.textContent = 'Cadastrar';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      statusEl.classList.add('show');

      const submitBtn = document.getElementById('submit-btn');
      const identifier = document.getElementById('identifier').value;
      const password = document.getElementById('password').value;
      const instruction = document.getElementById('instruction').value;
      const fileList = document.getElementById('files').files;

      if (fileList.length === 0) {
        log('Escolha pelo menos um arquivo.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      const uploaded = [];
      try {
        for (const file of fileList) {
          log(`Enviando ${file.name}...`);
          const blob = await upload(file.name, file, {
            access: 'public',
            handleUploadUrl: '/api/upload-token',
            clientPayload: JSON.stringify({ identifier, password }),
          });
          uploaded.push({ url: blob.url, name: file.name });
          log(`✓ ${file.name} enviado`);
        }

        log('Registrando pedido...');
        const response = await fetch('/api/commit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password, instruction, files: uploaded }),
        });
        const result = await response.json();

        if (!response.ok && response.status !== 207) {
          log(`Erro: ${result.error || 'falha desconhecida'}`);
        } else {
          log(`Pronto! Pasta criada: ${result.subfolder}`);
          result.files.forEach((f) => log(`  ${f.file}: ${f.status}`));
          log(`  instrucoes.txt: ${result.instructions.status}`);
          loginForm.reset();
        }
      } catch (error) {
        log(`Erro: ${error.message || error}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar';
      }
    });
  </script>
</body>
</html>
