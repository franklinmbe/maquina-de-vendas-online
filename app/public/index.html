<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Máquina de Vendas Online — Upload</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #8b95a5;
    --accent: #ff5a36;
    --accent-hover: #ff7554;
    --cyan: #33d6cb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 60px;
    background: var(--bg);
    color: var(--text);
  }
  .hero {
    margin: 0 -16px 20px;
    position: relative;
  }
  .hero img {
    width: 100%;
    height: auto;
    display: block;
    border-bottom: 2px solid var(--cyan);
  }
  p.sub {
    color: var(--muted);
    margin-top: 0;
    font-size: 0.9rem;
    border-left: 3px solid var(--cyan);
    padding-left: 10px;
  }
  label {
    display: block;
    margin-top: 20px;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--cyan);
  }
  input[type="password"], input[type="email"], input[type="text"], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  input[type="password"]:focus, input[type="email"]:focus, input[type="text"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(51, 214, 203, 0.2);
  }
  textarea { min-height: 90px; resize: vertical; }
  #identifier, #signup-identifier {
    font-size: 1.25rem;
    padding: 16px 14px;
    border: 2px solid var(--cyan);
    font-weight: 600;
  }
  .upload-buttons {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .file-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px 10px;
    color: var(--text);
    background: var(--panel);
    border: 2px dashed var(--cyan);
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    text-align: center;
    cursor: pointer;
  }
  .file-btn:hover { border-color: var(--accent); }
  .file-btn.camera-btn { border-style: solid; border-color: var(--accent); flex: 0 0 auto; padding-left: 18px; padding-right: 18px; }
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .thumb img, .thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb .duration {
    position: absolute;
    bottom: 4px;
    right: 4px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 0.65rem;
    padding: 1px 5px;
    border-radius: 4px;
  }
  .thumb .remove {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    border: none;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.05rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  #status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 0.9rem;
    white-space: pre-wrap;
    display: none;
  }
  #status.show { display: block; }
  .file-item { padding: 2px 0; }
  .tabs {
    display: flex;
    margin-top: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
    margin-top: 0;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
  .panel { display: none; }
  .panel.active { display: block; }
  .hint {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 4px;
  }
  #login-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--cyan);
    background: rgba(51, 214, 203, 0.1);
    font-size: 0.9rem;
    font-weight: 600;
  }
  #login-banner.show { display: flex; }
  #login-banner .logout-link {
    background: none;
    border: none;
    color: var(--accent);
    text-decoration: underline;
    font-weight: 700;
    font-size: 0.8rem;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
    margin: 0;
    width: auto;
  }
  #credentials-fields.hide, #upload-fields.hide { display: none; }
  .instruction-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
    margin-bottom: 6px;
  }
  .instruction-text { flex: 1; min-width: 0; }
  .instruction-label,
  .instruction-hint {
    display: block;
    margin: 0;
    color: var(--cyan);
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: none;
    letter-spacing: normal;
  }
  .instruction-hint { margin-top: 2px; }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(51, 214, 203, 0.55); }
    50% { box-shadow: 0 0 0 10px rgba(51, 214, 203, 0); }
  }
  .mic-btn {
    flex: 0 0 auto;
    width: 68px;
    height: 68px;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    border: none;
    background: var(--cyan);
    color: var(--bg);
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
    animation: mic-pulse 1.8s ease-in-out infinite;
  }
  .mic-btn.recording {
    background: var(--accent);
    color: white;
    animation: none;
  }
  .mic-btn:disabled {
    background: var(--border);
    color: var(--muted);
    opacity: 1;
    cursor: not-allowed;
    animation: none;
  }
  .password-wrap {
    position: relative;
  }
  .password-wrap input {
    padding-right: 46px;
  }
  .toggle-password {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    margin: 0;
    padding: 6px 10px;
    background: none;
    border: none;
    font-size: 1.15rem;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="hero">
    <img src="/img/hero-robo-crop.png" alt="Máquina de Vendas Online" />
  </div>
  <p class="sub">Enquanto você cuida do seu negócio, a gente cuida das suas redes sociais.</p>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tab-login-btn">Entrar</button>
    <button type="button" class="tab-btn" id="tab-signup-btn">Cadastrar</button>
  </div>

  <form id="signup-form" class="panel">
    <label for="signup-identifier">E-mail ou telefone</label>
    <input type="text" id="signup-identifier" required autocomplete="username" placeholder="seuemail@exemplo.com ou (11) 91234-5678" />

    <label for="signup-password">Crie uma senha</label>
    <div class="password-wrap">
      <input type="password" id="signup-password" required autocomplete="new-password" minlength="6" />
      <button type="button" class="toggle-password" data-target="signup-password" aria-label="Mostrar senha">👁️</button>
    </div>
    <p class="hint">Pelo menos 6 caracteres.</p>

    <label for="signup-password-confirm">Confirme a senha</label>
    <div class="password-wrap">
      <input type="password" id="signup-password-confirm" required autocomplete="new-password" minlength="6" />
      <button type="button" class="toggle-password" data-target="signup-password-confirm" aria-label="Mostrar senha">👁️</button>
    </div>
    <p class="hint">Só funciona com o e-mail/telefone que o Franklin liberou pra você.</p>

    <button type="submit" id="signup-btn">Cadastrar</button>
  </form>

  <form id="upload-form" class="panel active">
    <div id="credentials-fields">
      <label for="identifier">E-mail ou telefone</label>
      <input type="text" id="identifier" required autocomplete="username" placeholder="seuemail@exemplo.com ou (11) 91234-5678" />

      <label for="password">Senha</label>
      <div class="password-wrap">
        <input type="password" id="password" required autocomplete="current-password" />
        <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar senha">👁️</button>
      </div>

      <button type="button" id="login-btn">Entrar</button>
    </div>

    <div id="login-banner">
      <span id="login-banner-text"></span>
      <button type="button" class="logout-link" id="logout-btn">Trocar conta</button>
    </div>

    <div id="upload-fields" class="hide">
      <div class="instruction-row">
        <div class="instruction-text">
          <label for="instruction" class="instruction-label">Escreva ou faça seu pedido por áudio</label>
          <p class="instruction-hint">O que você quer que seja feito pelo agente de IA?</p>
        </div>
        <button type="button" class="mic-btn" id="mic-btn" aria-label="Ditar por áudio" title="Ditar por áudio">🎤</button>
      </div>
      <textarea id="instruction" required placeholder="Ex: pega essas fotos, faz 3 banners e 3 vídeos, posta 1 vídeo e 1 banner de manhã, tarde e noite, em todas as redes sociais. Não esqueça de colocar as promoções da semana."></textarea>

      <label>Fotos</label>
      <div class="upload-buttons">
        <label class="file-btn" for="files-images">📁 Escolher fotos</label>
        <input type="file" id="files-images" accept="image/*" multiple hidden />
        <label class="file-btn camera-btn" for="files-camera">📷 Câmera</label>
        <input type="file" id="files-camera" accept="image/*,video/*" capture="environment" hidden />
      </div>
      <p class="hint" id="images-count">Nenhuma foto selecionada.</p>
      <div class="thumb-grid" id="images-grid"></div>

      <label>Vídeos</label>
      <div class="upload-buttons">
        <label class="file-btn" for="files-videos">📁 Escolher vídeos</label>
        <input type="file" id="files-videos" accept="video/*" multiple hidden />
      </div>
      <p class="hint" id="videos-count">Nenhum vídeo selecionado.</p>
      <div class="thumb-grid" id="videos-grid"></div>

      <button type="submit" id="submit-btn">Enviar</button>
    </div>
  </form>

  <div id="status"></div>

  <script type="module">
    import { upload } from 'https://esm.sh/@vercel/blob@0.27.0/client';

    const statusEl = document.getElementById('status');

    function log(line) {
      statusEl.classList.add('show');
      statusEl.textContent += (statusEl.textContent ? '\n' : '') + line;
    }

    let selectedImages = [];
    let selectedVideos = [];

    function formatDuration(seconds) {
      const total = Math.round(seconds);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function pluralize(count, singular, plural) {
      return `${count} ${count === 1 ? singular : plural}`;
    }

    function renderGrid(list, gridEl, countEl, emptyLabel, noun) {
      gridEl.innerHTML = '';
      const adjective = list.length === 1 ? `selecionad${noun[2]}` : `selecionad${noun[2]}s`;
      countEl.textContent = list.length === 0 ? emptyLabel : `${pluralize(list.length, noun[0], noun[1])} ${adjective}.`;

      list.forEach((file, index) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumb';

        const url = URL.createObjectURL(file);
        if (file.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = url;
          thumb.appendChild(img);
        } else {
          const video = document.createElement('video');
          video.src = url;
          video.muted = true;
          thumb.appendChild(video);

          const duration = document.createElement('span');
          duration.className = 'duration';
          duration.textContent = '...';
          thumb.appendChild(duration);
          video.addEventListener('loadedmetadata', () => {
            duration.textContent = formatDuration(video.duration);
          });
        }

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => {
          list.splice(index, 1);
          renderGrid(list, gridEl, countEl, emptyLabel, noun);
        });
        thumb.appendChild(removeBtn);

        gridEl.appendChild(thumb);
      });
    }

    const imagesGrid = document.getElementById('images-grid');
    const imagesCount = document.getElementById('images-count');
    const videosGrid = document.getElementById('videos-grid');
    const videosCount = document.getElementById('videos-count');

    function renderImages() {
      renderGrid(selectedImages, imagesGrid, imagesCount, 'Nenhuma foto selecionada.', ['foto', 'fotos', 'a']);
    }
    function renderVideos() {
      renderGrid(selectedVideos, videosGrid, videosCount, 'Nenhum vídeo selecionado.', ['vídeo', 'vídeos', 'o']);
    }

    function addFiles(fileList) {
      for (const file of fileList) {
        if (file.type.startsWith('image/')) selectedImages.push(file);
        else if (file.type.startsWith('video/')) selectedVideos.push(file);
      }
      renderImages();
      renderVideos();
    }

    function resetUploads() {
      selectedImages = [];
      selectedVideos = [];
      renderImages();
      renderVideos();
    }

    document.getElementById('files-images').addEventListener('change', (e) => {
      addFiles(e.target.files);
      e.target.value = '';
    });
    document.getElementById('files-videos').addEventListener('change', (e) => {
      addFiles(e.target.files);
      e.target.value = '';
    });
    document.getElementById('files-camera').addEventListener('change', (e) => {
      addFiles(e.target.files);
      e.target.value = '';
    });

    document.querySelectorAll('.toggle-password').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        const showing = target.type === 'text';
        target.type = showing ? 'password' : 'text';
        btn.textContent = showing ? '👁️' : '🙈';
        btn.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Esconder senha');
      });
    });

    const credentialsFields = document.getElementById('credentials-fields');
    const uploadFields = document.getElementById('upload-fields');
    const loginBanner = document.getElementById('login-banner');
    const loginBannerText = document.getElementById('login-banner-text');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const identifierInput = document.getElementById('identifier');
    const passwordInput = document.getElementById('password');

    let session = null; // { identifier, password, client }

    function setLoggedIn(identifier, password, client) {
      session = { identifier, password, client };
      credentialsFields.classList.add('hide');
      uploadFields.classList.remove('hide');
      loginBanner.classList.add('show');
      loginBannerText.textContent = `✓ Logado como: ${client}`;
    }

    function setLoggedOut() {
      session = null;
      credentialsFields.classList.remove('hide');
      uploadFields.classList.add('hide');
      loginBanner.classList.remove('show');
      passwordInput.value = '';
    }

    loginBtn.addEventListener('click', async () => {
      statusEl.textContent = '';
      statusEl.classList.add('show');

      const identifier = identifierInput.value;
      const password = passwordInput.value;
      if (!identifier || !password) {
        log('Preencha e-mail/telefone e senha.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Entrando...';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
        });
        const result = await response.json();
        if (!response.ok) {
          log(`Erro ao entrar: ${result.error || 'falha desconhecida'}`);
        } else {
          log(`Login ok.`);
          setLoggedIn(identifier, password, result.client);
        }
      } catch (error) {
        log(`Erro ao entrar: ${error.message || error}`);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Entrar';
      }
    });

    logoutBtn.addEventListener('click', () => {
      setLoggedOut();
      resetUploads();
      statusEl.textContent = '';
      statusEl.classList.remove('show');
    });

    const micBtn = document.getElementById('mic-btn');
    const instructionEl = document.getElementById('instruction');
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognitionCtor) {
      micBtn.disabled = true;
      micBtn.title = 'Ditado por voz indisponível neste navegador. Use o Chrome no Android, ou digite normalmente.';
    } else {
      const recognition = new SpeechRecognitionCtor();
      recognition.lang = 'pt-BR';
      recognition.interimResults = false;
      recognition.continuous = false;

      let listening = false;

      function stopListeningUi() {
        listening = false;
        micBtn.classList.remove('recording');
        micBtn.textContent = '🎤';
        micBtn.title = 'Ditar por áudio';
      }

      recognition.addEventListener('result', (event) => {
        const transcript = Array.from(event.results)
          .map((result) => result[0].transcript)
          .join(' ')
          .trim();
        if (!transcript) return;
        const separator = instructionEl.value.trim() ? ' ' : '';
        instructionEl.value = instructionEl.value.trim() + separator + transcript;
      });

      recognition.addEventListener('end', stopListeningUi);

      recognition.addEventListener('error', (event) => {
        stopListeningUi();
        if (event.error !== 'aborted' && event.error !== 'no-speech') {
          log(`Erro no microfone: ${event.error}`);
        }
      });

      micBtn.addEventListener('click', () => {
        if (listening) {
          recognition.stop();
          return;
        }
        listening = true;
        micBtn.classList.add('recording');
        micBtn.textContent = '🔴';
        micBtn.title = 'Ouvindo... toque pra parar';
        try {
          recognition.start();
        } catch (error) {
          stopListeningUi();
        }
      });
    }

    const tabLoginBtn = document.getElementById('tab-login-btn');
    const tabSignupBtn = document.getElementById('tab-signup-btn');
    const loginForm = document.getElementById('upload-form');
    const signupForm = document.getElementById('signup-form');

    tabLoginBtn.addEventListener('click', () => {
      tabLoginBtn.classList.add('active');
      tabSignupBtn.classList.remove('active');
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
    });
    tabSignupBtn.addEventListener('click', () => {
      tabSignupBtn.classList.add('active');
      tabLoginBtn.classList.remove('active');
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      statusEl.classList.add('show');

      const identifier = document.getElementById('signup-identifier').value;
      const password = document.getElementById('signup-password').value;
      const passwordConfirm = document.getElementById('signup-password-confirm').value;
      const signupBtn = document.getElementById('signup-btn');

      if (password !== passwordConfirm) {
        log('Erro: as senhas não são iguais.');
        return;
      }

      signupBtn.disabled = true;
      signupBtn.textContent = 'Cadastrando...';
      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
        });
        const result = await response.json();
        if (!response.ok) {
          log(`Erro: ${result.error || 'falha desconhecida'}`);
        } else {
          log(`Cadastro feito! Agora entre com esse e-mail/telefone e senha na aba "Entrar".`);
          signupForm.reset();
          document.getElementById('identifier').value = identifier;
          tabLoginBtn.click();
        }
      } catch (error) {
        log(`Erro: ${error.message || error}`);
      } finally {
        signupBtn.disabled = false;
        signupBtn.textContent = 'Cadastrar';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      statusEl.classList.add('show');

      const submitBtn = document.getElementById('submit-btn');

      if (!session) {
        log('Você precisa entrar primeiro (aba "Entrar").');
        return;
      }
      const { identifier, password } = session;
      const instruction = document.getElementById('instruction').value;
      const fileList = [...selectedImages, ...selectedVideos];

      if (fileList.length === 0) {
        log('Escolha pelo menos uma foto ou vídeo.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      const uploaded = [];
      try {
        for (const file of fileList) {
          log(`Enviando ${file.name}...`);
          const blob = await upload(file.name, file, {
            access: 'public',
            handleUploadUrl: '/api/upload-token',
            clientPayload: JSON.stringify({ identifier, password }),
          });
          uploaded.push({ url: blob.url, name: file.name });
          log(`✓ ${file.name} enviado`);
        }

        log('Registrando pedido...');
        const response = await fetch('/api/commit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password, instruction, files: uploaded }),
        });
        const result = await response.json();

        if (!response.ok && response.status !== 207) {
          log(`Erro: ${result.error || 'falha desconhecida'}`);
        } else {
          log(`Pronto! Pasta criada: ${result.subfolder}`);
          result.files.forEach((f) => log(`  ${f.file}: ${f.status}`));
          log(`  instrucoes.txt: ${result.instructions.status}`);
          loginForm.reset();
          resetUploads();
        }
      } catch (error) {
        log(`Erro: ${error.message || error}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar';
      }
    });
  </script>
</body>
</html>
