<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendário de Postagens — Máquina de Vendas Online</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0d12" />
<link rel="icon" href="/img/icons/favicon-32.png" sizes="32x32" />
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --panel-hover: #171c28;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --accent-hover: #ff7554;
    --cyan: #33d6cb;
    --violet: #8b7cf6;
    --green: #35d07f;
    --blue: #4d9eff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; }

  .screen-header {
    padding: 18px 16px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .back-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    text-decoration: none;
  }
  .screen-title { font-size: 1.15rem; font-weight: 700; margin: 0; flex: 1; }

  .date-picker-row { padding: 12px 16px; flex-shrink: 0; }
  .date-pill {
    position: relative;
    display: block;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 16px 16px;
  }
  @keyframes datePillPulse {
    0%, 100% { color: var(--accent-hover); transform: scale(1); text-shadow: 0 0 6px rgba(255, 45, 31, 0.3); }
    50% { color: #ff2d1f; transform: scale(1.08); text-shadow: 0 0 16px rgba(255, 45, 31, 0.75); }
  }
  #date-pill-label {
    display: inline-block;
    font-weight: 800;
    font-size: 1.7rem;
    animation: datePillPulse 1.8s ease-in-out infinite;
  }
  .date-pill input {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .hour-grid {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 16px;
  }
  .hour-row {
    display: flex;
    gap: 12px;
    min-height: 90px;
  }
  .hour-label {
    flex: 0 0 52px;
    padding-top: 4px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .hour-slot {
    flex: 1;
    border-top: 1px solid var(--border);
    border-radius: 10px;
    background: repeating-linear-gradient(135deg, var(--panel), var(--panel) 8px, var(--bg) 8px, var(--bg) 16px);
    cursor: pointer;
    margin-bottom: 2px;
  }
  .hour-slot:active { filter: brightness(1.15); }
  .hour-slot.selected { border: 2px solid var(--accent); border-top: 2px solid var(--accent); }
  .hour-slot.posted {
    background: rgba(51, 214, 203, 0.14);
    border: 1px solid var(--cyan);
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .hour-slot.posted .posted-tag {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--cyan);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .hour-slot.posted .posted-text {
    font-size: 0.78rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .action-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 4px;
    border-radius: 14px;
    background: none;
    border: none;
    position: relative;
    font-family: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .action-item svg { width: 24px; height: 24px; }
  .action-item .icon-circle, .action-item .icon-plain {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .action-item.item-calendario .icon-plain { background: rgba(51, 214, 203, 0.16); color: var(--cyan); }
  .action-item.item-redes .icon-plain { background: rgba(139, 124, 246, 0.18); color: var(--violet); }
  .action-item.item-postar .icon-circle { background: rgba(255, 90, 54, 0.16); color: var(--accent); }
  .action-item.item-relatorio .icon-plain { background: rgba(53, 208, 127, 0.16); color: var(--green); }
  .action-item.item-ajustes .icon-plain { background: rgba(77, 158, 255, 0.16); color: var(--blue); }
  .action-item.active.item-calendario { color: var(--cyan); }
  .action-item.active.item-calendario .icon-plain { background: var(--cyan); color: #06231f; }
  .action-item.active.item-redes { color: var(--violet); }
  .action-item.active.item-redes .icon-plain { background: var(--violet); color: #fff; }
  .action-item.active.item-postar { color: var(--accent); }
  .action-item.active.item-postar .icon-circle { background: var(--accent); color: #fff; }
  .action-item.active.item-relatorio { color: var(--green); }
  .action-item.active.item-relatorio .icon-plain { background: var(--green); color: #06231f; }
  .action-item.active.item-ajustes { color: var(--blue); }
  .action-item.active.item-ajustes .icon-plain { background: var(--blue); color: #fff; }

  /* ---- folha "Add Post" ---- */
  .sheet-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 60;
  }
  .sheet-backdrop.show { display: block; }
  .sheet {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 61;
    background: var(--panel);
    border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    margin: 0 auto;
  }
  .sheet.show { display: block; }
  .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 16px; }
  .sheet-title { font-size: 1.2rem; font-weight: 700; margin: 0 0 16px; }
  .sheet-datetime {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 0.95rem;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .sheet-note { font-size: 0.85rem; color: var(--accent-hover); margin: 0 0 16px; }
  .sheet-minute-select {
    margin-left: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 6px 8px;
  }
  .sheet-create-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  .sheet-create-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }

  /* ---- botão flutuante de Suporte ---- */
  .support-fab {
    position: fixed;
    z-index: 300;
    width: 66px;
    height: 66px;
    border: none;
    border-radius: 18px;
    background: none;
    padding: 0;
    display: none;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }
  .support-fab:focus, .support-fab:active { outline: none; }
  .support-fab img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .support-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 310;
    flex-direction: column;
  }
  .support-modal.show { display: flex; }
  .support-modal-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .support-modal-header .back-btn {
    width: 32px;
    height: 32px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    cursor: pointer;
  }
  .support-modal-title { font-weight: 700; font-size: 1rem; flex: 1; text-align: center; margin-right: 32px; }
  .support-chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .support-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .support-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .support-msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  .support-msg.bot.loading { color: var(--muted); font-style: italic; }
  .support-empty-hint { color: var(--muted); font-size: 0.9rem; text-align: center; margin-top: 24px; }
  .support-modal-bottom {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .support-question-input {
    flex: 1;
    resize: none;
    max-height: 100px;
    padding: 10px 14px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
  }
  .support-mic-btn, .support-send-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
  }
  .support-mic-btn.recording { background: var(--green); color: #06231f; border-color: var(--green); }
  .support-send-btn { background: var(--accent); color: #fff; border: none; }
  .support-send-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
</style>
</head>
<body>

  <div class="screen-header">
    <a href="/" class="back-btn" id="back-btn">‹</a>
    <h1 class="screen-title">Calendário de Postagens</h1>
  </div>

  <div class="date-picker-row">
    <label class="date-pill" id="date-pill">
      <span id="date-pill-label">—</span>
      <input type="date" id="date-input" />
    </label>
  </div>

  <div class="hour-grid" id="hour-grid"></div>

  <nav class="action-bar">
    <span class="action-item item-calendario active">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      Calendário
    </span>
    <a class="action-item item-redes" href="/contas-conectadas.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h11"/></svg></div>
      Redes
    </a>
    <a class="action-item item-postar" href="/#postar">
      <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div>
      Postar
    </a>
    <a class="action-item item-relatorio" href="/relatorio-redes.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div>
      Relatório
    </a>
    <a class="action-item item-ajustes" href="/ajustes.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      Ajustes
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="add-post-sheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">Nova postagem</h2>
    <div class="sheet-datetime">
      <span>📅</span>
      <span id="sheet-datetime-label">—</span>
      <select id="sheet-minute-select" class="sheet-minute-select"></select>
    </div>
    <p class="sheet-note" id="sheet-note" hidden>Esse horário já passou.</p>
    <button type="button" class="sheet-create-btn" id="sheet-create-btn">+ Criar postagem</button>
  </div>

  <button type="button" id="support-fab" class="support-fab" aria-label="Suporte">
    <img src="/img/support-robot-cutout.png" alt="" />
  </button>

  <div id="support-modal" class="support-modal">
    <div class="support-modal-header">
      <button type="button" id="support-close-btn" class="back-btn">‹</button>
      <div class="support-modal-title">Suporte</div>
    </div>
    <div class="support-chat" id="support-chat">
      <p class="support-empty-hint">Pergunte qualquer coisa sobre como usar o app — como postar, agendar, ver relatórios, conectar redes, ou tirar dúvida sobre os planos.</p>
    </div>
    <div class="support-modal-bottom">
      <textarea id="support-question-input" class="support-question-input" rows="1" placeholder="Digite sua dúvida..."></textarea>
      <button type="button" id="support-mic-btn" class="support-mic-btn" title="Perguntar por voz">🎤</button>
      <button type="button" id="support-send-btn" class="support-send-btn">➤</button>
    </div>
  </div>

  <script>
    const HANDOFF_KEY = 'mvo_report_handoff';

    document.getElementById('back-btn').addEventListener('click', (e) => {
      if (window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });

    // Essa tela ainda não fala com o servidor (é só o esquema visual do
    // calendário) — só exige ter uma sessão salva pra não ficar acessível
    // solta fora do app.
    let sessionHandoff = null;
    (function requireSession() {
      try {
        const handoff = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        if (!handoff || !handoff.identifier) { window.location.href = '/'; return; }
        sessionHandoff = handoff;
      } catch (e) {
        window.location.href = '/';
      }
    })();

    const dateInput = document.getElementById('date-input');
    const datePillLabel = document.getElementById('date-pill-label');
    const hourGrid = document.getElementById('hour-grid');
    const sheetBackdrop = document.getElementById('sheet-backdrop');
    const addPostSheet = document.getElementById('add-post-sheet');
    const sheetDatetimeLabel = document.getElementById('sheet-datetime-label');
    const sheetNote = document.getElementById('sheet-note');
    const sheetCreateBtn = document.getElementById('sheet-create-btn');
    const sheetMinuteSelect = document.getElementById('sheet-minute-select');
    for (let min = 0; min < 60; min += 5) {
      const opt = document.createElement('option');
      opt.value = String(min);
      opt.textContent = String(min).padStart(2, '0') + ' min';
      sheetMinuteSelect.appendChild(opt);
    }

    const WEEKDAY_FMT = new Intl.DateTimeFormat('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
    const FULL_FMT = new Intl.DateTimeFormat('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });

    function todayIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function renderDatePill() {
      const [y, m, d] = dateInput.value.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      datePillLabel.textContent = WEEKDAY_FMT.format(date);
    }

    function isoFromDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function changeDay(delta) {
      const [y, m, d] = dateInput.value.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + delta);
      dateInput.value = isoFromDate(date);
      renderDatePill();
      selectedSlot = null;
      renderHourGrid();
    }

    let selectedSlot = null;

    function renderHourGrid() {
      hourGrid.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        const row = document.createElement('div');
        row.className = 'hour-row';
        const label = h === 0 ? '12:00 am' : h < 12 ? `${h}:00 am` : h === 12 ? '12:00 pm' : `${h - 12}:00 pm`;
        row.innerHTML = `<div class="hour-label">${label}</div><div class="hour-slot" data-hour="${h}"></div>`;
        hourGrid.appendChild(row);
      }
      hourGrid.querySelectorAll('.hour-slot').forEach((slot) => {
        slot.addEventListener('click', () => selectSlot(slot));
      });
      applyPostedMarkers();
    }

    // Histórico real de pedidos já enviados (mesmo dado do relatório
    // administrativo) — marca no dia certo em que horário cada um foi feito.
    let postHistory = [];

    async function loadPostHistory() {
      if (!sessionHandoff) return;
      try {
        const response = await fetch('/api/post-history', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: sessionHandoff.identifier, password: sessionHandoff.password }),
        });
        const result = await response.json();
        if (response.ok) {
          postHistory = result.entries || [];
          applyPostedMarkers();
        }
      } catch (e) {
        // Historico e um extra visual - nao impede o resto do calendario de funcionar.
      }
    }

    function applyPostedMarkers() {
      const dayEntries = postHistory.filter((entry) => entry.date.slice(0, 10) === dateInput.value);
      dayEntries.forEach((entry) => {
        const hour = new Date(entry.date).getHours();
        const slot = hourGrid.querySelector(`.hour-slot[data-hour="${hour}"]`);
        if (!slot) return;
        slot.classList.add('posted');
        const clientTag = entry.client && entry.client !== 'frank' ? ` (${entry.client})` : '';
        slot.innerHTML = `<span class="posted-tag">Pedido enviado${clientTag}</span><span class="posted-text">${entry.instruction || ''}</span>`;
      });
    }

    function selectSlot(slot) {
      if (selectedSlot) selectedSlot.classList.remove('selected');
      selectedSlot = slot;
      slot.classList.add('selected');
      openAddPostSheet(Number(slot.dataset.hour));
    }

    let sheetHour = 0;

    function hourMinuteLabel(hour, minute) {
      const mm = String(minute).padStart(2, '0');
      return hour === 0 ? `12:${mm} am` : hour < 12 ? `${hour}:${mm} am` : hour === 12 ? `12:${mm} pm` : `${hour - 12}:${mm} pm`;
    }

    function currentChosenDate() {
      const [y, m, d] = dateInput.value.split('-').map(Number);
      return new Date(y, m - 1, d, sheetHour, Number(sheetMinuteSelect.value), 0);
    }

    function refreshSheetLabel() {
      const chosen = currentChosenDate();
      sheetDatetimeLabel.textContent = `${FULL_FMT.format(chosen)}, ${hourMinuteLabel(sheetHour, Number(sheetMinuteSelect.value))}`;
      const isPast = chosen.getTime() < Date.now();
      sheetNote.hidden = !isPast;
      sheetCreateBtn.disabled = isPast;
    }

    function openAddPostSheet(hour) {
      sheetHour = hour;
      sheetMinuteSelect.value = '0';
      refreshSheetLabel();
      sheetBackdrop.classList.add('show');
      addPostSheet.classList.add('show');
    }

    sheetMinuteSelect.addEventListener('change', refreshSheetLabel);

    function closeAddPostSheet() {
      sheetBackdrop.classList.remove('show');
      addPostSheet.classList.remove('show');
      if (selectedSlot) { selectedSlot.classList.remove('selected'); selectedSlot = null; }
    }

    sheetBackdrop.addEventListener('click', closeAddPostSheet);

    // "Criar postagem" leva o horário escolhido (data + hora + minuto) pra
    // tela de Postar via localStorage — lá, se for "agora" publica na hora
    // de sempre; se for um momento futuro, agenda de verdade (o servidor
    // dispara sozinho na hora certa).
    sheetCreateBtn.addEventListener('click', () => {
      if (sheetCreateBtn.disabled) return;
      const chosen = currentChosenDate();
      try {
        const handoff = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null') || {};
        localStorage.setItem(HANDOFF_KEY, JSON.stringify({ ...handoff, scheduledFor: chosen.toISOString() }));
      } catch (e) {}
      window.location.href = '/#postar';
    });

    dateInput.addEventListener('change', () => {
      renderDatePill();
      selectedSlot = null;
      renderHourGrid();
    });

    dateInput.value = todayIso();
    renderDatePill();
    renderHourGrid();
    loadPostHistory();

    // Rola até a hora atual pra não precisar arrastar do zero.
    (function scrollToNow() {
      const nowHour = new Date().getHours();
      const target = hourGrid.querySelector(`.hour-slot[data-hour="${Math.max(0, nowHour - 1)}"]`);
      if (target) target.scrollIntoView({ block: 'start' });
    })();

    // Arrastar pro lado troca de dia (rolar pra baixo continua navegando
    // pelas horas do mesmo dia, normal). Só conta como troca de dia se o
    // arrasto for bem mais horizontal que vertical, pra não brigar com o
    // scroll vertical da lista de horários.
    (function enableDaySwipe() {
      let startX = 0;
      let startY = 0;
      hourGrid.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
      hourGrid.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          changeDay(dx < 0 ? 1 : -1);
        }
      }, { passive: true });
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // ---- Botão flutuante de Suporte (arrastável) ----
    (function setupSupportWidget() {
      const supportFab = document.getElementById('support-fab');
      const supportModal = document.getElementById('support-modal');
      const closeBtn = document.getElementById('support-close-btn');
      const chatEl = document.getElementById('support-chat');
      const inputEl = document.getElementById('support-question-input');
      const micBtn = document.getElementById('support-mic-btn');
      const sendBtn = document.getElementById('support-send-btn');

      function getCreds() {
        try {
          return JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        } catch (e) {
          return null;
        }
      }
      function showFabIfLoggedIn() {
        const creds = getCreds();
        if (creds && creds.identifier && creds.password) supportFab.style.display = 'block';
      }
      showFabIfLoggedIn();

      const POS_KEY = 'mvo_support_fab_pos';
      function applyPos(pos) {
        supportFab.style.left = `${pos.x}px`;
        supportFab.style.top = `${pos.y}px`;
        supportFab.style.right = 'auto';
        supportFab.style.bottom = 'auto';
      }
      function defaultPos() {
        return { x: window.innerWidth - 70, y: Math.round(window.innerHeight * 0.58) };
      }
      (function initPos() {
        try {
          const saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
          applyPos(saved && typeof saved.x === 'number' ? saved : defaultPos());
        } catch (e) {
          applyPos(defaultPos());
        }
      })();

      let dragging = false;
      let moved = false;
      let startX, startY, origX, origY;
      supportFab.addEventListener('pointerdown', (e) => {
        dragging = true;
        moved = false;
        supportFab.setPointerCapture(e.pointerId);
        const rect = supportFab.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origX = rect.left;
        origY = rect.top;
      });
      supportFab.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        const x = Math.max(4, Math.min(window.innerWidth - supportFab.offsetWidth - 4, origX + dx));
        const y = Math.max(4, Math.min(window.innerHeight - supportFab.offsetHeight - 4, origY + dy));
        applyPos({ x, y });
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        const rect = supportFab.getBoundingClientRect();
        try {
          localStorage.setItem(POS_KEY, JSON.stringify({ x: rect.left, y: rect.top }));
        } catch (e) {}
      }
      supportFab.addEventListener('pointerup', endDrag);
      supportFab.addEventListener('pointercancel', endDrag);
      supportFab.addEventListener('click', () => {
        if (moved) return;
        supportModal.classList.add('show');
      });
      closeBtn.addEventListener('click', () => supportModal.classList.remove('show'));

      function addMsg(text, who) {
        const el = document.createElement('div');
        el.className = `support-msg ${who}`;
        el.textContent = text;
        chatEl.appendChild(el);
        chatEl.scrollTop = chatEl.scrollHeight;
        return el;
      }

      async function sendQuestion() {
        const question = inputEl.value.trim();
        if (!question) return;
        const creds = getCreds();
        if (!creds || !creds.identifier || !creds.password) {
          addMsg('Sessão não encontrada — entre no app de novo.', 'bot');
          return;
        }
        inputEl.value = '';
        sendBtn.disabled = true;
        addMsg(question, 'user');
        const loadingEl = addMsg('Pensando...', 'bot');
        loadingEl.classList.add('loading');
        try {
          const response = await fetch('/api/support-ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: creds.identifier, password: creds.password, question }),
          });
          const result = await response.json();
          loadingEl.remove();
          addMsg(response.ok ? result.answer : result.error || 'Não consegui responder agora.', 'bot');
        } catch (error) {
          loadingEl.remove();
          addMsg('Falha de conexão — tenta de novo.', 'bot');
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', sendQuestion);
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendQuestion();
        }
      });

      // Microfone — mesmo padrão de ditado já usado no composer.
      const SupportSpeechCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SupportSpeechCtor) {
        micBtn.disabled = true;
        micBtn.title = 'Ditado por voz indisponível neste navegador.';
      } else {
        const recognition = new SupportSpeechCtor();
        recognition.lang = 'pt-BR';
        recognition.interimResults = true;
        recognition.continuous = true;
        let listening = false;
        let baseText = '';
        let finalText = '';

        function stopListeningUi() {
          listening = false;
          micBtn.classList.remove('recording');
        }
        recognition.addEventListener('result', (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (result.isFinal) finalText = `${finalText} ${result[0].transcript}`.trim();
            else interim += result[0].transcript;
          }
          const transcript = `${finalText} ${interim}`.trim();
          if (!transcript) return;
          const sep = baseText.trim() ? ' ' : '';
          inputEl.value = `${baseText.trim()}${sep}${transcript}`.trim();
        });
        recognition.addEventListener('end', () => {
          if (listening) {
            try {
              recognition.start();
            } catch (e) {
              stopListeningUi();
            }
            return;
          }
          stopListeningUi();
        });
        recognition.addEventListener('error', (event) => {
          if (event.error === 'no-speech' || event.error === 'aborted') return;
          listening = false;
          stopListeningUi();
        });
        micBtn.addEventListener('click', () => {
          if (listening) {
            listening = false;
            recognition.stop();
            return;
          }
          listening = true;
          baseText = inputEl.value;
          finalText = '';
          micBtn.classList.add('recording');
          try {
            recognition.start();
          } catch (e) {
            listening = false;
            stopListeningUi();
          }
        });
      }
    })();
  </script>
</body>
</html>
