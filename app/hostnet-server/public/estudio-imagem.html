<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Estúdio de Imagem | Máquina de Vendas Online</title>
<meta name="description" content="Monte seus banners do seu jeito: modelos prontos, tirar fundo, textos, formas, filtros e todos os tamanhos das redes." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Lobster&family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,500&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<!-- Estúdio de Imagem (Franklin, 2026-10-30): editor de banner no estilo do
     Canva, separado do Cut Studio Pro. Só imagem, nada de vídeo. Tudo roda no
     aparelho (grátis), menos as ferramentas com IA, que usam /api/estudio-edit
     e gastam 1 imagem do plano. "Salvar em Minhas criações" manda a imagem
     pronta pro /api/commit, igual ao Cut Studio Pro. -->
<style>
  :root {
    --bg: #0a0d12; --panel: #12161e; --panel2: #181d27; --line: #262d3a;
    --text: #f2f2f0; --muted: #a9b2c1; --gold: #f5c542; --green: #35d07f; --red: #ff5a4f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; width: 100%; overflow: hidden; }
  body > * { min-width: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .top { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top .title { flex: 1; min-width: 0; font-weight: 900; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .title b { color: var(--gold); }
  .ib { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 7px 10px; font-size: .95rem; text-decoration: none; color: var(--text); white-space: nowrap; }
  .ib:disabled { opacity: .35; }
  .ib.gold { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 800; }
  .stage { flex: 1; min-height: 34vh; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 8px; background:
    repeating-conic-gradient(#10141b 0% 25%, #0c1016 0% 50%) 50% / 22px 22px; position: relative; }
  .stage .canvas-container { box-shadow: 0 8px 30px rgba(0,0,0,.55); }
  .size-tag { position: absolute; left: 10px; top: 8px; font-size: .75rem; color: var(--muted); background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 999px; }
  .busy { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: rgba(5,7,10,.78); z-index: 5; text-align: center; padding: 20px; font-weight: 700; }
  .busy.on { display: flex; }
  .spin { width: 42px; height: 42px; border: 4px solid rgba(245,197,66,.25); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .quick { display: none; gap: 6px; padding: 6px 10px; overflow-x: auto; border-top: 1px solid var(--line); background: var(--panel); scrollbar-width: none; }
  .quick.on { display: flex; }
  .quick button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 6px 10px; font-size: .85rem; }
  .quick button.del { color: var(--red); }
  .sheet { max-height: 36vh; overflow-y: auto; padding: 10px 12px 14px; background: var(--panel); border-top: 1px solid var(--line); }
  .tabbar { display: flex; overflow-x: auto; background: #0e1219; border-top: 1px solid var(--line); scrollbar-width: none; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar::-webkit-scrollbar, .quick::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; min-width: 70px; border: 0; background: none; padding: 8px 6px 9px; font-size: .72rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tab span { font-size: 1.25rem; }
  .tab.on { color: var(--gold); box-shadow: inset 0 3px 0 var(--gold); }
  h3 { margin: 4px 0 8px; font-size: .95rem; color: var(--gold); }
  h4 { margin: 14px 0 6px; font-size: .85rem; color: var(--text); }
  .hint { color: var(--muted); font-size: .82rem; margin: 4px 0 8px; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .card { border: 1.5px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 8px; text-align: center; font-size: .78rem; line-height: 1.25; }
  .card b { display: block; font-size: .85rem; margin-bottom: 2px; }
  .card small { color: var(--muted); }
  .card.on { border-color: var(--gold); }
  .card .ratio { margin: 0 auto 6px; border: 2px solid var(--gold); border-radius: 4px; max-width: 54px; max-height: 54px; }
  .tpl { padding: 0; overflow: hidden; }
  .tpl .sw { height: 74px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: .95rem; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); padding: 4px; }
  .tpl .nm { padding: 6px 4px; }
  .tplgrid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
  .tplgrid .tpl .sw { height: auto; aspect-ratio: 1 / 1; position: relative; padding: 0; overflow: hidden; }
  .tplgrid .tpl .sw span { padding: 6px; }
  .tplgrid .tpl .sw img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0d1017; opacity: 0; transition: opacity .25s; }
  .tplgrid .tpl .sw img.ok { opacity: 1; }
  .tplgrid .tpl .nm b { font-size: .8rem; margin: 0; }
  .tplgrid .tpl .sw .anim-tag { position: absolute; left: 5px; bottom: 5px; font-style: normal; font-size: .66rem; font-weight: 800; background: rgba(0,0,0,.72); color: #f5c542; padding: 2px 6px; border-radius: 999px; }
  /* Diminuir o banner pra sobrar tela pros botões de baixo (Franklin, 2026-11-07, celular). */
  .stage-toggle { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 5; border: 1.5px solid var(--gold); border-radius: 999px; padding: 8px 18px; font-weight: 800; font-size: .8rem; background: rgba(13,16,23,.9); color: var(--gold); cursor: ns-resize; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; }
  .stage-toggle.drag { background: var(--gold); color: #111; }
  body.stage-custom .stage { flex: 0 0 var(--stage-h, 22vh); min-height: 0; }
  body.stage-custom .sheet { max-height: none; flex: 1; }
  .anim-btn { position: absolute; right: 10px; top: 8px; z-index: 5; display: none; border: 0; border-radius: 999px; padding: 7px 12px; font-weight: 800; font-size: .85rem; background: #f5c542; color: #111; box-shadow: 0 4px 14px rgba(0,0,0,.5); cursor: pointer; }
  .anim-btn.on { display: block; animation: animPulse 1.4s ease-in-out infinite; }
  @keyframes animPulse { 50% { transform: scale(1.07); } }
  .tl-top { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; }
  .tl-top b { font-variant-numeric: tabular-nums; }
  .tl { position: relative; background: #0d1017; border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 8px 8px; user-select: none; touch-action: none; }
  .tl-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .tl-row.on .tl-lab { color: var(--gold); font-weight: 800; }
  .tl-lab { width: 96px; flex: none; font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .tl-track { position: relative; flex: 1; height: 30px; background: #161b26; border-radius: 8px; cursor: pointer; }
  .tl-ruler { height: 20px; background: transparent; }
  .tl-ruler span { position: absolute; top: 2px; transform: translateX(-50%); font-size: .62rem; color: var(--muted); }
  .tl-ruler span:first-child { transform: none; }
  .tl-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 7px; background: #8e9bb8; cursor: grab; touch-action: none; min-width: 14px; }
  .tl-bar.tx { background: #4fc3f7; }
  .tl-bar.nr { background: linear-gradient(90deg, #6d28d9, #a855f7); cursor: grab; }
  .tl-bar.vd { background: linear-gradient(90deg, #3a2a10, #7a4a12); }
  .tl-bar.an::after { content: '✨'; position: absolute; left: 14px; top: 2px; font-size: .7rem; }
  .tl-row.on .tl-bar { outline: 2px solid var(--gold); }
  .tl-bar .h { position: absolute; top: 0; bottom: 0; width: 12px; background: rgba(255,255,255,.55); border-radius: 6px; cursor: ew-resize; }
  .tl-bar .h.l { left: 0; } .tl-bar .h.r { right: 0; }
  .tl-head { position: absolute; top: 4px; bottom: 4px; width: 2px; background: #ff3b30; pointer-events: none; box-shadow: 0 0 6px #ff3b30; }
  .tl-sel { width: 100%; padding: 9px; border-radius: 10px; background: var(--panel2); color: inherit; border: 1.5px solid var(--line); }
  .anim-view { background: #000; border-radius: 10px; margin: 6px 0 10px; }
  .ftiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(160px, 46%); grid-template-rows: repeat(2, 84px); gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
  .ftile { position: relative; border: 0; border-radius: 14px; padding: 12px; text-align: left; color: #1b1b2a; overflow: hidden; cursor: pointer; scroll-snap-align: start; transition: transform .18s ease, box-shadow .18s ease; }
  .ftile:hover, .ftile:focus-visible { transform: translateY(-2px) scale(1.04); box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  .ftile:active { transform: scale(.98); }
  .ftile b { position: relative; z-index: 3; display: block; max-width: 47%; font-size: .88rem; line-height: 1.2; font-weight: 800; }
  .ftile .ft-back { position: absolute; right: 30px; bottom: -14px; width: 40%; height: 80%; border-radius: 9px; background: rgba(255,255,255,.65); transform: rotate(-12deg); z-index: 1; }
  .ftile img { position: absolute; right: 12px; bottom: -8px; height: 80%; max-width: 40%; object-fit: cover; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.28); transform: rotate(-4deg); opacity: 0; transition: opacity .25s, transform .2s; z-index: 2; }
  .ftile img.ok { opacity: 1; }
  .ftile:hover img { transform: rotate(0deg) scale(1.08); }
  .ftile .ft-badge { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; z-index: 4; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
  .ftile .ft-badge svg { width: 100%; height: 100%; display: block; }
  .tpl-q { width: 100%; box-sizing: border-box; margin: 4px 0 8px; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel2); color: inherit; font-size: 1rem; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 6px 12px; font-size: .82rem; }
  .chip.on { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 800; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px 12px; font-size: .88rem; }
  .btn.on { border-color: var(--gold); color: var(--gold); }
  .btn.big { width: 100%; padding: 12px; font-weight: 800; font-size: .95rem; margin-top: 6px; }
  .btn.gold { background: var(--gold); color: #111; border-color: var(--gold); }
  .btn.ai { border-color: #9b5cff; background: rgba(155,92,255,.12); }
  .btn small { display: block; font-size: .72rem; color: var(--muted); font-weight: 400; }
  .sw-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sw-c { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); padding: 0; }
  .sw-c.on { outline: 3px solid var(--gold); outline-offset: 1px; }
  .sw-g { width: 46px; height: 30px; border-radius: 8px; border: 2px solid rgba(255,255,255,.2); padding: 0; }
  input[type=color] { width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 1px; }
  label.sl { display: grid; grid-template-columns: 96px 1fr 38px; gap: 8px; align-items: center; font-size: .82rem; margin: 6px 0; }
  label.sl output { color: var(--muted); text-align: right; font-size: .75rem; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  select, textarea, input[type=number] { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: inherit; font-size: .9rem; }
  textarea { min-height: 64px; resize: vertical; }
  .file-btn { position: relative; overflow: hidden; display: inline-flex; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .thumbs { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); flex: 0 0 auto; cursor: pointer; background: #fff; }
  .layers { display: flex; flex-direction: column; gap: 6px; }
  .layer { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--panel2); font-size: .85rem; }
  .layer.on { border-color: var(--gold); }
  .layer .ln { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .layer button { border: 0; background: none; font-size: 1rem; padding: 2px 4px; }
  .msg { border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: .88rem; line-height: 1.4; }
  .msg.ok { background: rgba(53,208,127,.12); border: 1px solid rgba(53,208,127,.5); }
  .msg.err { background: rgba(255,90,79,.12); border: 1px solid rgba(255,90,79,.5); }
  .msg a { color: var(--gold); }
  .fonts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .fonts button { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px; font-size: 1.05rem; }
  .fonts button.on { border-color: var(--gold); }
  .emoji { font-size: 1.6rem; padding: 4px; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal.on { display: flex; }
  .modal .box { background: var(--panel); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 16px; border-top: 2px solid var(--gold); max-height: 80vh; overflow-y: auto; }
  @media (min-width: 900px) {
    .sheet { max-height: 30vh; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="ib" href="/" title="Voltar ao app">←</a>
  <div class="title">🖼️ Estúdio de <b>IMAGEM</b></div>
  <button class="ib" id="undo" type="button" title="Desfazer">↶</button>
  <button class="ib" id="redo" type="button" title="Refazer">↷</button>
  <button class="ib gold" id="done" type="button">Pronto ✓</button>
</header>

<div class="stage" id="stage">
  <span class="size-tag" id="size-tag"></span>
  <button class="anim-btn" id="anim-btn" type="button">▶️ Ver animação</button>
  <button class="stage-toggle" id="stage-toggle" type="button">⬍ Arraste pra diminuir</button>
  <canvas id="c"></canvas>
  <div class="busy" id="busy"><div class="spin"></div><div id="busy-text">Trabalhando…</div></div>
</div>

<div class="quick" id="quick">
  <button type="button" data-q="dup">⧉ Duplicar</button>
  <button type="button" data-q="menor">➖ Menor</button>
  <button type="button" data-q="maior">➕ Maior</button>
  <button type="button" data-q="centro">⊕ Centralizar</button>
  <button type="button" data-q="frente">⬆️ Pra frente</button>
  <button type="button" data-q="tras">⬇️ Pra trás</button>
  <button type="button" data-q="girar">↻ Girar</button>
  <button type="button" data-q="del" class="del">🗑️ Excluir</button>
</div>

<section class="sheet" id="sheet"></section>

<nav class="tabbar" id="tabbar">
  <button class="tab" type="button" data-tab="modelos"><span>✨</span>Modelos</button>
  <button class="tab" type="button" data-tab="video"><span>🎬</span>Vídeo</button>
  <button class="tab" type="button" data-tab="tamanho"><span>📐</span>Tamanho</button>
  <button class="tab" type="button" data-tab="fotos"><span>🖼️</span>Fotos</button>
  <button class="tab" type="button" data-tab="texto"><span>🔤</span>Texto</button>
  <button class="tab" type="button" data-tab="elementos"><span>⭐</span>Elementos</button>
  <button class="tab" type="button" data-tab="fundo"><span>🎨</span>Fundo</button>
  <button class="tab" type="button" data-tab="editar"><span>🪄</span>Editar foto</button>
  <button class="tab" type="button" data-tab="camadas"><span>📚</span>Camadas</button>
</nav>

<div class="modal" id="done-modal"><div class="box" id="done-box"></div></div>

<script>
(function () {
  let session = null;
  try { session = JSON.parse(localStorage.getItem('mvo_report_handoff') || localStorage.getItem('mvo_admin_session') || localStorage.getItem('mvo_session') || 'null'); } catch (e) {}
  if (!session || !session.identifier) { location.href = '/'; return; }
  if (!window.fabric) { document.getElementById('sheet').innerHTML = '<div class="msg err">Não deu pra carregar o editor. Confira a internet e abra de novo.</div>'; return; }

  // Filtros pelo processador (o modo WebGL falha em foto grande no celular).
  fabric.filterBackend = new fabric.Canvas2dFilterBackend();
  Object.assign(fabric.Object.prototype, {
    transparentCorners: false, cornerColor: '#f5c542', cornerStrokeColor: '#111', borderColor: '#f5c542',
    cornerSize: 16, touchCornerSize: 36, cornerStyle: 'circle', borderScaleFactor: 2, padding: 4
  });

  // Tamanhos (como o Canva: cada rede tem o seu).
  const FORMATS = [
    { id: 'quadrado', name: 'Post quadrado', sub: 'Instagram e Facebook', w: 1080, h: 1080 },
    { id: 'retrato', name: 'Post em pé', sub: 'Feed do Instagram (4:5)', w: 1080, h: 1350 },
    { id: 'story', name: 'Stories, Reels e TikTok', sub: 'Status do WhatsApp (9:16)', w: 1080, h: 1920 },
    { id: 'youtube', name: 'Capa de vídeo', sub: 'YouTube (16:9)', w: 1280, h: 720 },
    { id: 'paisagem', name: 'Deitado', sub: 'Site e telas (16:9)', w: 1920, h: 1080 },
    { id: 'post-fb', name: 'Post para Facebook', sub: 'Feed do Facebook', w: 940, h: 788 },
    { id: 'convite', name: 'Convite', sub: 'Em pé', w: 1240, h: 1748 },
    { id: 'capa-yt', name: 'Capa do YouTube', sub: 'Banner do canal', w: 2560, h: 1440 },
    { id: 'cartao', name: 'Cartão de visita', sub: 'Deitado', w: 1050, h: 600 },
    { id: 'carrossel3', name: 'Carrossel (3 partes)', sub: 'Instagram, desliza contínuo', w: 3240, h: 1350 },
    { id: 'carrossel3-fb', name: 'Carrossel do Facebook (3 partes)', sub: 'Facebook, desliza contínuo', w: 3240, h: 1080 },
    { id: 'facebook', name: 'Post do Facebook', sub: 'Link e anúncio', w: 1200, h: 630 },
    { id: 'capa-fb', name: 'Capa do Facebook', sub: 'Topo da Página', w: 1640, h: 624 },
    { id: 'panfleto', name: 'Panfleto', sub: 'A5, em pé', w: 1240, h: 1748 },
    { id: 'cartaz', name: 'Cartaz', sub: 'A4, em pé', w: 1654, h: 2339 },
    { id: 'logo', name: 'Logo', sub: 'Quadrado', w: 1000, h: 1000 }
  ];

  const FONTS = ['Montserrat', 'Anton', 'Bebas Neue', 'Poppins', 'Oswald', 'Playfair Display', 'Lobster', 'Pacifico', 'Permanent Marker', 'Arial'];
  const COLORS = ['#ffffff', '#111111', '#ff3b30', '#ff9f1a', '#ffd60a', '#35d07f', '#25d366', '#22c1ee', '#4d7cff', '#9b5cff', '#ff4fa3', '#8b5a2b', '#f6f1ea', '#9aa0a6'];
  const GRADS = [['#ff3b30', '#ff9f1a'], ['#0b1020', '#1e2a5a'], ['#9b5cff', '#ff4fa3'], ['#25d366', '#0e7a3d'], ['#22c1ee', '#4d7cff'], ['#111111', '#434343'], ['#ffd60a', '#ff9f1a'], ['#f6f1ea', '#e8dccb'], ['#0f2027', '#2c5364'], ['#f12711', '#f5af19']];
  const EMOJIS = ['🔥', '⭐', '✅', '📞', '💬', '🛒', '🎉', '⚡', '❤️', '👉', '📍', '🚚', '💯', '🏷️', '🆕', '🎁', '⏰', '👍', '😍', '🏆', '📢', '💥', '✨', '🛠️'];
  // Propriedades nossas que precisam ir junto no desfazer e no rascunho.
  const PROPS = ['name', 'isBg', 'isBgPhoto', 'placeholder', 'samplePhoto', 'slotW', 'slotH', 'phShape', 'phR', 'anim', 'animDelay', 'tIn', 'tOut', 'videoKey', 'posterURL', 'clipStart', 'videoLen', 'music', 'narrStart', 'narrKind', 'narrVoz', 'narrTexto', 'selectable', 'evented', 'locked', 'lockMovementX', 'lockMovementY', 'lockScalingX', 'lockScalingY', 'lockRotation', 'shape', 'preset', 'cropPct'];
  const DRAFT_KEY = 'mvo_estudio_imagem';

  let W = 1080, H = 1080, fmt = 'quadrado', scale = 1;

  const S = () => Math.min(W, H) / 1080;

    if (bgRect()) return;

    const box = stage.getBoundingClientRect();
    const avW = Math.max(120, box.width - 16), avH = Math.max(120, box.height - 16);
    scale = Math.min(avW / W, avH / H);
    canvas.setDimensions({ width: Math.round(W * scale), height: Math.round(H * scale) });
    canvas.setZoom(scale);

  function add(o, opts) {

  function coverFit(img, w, h, cx, cy) {
    const s = Math.max(w / img.width, h / img.height);
    img.set({ scaleX: s, scaleY: s, originX: 'center', originY: 'center', left: cx == null ? w / 2 : cx, top: cy == null ? h / 2 : cy });

  // ---------- desfazer / rascunho ----------
  let hist = [], hi = -1, muted = false, histT = null;
  function snap() { return JSON.stringify({ W, H, fmt, json: canvas.toJSON(PROPS) }); }
  function pushHist() {
    if (muted) return;
    clearTimeout(histT);
    histT = setTimeout(() => {
      const s = snap();
      if (hist[hi] === s) return;
      hist = hist.slice(0, hi + 1); hist.push(s);
      if (hist.length > 30) hist.shift();
      hi = hist.length - 1;
      try { localStorage.setItem(DRAFT_KEY, s); } catch (e) {}
      updUndo();
      if (tab === 'camadas') renderSheet();
    }, 250);
  }
  function restore(s, cb) {
    muted = true;
    const d = JSON.parse(s);
    W = d.W; H = d.H; fmt = d.fmt;
    edAnim = null;
    canvas.loadFromJSON(d.json, () => {
      ensureBg(); reattachVideos(); keepBgBottom(); fitView(); canvas.renderAll();
      muted = false; updUndo(); renderSheet(); updQuick();
      if (cb) cb();
    });
  }
  function updUndo() {
    document.getElementById('undo').disabled = hi <= 0;
    document.getElementById('redo').disabled = hi >= hist.length - 1;

  function setFormat(nw, nh, id) {
    const sx = nw / W, sy = nh / H, k = Math.min(sx, sy);
    canvas.discardActiveObject();
    canvas.getObjects().forEach((o) => {
      if (o.isBg) {
        if (o.fill && o.fill.coords) { const c = o.fill.coords; c.x1 *= sx; c.x2 *= sx; c.y1 *= sy; c.y2 *= sy; }
        o.set({ width: nw, height: nh, left: 0, top: 0, dirty: true });
        return;
      }
      if (o.isBgPhoto) { coverFit(o, nw, nh); return; }
      const c = o.getCenterPoint();
      o.set({ scaleX: o.scaleX * k, scaleY: o.scaleY * k });
      o.setPositionByOrigin(new fabric.Point(c.x * sx, c.y * sy), 'center', 'center');
      o.setCoords();
    });
    W = nw; H = nh; fmt = id || 'livre';
    fitView(); pushHist();

  // ---------- fotos ----------
  function readFile(file) {
    return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file); });
  }
  function loadImg(url) {
    return new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => reject(new Error('Não consegui abrir essa imagem.')); i.src = url; });
  }
  // Reduz foto grande (máx. 2000 px) pra o celular não travar. PNG continua PNG (transparência).
  async function prepPhoto(file) {
    const url = await readFile(file);
    const el = await loadImg(url);
    const max = 2000, k = Math.min(1, max / Math.max(el.naturalWidth, el.naturalHeight));
    if (k === 1 && file.size < 2.5e6) return url;
    const c = document.createElement('canvas');
    c.width = Math.round(el.naturalWidth * k); c.height = Math.round(el.naturalHeight * k);
    c.getContext('2d').drawImage(el, 0, 0, c.width, c.height);
    return /png|webp|gif/.test(file.type) ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.92);
  }

    fabric.Image.fromURL(url, (img) => {

      // Espaço escolhido: o que está selecionado (espaço vazio ou foto de exemplo),
      // senão o primeiro espaço vazio, senão a primeira foto de exemplo do modelo.
      const sel = active();
      const ph = !(opts && opts.free) && ((sel && (sel.placeholder || sel.samplePhoto)) ? sel : (placeholders()[0] || canvas.getObjects().find((o) => o.samplePhoto)));
      if (ph) {
        // Encaixa a foto no espaço do modelo, cobrindo tudo, no formato do espaço.
        const bw = ph.slotW || ph.width * ph.scaleX, bh = ph.slotH || ph.height * ph.scaleY;
        const c = ph.getCenterPoint();
        const idx = canvas.getObjects().indexOf(ph);
        coverFit(img, bw, bh, c.x, c.y);
        if (ph.anim) img.set({ anim: ph.anim, animDelay: ph.animDelay });
        img.clipPath = ph.slotW ? shapeObj(ph.phShape, bw, bh, img.scaleX, ph.phR) : new fabric.Rect({ width: bw / img.scaleX, height: bh / img.scaleY, rx: 28 / img.scaleX, ry: 28 / img.scaleY, originX: 'center', originY: 'center' });
        img.shape = 'moldura';
        canvas.remove(ph);
        canvas.insertAt(img, idx);
        canvas.setActiveObject(img); canvas.requestRenderAll();
        pushHist();
      } else {
        const s = Math.min((W * 0.7) / img.width, (H * 0.7) / img.height, 1.5);
        img.set({ scaleX: s, scaleY: s });
        add(img);
      }
    });
  }

  // ---------- Construção (Franklin, 2026-11-07) ----------
  // Inspirados no estilo dos banners de obra que ele usava no Canva pro Kleber
  // (hexágonos, faixas, fotos em círculo), mas feitos por nós: fotos de exemplo
  // criadas pela IA (/img/modelos/construcao/) e textos em português, sem preço.
  // A foto de exemplo é trocada pela do cliente (toque nela → Fotos).
  const SAMPLE_DIR = '/img/modelos/construcao/';
  const IMGS = {};
  let brandName = '';
  const EMPRESA = () => brandName || 'SUA LOJA DE CONSTRUÇÃO';
  // 'pedreiro' = construcao/pedreiro.jpg; 'blackfriday/tenis' = outra pasta.
  const samplePath = (n) => (n.includes('/') ? '/img/modelos/' + n : SAMPLE_DIR + n) + '.jpg';
  function preloadTpl(t) {
    return Promise.all((t.photos || []).map((n) => IMGS[n] ? IMGS[n] : loadImg(samplePath(n)).then((el) => { IMGS[n] = el; }).catch(() => {})));
  }
  // Formas de recorte (em unidades da imagem, centradas).

    } else if (tab === 'editar') {
      if (!isImg(o)) {
        h = '<h3>🪄 Editar foto</h3><p class="hint">Toque numa foto do banner pra editar. Se ainda não tem foto, vá em 🖼️ <b>Fotos</b>.</p>' +

          const i = canvas.getObjects().indexOf(x);
          const nm = x.isBgPhoto ? '🖼️ Foto de fundo' : isText(x) ? '🔤 ' + x.text.replace(/\s+/g, ' ').slice(0, 22) : isImg(x) ? '🖼️ ' + (x.name || 'Foto') : x.placeholder ? '📷 Espaço da foto' : '⭐ ' + (x.name || 'Elemento');
          return '<div class="layer' + (x === o ? ' on' : '') + '"><span class="ln" data-lsel="' + i + '">' + esc(nm) + '</span>' +
            (x.isBgPhoto ? '' : '<button type="button" data-lup="' + i + '" title="Pra frente">⬆️</button><button type="button" data-ldn="' + i + '" title="Pra trás">⬇️</button>') +
            '<button type="button" data-lvis="' + i + '" title="Mostrar/esconder">' + (x.visible === false ? '🙈' : '👁️') + '</button>' +

  function bindSheet() {
    const o = active();
    const on = (sel, ev, fn) => sheet.querySelectorAll(sel).forEach((el) => el.addEventListener(ev, (e) => fn(el, e)));
    const rr = () => { canvas.requestRenderAll(); };
    // modelos / tamanho
    on('[data-tcat]', 'click', (b) => { tplCat = b.dataset.tcat; tplQ = ''; renderSheet(); });
    on('[data-tgrp]', 'click', (b) => { tplGrp = b.dataset.tgrp; renderSheet(); });
    on('[data-tile]', 'click', (b) => {
      tplTile = TILES.find((x) => x.id === b.dataset.tile); tplQ = ''; tplSub = 0;
      // abre no tema que o cliente já estava vendo, se existir nesse formato
      if (!tileTpls(curTile()).some((t) => t.cat.includes(tplCat))) tplCat = 'todos';
      renderSheet(); sheet.scrollTop = 0;
    });
    on('[data-tsub]', 'click', (b) => { tplSub = +b.dataset.tsub; if (!tileTpls(curTile()).some((t) => t.cat.includes(tplCat))) tplCat = 'todos'; renderSheet(); });
    on('#tile-back', 'click', () => { tplTile = null; tplQ = ''; if (tplCat === 'todos') tplCat = 'blackfriday'; renderSheet(); sheet.scrollTop = 0; });
    on('[data-tpl]', 'click', (b) => pickTpl(b.dataset.tpl, b.dataset.tfmt, b.dataset.tfit === '1'));
    on('#tpl-q', 'input', (el) => {
      tplQ = el.value;
      sheet.querySelectorAll('[data-tcat]').forEach((c) => c.classList.toggle('on', !tplQ && c.dataset.tcat === tplCat));
      const g = document.getElementById('tpl-grid');
      g.innerHTML = tplGridHtml();
      g.querySelectorAll('[data-tpl]').forEach((b) => b.addEventListener('click', () => pickTpl(b.dataset.tpl, b.dataset.tfmt, b.dataset.tfit === '1')));
      fillThumbs();
    });
    if (tab === 'modelos') fillThumbs();
    on('#blank', 'click', () => {
      if (canvas.getObjects().some((x) => !x.isBg) && !confirm('Começar um banner novo em branco? (dá pra voltar com ↶)')) return;
      muted = true; canvas.clear(); ensureBg(); canvas.renderAll(); muted = false; pushHist(); setTab('fotos');
    });
    on('[data-fmt]', 'click', (b) => { const f = FORMATS.find((x) => x.id === b.dataset.fmt); setFormat(f.w, f.h, f.id); renderSheet(); });
    on('#custom', 'click', () => {
      const w = Math.round(+document.getElementById('cw').value), hh = Math.round(+document.getElementById('ch').value);
      if (!(w >= 200 && w <= 4000 && hh >= 200 && hh <= 4000)) { alert('Use um tamanho entre 200 e 4000 pixels.'); return; }
      setFormat(w, hh, 'livre'); renderSheet();
    });
    // fotos
    const handleFiles = async (files, asBg) => {
      const msg = document.getElementById('foto-msg');
      for (const f of [...files].slice(0, 10)) {
        if (!/^image\//.test(f.type)) { if (msg) msg.innerHTML = '<div class="msg err">Aqui é só imagem. Vídeo é no Cut Studio Pro.</div>'; continue; }
        try { const url = await prepPhoto(f); sessionPhotos.unshift(url); if (sessionPhotos.length > 12) sessionPhotos.pop(); asBg ? setAsBackground(url) : addPhoto(url); }
        catch (e) { if (msg) msg.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; }
      }
    };
    on('#pick', 'change', (el) => handleFiles(el.files));
    on('#cam', 'change', (el) => handleFiles(el.files));
    on('#bgpick', 'change', (el) => handleFiles(el.files, true));
    on('[data-again]', 'click', (el) => addPhoto(sessionPhotos[+el.dataset.again]));
    on('#logo', 'click', async () => {
      const msg = document.getElementById('foto-msg');
      try {
        const r = await fetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifier: session.identifier, password: session.password }) });
        const d = await r.json();
        if (d.brand && d.brand.logo) {
          fabric.Image.fromURL(d.brand.logo, (img) => {
            const s = (Math.min(W, H) * 0.22) / Math.max(img.width, img.height);
            img.set({ scaleX: s, scaleY: s, name: 'Logo', originX: 'right', originY: 'top', left: W - W * 0.04, top: H * 0.04 });
            add(img, { keepPos: true });
          });
        } else if (msg) msg.innerHTML = '<div class="msg err">Você ainda não tem logo salva no app. Toque em 📁 <b>Escolher da galeria</b> e pegue a imagem da sua logo.</div>';
      } catch (e) { if (msg) msg.innerHTML = '<div class="msg err">Não deu pra buscar a logo agora.</div>'; }
    });
    // texto
    on('[data-addtext]', 'click', (b) => addText(b.dataset.addtext));
    if (isText(o)) {
      on('#tx', 'input', (el) => { o.set('text', el.value); rr(); pushHist(); });
      on('[data-font]', 'click', (b) => setFont(o, b.dataset.font));
      bindSlider('fs', (v) => { o.set({ fontSize: v / (o.scaleX || 1) }); rr(); });
      bindColors('data-tcol', (c) => { o.set('fill', c); rr(); });
      bindColors('data-tstk', (c) => { o.set({ stroke: c, paintFirst: 'stroke' }); if (!o.strokeWidth) o.set('strokeWidth', 6 * S()); rr(); });
      bindColors('data-tbg', (c) => { o.set('backgroundColor', c); rr(); });
      bindSlider('sw', (v) => { o.set({ strokeWidth: v * S(), paintFirst: 'stroke', stroke: o.stroke || '#111111' }); rr(); });
      bindSlider('cs', (v) => { o.set('charSpacing', v); o.initDimensions(); rr(); });
      bindSlider('lh', (v) => { o.set('lineHeight', v); o.initDimensions(); rr(); });
      bindSlider('op', (v) => { o.set('opacity', v); rr(); });
      on('[data-ta]', 'click', (b) => { o.set('textAlign', b.dataset.ta); rr(); pushHist(); renderSheet(); });
      on('[data-ts]', 'click', (b) => {
        const k = b.dataset.ts;
        if (k === 'bold') o.set('fontWeight', Number(o.fontWeight) >= 700 || o.fontWeight === 'bold' ? 400 : 900);
        if (k === 'italic') o.set('fontStyle', o.fontStyle === 'italic' ? 'normal' : 'italic');
        if (k === 'upper') o.set('text', o.text === o.text.toUpperCase() ? o.text.toLowerCase() : o.text.toUpperCase());
        if (k === 'shadow') o.set('shadow', o.shadow ? null : new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 16 * S(), offsetX: 4 * S(), offsetY: 6 * S() }));
        if (o.initDimensions) o.initDimensions();
        o.setCoords(); rr(); pushHist(); renderSheet();
      });
    }
    // elementos
    on('[data-shape]', 'click', (b) => shape(b.dataset.shape));
    on('[data-emoji]', 'click', (b) => add(new fabric.Text(b.dataset.emoji, { fontSize: 180 * S(), name: 'Figurinha ' + b.dataset.emoji })));
    if (o && !isText(o) && !isImg(o) && !o.placeholder) {
      const each = (fn) => (o.type === 'group' ? o.getObjects().filter((x) => x.type !== 'text') : [o]).forEach(fn);
      bindColors('data-scol', (c) => { each((x) => x.set('fill', c)); rr(); });
      bindColors('data-sstk', (c) => { each((x) => { x.set('stroke', c); if (!x.strokeWidth) x.set('strokeWidth', 6 * S()); }); rr(); });
      bindSlider('ssw', (v) => { each((x) => x.set({ strokeWidth: v * S(), stroke: x.stroke || '#111111' })); rr(); });
      bindSlider('srx', (v) => { o.set({ rx: v, ry: v }); rr(); });
      bindSlider('sop', (v) => { o.set('opacity', v); rr(); });
      on('#sshadow', 'click', () => { o.set('shadow', o.shadow ? null : new fabric.Shadow({ color: 'rgba(0,0,0,0.45)', blur: 24 * S(), offsetX: 6 * S(), offsetY: 10 * S() })); rr(); pushHist(); renderSheet(); });
    }
    // fundo
    bindColors('data-bgc', (c) => { bgRect().set('fill', c); rr(); });
    on('[data-bgg]', 'click', (b) => { const g = GRADS[+b.dataset.bgg]; bgRect().set('fill', grad(g[0], g[1], true)); rr(); pushHist(); });
    on('#bgdel', 'click', () => { canvas.remove(bgPhoto()); renderSheet(); });
    if (bgPhoto()) {
      bindSlider('bgblur', (v) => setAdj(bgPhoto(), 'Blur', 'blur', v), pct);
      bindSlider('bgdark', (v) => setAdj(bgPhoto(), 'Brightness', 'brightness', v), (v) => Math.round(v * 100));
    }
    // editar foto
    if (isImg(o)) {
      on('[data-ai]', 'click', (b) => {
        const [tool, opt] = b.dataset.ai.split(':');
        const label = { recorte: '✂️ A IA está tirando o fundo…', fundo: '🎨 A IA está trocando o fundo…', retoque: '💄 A IA está retocando…' }[tool];
        aiTool(o, tool, opt ? { fundo: opt } : { nivel: 'leve' }, label);
      });
      on('#ai-edit', 'click', () => {
        const p = document.getElementById('ai-pedido').value.trim();
        if (!p) { document.getElementById('ed-msg').innerHTML = '<div class="msg err">Escreva o que você quer mudar na foto.</div>'; return; }
        aiTool(o, 'editar-ia', { pedido: p }, '✏️ A IA está mudando a foto…');
      });
      on('#flat', 'click', async () => {
        busy(true, '🧽 Apagando o fundo…');
        await new Promise((r) => setTimeout(r, 30));
        try { await replaceSrc(o, clearFlatBg(o, +document.getElementById('tol').value)); document.getElementById('ed-msg').innerHTML = '<div class="msg ok">✅ Pronto! Se apagou demais, toque em ↶ e use menos força. Se o fundo tem várias cores, use ✂️ Tirar o fundo (IA).</div>'; }
        catch (e) { document.getElementById('ed-msg').innerHTML = '<div class="msg err">Não deu pra apagar o fundo dessa foto.</div>'; }
        finally { busy(false); }
      });
      on('[data-preset]', 'click', (b) => setPreset(o, b.dataset.preset));
      ADJ.forEach(([type, key]) => bindSlider('adj-' + type, (v) => setAdj(o, type, key, v), (v) => Math.round(v * 100)));
      ['l', 'r', 't', 'b'].forEach((k) => bindSlider('crop-' + k, () => {
        const p = {}; ['l', 'r', 't', 'b'].forEach((x) => { p[x] = +document.getElementById('crop-' + x).value; });
        applyCrop(o, p);
      }, (v) => v + '%'));
      on('[data-shp]', 'click', (b) => { applyShape(o, b.dataset.shp); renderSheet(); });
      on('[data-flip]', 'click', (b) => { const k = b.dataset.flip === 'x' ? 'flipX' : 'flipY'; o.set(k, !o[k]); rr(); pushHist(); });
      on('#ishadow', 'click', () => { o.set('shadow', o.shadow ? null : new fabric.Shadow({ color: 'rgba(0,0,0,0.45)', blur: 30 * S(), offsetX: 8 * S(), offsetY: 14 * S() })); rr(); pushHist(); renderSheet(); });
      on('#asbg', 'click', () => { const url = o.getSrc(); canvas.remove(o); setAsBackground(url); setTab('fundo'); });
      bindColors('data-istk', (c) => { o.set({ stroke: c }); if (!o.strokeWidth) o.set('strokeWidth', 10 * S()); rr(); });
      bindSlider('isw', (v) => { o.set({ strokeWidth: v * S(), stroke: o.stroke || '#ffffff' }); rr(); });
      bindSlider('iop', (v) => { o.set('opacity', v); rr(); });
    }
    // camadas
    const objAt = (el, k) => canvas.getObjects()[+el.dataset[k]];
    on('[data-lsel]', 'click', (el) => { const x = objAt(el, 'lsel'); if (x.isBgPhoto) return; canvas.setActiveObject(x); rr(); renderSheet(); updQuick(); });
    on('[data-lup]', 'click', (el) => { canvas.bringForward(objAt(el, 'lup')); pushHist(); renderSheet(); });
    on('[data-ldn]', 'click', (el) => { canvas.sendBackwards(objAt(el, 'ldn')); keepBgBottom(); pushHist(); renderSheet(); });
    on('[data-lvis]', 'click', (el) => { const x = objAt(el, 'lvis'); x.set('visible', x.visible === false); if (x.visible === false) canvas.discardActiveObject(); rr(); pushHist(); renderSheet(); });
    on('[data-llock]', 'click', (el) => { const x = objAt(el, 'llock'); setLock(x, !x.locked); rr(); pushHist(); renderSheet(); });
    on('[data-ldel]', 'click', (el) => { canvas.remove(objAt(el, 'ldel')); renderSheet(); });
  }
  function setLock(x, v) {
    x.set({ locked: v, lockMovementX: v, lockMovementY: v, lockScalingX: v, lockScalingY: v, lockRotation: v, hasControls: !v });
  }

  // Banner pequeno / normal: sobra mais tela pros botões de baixo.
  // Alça de arrastar (Franklin, 2026-11-07: "clicando fica ruim, bota pra
  // diminuir e aumentar arrastando"). Arrasta: o banner fica do tamanho em que
  // soltar. Toque rápido: alterna entre pequeno e normal.
  const stageEl = document.getElementById('stage'), stageBtn = document.getElementById('stage-toggle');
  function setStageH(px) {
    if (px == null) { document.body.classList.remove('stage-custom'); document.body.style.removeProperty('--stage-h'); }
    else { document.body.classList.add('stage-custom'); document.body.style.setProperty('--stage-h', Math.round(px) + 'px'); }
    const small = px != null && px < window.innerHeight * 0.3;
    stageBtn.textContent = small ? '⬍ Arraste pra aumentar' : '⬍ Arraste pra diminuir';
    try { localStorage.setItem('mvo_estudio_stage_h', px == null ? '' : String(Math.round(px))); } catch (e) {}
  }
  function setStageMin(on) { setStageH(on ? window.innerHeight * 0.2 : null); setTimeout(fitView, 60); }
  let fitRaf = 0;
  stageBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const y0 = e.clientY, h0 = stageEl.getBoundingClientRect().height;
    const minH = Math.max(90, window.innerHeight * 0.12), maxH = window.innerHeight * 0.72;
    let moved = false;
    try { stageBtn.setPointerCapture(e.pointerId); } catch (x) {}
    stageBtn.classList.add('drag');
    const mv = (ev) => {
      const dy = ev.clientY - y0;
      if (!moved && Math.abs(dy) < 6) return;
      moved = true;
      setStageH(Math.max(minH, Math.min(maxH, h0 + dy)));
      cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitView);
    };
    const up = () => {
      stageBtn.removeEventListener('pointermove', mv); stageBtn.removeEventListener('pointerup', up); stageBtn.removeEventListener('pointercancel', up);
      stageBtn.classList.remove('drag');
      if (!moved) setStageMin(!(document.body.classList.contains('stage-custom') && stageEl.getBoundingClientRect().height < window.innerHeight * 0.3));
      else setTimeout(fitView, 30);
    };
    stageBtn.addEventListener('pointermove', mv); stageBtn.addEventListener('pointerup', up); stageBtn.addEventListener('pointercancel', up);
  });
  try { const h = +localStorage.getItem('mvo_estudio_stage_h'); if (h > 0) { setStageH(Math.min(h, window.innerHeight * 0.72)); setTimeout(fitView, 60); } } catch (e) {}
  function setTab(t) { if (t !== 'video') edStop(); tab = t; renderSheet(); sheet.scrollTop = 0; }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));

  // Ao tocar num item, abre o painel certo (como no Canva).
  function onSelect() {
    const o = active();
    if (tab === 'video') { renderSheet(); updQuick(); return; }
    if (isText(o)) tab = 'texto';
    else if (o && o.samplePhoto) tab = 'fotos';
    else if (isImg(o)) tab = 'editar';
    else if (o && o.placeholder) tab = 'fotos';
    else if (o && o.type !== 'activeSelection') tab = 'elementos';
    renderSheet(); updQuick();
  }
  canvas.on('selection:created', onSelect);
  canvas.on('selection:updated', onSelect);
  canvas.on('selection:cleared', () => { updQuick(); if (['texto', 'editar', 'elementos'].includes(tab)) renderSheet(); });
  canvas.on('object:scaling', (e) => { if (isText(e.target) && tab === 'texto') { const o = document.getElementById('fs-o'); if (o) o.textContent = Math.round(e.target.fontSize * e.target.scaleX); } });

  function updQuick() { document.getElementById('quick').classList.toggle('on', !!active()); }
  document.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => {
    const o = active(); if (!o) return;
    const q = b.dataset.q;
    if (q === 'del') { (o.type === 'activeSelection' ? o.getObjects() : [o]).forEach((x) => canvas.remove(x)); canvas.discardActiveObject(); renderSheet(); }
    if (q === 'dup') o.clone((c) => { c.set({ left: c.left + 30 * S(), top: c.top + 30 * S() }); if (c.type === 'activeSelection') { c.canvas = canvas; c.forEachObject((x) => canvas.add(x)); c.setCoords(); } else canvas.add(c); canvas.setActiveObject(c); canvas.requestRenderAll(); }, PROPS);
    if (q === 'menor' || q === 'maior') { const k = q === 'maior' ? 1.1 : 0.9; const c = o.getCenterPoint(); o.set({ scaleX: o.scaleX * k, scaleY: o.scaleY * k }); o.setPositionByOrigin(c, 'center', 'center'); o.setCoords(); pushHist(); }
    if (q === 'centro') { centerOf(o); pushHist(); }
    if (q === 'frente') { canvas.bringToFront(o); pushHist(); }
    if (q === 'tras') { canvas.sendToBack(o); keepBgBottom(); pushHist(); }
    if (q === 'girar') { o.rotate(((o.angle || 0) + 15) % 360); o.setCoords(); pushHist(); }
    canvas.requestRenderAll();
  }));
  document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const o = active();
    if (/INPUT|TEXTAREA|SELECT/.test(tag) || (o && o.isEditing)) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && o) { e.preventDefault(); document.querySelector('[data-q="del"]').click(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); document.getElementById(e.shiftKey ? 'redo' : 'undo').click(); }
  });

  // ---------- pronto: baixar ou mandar pras criações ----------
  function exportBlob(type) {
    edStop();
    canvas.discardActiveObject();
    const hidden = placeholders(); hidden.forEach((p) => p.set('visible', false));
    canvas.renderAll();
    const url = canvas.toDataURL({ format: type === 'png' ? 'png' : 'jpeg', quality: 0.93, multiplier: 1 / scale });
    hidden.forEach((p) => p.set('visible', true)); canvas.renderAll();
    return fetch(url).then((r) => r.blob());
  }
  // Carrossel: o banner comprido sai em 3 imagens, na ordem (1, 2, 3).
  async function exportParts(n) {
    edStop(); canvas.discardActiveObject();
    const hidden = placeholders(); hidden.forEach((p) => p.set('visible', false));
    canvas.renderAll();
    const out = [];
    for (let i = 0; i < n; i++) {
      const url = canvas.toDataURL({ format: 'jpeg', quality: 0.93, left: (i * W / n) * scale, top: 0, width: (W / n) * scale, height: H * scale, multiplier: 1 / scale });
      out.push(new File([await (await fetch(url)).blob()], 'carrossel-' + (i + 1) + '.jpg', { type: 'image/jpeg' }));
    }
    hidden.forEach((p) => p.set('visible', true)); canvas.renderAll();
    return out;
  }
  const isCarrossel = () => fmt === 'carrossel3' || fmt === 'carrossel3-fb';
  const doneModal = document.getElementById('done-modal'), doneBox = document.getElementById('done-box');
  document.getElementById('done').addEventListener('click', () => {
    const vazio = placeholders().length;
    edStop();
    if (isCarrossel()) {
      doneBox.innerHTML = '<h3>🎠 Seu carrossel está pronto?</h3><p class="hint">Ele sai em <b>3 imagens, na ordem</b>. No Instagram, poste as 3 juntas no mesmo post (carrossel): a imagem continua de uma pra outra quando a pessoa desliza.</p>' +
        '<button type="button" class="btn gold big" id="d-criacoes">💾 Salvar o carrossel em Minhas criações<small style="color:#333">as 3 imagens, pra postar pelo app</small></button>' +
        '<button type="button" class="btn big" id="d-baixar3">⬇️ Baixar as 3 imagens</button><div id="d-msg"></div><button type="button" class="btn big" id="d-fechar">Continuar editando</button>';
      doneModal.classList.add('on');
      document.getElementById('d-fechar').onclick = () => doneModal.classList.remove('on');
      document.getElementById('d-criacoes').onclick = () => saveToCriacoes();
      document.getElementById('d-baixar3').onclick = async () => {
        const files = await exportParts(3);
        if (navigator.canShare && navigator.canShare({ files }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
          try { await navigator.share({ files, title: 'Meu carrossel' }); return; } catch (e) { if (e.name === 'AbortError') return; }
        }
        for (const f of files) { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); await new Promise((r) => setTimeout(r, 400)); a.remove(); }
      };
      return;
    }
    if (hasAnim()) {
      // Banner animado: o principal é o vídeo; a imagem parada continua disponível.
      showAnimPreview().then(() => {
        const extra = document.createElement('div');
        extra.innerHTML = '<h4 style="margin-top:12px">Ou só a imagem parada</h4><button type="button" class="btn big" id="d-criacoes-img">💾 Salvar IMAGEM em Minhas criações</button><button type="button" class="btn big" id="d-baixar">⬇️ Baixar imagem (JPG)</button>';
        document.getElementById('a-fechar').before(extra);
        document.getElementById('d-baixar').onclick = () => download('jpg');
        document.getElementById('d-criacoes-img').onclick = () => { document.getElementById('d-criacoes-img').id = 'd-criacoes'; saveToCriacoes(); };
      });
      return;
    }
    doneBox.innerHTML = '<h3>✓ Seu banner está pronto?</h3>' +
      (vazio ? '<div class="msg err">Ainda tem ' + vazio + ' espaço(s) de foto vazio(s). Eles não aparecem na imagem final, mas o lugar fica em branco.</div>' : '') +
      '<button type="button" class="btn gold big" id="d-criacoes">💾 Salvar em Minhas criações<small style="color:#333">pra postar nas redes pelo app</small></button>' +
      '<button type="button" class="btn big" id="d-baixar">⬇️ Baixar no celular (JPG)</button>' +
      '<button type="button" class="btn big" id="d-png">⬇️ Baixar com fundo transparente (PNG)<small>bom pra logo</small></button>' +
      '<div id="d-msg"></div><button type="button" class="btn big" id="d-fechar">Continuar editando</button>';
    doneModal.classList.add('on');
    document.getElementById('d-fechar').onclick = () => doneModal.classList.remove('on');
    document.getElementById('d-baixar').onclick = () => download('jpg');
    document.getElementById('d-png').onclick = () => download('png');
    document.getElementById('d-criacoes').onclick = () => saveToCriacoes();
  });
  doneModal.addEventListener('click', (e) => { if (e.target === doneModal) closeDone(); });
  async function download(kind) {
    let restore = null;
    if (kind === 'png') { const b = bgRect(); restore = b.visible; b.set('visible', false); }
    const blob = await exportBlob(kind);
    if (kind === 'png') bgRect().set('visible', restore !== false);
    canvas.renderAll();
    const name = 'banner-' + Date.now() + '.' + kind;
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      try { await navigator.share({ files: [file], title: 'Meu banner' }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  // video (File) = banner animado já gravado; sem ele, salva a imagem parada.
  async function saveToCriacoes(video) {
    const btn = document.getElementById('d-criacoes'), msg = document.getElementById('d-msg');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      const fd = new FormData();
      fd.append('identifier', session.identifier); fd.append('password', session.password);
      if (video) {
        fd.append('instruction', 'Cliente: Este vídeo já está pronto (banner animado feito no Estúdio de Imagem). Use exatamente como está, sem criar banner, vídeo, música nem narração novos. Só escreva a legenda de cada rede.');
        fd.append('files', video, video.name.replace('banner-animado', 'estudio-animado'));
      } else if (isCarrossel()) {
        fd.append('instruction', 'Cliente: Este carrossel já está pronto (3 imagens feitas no Estúdio de Imagem, nesta ordem: 1, 2, 3). Use exatamente como está, sem criar banner, vídeo nem narração novos, e publique como carrossel na mesma ordem. Só escreva a legenda de cada rede.');
        (await exportParts(3)).forEach((f) => fd.append('files', f, 'estudio-' + f.name));
      } else {
        const blob = await exportBlob('jpg');
        fd.append('instruction', 'Cliente: Esta imagem já está pronta (feita no Estúdio de Imagem). Use exatamente como está, sem criar banner, vídeo nem narração novos. Só escreva a legenda de cada rede.');
        fd.append('files', blob, 'estudio-imagem-' + Date.now() + '.jpg');
      }
      fd.append('projeto', 'true');
      fd.append('projetoTitulo', video ? '🎬 Banner animado do Estúdio de Imagem' : isCarrossel() ? '🎠 Carrossel do Estúdio de Imagem' : '🖼️ Banner do Estúdio de Imagem');
      fd.append('semAprovacao', 'true');
      fd.append('requestId', (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2)));
      const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 180000);
      const res = await fetch('/api/commit', { method: 'POST', body: fd, signal: ctrl.signal });
      clearTimeout(timer);
      const r = await res.json();
      if (!(res.ok || res.status === 207)) throw new Error(r.error || 'falha desconhecida');
      if ((r.files || []).some((f) => f.status === 'erro')) throw new Error('A imagem não chegou ao app. Tente de novo com um sinal melhor.');
      msg.innerHTML = '<div class="msg ok">💾 Salvo! Em instantes aparece em <a href="/estudio.html#meus">📁 Minhas criações</a>, pronto pra postar em <a href="/estudio.html#postar">📤 Postar</a>.</div>';
      btn.textContent = '✔️ Salvo';
    } catch (e) {
      msg.innerHTML = '<div class="msg err">' + esc(e instanceof TypeError || e.name === 'AbortError' ? 'A conexão caiu no envio. Tente num lugar com mais sinal ou wifi.' : 'Não deu pra salvar: ' + e.message) + '</div>';
      btn.disabled = false; btn.textContent = '💾 Tentar de novo';
    }
  }

  // ---------- começo ----------
  // Nicho do cliente: quem é de material de construção já abre os modelos de Construção
  // com o nome da empresa nos banners (Franklin, 2026-11-07).
  const NICHO_CONSTRUCAO = ['kleber-construcao'];
  async function loadNiche() {
    try {
      const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifier: session.identifier, password: session.password }), signal: ctrl.signal });
      clearTimeout(tm);
      const d = await r.json();
      if (d.brand && d.brand.nome) brandName = d.brand.nome;
      if (/-rjinox$/.test(d.client || '')) tplCat = 'inox';
      if (NICHO_CONSTRUCAO.includes(d.client)) {
        tplCat = 'construcao';
        if (!brandName) brandName = 'Kleber Materiais de Construção';
      }
    } catch (e) {}
  }
  async function start() {
    await loadNiche();
    try { await Promise.all(FONTS.filter((f) => f !== 'Arial').flatMap((f) => [document.fonts.load('400 40px "' + f + '"'), document.fonts.load('900 40px "' + f + '"')])); } catch (e) {}
    let draft = null;
    try { draft = localStorage.getItem(DRAFT_KEY); } catch (e) {}
    const hash = location.hash.replace('#', '');
    const go = () => {
      if (['modelos', 'video', 'tamanho', 'fotos', 'texto', 'elementos', 'fundo', 'editar', 'camadas'].includes(hash)) setTab(hash);
      else setTab(canvas.getObjects().some((x) => !x.isBg) ? 'fotos' : 'modelos');
    };
    if (draft) {
      try { hist = [draft]; hi = 0; restore(draft, go); return; } catch (e) { hist = []; hi = -1; }
    }
    ensureBg(); fitView(); pushHist(); go();
  }
  start();
})();
</script>
