<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extrato da operação — Máquina de Vendas Online</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --accent-hover: #ff7554;
    --cyan: #33d6cb;
    --error: #ff6b6b;
    --violet: #8b7cf6;
    --green: #35d07f;
    --blue: #4d9eff;
    --amber: #ffc400;
  }
  * { box-sizing: border-box; }
  @keyframes appFrameGlow {
    0%, 100% { border-color: #ff2d1f; box-shadow: inset 0 0 10px rgba(255, 45, 31, 0.2); }
    50% { border-color: #ff7a63; box-shadow: inset 0 0 20px rgba(255, 45, 31, 0.4); }
  }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 16px 100px;
    background: var(--bg);
    color: var(--text);
    border-left: 2px solid #ff2d1f;
    border-right: 2px solid #ff2d1f;
    animation: appFrameGlow 2.4s ease-in-out infinite;
  }
  .action-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--panel);
    z-index: 50;
  }
  .action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 4px;
    border-radius: 14px;
    background: none;
    border: none;
    width: auto;
    margin-top: 0;
    position: relative;
    font-family: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .action-item svg { width: 24px; height: 24px; }
  .action-item .icon-circle, .action-item .icon-plain {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .action-item.item-calendario .icon-plain { background: rgba(51, 214, 203, 0.16); color: var(--cyan); }
  .action-item.item-redes .icon-plain { background: rgba(139, 124, 246, 0.18); color: var(--violet); }
  .action-item.item-postar .icon-circle { background: rgba(255, 90, 54, 0.16); color: var(--accent); }
  .action-item.item-relatorio .icon-plain { background: rgba(53, 208, 127, 0.16); color: var(--green); }
  .action-item.item-ajustes .icon-plain { background: rgba(77, 158, 255, 0.16); color: var(--blue); }
  .action-item.active.item-ajustes { color: var(--blue); }
  .action-item.active.item-ajustes .icon-plain { background: var(--blue); color: #fff; }
  h1 { font-size: 1.3rem; margin: 0; }
  .screen-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .back-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    text-decoration: none;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0 0 6px; }
  input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1.05rem;
  }
  input:focus { outline: none; border-color: var(--cyan); }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  #status { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; }
  #status.show { display: block; background: rgba(255, 107, 107, 0.12); border: 1px solid var(--error); color: var(--error); }
  #manual-login { display: none; }

  .alert-banner {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid var(--error);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .alert-banner.amber { background: rgba(255, 196, 0, 0.1); border-color: var(--amber); }
  .alert-banner .icon { font-size: 1.3rem; line-height: 1; }
  .alert-banner h3 { font-size: 0.95rem; margin: 0 0 4px; color: var(--error); }
  .alert-banner.amber h3 { color: var(--amber); }
  .alert-banner p { margin: 0; font-size: 0.85rem; color: var(--text); line-height: 1.5; }
  .alert-banner .row-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .alert-banner .row-list .item { font-size: 0.82rem; color: var(--muted); }
  .alert-banner .row-list .item b { color: var(--text); }

  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0 22px; }
  .strip-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .strip-card .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .strip-card .value { font-size: 1.4rem; font-weight: 800; margin-top: 6px; color: var(--cyan); }
  .strip-card .sub { font-size: 0.76rem; color: var(--muted); margin-top: 4px; }

  .group-label { font-size: 0.8rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin: 22px 0 10px; }
  .cost-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }
  .cost-card.critical { border-color: var(--error); background: rgba(255, 107, 107, 0.06); }
  .cost-card.warn { border-color: var(--amber); background: rgba(255, 196, 0, 0.06); }
  .cost-card .name { font-weight: 700; font-size: 0.95rem; }
  .cost-card .note { font-size: 0.78rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .cost-card .right { text-align: right; flex-shrink: 0; white-space: nowrap; }
  .cost-card .value { font-weight: 700; font-size: 0.95rem; }
  .cost-card .cycle { font-size: 0.72rem; color: var(--muted); }
  .cost-card .countdown { margin-top: 6px; font-size: 0.76rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; display: inline-block; }
  .cost-card .countdown.ok { background: rgba(53, 208, 127, 0.16); color: var(--green); }
  .cost-card .countdown.warn { background: rgba(255, 196, 0, 0.16); color: var(--amber); }
  .cost-card .countdown.critical { background: rgba(255, 107, 107, 0.16); color: var(--error); }
  .pontual-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .pontual-card .name { font-weight: 700; font-size: 0.9rem; }
  .pontual-card .note { font-size: 0.78rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .pontual-card .meta { margin-top: 6px; font-size: 0.78rem; color: var(--muted); }
  .pontual-card .status-pill { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .note-footer { font-size: 0.78rem; color: var(--muted); margin-top: 24px; line-height: 1.5; }
  .credito-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .credito-card.baixo { border-color: var(--amber); background: rgba(255, 196, 0, 0.06); }
  .credito-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .credito-card .name { font-weight: 700; font-size: 0.95rem; }
  .credito-card .note { font-size: 0.78rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .credito-card .saldo { font-weight: 800; font-size: 1.2rem; text-align: right; white-space: nowrap; }
  .credito-card.baixo .saldo { color: var(--amber); }
  .credito-card:not(.baixo) .saldo { color: var(--green); }
  .credito-card .meta-row { margin-top: 8px; font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
  .credito-card .meta-row b { color: var(--text); }

  /* ---- botão flutuante de Suporte ---- */
  .support-fab {
    position: fixed;
    z-index: 300;
    width: 66px;
    height: 66px;
    border: none;
    border-radius: 18px;
    background: none;
    padding: 0;
    display: none;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }
  .support-fab:focus, .support-fab:active { outline: none; }
  .support-fab img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .support-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 310;
    flex-direction: column;
  }
  .support-modal.show { display: flex; }
  .support-modal-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .support-modal-header .back-btn {
    width: 32px;
    height: 32px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    cursor: pointer;
  }
  .support-modal-title { font-weight: 700; font-size: 1rem; flex: 1; text-align: center; margin-right: 32px; }
  .support-chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .support-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .support-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .support-msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  .support-msg.bot.loading { color: var(--muted); font-style: italic; }
  .support-empty-hint { color: var(--muted); font-size: 0.9rem; text-align: center; margin-top: 24px; }
  .support-modal-bottom {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .support-question-input {
    flex: 1;
    resize: none;
    max-height: 100px;
    padding: 10px 14px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
  }
  .support-mic-btn, .support-send-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
  }
  .support-mic-btn.recording { background: var(--green); color: #06231f; border-color: var(--green); }
  .support-send-btn { background: var(--accent); color: #fff; border: none; }
  .support-send-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
</style>
</head>
<body>
  <div class="screen-header">
    <a href="/ajustes.html" class="back-btn" id="back-btn">‹</a>
    <h1>Extrato da operação</h1>
  </div>

  <div id="manual-login">
    <label for="passphrase">Sua senha mestra</label>
    <input type="password" id="passphrase" autocomplete="current-password" />
    <button type="button" id="load-btn">Carregar extrato</button>
  </div>

  <div id="status"></div>

  <div id="report" style="display:none;">
    <div id="alerts-area"></div>
    <div class="strip" id="strip"></div>

    <div class="group-label">Créditos de uso variável</div>
    <div id="creditos-area"></div>

    <div class="group-label">Vencimentos com data</div>
    <div id="recorrentes-area"></div>

    <div class="group-label">Pontuais, pendentes ou fora de uso</div>
    <div id="pontuais-area"></div>

    <p class="note-footer" id="updated-note"></p>
  </div>

  <nav class="action-bar">
    <a class="action-item item-calendario" href="/calendario.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      Calendário
    </a>
    <a class="action-item item-redes" href="/contas-conectadas.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h11"/></svg></div>
      Redes
    </a>
    <a class="action-item item-postar" href="/#postar">
      <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div>
      Postar
    </a>
    <a class="action-item item-relatorio" href="/relatorio-redes.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div>
      Relatório
    </a>
    <a class="action-item active item-ajustes" href="/ajustes.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      Ajustes
    </a>
  </nav>

  <button type="button" id="support-fab" class="support-fab" aria-label="Suporte">
    <img src="/img/support-robot-cutout.png" alt="" />
  </button>

  <div id="support-modal" class="support-modal">
    <div class="support-modal-header">
      <button type="button" id="support-close-btn" class="back-btn">‹</button>
      <div class="support-modal-title">Suporte</div>
    </div>
    <div class="support-chat" id="support-chat">
      <p class="support-empty-hint">Pergunte qualquer coisa sobre como usar o app.</p>
    </div>
    <div class="support-modal-bottom">
      <textarea id="support-question-input" class="support-question-input" rows="1" placeholder="Digite sua dúvida..."></textarea>
      <button type="button" id="support-mic-btn" class="support-mic-btn" title="Perguntar por voz">🎤</button>
      <button type="button" id="support-send-btn" class="support-send-btn">➤</button>
    </div>
  </div>

  <script>
    const HANDOFF_KEY = 'mvo_report_handoff';

    document.getElementById('back-btn').addEventListener('click', (e) => {
      if (window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });
    const statusEl = document.getElementById('status');
    const reportEl = document.getElementById('report');
    const manualLoginEl = document.getElementById('manual-login');

    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = 'show';
    }

    function fmtMoeda(valor, moeda) {
      if (valor == null) return '—';
      const prefix = moeda === 'USD' ? 'US$' : 'R$';
      return `${prefix} ${valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function fmtData(iso) {
      const [ano, mes, dia] = iso.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    function countdownLabel(dias) {
      if (dias < 0) return { texto: `venceu há ${Math.abs(dias)} dia${Math.abs(dias) === 1 ? '' : 's'}`, classe: 'critical' };
      if (dias === 0) return { texto: 'vence hoje', classe: 'critical' };
      if (dias === 1) return { texto: 'vence amanhã', classe: 'critical' };
      if (dias <= 5) return { texto: `vence em ${dias} dias`, classe: 'warn' };
      return { texto: `vence em ${dias} dias`, classe: 'ok' };
    }

    function renderAlerts(alertas) {
      const area = document.getElementById('alerts-area');
      if (!alertas.length) {
        area.innerHTML = '';
        return;
      }
      const criticos = alertas.filter((a) => a.diasParaVencer <= 2);
      const classe = criticos.length ? '' : 'amber';
      const icon = criticos.length ? '🚨' : '⚠️';
      const rows = alertas
        .map((a) => `<div class="item"><b>${a.nome}</b> — ${a.diasParaVencer < 0 ? 'venceu' : `vence em ${a.diasParaVencer} dia${a.diasParaVencer === 1 ? '' : 's'}`} (${fmtData(a.proximaData)}), ${fmtMoeda(a.valor, a.moeda)}${a.critico ? ' — CRÍTICO: app sai do ar se vencer' : ''}</div>`)
        .join('');
      area.innerHTML = `
        <div class="alert-banner ${classe}">
          <div class="icon">${icon}</div>
          <div>
            <h3>${alertas.length === 1 ? '1 vencimento chegando' : `${alertas.length} vencimentos chegando`}</h3>
            <p>Dentro dos próximos 5 dias:</p>
            <div class="row-list">${rows}</div>
          </div>
        </div>
      `;
    }

    function renderStrip(recorrentes, fixoMensalConhecido) {
      const proximo = recorrentes[0];
      const strip = document.getElementById('strip');
      strip.innerHTML = `
        <div class="strip-card">
          <div class="label">Fixo mensal conhecido</div>
          <div class="value">R$ ${fixoMensalConhecido.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
          <div class="sub">soma dos itens mensais abaixo</div>
        </div>
        <div class="strip-card">
          <div class="label">Vencimento mais próximo</div>
          <div class="value" style="font-size:1.1rem">${proximo ? proximo.nome : '—'}</div>
          <div class="sub">${proximo ? `${fmtData(proximo.proximaData)} · ${fmtMoeda(proximo.valor, proximo.moeda)}` : ''}</div>
        </div>
      `;
    }

    function renderRecorrentes(recorrentes) {
      const area = document.getElementById('recorrentes-area');
      area.innerHTML = recorrentes
        .map((item) => {
          const cd = countdownLabel(item.diasParaVencer);
          const cardClasse = item.critico && cd.classe !== 'ok' ? 'critical' : cd.classe === 'critical' || cd.classe === 'warn' ? 'warn' : '';
          const valorLabel = item.moeda === 'USD' && item.valorAproxBRL
            ? `${fmtMoeda(item.valor, 'USD')} <span style="color:var(--muted); font-weight:400">(≈ ${fmtMoeda(item.valorAproxBRL, 'BRL')})</span>`
            : fmtMoeda(item.valor, item.moeda);
          const autoRenovNota = item.autoRenovacao === false ? ' · sem renovação automática' : '';
          const pagoNota = item.ultimoPagamento
            ? ` · ✔ pago (ref. ${item.ultimoPagamento.referencia.slice(5)}/${item.ultimoPagamento.referencia.slice(0, 4)}, informado em ${fmtData(item.ultimoPagamento.informadoEm)})`
            : '';
          return `
            <div class="cost-card ${cardClasse}">
              <div>
                <div class="name">${item.nome}</div>
                <div class="note">${item.categoria} · ${item.nota || ''}${autoRenovNota}${pagoNota}</div>
              </div>
              <div class="right">
                <div class="value">${valorLabel}</div>
                <div class="cycle">${item.ciclo} · dia ${fmtData(item.proximaData)}</div>
                <div class="countdown ${cd.classe}">${cd.texto}</div>
              </div>
            </div>
          `;
        })
        .join('');
    }

    function renderPontuais(pontuais) {
      const area = document.getElementById('pontuais-area');
      area.innerHTML = pontuais
        .map(
          (item) => `
            <div class="pontual-card">
              <div class="name">${item.nome}</div>
              <div class="note">${item.nota || ''}</div>
              <div class="meta">
                ${item.valor != null ? `${fmtMoeda(item.valor, item.moeda)}${item.ciclo ? ` · ${item.ciclo}` : ''} · ` : ''}
                <span class="status-pill">${item.status}</span>
              </div>
            </div>
          `
        )
        .join('');
    }

    function renderCreditos(creditos) {
      const area = document.getElementById('creditos-area');
      area.innerHTML = creditos
        .map((item) => {
          const recarga = item.ultimaRecarga
            ? `${fmtMoeda(item.ultimaRecarga.valor, item.moeda)} em ${fmtData(item.ultimaRecarga.data)}`
            : '—';
          return `
            <div class="credito-card ${item.saldoBaixo ? 'baixo' : ''}">
              <div class="top-row">
                <div>
                  <div class="name">${item.saldoBaixo ? '⚠️ ' : ''}${item.nome}</div>
                  <div class="note">${item.nota || ''}</div>
                </div>
                <div class="saldo">${fmtMoeda(item.saldoAtual, item.moeda)}</div>
              </div>
              <div class="meta-row">
                <span>Última recarga: <b>${recarga}</b></span>
                <span>Recarga automática: <b>${item.recargaAutomatica ? 'ligada' : 'desligada'}</b></span>
                <span>Conferido em: <b>${fmtData(item.conferidoEm)}</b></span>
              </div>
            </div>
          `;
        })
        .join('');
    }

    async function loadReport(passphrase) {
      statusEl.className = '';
      try {
        const response = await fetch('/api/extrato-operacao', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passphrase }),
        });
        const result = await response.json();
        if (!response.ok) {
          showError(`Erro: ${result.error || 'falha desconhecida'}`);
          manualLoginEl.style.display = 'block';
          return;
        }
        renderAlerts(result.alertas || []);
        renderStrip(result.recorrentes || [], result.fixoMensalConhecido || 0);
        renderCreditos(result.creditos || []);
        renderRecorrentes(result.recorrentes || []);
        renderPontuais(result.pontuais || []);
        document.getElementById('updated-note').textContent =
          `Datas recalculadas a cada vez que essa página abre. Última carga: ${new Date(result.atualizadoEm).toLocaleString('pt-BR')}. Valores/dias vêm de uma lista mantida manualmente (custos-operacao.js) — atualizar lá sempre que uma ferramenta nova entrar ou um valor mudar.`;
        reportEl.style.display = 'block';
      } catch (error) {
        showError(`Erro: ${error.message || error}`);
        manualLoginEl.style.display = 'block';
      }
    }

    document.getElementById('load-btn').addEventListener('click', () => {
      const passphrase = document.getElementById('passphrase').value;
      if (!passphrase) {
        showError('Digite a senha mestra.');
        return;
      }
      loadReport(passphrase);
    });

    (function autoLoad() {
      try {
        const handoff = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        if (handoff && handoff.password) {
          loadReport(handoff.password);
          return;
        }
      } catch (e) {}
      manualLoginEl.style.display = 'block';
    })();

    // ---- Botão flutuante de Suporte (arrastável) ----
    (function setupSupportWidget() {
      const supportFab = document.getElementById('support-fab');
      const supportModal = document.getElementById('support-modal');
      const closeBtn = document.getElementById('support-close-btn');
      const chatEl = document.getElementById('support-chat');
      const inputEl = document.getElementById('support-question-input');
      const micBtn = document.getElementById('support-mic-btn');
      const sendBtn = document.getElementById('support-send-btn');

      function getCreds() {
        try {
          return JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        } catch (e) {
          return null;
        }
      }
      function showFabIfLoggedIn() {
        const creds = getCreds();
        if (creds && creds.identifier && creds.password) supportFab.style.display = 'block';
      }
      showFabIfLoggedIn();

      const POS_KEY = 'mvo_support_fab_pos';
      function applyPos(pos) {
        supportFab.style.left = `${pos.x}px`;
        supportFab.style.top = `${pos.y}px`;
        supportFab.style.right = 'auto';
        supportFab.style.bottom = 'auto';
      }
      function defaultPos() {
        return { x: window.innerWidth - 70, y: Math.round(window.innerHeight * 0.58) };
      }
      (function initPos() {
        try {
          const saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
          applyPos(saved && typeof saved.x === 'number' ? saved : defaultPos());
        } catch (e) {
          applyPos(defaultPos());
        }
      })();

      let dragging = false;
      let moved = false;
      let startX, startY, origX, origY;
      supportFab.addEventListener('pointerdown', (e) => {
        dragging = true;
        moved = false;
        supportFab.setPointerCapture(e.pointerId);
        const rect = supportFab.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origX = rect.left;
        origY = rect.top;
      });
      supportFab.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        const x = Math.max(4, Math.min(window.innerWidth - supportFab.offsetWidth - 4, origX + dx));
        const y = Math.max(4, Math.min(window.innerHeight - supportFab.offsetHeight - 4, origY + dy));
        applyPos({ x, y });
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        const rect = supportFab.getBoundingClientRect();
        try {
          localStorage.setItem(POS_KEY, JSON.stringify({ x: rect.left, y: rect.top }));
        } catch (e) {}
      }
      supportFab.addEventListener('pointerup', endDrag);
      supportFab.addEventListener('pointercancel', endDrag);
      supportFab.addEventListener('click', () => {
        if (moved) return;
        supportModal.classList.add('show');
      });
      closeBtn.addEventListener('click', () => supportModal.classList.remove('show'));

      function addMsg(text, who) {
        const el = document.createElement('div');
        el.className = `support-msg ${who}`;
        el.textContent = text;
        chatEl.appendChild(el);
        chatEl.scrollTop = chatEl.scrollHeight;
        return el;
      }

      async function sendQuestion() {
        const question = inputEl.value.trim();
        if (!question) return;
        const creds = getCreds();
        if (!creds || !creds.identifier || !creds.password) {
          addMsg('Sessão não encontrada — entre no app de novo.', 'bot');
          return;
        }
        inputEl.value = '';
        sendBtn.disabled = true;
        addMsg(question, 'user');
        const loadingEl = addMsg('Pensando...', 'bot');
        loadingEl.classList.add('loading');
        try {
          const response = await fetch('/api/support-ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: creds.identifier, password: creds.password, question }),
          });
          const result = await response.json();
          loadingEl.remove();
          addMsg(response.ok ? result.answer : result.error || 'Não consegui responder agora.', 'bot');
        } catch (error) {
          loadingEl.remove();
          addMsg('Falha de conexão — tenta de novo.', 'bot');
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', sendQuestion);
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendQuestion();
        }
      });

      const SupportSpeechCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SupportSpeechCtor) {
        micBtn.disabled = true;
        micBtn.title = 'Ditado por voz indisponível neste navegador.';
      } else {
        const recognition = new SupportSpeechCtor();
        recognition.lang = 'pt-BR';
        recognition.interimResults = true;
        recognition.continuous = true;
        let listening = false;
        let baseText = '';
        let finalText = '';

        function stopListeningUi() {
          listening = false;
          micBtn.classList.remove('recording');
        }
        recognition.addEventListener('result', (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (result.isFinal) finalText = `${finalText} ${result[0].transcript}`.trim();
            else interim += result[0].transcript;
          }
          const transcript = `${finalText} ${interim}`.trim();
          if (!transcript) return;
          const sep = baseText.trim() ? ' ' : '';
          inputEl.value = `${baseText.trim()}${sep}${transcript}`.trim();
        });
        recognition.addEventListener('end', () => {
          if (listening) {
            try {
              recognition.start();
            } catch (e) {
              stopListeningUi();
            }
            return;
          }
          stopListeningUi();
        });
        recognition.addEventListener('error', (event) => {
          if (event.error === 'no-speech' || event.error === 'aborted') return;
          listening = false;
          stopListeningUi();
        });
        micBtn.addEventListener('click', () => {
          if (listening) {
            listening = false;
            recognition.stop();
            return;
          }
          listening = true;
          baseText = inputEl.value;
          finalText = '';
          micBtn.classList.add('recording');
          try {
            recognition.start();
          } catch (e) {
            listening = false;
            stopListeningUi();
          }
        });
      }
    })();
  </script>
</body>
