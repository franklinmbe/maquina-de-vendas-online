<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Relatório completo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#111315; --surface:#1A1D21; --ink:#E9EBEE; --muted:#9BA4AE; --line:#2E3339;
  --steel:#8E99A4; --accent:#FF5A6E; --accent-soft:#3A1A20;
  --fb:#4C8DFF; --ig:#E0569B;
  --good:#5CC98A; --good-soft:#15291E; --warn:#F0B35A; --warn-soft:#2E2412; --bad:#FF7A70; --bad-soft:#321816;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Archivo,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0;max-width:68ch}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px}
.back{color:var(--ink);text-decoration:none;font-size:1.8rem;line-height:1}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.mono{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
header{display:grid;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:16px}
section{display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.wrap>*,#report>*,.pane>*,.panel,.chart,.bar-row>*{min-width:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pills button.active{background:var(--accent);border-color:var(--accent);color:#1A0A0D}
.pills button:focus-visible,.tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs button{font:inherit;font-weight:800;font-size:1.05rem;padding:14px 10px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.tabs button.active{background:var(--ink);color:var(--ground)}
select{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px;align-content:start}
.kpi b{font-size:1.45rem;font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500}
.kpi span{color:var(--muted);font-size:.85rem}
.kpi small{font-size:.8rem;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.net{display:flex;align-items:center;gap:10px}
.net .dot{width:12px;height:12px;border-radius:50%}
.pane{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.vendors{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.vendor{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:6px;align-content:start}
.vendor.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.vendor .big{font-size:1.55rem;font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500}
.vendor small{color:var(--muted)}
.pill{justify-self:start;display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px}
.chart{display:grid;gap:8px;position:relative}
.bar-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:10px;align-items:center;font-size:.88rem}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:22px}
.bar{position:absolute;left:0;top:3px;height:16px;border-radius:0 4px 4px 0;background:var(--steel)}
.bar.me{background:var(--accent)}
.val{position:absolute;top:1px;z-index:2;background:var(--surface);padding:0 4px;border-radius:3px;font-size:.8rem;white-space:nowrap}
.avgline{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--muted)}
.legend{font-size:.8rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
td.r{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
td a{text-decoration:underline;text-underline-offset:2px}
tr:last-child td{border-bottom:none}
tr.me td{background:var(--accent-soft)}
.sugs{display:grid;gap:12px}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.sug .who{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 16px;font-size:.9rem;display:grid;gap:4px}
.note ul{margin:0;padding-left:18px}
.foot{color:var(--muted);font-size:.85rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.8rem;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
#manual-login{display:none;gap:8px;max-width:360px}
#manual-login input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#manual-login button{font:inherit;font-weight:700;padding:10px 12px;border-radius:8px;border:0;background:var(--accent);color:#1A0A0D;cursor:pointer}
#status{color:var(--bad)}
#report{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
[hidden]{display:none!important}
@media (max-width:640px){.bar-row{grid-template-columns:100px 1fr}h1{font-size:1.5rem}.kpi b{font-size:1.15rem}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/ajustes.html" class="back" id="back-btn" aria-label="Voltar">‹</a><span class="eyebrow">Relatório completo · Facebook, Instagram e Meta Ads</span></div>

  <div id="manual-login">
    <label for="identifier">E-mail ou telefone</label>
    <input type="text" id="identifier" autocomplete="username" />
    <label for="password">Senha</label>
    <input type="password" id="password" autocomplete="current-password" />
    <button type="button" id="load-btn">Ver relatório</button>
  </div>
  <p id="status"></p>

  <div id="report" hidden>
    <header>
      <h1 id="title"></h1>
      <label id="conta-wrap" hidden><span class="eyebrow">Empresa</span><br><select id="conta"></select></label>
      <div class="tabs" role="tablist" aria-label="Tipo de relatório">
        <button type="button" role="tab" data-tab="organico">Orgânico</button>
        <button type="button" role="tab" data-tab="anuncios">Anúncios</button>
      </div>
      <div class="pills" id="periods" role="tablist" aria-label="Período"></div>
    </header>

    <div class="pane" id="pane-organico"></div>
    <div class="pane" id="pane-anuncios" hidden></div>
  </div>
</div>

<script>
(function(){
  const HANDOFF_KEY = 'mvo_report_handoff';
  const VENDOR_BY_CLIENT = { 'eduardo-rjinox':'dudu', 'jaqueline-rjinox':'jack', 'alessandra-rjinox':'ale', 'aline-rjinox':'aline' };
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const brl = (v) => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const int = (v) => Number(v || 0).toLocaleString('pt-BR');
  const brDate = (d) => String(d || '').slice(0, 10).split('-').reverse().join('/');
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  let RES = null, CREDS = null, ME = null, period = store.get('mvo_rel_period') || '7', tab = store.get('mvo_rel_tab') || 'organico';

  document.getElementById('back-btn').addEventListener('click', (e) => { if (history.length > 1) { e.preventDefault(); history.back(); } });

  function kpi(label, value, extra) { return `<div class="kpi"><span>${label}</span><b>${value}</b>${extra || ''}</div>`; }
  function growth(g) {
    if (!g) return '<small class="flat">sem histórico ainda</small>';
    const cls = g.valor > 0 ? 'up' : g.valor < 0 ? 'down' : 'flat';
    return `<small class="${cls}">${g.valor > 0 ? '+' : ''}${int(g.valor)} desde ${brDate(g.desde)}</small>`;
  }

  function renderPeriods() {
    document.getElementById('periods').innerHTML = ['7', '15', '30'].map((k) =>
      `<button type="button" role="tab" aria-selected="${k === period}" class="${k === period ? 'active' : ''}" data-p="${k}">${k} dias</button>`).join('');
    document.querySelectorAll('#periods button').forEach((b) => b.addEventListener('click', () => { period = b.dataset.p; store.set('mvo_rel_period', period); render(); }));
    document.querySelectorAll('.tabs button').forEach((b) => { const on = b.dataset.tab === tab; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
    document.getElementById('pane-organico').hidden = tab !== 'organico';
    document.getElementById('pane-anuncios').hidden = tab !== 'anuncios';
  }

  function renderOrganico() {
    const el = document.getElementById('pane-organico');
    const o = RES.organico;
    if (!o || o.erro) { el.innerHTML = `<div class="empty">${esc((o && o.erro) || 'Relatório orgânico indisponível.')}</div>`; return; }
    const p = o.periodos[period];
    const fb = p.facebook, ig = p.instagram;
    let html = `<section>
      <div class="net"><span class="dot" style="background:var(--fb)"></span><h2>Facebook · ${esc(o.pagina.nome)}</h2></div>
      <div class="kpis">
        ${kpi('Seguidores', int(o.pagina.seguidores), growth(fb.crescimentoSeguidores))}
        ${kpi('Visualizações dos vídeos', int(fb.visualizacoesVideos), `<small class="flat">${int(fb.videos)} vídeos/Reels no período</small>`)}
        ${kpi('Posts publicados', int(fb.posts))}
        ${fb.conversasMessenger == null ? kpi('Conversas no Messenger', '—', '<small class="flat">sem acesso às mensagens</small>') : kpi('Conversas no Messenger', int(fb.conversasMessenger), `<small class="flat">${int(fb.mensagensMessenger)} mensagens</small>`)}
        ${kpi('Pessoas falando da Página', int(o.pagina.falandoSobre), '<small class="flat">últimos 7 dias, segundo a Meta</small>')}
      </div>`;
    html += fb.topVideos.length ? `<div class="tablebox"><table><thead><tr><th>Vídeos mais vistos no Facebook</th><th class="r">Visualizações</th><th class="r">Data</th></tr></thead><tbody>${
      fb.topVideos.map((v) => `<tr><td>${v.link ? `<a href="${esc(v.link)}" target="_blank" rel="noopener">${esc(v.texto)}</a>` : esc(v.texto)}</td><td class="r">${int(v.visualizacoes)}</td><td class="r">${brDate(v.data)}</td></tr>`).join('')
    }</tbody></table></div>` : '<div class="empty">Nenhum vídeo publicado no Facebook nesse período.</div>';
    html += '<p class="foot">Visualizações contam tudo que o vídeo teve até hoje, inclusive as que vieram dos anúncios.</p></section>';

    if (ig && o.instagram) {
      html += `<section>
        <div class="net"><span class="dot" style="background:var(--ig)"></span><h2>Instagram · @${esc(o.instagram.usuario)}</h2></div>
        <div class="kpis">
          ${kpi('Seguidores', int(o.instagram.seguidores), growth(ig.crescimentoSeguidores))}
          ${kpi('Curtidas', int(ig.curtidas), `<small class="flat">nos ${int(ig.posts)} posts do período</small>`)}
          ${kpi('Comentários', int(ig.comentarios))}
          ${kpi('Posts publicados', int(ig.posts), `<small class="flat">${int(ig.reels)} Reels · ${int(ig.fotos)} fotos · ${int(ig.carrosseis)} carrosséis</small>`)}
        </div>`;
      html += ig.topPosts.length ? `<div class="tablebox"><table><thead><tr><th>Posts com mais curtidas e comentários</th><th>Tipo</th><th class="r">Curtidas</th><th class="r">Coment.</th><th class="r">Data</th></tr></thead><tbody>${
        ig.topPosts.map((x) => `<tr><td>${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.texto)}</a>` : esc(x.texto)}</td><td>${esc(x.tipo)}</td><td class="r">${int(x.curtidas)}</td><td class="r">${int(x.comentarios)}</td><td class="r">${brDate(x.data)}</td></tr>`).join('')
      }</tbody></table></div>` : '<div class="empty">Nenhum post no Instagram nesse período.</div>';
      html += '</section>';
    }

    html += `<div class="note"><b>Ainda não aparece aqui</b><ul>${(o.indisponivel || []).map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>
      <p class="foot">Atualizado em ${new Date(o.geradoEm).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' })}. Atualiza sozinho todo dia às 6h.</p>`;
    el.innerHTML = html;
  }

  function renderAnuncios() {
    const el = document.getElementById('pane-anuncios');
    const A = RES.anuncios;
    if (!A) { el.innerHTML = '<div class="empty">Ainda não há relatório de anúncios dessa empresa.</div>'; return; }
    const p = A.periodos[period];
    if (!p) { el.innerHTML = '<div class="empty">Sem dados para esse período.</div>'; return; }
    const hasVendors = Array.isArray(A.vendedores) && A.vendedores.length > 0;
    const hl = ME;
    let html = `<section><div class="kpis">
      ${kpi('Conversas no WhatsApp', int(p.total.conversas))}
      ${kpi('Investido', brl(p.total.gasto))}
      ${kpi('Custo médio por conversa', p.total.conversas ? brl(p.total.custo) : '—')}
      ${kpi('Período', `<span style="font-size:1rem;font-family:Archivo,sans-serif">${esc(p.rotulo)}</span>`)}
    </div></section>`;

    if (hasVendors) {
      const vs = A.vendedores.map((v) => {
        const cs = p.campanhas.filter((c) => c.vendedor === v.id);
        const conversas = cs.reduce((s, c) => s + c.conversas, 0);
        const gasto = cs.reduce((s, c) => s + c.gasto, 0);
        return { ...v, conversas, gasto, custo: conversas ? gasto / conversas : 0 };
      }).sort((a, b) => a.custo - b.custo);
      const tags = [['good', 'Melhor da conta'], ['good', 'Muito bom'], ['warn', 'Acima da média'], ['bad', 'Mais cara da conta']];
      html += `<section><span class="eyebrow">Resumo por vendedor</span><h2>Quem traz conversa mais barata</h2><div class="vendors">${
        vs.map((v, i) => `<div class="vendor ${v.id === ME ? 'me' : ''}"><h3>${esc(v.nome)}${v.id === ME ? ' · você' : ''}</h3><span class="big">${brl(v.custo)}</span>
        <small>por conversa · ${int(v.conversas)} conversas · ${brl(v.gasto)}</small><span class="pill ${(tags[i] || tags[1])[0]}">${(tags[i] || tags[1])[1]}</span></div>`).join('')
      }</div></section>`;
    }

    const withConv = p.campanhas.filter((c) => c.conversas > 0);
    if (withConv.length) {
      html += '<section class="panel"><span class="eyebrow">Custo por conversa, campanha a campanha</span><div class="chart" id="chart"></div><div class="legend" id="legend"></div></section>';
    }
    html += `<section><span class="eyebrow">Campanhas</span><div class="tablebox"><table><thead><tr><th>Campanha</th><th class="r">Conversas</th><th class="r">Custo/conversa</th><th class="r">Investido</th><th class="r">Pessoas alcançadas</th></tr></thead><tbody>${
      [...p.campanhas].sort((a, b) => (a.custo || 1e9) - (b.custo || 1e9)).map((c) =>
        `<tr class="${hl && c.vendedor === hl ? 'me' : ''}"><td>${esc(c.nome)}</td><td class="r">${int(c.conversas)}</td><td class="r">${c.conversas ? brl(c.custo) : '—'}</td><td class="r">${brl(c.gasto)}</td><td class="r">${int(c.alcance)}</td></tr>`).join('') || '<tr><td colspan="5">Nenhuma campanha com investimento nesse período.</td></tr>'
    }</tbody></table></div></section>`;

    if (Array.isArray(p.anuncios) && p.anuncios.length) {
      html += `<section><span class="eyebrow">Anúncios que mais receberam investimento</span><div class="tablebox"><table><thead><tr><th>Anúncio</th><th>Situação</th><th class="r">Conversas</th><th class="r">Custo/conversa</th><th class="r">Investido</th></tr></thead><tbody>${
        p.anuncios.slice(0, 12).map((x) => `<tr><td>${esc(x.nome)}</td><td>${x.ativo ? '<span class="pill good">Ativo</span>' : '<span class="pill warn">Pausado</span>'}</td><td class="r">${int(x.conversas)}</td><td class="r">${x.conversas ? brl(x.custo) : '—'}</td><td class="r">${brl(x.gasto)}</td></tr>`).join('')
      }</tbody></table></div></section>`;
    }

    if (Array.isArray(A.sugestoes) && A.sugestoes.length) {
      html += `<section><span class="eyebrow">Observações e sugestões</span><div class="sugs">${
        A.sugestoes.map((s) => `<div class="sug"><span class="who">${esc(s.quem)}</span><h3>${esc(s.titulo)}</h3><p>${esc(s.texto)}</p></div>`).join('')
      }</div></section>`;
    }
    html += `<p class="foot">${esc(A.fonte || '')} Atualizado em ${brDate(A.atualizadoEm)}.</p>`;
    el.innerHTML = html;

    if (withConv.length) {
      const max = Math.max(...withConv.map((c) => c.custo)) * 1.4;
      const chart = document.getElementById('chart');
      const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; chart.appendChild(tip);
      [...withConv].sort((a, b) => a.custo - b.custo).forEach((c) => {
        const row = document.createElement('div'); row.className = 'bar-row';
        const w = c.custo / max * 100;
        const mine = hl && c.vendedor === hl;
        row.innerHTML = `<span class="lbl">${esc(c.curto || c.nome)}</span><div class="track"><div class="bar ${mine ? 'me' : ''}" style="width:${w}%"></div><span class="val mono" style="left:calc(${w}% + 6px)">${brl(c.custo)}</span><div class="avgline" style="left:${p.total.custo / max * 100}%"></div></div>`;
        row.addEventListener('mousemove', (e) => { const r = chart.getBoundingClientRect(); tip.hidden = false; tip.textContent = `${c.curto || c.nome}: ${brl(c.custo)} por conversa · ${c.conversas} conversas · ${brl(c.gasto)}`; tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; });
        row.addEventListener('mouseleave', () => { tip.hidden = true; });
        chart.appendChild(row);
      });
      document.getElementById('legend').innerHTML =
        `${hl ? '<span class="key"><span class="sw" style="background:var(--accent)"></span>Suas campanhas</span>' : ''}
         <span class="key"><span style="display:inline-block;width:14px;border-top:2px dashed var(--muted)"></span>Média da conta (${brl(p.total.custo)})</span>
         <span>Barra menor = conversa mais barata</span>`;
    }
  }

  function render() { renderPeriods(); renderOrganico(); renderAnuncios(); }

  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; store.set('mvo_rel_tab', tab); render(); }));
  document.getElementById('conta').addEventListener('change', (e) => { store.set('mvo_rel_conta', e.target.value); load(CREDS.identifier, CREDS.password, e.target.value); });

  async function load(identifier, password, conta) {
    const statusEl = document.getElementById('status');
    statusEl.textContent = 'Carregando…';
    try {
      const r = await fetch('/api/relatorio-completo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifier, password, conta }) });
      const j = await r.json();
      if (!r.ok) { statusEl.textContent = j.error || 'Não consegui carregar o relatório.'; document.getElementById('manual-login').style.display = 'grid'; return; }
      statusEl.textContent = '';
      RES = j; CREDS = { identifier, password }; ME = VENDOR_BY_CLIENT[j.client] || null;
      document.getElementById('title').textContent = j.contas.find((c) => c.id === j.conta).nome;
      const sel = document.getElementById('conta');
      sel.innerHTML = j.contas.map((c) => `<option value="${esc(c.id)}"${c.id === j.conta ? ' selected' : ''}>${esc(c.nome)}</option>`).join('');
      document.getElementById('conta-wrap').hidden = j.contas.length < 2;
      document.getElementById('manual-login').style.display = 'none';
      document.getElementById('report').hidden = false;
      render();
    } catch (e) {
      statusEl.textContent = 'Sem conexão agora. Atualize a página.';
    }
  }

  document.getElementById('load-btn').addEventListener('click', () => {
    const id = document.getElementById('identifier').value.trim();
    const pw = document.getElementById('password').value;
    if (!id || !pw) { document.getElementById('status').textContent = 'Digite e-mail/telefone e senha.'; return; }
    load(id, pw, store.get('mvo_rel_conta'));
  });

  try {
    const h = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
    if (h && h.identifier && h.password) { load(h.identifier, h.password, store.get('mvo_rel_conta')); return; }
  } catch (e) {}
  document.getElementById('manual-login').style.display = 'grid';
})();
</script>
</body>
</html>
