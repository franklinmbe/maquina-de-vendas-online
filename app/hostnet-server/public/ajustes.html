<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ajustes — Máquina de Vendas Online</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0d12" />
<link rel="icon" href="/img/icons/favicon-32.png" sizes="32x32" />
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --panel-hover: #171c28;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --accent-hover: #ff7554;
    --cyan: #33d6cb;
    --error: #ff6b6b;
    --violet: #8b7cf6;
    --green: #35d07f;
    --blue: #4d9eff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; }

  #manual-login {
    display: none;
    max-width: 360px;
    margin: 60px auto;
    padding: 0 16px;
  }
  #manual-login label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 6px; }
  #manual-login input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1.05rem;
  }
  #manual-login button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
  }

  #status { display: none; margin: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; background: rgba(255,107,107,0.12); border: 1px solid var(--error); color: var(--error); }
  #status.show { display: block; }

  #app { display: none; flex-direction: column; height: 100%; }
  #app.show { display: flex; }

  .screen-header {
    padding: 18px 16px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .back-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    text-decoration: none;
  }
  .screen-title { font-size: 1.15rem; font-weight: 700; margin: 0; flex: 1; }

  .settings-list {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .settings-group-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 14px 0 2px;
  }
  .settings-group-label:first-child { margin-top: 0; }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    text-align: left;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .settings-row:active { background: var(--panel-hover); }
  .settings-row.disabled { opacity: 0.5; cursor: default; }
  .settings-row .row-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(51,214,203,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .settings-row .row-icon svg { width: 19px; height: 19px; stroke: var(--cyan); }
  .settings-row .row-text { flex: 1; }
  .settings-row .row-title { display: block; font-weight: 600; }
  .settings-row .row-sub { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .settings-row .row-soon {
    font-size: 0.68rem;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  .settings-row .row-arrow { color: var(--muted); font-size: 1.1rem; }
  .empty-note { margin: 40px 16px; text-align: center; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }

  .action-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 4px;
    border-radius: 14px;
    background: none;
    border: none;
    position: relative;
    font-family: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .action-item svg { width: 24px; height: 24px; }
  .action-item.disabled { opacity: 0.38; }
  .action-item .icon-circle, .action-item .icon-plain {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .action-item.item-calendario .icon-plain { background: rgba(51, 214, 203, 0.16); color: var(--cyan); }
  .action-item.item-redes .icon-plain { background: rgba(139, 124, 246, 0.18); color: var(--violet); }
  .action-item.item-postar .icon-circle { background: rgba(255, 90, 54, 0.16); color: var(--accent); }
  .action-item.item-relatorio .icon-plain { background: rgba(53, 208, 127, 0.16); color: var(--green); }
  .action-item.item-ajustes .icon-plain { background: rgba(77, 158, 255, 0.16); color: var(--blue); }
  .action-item.active.item-calendario { color: var(--cyan); }
  .action-item.active.item-calendario .icon-plain { background: var(--cyan); color: #06231f; }
  .action-item.active.item-redes { color: var(--violet); }
  .action-item.active.item-redes .icon-plain { background: var(--violet); color: #fff; }
  .action-item.active.item-postar { color: var(--accent); }
  .action-item.active.item-postar .icon-circle { background: var(--accent); color: #fff; }
  .action-item.active.item-relatorio { color: var(--green); }
  .action-item.active.item-relatorio .icon-plain { background: var(--green); color: #06231f; }
  .action-item.active.item-ajustes { color: var(--blue); }
  .action-item.active.item-ajustes .icon-plain { background: var(--blue); color: #fff; }
  .soon-dot { position: absolute; top: 0; right: 2px; font-size: 0.52rem; color: var(--muted); }

  /* ---- botão flutuante de Suporte ---- */
  .support-fab {
    position: fixed;
    z-index: 300;
    width: 66px;
    height: 66px;
    border: none;
    border-radius: 18px;
    background: none;
    padding: 0;
    display: none;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }
  .support-fab:focus, .support-fab:active { outline: none; }
  .support-fab img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .support-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 310;
    flex-direction: column;
  }
  .support-modal.show { display: flex; }
  .support-modal-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .support-modal-header .back-btn {
    width: 32px;
    height: 32px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    cursor: pointer;
  }
  .support-modal-title { font-weight: 700; font-size: 1rem; flex: 1; text-align: center; margin-right: 32px; }
  .support-chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .support-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .support-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .support-msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  .support-msg.bot.loading { color: var(--muted); font-style: italic; }
  .support-empty-hint { color: var(--muted); font-size: 0.9rem; text-align: center; margin-top: 24px; }
  .support-modal-bottom {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .support-question-input {
    flex: 1;
    resize: none;
    max-height: 100px;
    padding: 10px 14px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
  }
  .support-mic-btn, .support-send-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
  }
  .support-mic-btn.recording { background: var(--green); color: #06231f; border-color: var(--green); }
  .support-send-btn { background: var(--accent); color: #fff; border: none; }
  .support-send-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
</style>
</head>
<body>

  <div id="manual-login">
    <label for="identifier">E-mail ou telefone</label>
    <input type="text" id="identifier" autocomplete="username" />
    <label for="password">Senha</label>
    <input type="password" id="password" autocomplete="current-password" />
    <button type="button" id="load-btn">Ver ajustes</button>
  </div>

  <div id="status"></div>

  <div id="app">
    <div class="screen-header">
      <a href="/" class="back-btn" id="back-btn">‹</a>
      <h1 class="screen-title">Ajustes</h1>
    </div>

    <div class="settings-list" id="settings-list"></div>

    <div class="action-bar">
      <a class="action-item item-calendario" href="/calendario.html">
        <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
        Calendário
      </a>
      <button class="action-item item-redes" id="redes-btn">
        <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h11"/></svg></div>
        Redes
      </button>
      <a class="action-item item-postar" href="/#postar">
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div>
        Postar
      </a>
      <button class="action-item item-relatorio" id="relatorio-btn">
        <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div>
        Relatório
      </button>
      <button class="action-item item-ajustes active" id="ajustes-btn">
        <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
        Ajustes
      </button>
    </div>
  </div>

  <button type="button" id="support-fab" class="support-fab" aria-label="Suporte">
    <img src="/img/support-robot-cutout.png" alt="" />
  </button>

  <div id="support-modal" class="support-modal">
    <div class="support-modal-header">
      <button type="button" id="support-close-btn" class="back-btn">‹</button>
      <div class="support-modal-title">Suporte</div>
    </div>
    <div class="support-chat" id="support-chat">
      <p class="support-empty-hint">Pergunte qualquer coisa sobre como usar o app — como postar, agendar, ver relatórios, conectar redes, ou tirar dúvida sobre os planos.</p>
    </div>
    <div class="support-modal-bottom">
      <textarea id="support-question-input" class="support-question-input" rows="1" placeholder="Digite sua dúvida..."></textarea>
      <button type="button" id="support-mic-btn" class="support-mic-btn" title="Perguntar por voz">🎤</button>
      <button type="button" id="support-send-btn" class="support-send-btn">➤</button>
    </div>
  </div>

  <script>
    const HANDOFF_KEY = 'mvo_report_handoff';

    document.getElementById('back-btn').addEventListener('click', (e) => {
      if (window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });
    const statusEl = document.getElementById('status');
    const manualLoginEl = document.getElementById('manual-login');
    const appEl = document.getElementById('app');
    const listEl = document.getElementById('settings-list');

    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = 'show';
    }

    function iconSvg(path) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="${path}"/></svg>`;
    }

    function renderSettings(isAdmin) {
      const planosRow = `
        <p class="settings-group-label">Conta</p>
        <a class="settings-row" href="/#planos">
          <div class="row-icon">${iconSvg('M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2')}</div>
          <div class="row-text">
            <span class="row-title">Planos</span>
            <span class="row-sub">Ver ou trocar de plano</span>
          </div>
          <span class="row-arrow">›</span>
        </a>
      `;

      if (!isAdmin) {
        listEl.innerHTML = planosRow;
        return;
      }

      listEl.innerHTML = `
        ${planosRow}
        <p class="settings-group-label">Administração</p>
        <a class="settings-row" href="/relatorio.html" target="_blank" rel="noopener">
          <div class="row-icon">${iconSvg('M4 19V9M10 19V5M16 19v-7M22 19H2')}</div>
          <div class="row-text">
            <span class="row-title">Relatório administrativo</span>
            <span class="row-sub">Contas, planos e uso de cada cliente</span>
          </div>
          <span class="row-arrow">›</span>
        </a>
        <button type="button" class="settings-row disabled" data-soon="1">
          <div class="row-icon">${iconSvg('M4 6h16M4 12h16M4 18h11')}</div>
          <div class="row-text">
            <span class="row-title">Configurações globais</span>
            <span class="row-sub">Retenção de métricas, notificações por e-mail</span>
          </div>
          <span class="row-soon">em breve</span>
        </button>
        <button type="button" class="settings-row disabled" data-soon="1">
          <div class="row-icon">${iconSvg('M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0 1 12 2.944a11.955 11.955 0 0 1-8.618 3.04A12.02 12.02 0 0 0 3 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z')}</div>
          <div class="row-text">
            <span class="row-title">Redes cadastradas</span>
            <span class="row-sub">Apps de desenvolvedor registrados em cada rede social</span>
          </div>
          <span class="row-soon">em breve</span>
        </button>
      `;
      listEl.querySelectorAll('.settings-row[data-soon]').forEach((row) => {
        row.addEventListener('click', () => {
          statusEl.textContent = 'Ainda sem função definida por aqui.';
          statusEl.classList.add('show');
        });
      });
    }

    async function loadAjustes(identifier, password) {
      statusEl.className = '';
      try {
        const response = await fetch('/api/social-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
        });
        const result = await response.json();
        if (!response.ok) {
          showError(`Erro: ${result.error || 'falha desconhecida'}`);
          manualLoginEl.style.display = 'block';
          return;
        }
        renderSettings(result.client === 'frank');
        appEl.classList.add('show');
      } catch (error) {
        showError(`Erro: ${error.message || error}`);
        manualLoginEl.style.display = 'block';
      }
    }

    document.getElementById('load-btn').addEventListener('click', () => {
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      if (!identifier || !password) {
        showError('Digite e-mail/telefone e senha.');
        return;
      }
      loadAjustes(identifier, password);
    });

    document.getElementById('redes-btn').addEventListener('click', () => {
      window.location.href = '/contas-conectadas.html';
    });
    document.getElementById('relatorio-btn').addEventListener('click', () => {
      window.open('/relatorio-redes.html', '_blank');
    });

    (function autoLoad() {
      try {
        const handoff = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        if (handoff && handoff.identifier && handoff.password) {
          loadAjustes(handoff.identifier, handoff.password);
          return;
        }
      } catch (e) {}
      manualLoginEl.style.display = 'block';
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // ---- Botão flutuante de Suporte (arrastável) ----
    (function setupSupportWidget() {
      const supportFab = document.getElementById('support-fab');
      const supportModal = document.getElementById('support-modal');
      const closeBtn = document.getElementById('support-close-btn');
      const chatEl = document.getElementById('support-chat');
      const inputEl = document.getElementById('support-question-input');
      const micBtn = document.getElementById('support-mic-btn');
      const sendBtn = document.getElementById('support-send-btn');

      function getCreds() {
        try {
          return JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        } catch (e) {
          return null;
        }
      }
      function showFabIfLoggedIn() {
        const creds = getCreds();
        if (creds && creds.identifier && creds.password) supportFab.style.display = 'block';
      }
      showFabIfLoggedIn();

      const POS_KEY = 'mvo_support_fab_pos';
      function applyPos(pos) {
        supportFab.style.left = `${pos.x}px`;
        supportFab.style.top = `${pos.y}px`;
        supportFab.style.right = 'auto';
        supportFab.style.bottom = 'auto';
      }
      function defaultPos() {
        return { x: window.innerWidth - 70, y: Math.round(window.innerHeight * 0.58) };
      }
      (function initPos() {
        try {
          const saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
          applyPos(saved && typeof saved.x === 'number' ? saved : defaultPos());
        } catch (e) {
          applyPos(defaultPos());
        }
      })();

      let dragging = false;
      let moved = false;
      let startX, startY, origX, origY;
      supportFab.addEventListener('pointerdown', (e) => {
        dragging = true;
        moved = false;
        supportFab.setPointerCapture(e.pointerId);
        const rect = supportFab.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origX = rect.left;
        origY = rect.top;
      });
      supportFab.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        const x = Math.max(4, Math.min(window.innerWidth - supportFab.offsetWidth - 4, origX + dx));
        const y = Math.max(4, Math.min(window.innerHeight - supportFab.offsetHeight - 4, origY + dy));
        applyPos({ x, y });
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        const rect = supportFab.getBoundingClientRect();
        try {
          localStorage.setItem(POS_KEY, JSON.stringify({ x: rect.left, y: rect.top }));
        } catch (e) {}
      }
      supportFab.addEventListener('pointerup', endDrag);
      supportFab.addEventListener('pointercancel', endDrag);
      supportFab.addEventListener('click', () => {
        if (moved) return;
        supportModal.classList.add('show');
      });
      closeBtn.addEventListener('click', () => supportModal.classList.remove('show'));

      function addMsg(text, who) {
        const el = document.createElement('div');
        el.className = `support-msg ${who}`;
        el.textContent = text;
        chatEl.appendChild(el);
        chatEl.scrollTop = chatEl.scrollHeight;
        return el;
      }

      async function sendQuestion() {
        const question = inputEl.value.trim();
        if (!question) return;
        const creds = getCreds();
        if (!creds || !creds.identifier || !creds.password) {
          addMsg('Sessão não encontrada — entre no app de novo.', 'bot');
          return;
        }
        inputEl.value = '';
        sendBtn.disabled = true;
        addMsg(question, 'user');
        const loadingEl = addMsg('Pensando...', 'bot');
        loadingEl.classList.add('loading');
        try {
          const response = await fetch('/api/support-ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: creds.identifier, password: creds.password, question }),
          });
          const result = await response.json();
          loadingEl.remove();
          addMsg(response.ok ? result.answer : result.error || 'Não consegui responder agora.', 'bot');
        } catch (error) {
          loadingEl.remove();
          addMsg('Falha de conexão — tenta de novo.', 'bot');
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', sendQuestion);
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendQuestion();
        }
      });

      // Microfone — mesmo padrão de ditado já usado no composer.
      const SupportSpeechCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SupportSpeechCtor) {
        micBtn.disabled = true;
        micBtn.title = 'Ditado por voz indisponível neste navegador.';
      } else {
        const recognition = new SupportSpeechCtor();
        recognition.lang = 'pt-BR';
        recognition.interimResults = true;
        recognition.continuous = true;
        let listening = false;
        let baseText = '';
        let finalText = '';

        function stopListeningUi() {
          listening = false;
          micBtn.classList.remove('recording');
        }
        recognition.addEventListener('result', (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (result.isFinal) finalText = `${finalText} ${result[0].transcript}`.trim();
            else interim += result[0].transcript;
          }
          const transcript = `${finalText} ${interim}`.trim();
          if (!transcript) return;
          const sep = baseText.trim() ? ' ' : '';
          inputEl.value = `${baseText.trim()}${sep}${transcript}`.trim();
        });
        recognition.addEventListener('end', () => {
          if (listening) {
            try {
              recognition.start();
            } catch (e) {
              stopListeningUi();
            }
            return;
          }
          stopListeningUi();
        });
        recognition.addEventListener('error', (event) => {
          if (event.error === 'no-speech' || event.error === 'aborted') return;
          listening = false;
          stopListeningUi();
        });
        micBtn.addEventListener('click', () => {
          if (listening) {
            listening = false;
            recognition.stop();
            return;
          }
          listening = true;
          baseText = inputEl.value;
          finalText = '';
          micBtn.classList.add('recording');
          try {
            recognition.start();
          } catch (e) {
            listening = false;
            stopListeningUi();
          }
        });
      }
    })();
  </script>
</body>
</html>
