<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contas Conectadas — Máquina de Vendas Online</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0d12" />
<link rel="icon" href="/img/icons/favicon-32.png" sizes="32x32" />
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --panel-hover: #171c28;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --accent-hover: #ff7554;
    --cyan: #33d6cb;
    --error: #ff6b6b;
    --violet: #8b7cf6;
    --green: #35d07f;
    --blue: #4d9eff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; }

  #manual-login {
    display: none;
    max-width: 360px;
    margin: 60px auto;
    padding: 0 16px;
  }
  #manual-login label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 6px; }
  #manual-login input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1.05rem;
  }
  #manual-login button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
  }

  #status { display: none; margin: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; background: rgba(255,107,107,0.12); border: 1px solid var(--error); color: var(--error); }
  #status.show { display: block; }

  #app { display: none; flex-direction: column; height: 100%; }
  #app.show { display: flex; }

  .screen-header {
    padding: 18px 16px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .back-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    text-decoration: none;
  }
  .screen-title { font-size: 1.15rem; font-weight: 700; margin: 0; flex: 1; }
  .select-all-btn {
    font-size: 0.74rem;
    color: var(--cyan);
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    white-space: nowrap;
  }

  .account-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }
  .empty-note {
    margin: 40px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .account-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 8px;
    border-radius: 12px;
  }
  .account-row:active { background: var(--panel-hover); }

  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
    background: var(--seed, #555);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .badge {
    position: absolute;
    right: -6px;
    bottom: -6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
  }
  .badge svg { width: 15px; height: 15px; }

  .account-name {
    display: block;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .account-platform { display: block; font-size: 0.7rem; color: var(--muted); margin-top: 1px; }

  .pending-heading {
    margin: 14px 8px 4px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .client-section { margin-bottom: 6px; }
  .client-section-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 8px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 1.15rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }
  .client-section-header .count { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
  .client-section-header .chevron { transition: transform 0.15s ease; color: var(--muted); }
  .client-section.collapsed .client-section-header .chevron { transform: rotate(-90deg); }
  .client-section-body { display: flex; flex-direction: column; gap: 2px; }
  .client-section.collapsed .client-section-body { display: none; }
  .account-row.pending { opacity: 0.7; }
  .account-row.pending .avatar { background: #3a3f52; }
  .pending-tag {
    display: inline-block;
    margin-top: 1px;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--muted);
    background: var(--panel);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .check svg { width: 13px; height: 13px; opacity: 0; }
  .check.checked { background: var(--accent); border-color: var(--accent); }
  .check.checked svg { opacity: 1; }

  .action-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 4px;
    border-radius: 14px;
    background: none;
    border: none;
    position: relative;
    font-family: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .action-item svg { width: 24px; height: 24px; }
  .action-item.disabled { opacity: 0.38; }
  .action-item .icon-circle, .action-item .icon-plain {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .action-item.item-calendario .icon-plain { background: rgba(51, 214, 203, 0.16); color: var(--cyan); }
  .action-item.item-redes .icon-plain { background: rgba(139, 124, 246, 0.18); color: var(--violet); }
  .action-item.item-postar .icon-circle { background: rgba(255, 90, 54, 0.16); color: var(--accent); }
  .action-item.item-relatorio .icon-plain { background: rgba(53, 208, 127, 0.16); color: var(--green); }
  .action-item.item-ajustes .icon-plain { background: rgba(77, 158, 255, 0.16); color: var(--blue); }
  .action-item.active.item-calendario { color: var(--cyan); }
  .action-item.active.item-calendario .icon-plain { background: var(--cyan); color: #06231f; }
  .action-item.active.item-redes { color: var(--violet); }
  .action-item.active.item-redes .icon-plain { background: var(--violet); color: #fff; }
  .action-item.active.item-postar { color: var(--accent); }
  .action-item.active.item-postar .icon-circle { background: var(--accent); color: #fff; }
  .action-item.active.item-relatorio { color: var(--green); }
  .action-item.active.item-relatorio .icon-plain { background: var(--green); color: #06231f; }
  .action-item.active.item-ajustes { color: var(--blue); }
  .action-item.active.item-ajustes .icon-plain { background: var(--blue); color: #fff; }
  .soon-dot { position: absolute; top: 0; right: 2px; font-size: 0.52rem; color: var(--muted); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel);
    border: 1px solid var(--cyan);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 320px;
    text-align: center;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- botão flutuante de Suporte ---- */
  .support-fab {
    position: fixed;
    z-index: 300;
    width: 66px;
    height: 66px;
    border: none;
    border-radius: 18px;
    background: none;
    padding: 0;
    display: none;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }
  .support-fab:focus, .support-fab:active { outline: none; }
  .support-fab img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .support-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 310;
    flex-direction: column;
  }
  .support-modal.show { display: flex; }
  .support-modal-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .support-modal-header .back-btn {
    width: 32px;
    height: 32px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    cursor: pointer;
  }
  .support-modal-title { font-weight: 700; font-size: 1rem; flex: 1; text-align: center; margin-right: 32px; }
  .support-chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .support-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .support-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .support-msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  .support-msg.bot.loading { color: var(--muted); font-style: italic; }
  .support-empty-hint { color: var(--muted); font-size: 0.9rem; text-align: center; margin-top: 24px; }
  .support-modal-bottom {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .support-question-input {
    flex: 1;
    resize: none;
    max-height: 100px;
    padding: 10px 14px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
  }
  .support-mic-btn, .support-send-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
  }
  .support-mic-btn.recording { background: var(--green); color: #06231f; border-color: var(--green); }
  .support-send-btn { background: var(--accent); color: #fff; border: none; }
  .support-send-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
</style>
</head>
<body>

  <div id="manual-login">
    <label for="identifier">E-mail ou telefone</label>
    <input type="text" id="identifier" autocomplete="username" />
    <label for="password">Senha</label>
    <input type="password" id="password" autocomplete="current-password" />
    <button type="button" id="load-btn">Ver contas conectadas</button>
  </div>

  <div id="status"></div>

  <div id="app">
    <div class="screen-header">
      <a href="/" class="back-btn" id="back-btn">‹</a>
      <h1 class="screen-title">Contas Conectadas</h1>
      <button class="select-all-btn" id="select-all">Marcar todas</button>
    </div>

    <div class="account-list" id="account-list"></div>

    <div class="action-bar">
      <a class="action-item item-calendario" href="/calendario.html">
        <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
        Calendário
      </a>
      <button class="action-item item-redes active" id="canais-btn">
        <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h11"/></svg></div>
        Redes
      </button>
      <button class="action-item item-postar" id="new-request-btn">
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div>
        Postar
      </button>
      <button class="action-item item-relatorio" id="report-btn">
        <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div>
        Relatório
      </button>
      <button class="action-item item-ajustes" id="ajustes-btn">
        <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
        Ajustes
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <button type="button" id="support-fab" class="support-fab" aria-label="Suporte">
    <img src="/img/support-robot-cutout.png" alt="" />
  </button>

  <div id="support-modal" class="support-modal">
    <div class="support-modal-header">
      <button type="button" id="support-close-btn" class="back-btn">‹</button>
      <div class="support-modal-title">Suporte</div>
    </div>
    <div class="support-chat" id="support-chat">
      <p class="support-empty-hint">Pergunte qualquer coisa sobre como usar o app — como postar, agendar, ver relatórios, conectar redes, ou tirar dúvida sobre os planos.</p>
    </div>
    <div class="support-modal-bottom">
      <textarea id="support-question-input" class="support-question-input" rows="1" placeholder="Digite sua dúvida..."></textarea>
      <button type="button" id="support-mic-btn" class="support-mic-btn" title="Perguntar por voz">🎤</button>
      <button type="button" id="support-send-btn" class="support-send-btn">➤</button>
    </div>
  </div>

  <script>
    const HANDOFF_KEY = 'mvo_report_handoff';

    // Seta "‹" volta pra página anterior de verdade (aba aberta com
    // navegação própria); só cai pro link fixo "/" se não tiver histórico
    // (ex: aba nova sem nada antes).
    document.getElementById('back-btn').addEventListener('click', (e) => {
      if (window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });
    const statusEl = document.getElementById('status');
    const manualLoginEl = document.getElementById('manual-login');
    const appEl = document.getElementById('app');
    const listEl = document.getElementById('account-list');

    const PLATFORM_LABELS = {
      facebook: 'Facebook',
      instagram: 'Instagram',
      tiktok: 'TikTok',
      youtube: 'YouTube',
      telegram: 'Telegram',
      wordpress: 'WordPress',
    };

      tiktok: { color: '#000', svg: '<svg viewBox="0 0 256 290" xmlns="http://www.w3.org/2000/svg"><path fill="#ff004f" d="M189.72 104.421c18.678 13.345 41.56 21.197 66.273 21.197v-47.53a67 67 0 0 1-13.918-1.456v37.413c-24.711 0-47.59-7.851-66.272-21.195v96.996c0 48.523-39.356 87.855-87.9 87.855c-18.113 0-34.949-5.473-48.934-14.86c15.962 16.313 38.222 26.432 62.848 26.432c48.548 0 87.905-39.332 87.905-87.857v-96.995z"/><path fill="#fff" d="M175.803 92.849c18.683 13.344 41.56 21.195 66.272 21.195V76.631c-13.794-2.937-26.005-10.141-35.186-20.162c-15.715-9.802-27.038-25.972-30.358-44.898h-34.643v189.843c-.079 22.132-18.049 40.052-40.21 40.052c-13.058 0-24.66-6.221-32.007-15.86c-13.12-6.618-22.118-20.206-22.118-35.898c0-22.193 18-40.187 40.208-40.187c4.255 0 8.356.662 12.203 1.882v-37.822c-47.692.985-86.047 39.933-86.047 87.834c0 23.912 9.551 45.589 25.053 61.428c13.985 9.385 30.82 14.86 48.934 14.86c48.545 0 87.9-39.335 87.9-87.857z"/><path fill="#00f2ea" d="M242.075 76.63V66.516a66.3 66.3 0 0 1-35.186-10.047a66.47 66.47 0 0 0 35.186 20.163"/></svg>' },
      youtube: { color: '#FF0000', svg: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#fff"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>' },
      telegram: { color: '#26A5E4', svg: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#fff"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>' },
      wordpress: { color: '#21759B', svg: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#fff"><path d="M21.469 6.825c.84 1.537 1.318 3.3 1.318 5.175 0 3.979-2.156 7.456-5.363 9.325l3.295-9.527c.615-1.54.82-2.771.82-3.864 0-.405-.026-.78-.07-1.11m-7.981.105c.647-.03 1.232-.105 1.232-.105.582-.075.514-.93-.067-.899 0 0-1.755.135-2.88.135-1.064 0-2.85-.15-2.85-.15-.585-.03-.661.855-.075.885 0 0 .54.061 1.125.09l1.68 4.605-2.37 7.08L5.354 6.9c.649-.03 1.234-.1 1.234-.1.585-.075.516-.93-.065-.896 0 0-1.746.138-2.874.138-.2 0-.438-.008-.69-.015C4.911 3.15 8.235 1.215 12 1.215c2.809 0 5.365 1.072 7.286 2.833-.046-.003-.091-.009-.141-.009-1.06 0-1.812.923-1.812 1.914 0 .89.513 1.643 1.06 2.531.411.72.89 1.643.89 2.977 0 .915-.354 1.994-.821 3.479l-1.075 3.585-3.9-11.61.001.014zM12 22.784c-1.059 0-2.081-.153-3.048-.437l3.237-9.406 3.315 9.087c.024.053.05.101.078.149-1.12.393-2.325.609-3.582.609M1.211 12c0-1.564.336-3.05.935-4.39L7.29 21.709C3.694 19.96 1.212 16.271 1.211 12M12 0C5.385 0 0 5.385 0 12s5.385 12 12 12 12-5.385 12-12S18.615 0 12 0"/></svg>' },
    };
    const SEED_COLORS = ['#3a3f52', '#7a4a2e', '#4a3a2e', '#2e4a44', '#54402e', '#2e3f54', '#4a2e4e'];

    let accounts = [];
    let postizAccounts = [];
    let pendingClients = [];
    let clients = [];
    const selected = new Set();
    const expandedClients = new Set(['frank']);

    const PLAN_LABELS = {
      teste7dias: 'Teste Grátis 7 Dias',
      iniciante: 'Iniciante em Social Mídia',
      profissional: 'Profissional em Social Mídia',
      especialista: 'Especialista + Gestor de Tráfego',
      personalizado: 'Projeto Personalizado',
    };

    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = 'show';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove('show'), 2400);
    }

    function initials(name) {
      return String(name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    }

    function accountRowHtml(acc, checkKey, extraNote) {
      const icon = PLATFORM_ICONS[acc.platform] || PLATFORM_ICONS.facebook;
      const seed = SEED_COLORS[Math.abs(hashCode(checkKey)) % SEED_COLORS.length];
      const note = extraNote || PLATFORM_LABELS[acc.platform] || acc.platform;
      return `
        <div class="account-row">
          <div class="avatar-wrap">
            <div class="avatar" style="--seed:${seed}">${acc.avatarUrl ? `<img src="${acc.avatarUrl}" alt="" />` : initials(acc.name)}</div>
            <div class="badge" style="background:${icon.color}">${icon.svg}</div>
          </div>
          <div style="flex:1; min-width:0;">
            <span class="account-name">${acc.name}</span>
            <span class="account-platform">${note}</span>
          </div>
          <div class="check" data-i="${checkKey}">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>
          </div>
        </div>
      `;
    }

    function hashCode(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
      return h;
    }

    // Uma seção por cliente (Franklin, Kleber, etc.) só faz sentido quando
    // tem mais de um — pra um cliente comum vendo só a própria conta, a
    // lista continua lisa, sem cabeçalho nenhum.
    function renderAccounts() {
      listEl.innerHTML = '';
      if (accounts.length === 0 && postizAccounts.length === 0 && pendingClients.length === 0) {
        listEl.innerHTML = '<p class="empty-note">Nenhuma rede social conectada ainda. Volta pra tela principal e conecta pelos ícones das redes.</p>';
        return;
      }

      const grouped = clients.length > 1;
      const relevantClients = grouped ? clients : [{ client: clients[0] ? clients[0].client : null, name: null }];

      relevantClients.forEach(({ client, name }) => {
        const clientAccounts = client ? accounts.filter((a) => a.client === client) : accounts;
        const clientPostiz = client ? postizAccounts.filter((a) => a.client === client) : postizAccounts;
        const pendingInfo = client ? pendingClients.find((c) => c.client === client) : null;
        if (clientAccounts.length === 0 && clientPostiz.length === 0 && !pendingInfo) return;

        let bodyHtml = '';
        clientAccounts.forEach((acc) => {
          const i = accounts.indexOf(acc);
          bodyHtml += accountRowHtml(acc, `a${i}`);
        });
        clientPostiz.forEach((acc) => {
          const i = postizAccounts.indexOf(acc);
          bodyHtml += accountRowHtml(acc, `p${i}`, `${PLATFORM_LABELS[acc.platform] || acc.platform} — via Postiz, não pelo app`);
        });
        if (pendingInfo) {
          const planLabel = PLAN_LABELS[pendingInfo.plan] || pendingInfo.plan || 'sem plano definido';
          bodyHtml += `
            <div class="account-row pending">
              <div class="avatar-wrap"><div class="avatar">${initials(pendingInfo.name)}</div></div>
              <div style="flex:1; min-width:0;">
                <span class="account-name">${pendingInfo.name}</span>
                <span class="pending-tag">${planLabel} — nenhuma rede conectada ainda</span>
              </div>
            </div>
          `;
        }

        if (!grouped) {
          listEl.innerHTML += bodyHtml;
          return;
        }

        const collapsed = !expandedClients.has(client);
        const count = clientAccounts.length + clientPostiz.length;
        const section = document.createElement('div');
        section.className = 'client-section' + (collapsed ? ' collapsed' : '');
        section.dataset.client = client;
        section.innerHTML = `
          <button type="button" class="client-section-header" data-client="${client}">
            <span>Contas conectadas ${name || client}${count > 0 ? ` <span class="count">(${count})</span>` : ''}</span>
            <span class="chevron">⌄</span>
          </button>
          <div class="client-section-body">${bodyHtml}</div>
        `;
        listEl.appendChild(section);
      });
    }

    listEl.addEventListener('click', (e) => {
      const header = e.target.closest('.client-section-header');
      if (header) {
        const client = header.dataset.client;
        if (expandedClients.has(client)) expandedClients.delete(client);
        else expandedClients.add(client);
        header.closest('.client-section').classList.toggle('collapsed');
        return;
      }
      const check = e.target.closest('.check');
      if (!check) return;
      const i = check.dataset.i;
      if (selected.has(i)) { selected.delete(i); check.classList.remove('checked'); }
      else { selected.add(i); check.classList.add('checked'); }
    });

    // Chave com prefixo ("a0" = accounts[0], "p0" = postizAccounts[0]) pra
    // diferenciar as duas listas dentro do mesmo Set de seleção.
    function resolveSelectedKey(key) {
      if (key.startsWith('a')) return accounts[Number(key.slice(1))];
      if (key.startsWith('p')) {
        const acc = postizAccounts[Number(key.slice(1))];
        return acc ? { ...acc, viaPostiz: true } : null;
      }
      return null;
    }

    document.getElementById('select-all').addEventListener('click', () => {
      const total = accounts.length + postizAccounts.length;
      const allChecked = selected.size === total && total > 0;
      document.querySelectorAll('.check').forEach((c) => {
        if (allChecked) { c.classList.remove('checked'); selected.delete(c.dataset.i); }
        else { c.classList.add('checked'); selected.add(c.dataset.i); }
      });
    });

    document.getElementById('report-btn').addEventListener('click', () => {
      if (selected.size === 0) { showToast('Marca pelo menos uma conta pra ver o relatório'); return; }
      const filter = [...selected].map(resolveSelectedKey).filter(Boolean).map((acc) => ({ platform: acc.platform, name: acc.name }));
      try {
        const handoff = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null') || {};
        localStorage.setItem(HANDOFF_KEY, JSON.stringify({ ...handoff, filter }));
      } catch (e) {}
      window.open('/relatorio-redes.html', '_blank');
    });

    document.getElementById('new-request-btn').addEventListener('click', () => {
      try {
        const handoff = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null') || {};
        if (selected.size > 0) {
          // Leva pro compositor TODAS as contas dos clientes tocados (marcou
          // pelo menos uma conta dele) — as marcadas vêm "checked" (coloridas
          // lá), as outras do mesmo cliente vêm junto só pra aparecer em
          // cinza (dá pra incluir na hora, sem voltar aqui). Clientes que o
          // Franklin nem abriu/marcou não aparecem no compositor.
          const checkedKeys = new Set(selected);
          const touchedClients = new Set(
            [...selected].map(resolveSelectedKey).filter(Boolean).map((acc) => acc.client)
          );
          const postFilter = [];
          accounts.forEach((acc, i) => {
            if (!touchedClients.has(acc.client)) return;
            postFilter.push({ platform: acc.platform, name: acc.name, viaPostiz: false, client: acc.client, checked: checkedKeys.has(`a${i}`) });
          });
          postizAccounts.forEach((acc, i) => {
            if (!touchedClients.has(acc.client)) return;
            postFilter.push({ platform: acc.platform, name: acc.name, viaPostiz: true, client: acc.client, checked: checkedKeys.has(`p${i}`) });
          });
          localStorage.setItem(HANDOFF_KEY, JSON.stringify({ ...handoff, postFilter }));
        } else {
          const { postFilter, ...rest } = handoff;
          localStorage.setItem(HANDOFF_KEY, JSON.stringify(rest));
        }
      } catch (e) {}
      window.location.href = '/#postar';
    });

    document.getElementById('ajustes-btn').addEventListener('click', () => {
      window.location.href = '/ajustes.html';
    });

    document.querySelectorAll('.action-item[data-soon]').forEach((btn) => {
      btn.addEventListener('click', () => showToast('Ainda sem função definida por aqui'));
    });

    async function loadAccounts(identifier, password) {
      statusEl.className = '';
      try {
        const response = await fetch('/api/connected-accounts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
        });
        const result = await response.json();
        if (!response.ok) {
          showError(`Erro: ${result.error || 'falha desconhecida'}`);
          manualLoginEl.style.display = 'block';
          return;
        }
        accounts = result.accounts || [];
        postizAccounts = result.postizAccounts || [];
        pendingClients = result.pendingClients || [];
        clients = result.clients || [];
        renderAccounts();
        appEl.classList.add('show');
      } catch (error) {
        showError(`Erro: ${error.message || error}`);
        manualLoginEl.style.display = 'block';
      }
    }

    document.getElementById('load-btn').addEventListener('click', () => {
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      if (!identifier || !password) {
        showError('Digite e-mail/telefone e senha.');
        return;
      }
      loadAccounts(identifier, password);
    });

    (function autoLoad() {
      try {
        const handoff = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        if (handoff && handoff.identifier && handoff.password) {
          loadAccounts(handoff.identifier, handoff.password);
          return;
        }
      } catch (e) {}
      manualLoginEl.style.display = 'block';
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // ---- Botão flutuante de Suporte (arrastável) ----
    (function setupSupportWidget() {
      const supportFab = document.getElementById('support-fab');
      const supportModal = document.getElementById('support-modal');
      const closeBtn = document.getElementById('support-close-btn');
      const chatEl = document.getElementById('support-chat');
      const inputEl = document.getElementById('support-question-input');
      const micBtn = document.getElementById('support-mic-btn');
      const sendBtn = document.getElementById('support-send-btn');

      function getCreds() {
        try {
          return JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        } catch (e) {
          return null;
        }
      }
      function showFabIfLoggedIn() {
        const creds = getCreds();
        if (creds && creds.identifier && creds.password) supportFab.style.display = 'block';
      }
      showFabIfLoggedIn();

      const POS_KEY = 'mvo_support_fab_pos';
      function applyPos(pos) {
        supportFab.style.left = `${pos.x}px`;
        supportFab.style.top = `${pos.y}px`;
        supportFab.style.right = 'auto';
        supportFab.style.bottom = 'auto';
      }
      function defaultPos() {
        return { x: window.innerWidth - 70, y: Math.round(window.innerHeight * 0.58) };
      }
      (function initPos() {
        try {
          const saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
          applyPos(saved && typeof saved.x === 'number' ? saved : defaultPos());
        } catch (e) {
          applyPos(defaultPos());
        }
      })();

      let dragging = false;
      let moved = false;
      let startX, startY, origX, origY;
      supportFab.addEventListener('pointerdown', (e) => {
        dragging = true;
        moved = false;
        supportFab.setPointerCapture(e.pointerId);
        const rect = supportFab.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origX = rect.left;
        origY = rect.top;
      });
      supportFab.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        const x = Math.max(4, Math.min(window.innerWidth - supportFab.offsetWidth - 4, origX + dx));
        const y = Math.max(4, Math.min(window.innerHeight - supportFab.offsetHeight - 4, origY + dy));
        applyPos({ x, y });
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        const rect = supportFab.getBoundingClientRect();
        try {
          localStorage.setItem(POS_KEY, JSON.stringify({ x: rect.left, y: rect.top }));
        } catch (e) {}
      }
      supportFab.addEventListener('pointerup', endDrag);
      supportFab.addEventListener('pointercancel', endDrag);
      supportFab.addEventListener('click', () => {
        if (moved) return;
        supportModal.classList.add('show');
      });
      closeBtn.addEventListener('click', () => supportModal.classList.remove('show'));

      function addMsg(text, who) {
        const el = document.createElement('div');
        el.className = `support-msg ${who}`;
        el.textContent = text;
        chatEl.appendChild(el);
        chatEl.scrollTop = chatEl.scrollHeight;
        return el;
      }

      async function sendQuestion() {
        const question = inputEl.value.trim();
        if (!question) return;
        const creds = getCreds();
        if (!creds || !creds.identifier || !creds.password) {
          addMsg('Sessão não encontrada — entre no app de novo.', 'bot');
          return;
        }
        inputEl.value = '';
        sendBtn.disabled = true;
        addMsg(question, 'user');
        const loadingEl = addMsg('Pensando...', 'bot');
        loadingEl.classList.add('loading');
        try {
          const response = await fetch('/api/support-ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: creds.identifier, password: creds.password, question }),
          });
          const result = await response.json();
          loadingEl.remove();
          addMsg(response.ok ? result.answer : result.error || 'Não consegui responder agora.', 'bot');
        } catch (error) {
          loadingEl.remove();
          addMsg('Falha de conexão — tenta de novo.', 'bot');
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', sendQuestion);
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendQuestion();
        }
      });

      // Microfone — mesmo padrão de ditado já usado no composer.
      const SupportSpeechCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SupportSpeechCtor) {
        micBtn.disabled = true;
        micBtn.title = 'Ditado por voz indisponível neste navegador.';
      } else {
        const recognition = new SupportSpeechCtor();
        recognition.lang = 'pt-BR';
        recognition.interimResults = true;
        recognition.continuous = true;
        let listening = false;
        let baseText = '';
        let finalText = '';

        function stopListeningUi() {
          listening = false;
          micBtn.classList.remove('recording');
        }
        recognition.addEventListener('result', (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (result.isFinal) finalText = `${finalText} ${result[0].transcript}`.trim();
            else interim += result[0].transcript;
          }
          const transcript = `${finalText} ${interim}`.trim();
          if (!transcript) return;
          const sep = baseText.trim() ? ' ' : '';
          inputEl.value = `${baseText.trim()}${sep}${transcript}`.trim();
        });
        recognition.addEventListener('end', () => {
          if (listening) {
            try {
              recognition.start();
            } catch (e) {
              stopListeningUi();
            }
            return;
          }
          stopListeningUi();
        });
        recognition.addEventListener('error', (event) => {
          if (event.error === 'no-speech' || event.error === 'aborted') return;
          listening = false;
          stopListeningUi();
        });
        micBtn.addEventListener('click', () => {
          if (listening) {
            listening = false;
            recognition.stop();
            return;
          }
          listening = true;
          baseText = inputEl.value;
          finalText = '';
          micBtn.classList.add('recording');
          try {
            recognition.start();
          } catch (e) {
            listening = false;
            stopListeningUi();
          }
        });
      }
    })();
  </script>
