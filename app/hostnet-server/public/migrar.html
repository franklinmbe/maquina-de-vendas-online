<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Máquina de Vendas Online</title>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0d12;color:#f2f2f0;font-family:system-ui,sans-serif;text-align:center;padding:16px">
<p>Abrindo o aplicativo…</p>
<script>
  // Chegada da mudança de endereço (server.js, OLD_APP_HOSTS): guarda o login
  // que veio do endereço antigo, só se este aparelho ainda não tiver um, e
  // abre a página que a pessoa tinha pedido.
  (function () {
    var p = new URLSearchParams(location.hash.slice(1));
    var next = p.get('next') || '/';
    if (!/^\/(?![\/\\])/.test(next)) next = '/';
    var raw = p.get('d');
    if (raw) {
      try {
        var d = JSON.parse(decodeURIComponent(escape(atob(raw))));
        ['mvo_session', 'mvo_admin_session'].forEach(function (k) {
          if (typeof d[k] !== 'string' || localStorage.getItem(k)) return;
          var s = JSON.parse(d[k]);
          if (s && typeof s.identifier === 'string' && typeof s.password === 'string') localStorage.setItem(k, d[k]);
        });
      } catch (e) { /* sem login, a pessoa só entra de novo */ }
    }
    location.replace(next);
  })();
</script>
</body>
</html>
