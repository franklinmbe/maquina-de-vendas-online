<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relatório das redes sociais — Máquina de Vendas Online</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --panel-hover: #171c28;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --accent-hover: #ff7554;
    --cyan: #33d6cb;
    --error: #ff6b6b;
    --violet: #8b7cf6;
    --green: #35d07f;
    --blue: #4d9eff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 100px;
    background: var(--bg);
    color: var(--text);
  }
  .action-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--panel);
    z-index: 50;
  }
  .action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 4px;
    border-radius: 14px;
    background: none;
    border: none;
    width: auto;
    margin-top: 0;
    position: relative;
    font-family: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .action-item svg { width: 24px; height: 24px; }
  .action-item.disabled { opacity: 0.38; }
  .action-item .icon-circle, .action-item .icon-plain {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .action-item.item-calendario .icon-plain { background: rgba(51, 214, 203, 0.16); color: var(--cyan); }
  .action-item.item-redes .icon-plain { background: rgba(139, 124, 246, 0.18); color: var(--violet); }
  .action-item.item-postar .icon-circle { background: rgba(255, 90, 54, 0.16); color: var(--accent); }
  .action-item.item-relatorio .icon-plain { background: rgba(53, 208, 127, 0.16); color: var(--green); }
  .action-item.item-ajustes .icon-plain { background: rgba(77, 158, 255, 0.16); color: var(--blue); }
  .action-item.active.item-calendario { color: var(--cyan); }
  .action-item.active.item-calendario .icon-plain { background: var(--cyan); color: #06231f; }
  .action-item.active.item-redes { color: var(--violet); }
  .action-item.active.item-redes .icon-plain { background: var(--violet); color: #fff; }
  .action-item.active.item-postar { color: var(--accent); }
  .action-item.active.item-postar .icon-circle { background: var(--accent); color: #fff; }
  .action-item.active.item-relatorio { color: var(--green); }
  .action-item.active.item-relatorio .icon-plain { background: var(--green); color: #06231f; }
  .action-item.active.item-ajustes { color: var(--blue); }
  .action-item.active.item-ajustes .icon-plain { background: var(--blue); color: #fff; }
  .soon-dot { position: absolute; top: 0; right: 2px; font-size: 0.52rem; color: var(--muted); }
  h1 { font-size: 1.3rem; margin: 0; }
  .screen-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .back-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    text-decoration: none;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0 0 6px; }
  input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1.05rem;
  }
  input:focus { outline: none; border-color: var(--cyan); }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  #status { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; }
  #status.show { display: block; background: rgba(255, 107, 107, 0.12); border: 1px solid var(--error); color: var(--error); }
  #manual-login { display: none; }
  #report { display: none; margin-top: 20px; }
  #report p {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    margin: 0 0 10px;
  }
  .insights-block { margin-top: 24px; }
  .insights-block h2 {
    font-size: 1rem;
    color: var(--cyan);
    margin: 0 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .insights-block .sub-label { color: var(--muted); font-size: 0.82rem; margin: 0 0 14px; }
  .insights-note {
    padding: 12px 14px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .stat-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .stat-card { flex: 1 1 100px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-card .num { font-size: 1.3rem; font-weight: 700; color: var(--cyan); }
  .stat-card .label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .chart-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .chart-title { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
  .top-posts { display: flex; flex-direction: column; gap: 8px; }
  .top-post { display: flex; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 0.82rem; }
  .top-post a { color: var(--cyan); text-decoration: none; }
  .top-post .caption { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .top-post .metric { color: var(--muted); white-space: nowrap; }
  .plan-breakdown { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .plan-chip { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 0.8rem; }
  .summary-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .summary-chip {
    display: flex;
    align-items: baseline;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .summary-chip strong { font-size: 0.98rem; color: var(--text); }
  .channel-select { position: relative; margin-bottom: 18px; }
  .channel-select-label-top { font-size: 0.78rem; color: var(--muted); margin: 0 0 6px; }
  .channel-select-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .channel-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text);
    flex-shrink: 0;
    overflow: hidden;
  }
  .channel-select-value { flex: 1; text-align: left; }
  .channel-select-chevron { color: var(--muted); transition: transform 0.15s ease; flex-shrink: 0; }
  .channel-select.open .channel-select-chevron { transform: rotate(180deg); }
  .channel-select-menu {
    display: none;
    margin-top: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .channel-select.open .channel-select-menu { display: block; }
  .channel-select-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .channel-select-item:hover { background: var(--panel-hover); }
  .channel-select-item + .channel-select-item { border-top: 1px solid var(--border); }
  .channel-select-item .check-mark { margin-left: auto; color: var(--cyan); opacity: 0; }
  .channel-select-item.selected .check-mark { opacity: 1; }
  .headline-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .spark-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    min-height: 118px;
    overflow: hidden;
  }
  .spark-chart { position: absolute; inset: 0; }
  .spark-chart svg { width: 100%; height: 100%; display: block; }
  .spark-content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
  .spark-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .spark-label { font-size: 0.72rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .spark-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .spark-badge { font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .spark-badge.up { color: #38d977; background: rgba(56, 217, 119, 0.16); }
  .spark-badge.down { color: #ff6b6b; background: rgba(255, 107, 107, 0.16); }
  .spark-num { font-size: 1.55rem; font-weight: 800; margin-top: auto; }

  /* ---- botão flutuante de Suporte ---- */
  .support-fab {
    position: fixed;
    z-index: 300;
    width: 66px;
    height: 66px;
    border: none;
    border-radius: 18px;
    background: none;
    padding: 0;
    display: none;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }
  .support-fab:focus, .support-fab:active { outline: none; }
  .support-fab img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .support-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 310;
    flex-direction: column;
  }
  .support-modal.show { display: flex; }
  .support-modal-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .support-modal-header .back-btn {
    width: 32px;
    height: 32px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    cursor: pointer;
  }
  .support-modal-title { font-weight: 700; font-size: 1rem; flex: 1; text-align: center; margin-right: 32px; }
  .support-chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .support-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .support-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .support-msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  .support-msg.bot.loading { color: var(--muted); font-style: italic; }
  .support-empty-hint { color: var(--muted); font-size: 0.9rem; text-align: center; margin-top: 24px; }
  .support-modal-bottom {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .support-question-input {
    flex: 1;
    resize: none;
    max-height: 100px;
    padding: 10px 14px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
  }
  .support-mic-btn, .support-send-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
  }
  .support-mic-btn.recording { background: var(--green); color: #06231f; border-color: var(--green); }
  .support-send-btn { background: var(--accent); color: #fff; border: none; }
  .support-send-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
</style>
</head>
<body>
  <div class="screen-header">
    <a href="/" class="back-btn" id="back-btn">‹</a>
    <h1>Relatório das redes sociais</h1>
  </div>

  <div id="manual-login">
    <label for="identifier">E-mail ou telefone</label>
    <input type="text" id="identifier" autocomplete="username" />
    <label for="password">Senha</label>
    <input type="password" id="password" autocomplete="current-password" />
    <button type="button" id="load-btn">Carregar relatório</button>
  </div>

  <div id="status"></div>
  <div id="channel-select" class="channel-select" style="display:none;"></div>
  <div id="report"></div>

  <nav class="action-bar">
    <a class="action-item item-calendario" href="/calendario.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      Calendário
    </a>
    <a class="action-item item-redes" href="/contas-conectadas.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h11"/></svg></div>
      Redes
    </a>
    <a class="action-item item-postar" href="/#postar">
      <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div>
      Postar
    </a>
    <span class="action-item item-relatorio active">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div>
      Relatório
    </span>
    <a class="action-item item-ajustes" href="/ajustes.html">
      <div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      Ajustes
    </a>
  </nav>

  <button type="button" id="support-fab" class="support-fab" aria-label="Suporte">
    <img src="/img/support-robot-cutout.png" alt="" />
  </button>

  <div id="support-modal" class="support-modal">
    <div class="support-modal-header">
      <button type="button" id="support-close-btn" class="back-btn">‹</button>
      <div class="support-modal-title">Suporte</div>
    </div>
    <div class="support-chat" id="support-chat">
      <p class="support-empty-hint">Pergunte qualquer coisa sobre como usar o app — como postar, agendar, ver relatórios, conectar redes, ou tirar dúvida sobre os planos.</p>
    </div>
    <div class="support-modal-bottom">
      <textarea id="support-question-input" class="support-question-input" rows="1" placeholder="Digite sua dúvida..."></textarea>
      <button type="button" id="support-mic-btn" class="support-mic-btn" title="Perguntar por voz">🎤</button>
      <button type="button" id="support-send-btn" class="support-send-btn">➤</button>
    </div>
  </div>

  <script>
    const HANDOFF_KEY = 'mvo_report_handoff';

    document.getElementById('back-btn').addEventListener('click', (e) => {
      if (window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });
    const statusEl = document.getElementById('status');
    const reportEl = document.getElementById('report');
    const manualLoginEl = document.getElementById('manual-login');

    const PLAN_LABELS = {
      iniciante: 'Iniciante em Social Mídia',
      profissional: 'Profissional em Social Mídia',
      especialista: 'Especialista + Gestor de Tráfego',
      personalizado: 'Projeto Personalizado',
      teste7dias: 'Teste Grátis 7 Dias',
    };

    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = 'show';
    }

    let sparkGradSeq = 0;

    // Área preenchida com gradiente, mesmo estilo de card de dashboard da
    // Postiz — só desenha quando existe série real de pelo menos 2 pontos.
    function sparkAreaSvg(series, color) {
      const w = 300, h = 118;
      const values = series.map((p) => p.value);
      const max = Math.max(...values, 1);
      const min = Math.min(...values, 0);
      const range = max - min || 1;
      const stepX = values.length > 1 ? w / (values.length - 1) : 0;
      const points = values.map((v, i) => [i * stepX, h - ((v - min) / range) * (h - 14) - 6]);
      const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      const area = `${line} L${w},${h} L0,${h} Z`;
      const gradId = `sparkGrad${sparkGradSeq++}`;
      const dates = series.map((p) => p.date).filter(Boolean);
      const total = values.reduce((a, b) => a + b, 0);
      const tooltip = dates.length
        ? `${dates[0]} - ${dates[dates.length - 1]}\nTotal: ${total}`
        : `Total: ${total}`;
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <title>${tooltip}</title>
        <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${area}" fill="url(#${gradId})"/>
        <path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>
      </svg>`;
    }

    // Variação real entre o primeiro e o último ponto da série — nunca um
    // número inventado. Sem série (ou só 1 ponto), não mostra selo nenhum.
    function realChangePercent(series) {
      if (!series || series.length < 2) return null;
      const first = series[0].value;
      const last = series[series.length - 1].value;
      if (!first) return last > 0 ? null : 0;
      return ((last - first) / Math.abs(first)) * 100;
    }

    function sparkCard(label, value, series, color) {
      const hasSeries = Array.isArray(series) && series.length >= 2;
      const pct = hasSeries ? realChangePercent(series) : null;
      const badge = pct === null ? '' : `<span class="spark-badge ${pct >= 0 ? 'up' : 'down'}">${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
      const chart = hasSeries ? `<div class="spark-chart">${sparkAreaSvg(series, color)}</div>` : '';
      const displayValue = value === null || value === undefined ? '—' : value;
      return `
        <div class="spark-card">
          ${chart}
          <div class="spark-content">
            <div class="spark-top">
              <span class="spark-label"><span class="spark-dot" style="background:${color}"></span>${label}</span>
              ${badge}
            </div>
            <div class="spark-num">${displayValue}</div>
          </div>
        </div>
      `;
    }

    // Filtro vindo da tela "Contas Conectadas" (marcar contas + tocar
    // Relatório) — mostra só as redes marcadas, cada uma em seu próprio
    // bloco, uma embaixo da outra. Sem filtro (entrando direto pelo menu),
    // mostra tudo, comportamento de sempre.
    function matchesFilter(platform, name, filter) {
      if (!filter || filter.length === 0) return true;
      return filter.some((f) => f.platform === platform && f.name === name);
    }

    function renderInsights(data, filter) {
      const block = document.createElement('div');
      block.className = 'insights-block';

      if (!data.available) {
        const messages = {
          plano: 'Métricas de desempenho (visualizações, alcance, engajamento) são exclusivas do plano Especialista + Gestor de Tráfego e do Projeto Personalizado.',
          'sem-conexao': 'Conecte uma rede social pra ver as métricas de desempenho aqui.',
          'sem-permissao': 'Sua rede social foi conectada antes dessa função existir — reconecte a rede (ícone de rede social no app) pra liberar as métricas.',
        };
        block.innerHTML = `<h2>Desempenho nas redes</h2><p class="insights-note">${messages[data.reason] || 'Métricas ainda não disponíveis.'}</p>`;
        reportEl.appendChild(block);
        return;
      }

      function statCard(value, label) {
        if (value === null || value === undefined) return '';
        return `<div class="stat-card"><div class="num">${value}</div><div class="label">${label}</div></div>`;
      }

      const REACTION_LABELS = { like: '👍', love: '❤️', wow: '😮', haha: '😂', sorry: '😢', anger: '😡' };

      let html = '<h2>Desempenho nas redes</h2><p class="sub-label">Últimos 7 dias</p>';
      (data.pages || []).forEach((page) => {
        const showFacebook = page.facebook && matchesFilter('facebook', page.pageName, filter);
        const showInstagram = page.instagram && matchesFilter('instagram', page.instagramUsername || page.pageName, filter);
        if (!showFacebook && !showInstagram) return;

        html += `<p style="font-weight:700;margin:14px 0 8px;">${page.pageName || page.instagramUsername || 'Conta'}</p>`;
        if (showFacebook) {
          html += `
            <div class="headline-grid">
              ${sparkCard('Impressões (FB)', page.facebook.impressions, page.facebook.impressionsSeries, '#33d6cb')}
              ${sparkCard('Curtidas da Página', page.facebook.fans, null, '#ff5a36')}
            </div>
            <div class="stat-row">
              ${statCard(page.facebook.reachUnique, 'Alcance único')}
              <div class="stat-card"><div class="num">${page.facebook.engagedUsers}</div><div class="label">Engajados</div></div>
              ${statCard(page.facebook.pageViews, 'Visitas à Página')}
            </div>
          `;
          const reactions = page.facebook.reactions;
          if (reactions && Object.keys(reactions).length) {
            const chips = Object.entries(reactions)
              .map(([type, count]) => `<span class="plan-chip">${REACTION_LABELS[type] || type} ${count}</span>`)
              .join('');
            html += `<div class="chart-title">Reações por tipo</div><div class="plan-breakdown">${chips}</div>`;
          }
        }
        if (showInstagram) {
          html += `
            <div class="headline-grid">
              ${sparkCard('Alcance (IG)', page.instagram.reach, page.instagram.reachSeries, '#ff5a36')}
              ${sparkCard('Seguidores', page.instagram.followers, null, '#33d6cb')}
            </div>
            <div class="stat-row">
              <div class="stat-card"><div class="num">${page.instagram.impressions}</div><div class="label">Impressões</div></div>
              <div class="stat-card"><div class="num">${page.instagram.profileViews}</div><div class="label">Visitas ao perfil</div></div>
              ${statCard(page.instagram.websiteClicks, 'Cliques no site')}
              ${statCard(page.instagram.directionsClicks, 'Pediram rota')}
              ${statCard(page.instagram.callClicks, 'Cliques em ligar')}
              ${statCard(page.instagram.emailContacts, 'E-mails')}
              ${statCard(page.instagram.textClicks, 'Mensagens de texto')}
            </div>
          `;
        }
        if (page.topPosts && page.topPosts.length) {
          html += `<div class="chart-title">Publicações com mais engajamento</div><div class="top-posts">`;
          page.topPosts.forEach((post) => {
            const caption = (post.caption || post.media_type || 'Publicação').slice(0, 40);
            const parts = [];
            if (post.engagement) parts.push(`${post.engagement} interações`);
            parts.push(`💬 ${post.comments || 0}`);
            parts.push(`❤️ ${post.likes || 0}`);
            html += `<div class="top-post"><a class="caption" href="${post.permalink}" target="_blank" rel="noopener">${caption}</a><span class="metric">${parts.join(' · ')}</span></div>`;
          });
          html += `</div>`;
        }

        const growth = (page.growthHistory || []).slice().sort((a, b) => a.date.localeCompare(b.date));
        if (growth.length > 1) {
          const values = growth.map((g) => ({ date: g.date, value: g.followers ?? g.fans ?? 0 }));
          html += `<div class="headline-grid">${sparkCard('Seguidores/curtidas ao longo do tempo', values[values.length - 1].value, values, '#ffc400')}</div>`;
        } else {
          html += '<p class="insights-note">Gráfico de crescimento aparece aqui assim que o relatório acumular mais de um dia de histórico — vai crescendo sozinho a cada vez que essa página for aberta.</p>';
        }
      });
      block.innerHTML = html;
      reportEl.appendChild(block);
    }

    let lastInsightsData = null;
    let activeFilter = null;

    const PLATFORM_BADGES = {
      facebook: { color: '#0866FF', icon: 'f' },
      instagram: { color: '#dc2743', icon: '📸' },
    };

    function channelInitial(name) {
      return String(name || '?').trim().charAt(0).toUpperCase();
    }

    // Campo "Channel" igual a Postiz: mostra a rede escolhida, clicar abre a
    // lista com marca de seleção; escolher re-renderiza na hora, sem
    // precisar buscar de novo no servidor (já temos o resultado em memória).
    function renderChannelPicker(data) {
      const selectEl = document.getElementById('channel-select');
      if (!selectEl) return;
      const channels = [];
      (data.pages || []).forEach((page) => {
        if (page.facebook) channels.push({ platform: 'facebook', name: page.pageName });
        if (page.instagram) channels.push({ platform: 'instagram', name: page.instagramUsername || page.pageName });
      });
      if (channels.length <= 1) {
        selectEl.innerHTML = '';
        selectEl.style.display = 'none';
        return;
      }
      selectEl.style.display = 'block';

      const current = activeFilter && activeFilter.length === 1 ? activeFilter[0] : null;
      const currentLabel = current ? current.name : 'Todas as redes';
      const currentBadge = current ? PLATFORM_BADGES[current.platform] : null;

      function avatarHtml(name, badge) {
        const style = badge ? `background:${badge.color}` : '';
        return `<span class="channel-avatar" style="${style}">${badge ? badge.icon : channelInitial(name)}</span>`;
      }

      selectEl.innerHTML = `
        <p class="channel-select-label-top">Redes</p>
        <button type="button" class="channel-select-trigger" id="channel-select-trigger">
          ${avatarHtml(currentLabel, currentBadge)}
          <span class="channel-select-value">${currentLabel}</span>
          <span class="channel-select-chevron">⌄</span>
        </button>
        <div class="channel-select-menu" id="channel-select-menu">
          <div class="channel-select-item${!current ? ' selected' : ''}" data-all="1">
            ${avatarHtml('Todas as redes', null)}
            <span>Todas as redes</span>
            <span class="check-mark">✓</span>
          </div>
          ${channels
            .map((ch) => {
              const isSel = current && current.platform === ch.platform && current.name === ch.name;
              return `
                <div class="channel-select-item${isSel ? ' selected' : ''}" data-platform="${ch.platform}" data-name="${ch.name.replace(/"/g, '&quot;')}">
                  ${avatarHtml(ch.name, PLATFORM_BADGES[ch.platform])}
                  <span>${ch.name}</span>
                  <span class="check-mark">✓</span>
                </div>
              `;
            })
            .join('')}
        </div>
      `;

      selectEl.querySelector('#channel-select-trigger').addEventListener('click', () => {
        selectEl.classList.toggle('open');
      });
      selectEl.querySelectorAll('.channel-select-item').forEach((item) => {
        item.addEventListener('click', () => {
          activeFilter = item.dataset.all ? null : [{ platform: item.dataset.platform, name: item.dataset.name }];
          selectEl.classList.remove('open');
          rerenderInsights();
        });
      });
    }

    function rerenderInsights() {
      if (!lastInsightsData) return;
      const oldBlock = document.querySelector('.insights-block');
      if (oldBlock) oldBlock.remove();
      renderInsights(lastInsightsData, activeFilter);
      renderChannelPicker(lastInsightsData);
    }

    async function loadInsights(identifier, password, filter) {
      try {
        const response = await fetch('/api/social-insights', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
        });
        const result = await response.json();
        if (response.ok) {
          lastInsightsData = result;
          activeFilter = filter || null;
          renderInsights(result, activeFilter);
          renderChannelPicker(result);
        }
      } catch (error) {
        // Metricas sao um extra - nao derruba o resto do relatorio se falhar.
      }
    }

    async function loadReport(identifier, password, filter) {
      statusEl.className = '';
      try {
        const response = await fetch('/api/social-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
        });
        const result = await response.json();
        if (!response.ok) {
          showError(`Erro: ${result.error || 'falha desconhecida'}`);
          manualLoginEl.style.display = 'block';
          return;
        }
        const connected = Object.keys(result.connections || {});
        let summaryHtml = '<div class="summary-row">';
        if (result.plan) summaryHtml += `<div class="summary-chip">Plano <strong>${PLAN_LABELS[result.plan] || result.plan}</strong></div>`;
        summaryHtml += `<div class="summary-chip">Redes conectadas <strong>${connected.length}</strong></div>`;
        if (result.admin) summaryHtml += `<div class="summary-chip">Clientes cadastrados <strong>${result.admin.totalClientes}</strong></div>`;
        summaryHtml += '</div>';
        reportEl.innerHTML = summaryHtml;
        reportEl.style.display = 'block';
        loadInsights(identifier, password, filter);
      } catch (error) {
        showError(`Erro: ${error.message || error}`);
        manualLoginEl.style.display = 'block';
      }
    }

    document.getElementById('load-btn').addEventListener('click', () => {
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      if (!identifier || !password) {
        showError('Digite e-mail/telefone e senha.');
        return;
      }
      loadReport(identifier, password);
    });

    document.querySelectorAll('.action-item[data-soon]').forEach((btn) => {
      btn.addEventListener('click', () => {
        statusEl.textContent = 'Ainda sem função definida por aqui.';
        statusEl.classList.add('show');
      });
    });

    (function autoLoad() {
      try {
        const handoff = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        if (handoff && handoff.identifier && handoff.password) {
          loadReport(handoff.identifier, handoff.password, handoff.filter);
          return;
        }
      } catch (e) {}
      manualLoginEl.style.display = 'block';
    })();

    // ---- Botão flutuante de Suporte (arrastável) ----
    (function setupSupportWidget() {
      const supportFab = document.getElementById('support-fab');
      const supportModal = document.getElementById('support-modal');
      const closeBtn = document.getElementById('support-close-btn');
      const chatEl = document.getElementById('support-chat');
      const inputEl = document.getElementById('support-question-input');
      const micBtn = document.getElementById('support-mic-btn');
      const sendBtn = document.getElementById('support-send-btn');

      function getCreds() {
        try {
          return JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null');
        } catch (e) {
          return null;
        }
      }
      function showFabIfLoggedIn() {
        const creds = getCreds();
        if (creds && creds.identifier && creds.password) supportFab.style.display = 'block';
      }
      showFabIfLoggedIn();

      const POS_KEY = 'mvo_support_fab_pos';
      function applyPos(pos) {
        supportFab.style.left = `${pos.x}px`;
        supportFab.style.top = `${pos.y}px`;
        supportFab.style.right = 'auto';
        supportFab.style.bottom = 'auto';
      }
      function defaultPos() {
        return { x: window.innerWidth - 70, y: Math.round(window.innerHeight * 0.58) };
      }
      (function initPos() {
        try {
          const saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
          applyPos(saved && typeof saved.x === 'number' ? saved : defaultPos());
        } catch (e) {
          applyPos(defaultPos());
        }
      })();

      let dragging = false;
      let moved = false;
      let startX, startY, origX, origY;
      supportFab.addEventListener('pointerdown', (e) => {
        dragging = true;
        moved = false;
        supportFab.setPointerCapture(e.pointerId);
        const rect = supportFab.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        origX = rect.left;
        origY = rect.top;
      });
      supportFab.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        const x = Math.max(4, Math.min(window.innerWidth - supportFab.offsetWidth - 4, origX + dx));
        const y = Math.max(4, Math.min(window.innerHeight - supportFab.offsetHeight - 4, origY + dy));
        applyPos({ x, y });
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        const rect = supportFab.getBoundingClientRect();
        try {
          localStorage.setItem(POS_KEY, JSON.stringify({ x: rect.left, y: rect.top }));
        } catch (e) {}
      }
      supportFab.addEventListener('pointerup', endDrag);
      supportFab.addEventListener('pointercancel', endDrag);
      supportFab.addEventListener('click', () => {
        if (moved) return;
        supportModal.classList.add('show');
      });
      closeBtn.addEventListener('click', () => supportModal.classList.remove('show'));

      function addMsg(text, who) {
        const el = document.createElement('div');
        el.className = `support-msg ${who}`;
        el.textContent = text;
        chatEl.appendChild(el);
        chatEl.scrollTop = chatEl.scrollHeight;
        return el;
      }

      async function sendQuestion() {
        const question = inputEl.value.trim();
        if (!question) return;
        const creds = getCreds();
        if (!creds || !creds.identifier || !creds.password) {
          addMsg('Sessão não encontrada — entre no app de novo.', 'bot');
          return;
        }
        inputEl.value = '';
        sendBtn.disabled = true;
        addMsg(question, 'user');
        const loadingEl = addMsg('Pensando...', 'bot');
        loadingEl.classList.add('loading');
        try {
          const response = await fetch('/api/support-ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: creds.identifier, password: creds.password, question }),
          });
          const result = await response.json();
          loadingEl.remove();
          addMsg(response.ok ? result.answer : result.error || 'Não consegui responder agora.', 'bot');
        } catch (error) {
          loadingEl.remove();
          addMsg('Falha de conexão — tenta de novo.', 'bot');
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', sendQuestion);
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendQuestion();
        }
      });

      // Microfone — mesmo padrão de ditado já usado no composer.
      const SupportSpeechCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SupportSpeechCtor) {
        micBtn.disabled = true;
        micBtn.title = 'Ditado por voz indisponível neste navegador.';
      } else {
        const recognition = new SupportSpeechCtor();
        recognition.lang = 'pt-BR';
        recognition.interimResults = true;
        recognition.continuous = true;
        let listening = false;
        let baseText = '';
        let finalText = '';

        function stopListeningUi() {
          listening = false;
          micBtn.classList.remove('recording');
        }
        recognition.addEventListener('result', (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (result.isFinal) finalText = `${finalText} ${result[0].transcript}`.trim();
            else interim += result[0].transcript;
          }
          const transcript = `${finalText} ${interim}`.trim();
          if (!transcript) return;
          const sep = baseText.trim() ? ' ' : '';
          inputEl.value = `${baseText.trim()}${sep}${transcript}`.trim();
        });
        recognition.addEventListener('end', () => {
          if (listening) {
            try {
              recognition.start();
            } catch (e) {
              stopListeningUi();
            }
            return;
          }
          stopListeningUi();
        });
        recognition.addEventListener('error', (event) => {
          if (event.error === 'no-speech' || event.error === 'aborted') return;
          listening = false;
          stopListeningUi();
        });
        micBtn.addEventListener('click', () => {
          if (listening) {
            listening = false;
            recognition.stop();
            return;
          }
          listening = true;
          baseText = inputEl.value;
          finalText = '';
          micBtn.classList.add('recording');
          try {
            recognition.start();
          } catch (e) {
            listening = false;
            stopListeningUi();
          }
        });
      }
    })();
  </script>
</body>
</html>
