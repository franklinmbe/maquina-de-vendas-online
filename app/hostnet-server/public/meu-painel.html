<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meu Painel — Máquina de Vendas Online</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0d12" />
<link rel="icon" href="/img/icons/favicon-32.png" sizes="32x32" />
<style>
  :root {
    --bg: #0a0d12; --panel: #12161f; --border: #232a37; --text: #f2f2f0; --muted: #b7bfcc;
    --accent: #ff5a36; --cyan: #33d6cb; --error: #ff6b6b; --violet: #8b7cf6; --green: #35d07f; --blue: #4d9eff; --amber: #f5b73d;
  }
  * { box-sizing: border-box; }
  @keyframes appFrameGlow {
    0%, 100% { border-color: #ff2d1f; box-shadow: inset 0 0 10px rgba(255, 45, 31, 0.2); }
    50% { border-color: #ff7a63; box-shadow: inset 0 0 20px rgba(255, 45, 31, 0.4); }
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 860px; margin: 0 auto; min-height: 100vh;
    padding: 24px 16px 100px; background: var(--bg); color: var(--text);
    border-left: 2px solid #ff2d1f; border-right: 2px solid #ff2d1f; animation: appFrameGlow 2.4s ease-in-out infinite;
  }
  h1 { font-size: 1.3rem; margin: 0; }
  .screen-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .screen-header .grow { flex: 1; }
  .today { font-size: 0.78rem; color: var(--muted); }
  .back-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; text-decoration: none; }
  .refresh-btn { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 0.76rem; font-weight: 700; cursor: pointer; font-family: inherit; }
  .refresh-btn:hover { border-color: var(--green); color: var(--green); }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0 0 6px; }
  input[type="text"], input[type="password"] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 1rem; font-family: inherit; }
  input:focus { outline: none; border-color: var(--green); }
  .btn-main { width: 100%; margin-top: 14px; padding: 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; font-size: 1.05rem; cursor: pointer; font-family: inherit; }
  #status { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; }
  #status.show { display: block; background: rgba(255,107,107,0.12); border: 1px solid var(--error); color: var(--error); }
  #manual-login, #report { display: none; }

  .switch { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip-btn { padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); color: var(--muted); font-size: 0.74rem; font-weight: 700; cursor: pointer; font-family: inherit; }
  .chip-btn.active { border-color: var(--cyan); color: var(--text); }
  .readonly-note { font-size: 0.78rem; color: var(--cyan); margin: 0 0 12px; }

  .banner { border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; font-size: 0.86rem; line-height: 1.5; border: 1px solid; }
  .banner.wait { background: rgba(245,183,61,0.08); border-color: rgba(245,183,61,0.4); }
  .banner.conn { background: rgba(77,158,255,0.08); border-color: rgba(77,158,255,0.4); }
  .banner.bad { background: rgba(255,107,107,0.08); border-color: rgba(255,107,107,0.4); }
  .banner.good { background: rgba(53,208,127,0.08); border-color: rgba(53,208,127,0.4); }
  .banner strong { display: block; margin-bottom: 2px; }

  .section-label { font-size: 0.72rem; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 10px; }
  .block { margin-bottom: 26px; }
  .big-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .big-grid { grid-template-columns: repeat(3, 1fr); } }
  .big { background: linear-gradient(180deg, rgba(53,208,127,0.07), rgba(53,208,127,0.02)); border: 1px solid rgba(53,208,127,0.28); border-radius: 16px; padding: 14px 15px 13px; min-width: 0; }
  .big.waiting { background: rgba(255,255,255,0.02); border-color: var(--border); }
  .big .big-label { font-size: 0.66rem; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  .big .big-num { font-size: 2rem; font-weight: 900; color: #4dffa0; margin: 6px 0 8px; line-height: 1; text-shadow: 0 0 18px rgba(53,208,127,0.55); letter-spacing: -0.02em; word-break: break-word; }
  .big.waiting .big-num { color: #6b7686; text-shadow: none; }
  .big .bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 8px; }
  .big .bar > span { display: block; height: 100%; background: linear-gradient(90deg, #35d07f, #4dffa0); border-radius: 4px; }
  .big .bar.hot > span { background: linear-gradient(90deg, #f5b73d, #ff6b6b); }
  .big .big-cap { font-size: 0.73rem; color: var(--muted); line-height: 1.4; }
  .up { color: var(--green); font-weight: 700; }

  .cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px 15px; }
  .net-head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .net-name { font-weight: 800; font-size: 1rem; }
  .net-sub { font-size: 0.76rem; color: var(--muted); }
  .pill { font-size: 0.64rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(183,191,204,0.14); color: var(--muted); letter-spacing: 0.03em; }
  .pill.ok { background: rgba(53,208,127,0.16); color: var(--green); }
  .pill.wait { background: rgba(245,183,61,0.16); color: var(--amber); }
  .pill.conn { background: rgba(77,158,255,0.16); color: var(--blue); }
  .pill.bad { background: rgba(255,107,107,0.14); color: var(--error); }
  .net-followers { font-size: 1.6rem; font-weight: 900; color: #4dffa0; margin: 8px 0 2px; }
  .net-followers small { font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-left: 6px; }
  .metric-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 0.84rem; }
  .metric-row b { font-variant-numeric: tabular-nums; }
  .waiting-note { font-size: 0.78rem; color: var(--muted); line-height: 1.45; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 8px; }
  .top-posts { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px; }
  .top-posts .tp-title { font-size: 0.66rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 4px 0; }
  .tp { font-size: 0.78rem; padding: 5px 0; line-height: 1.35; }
  .tp a { color: var(--text); text-decoration: none; }
  .tp .tp-num { color: var(--muted); font-size: 0.72rem; }
  svg.spark { width: 100%; height: 40px; display: block; margin-top: 6px; }

  .use-line { display: flex; justify-content: space-between; gap: 10px; font-size: 0.86rem; padding: 6px 0; }
  .use-line span:first-child { color: var(--muted); }
  .quota { margin: 10px 0; }
  .quota .q-top { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 5px; gap: 10px; }
  .quota .q-bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .quota .q-bar > span { display: block; height: 100%; background: linear-gradient(90deg, #35d07f, #4dffa0); }
  .quota .q-bar.hot > span { background: linear-gradient(90deg, #f5b73d, #ff6b6b); }
  .quota .q-cap { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }

  .cols { display: grid; grid-template-columns: 1fr; gap: 22px; }
  .col-brief { order: 1; } .col-tasks { order: 2; }
  @media (min-width: 780px) { .cols { grid-template-columns: 1.15fr 1fr; align-items: start; } .col-brief { order: 2; } .col-tasks { order: 1; } }
  .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .add-row input { flex: 1; min-width: 0; }
  .add-row button { padding: 0 20px; border: none; border-radius: 10px; background: var(--green); color: #06231f; font-weight: 900; letter-spacing: 0.06em; cursor: pointer; font-family: inherit; }
  .sub-label { font-size: 0.66rem; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.09em; margin: 16px 0 8px; display: flex; gap: 8px; align-items: center; }
  .sub-label:first-child { margin-top: 0; }
  .sub-label .count { background: rgba(255,255,255,0.08); border-radius: 999px; padding: 1px 8px; font-size: 0.66rem; }
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 7px; background: var(--bg); }
  .task.auto { border-left: 3px solid var(--tc, var(--muted)); }
  .task .t-body { flex: 1; min-width: 0; }
  .task .t-title { font-size: 0.9rem; font-weight: 600; line-height: 1.35; }
  .task .t-hint { font-size: 0.75rem; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .task .t-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .tag { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: rgba(183,191,204,0.14); color: var(--muted); }
  .tag.origin { background: color-mix(in srgb, var(--tc, #b7bfcc) 16%, transparent); color: var(--tc, var(--muted)); }
  .tag.age { background: rgba(245,183,61,0.14); color: var(--amber); }
  .task input[type="checkbox"] { width: 22px; height: 22px; margin: 1px 0 0; padding: 0; accent-color: var(--green); flex-shrink: 0; cursor: pointer; }
  .task.done .t-title { text-decoration: line-through; color: var(--muted); }
  .task .del { width: 26px; height: 26px; border: none; background: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; border-radius: 8px; }
  .task .del:hover { color: var(--error); background: rgba(255,107,107,0.1); }
  .empty { font-size: 0.83rem; color: var(--muted); line-height: 1.5; padding: 4px 2px 8px; }
  .greet { font-size: 1.1rem; font-weight: 800; margin: 0 0 4px; }
  .greet-sub { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin: 0 0 14px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem; line-height: 1.35; }
  .row:last-child { border-bottom: none; }
  .row .r-time { min-width: 46px; color: #4dffa0; font-weight: 800; font-variant-numeric: tabular-nums; }
  .row .r-body { flex: 1; min-width: 0; }
  .row .r-what { color: var(--muted); font-size: 0.78rem; }
  .row .r-chip { font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(245,183,61,0.14); color: var(--amber); white-space: nowrap; }
  .row .r-chip.ok { background: rgba(53,208,127,0.14); color: var(--green); }
  .brief-block + .brief-block { margin-top: 18px; }

  .action-bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-around; padding: 10px 6px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); background: var(--panel); z-index: 50; }
  .action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 0.78rem; font-weight: 700; padding: 4px; text-decoration: none; }
  .action-item svg { width: 24px; height: 24px; }
  .action-item .icon-circle, .action-item .icon-plain { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .action-item.item-calendario .icon-plain { background: rgba(51,214,203,0.16); color: var(--cyan); }
  .action-item.item-redes .icon-plain { background: rgba(139,124,246,0.18); color: var(--violet); }
  .action-item.item-postar .icon-circle { background: rgba(255,90,54,0.16); color: var(--accent); }
  .action-item.item-relatorio .icon-plain { background: rgba(53,208,127,0.16); color: var(--green); }
  .action-item.item-ajustes .icon-plain { background: rgba(77,158,255,0.16); color: var(--blue); }
  .action-item.active.item-ajustes { color: var(--blue); }
  .action-item.active.item-ajustes .icon-plain { background: var(--blue); color: #fff; }
</style>
</head>
<body>
  <div class="screen-header">
    <a href="/ajustes.html" class="back-btn" id="back-btn">‹</a>
    <h1 id="page-title">Meu Painel</h1>
    <span class="grow"></span>
    <span class="today" id="today"></span>
    <button type="button" class="refresh-btn" id="refresh-btn" style="display:none">↻ Atualizar</button>
  </div>

  <div id="manual-login">
    <label for="identifier">E-mail ou telefone</label>
    <input type="text" id="identifier" autocomplete="username" />
    <label for="password" style="margin-top:10px">Senha</label>
    <input type="password" id="password" autocomplete="current-password" />
    <button type="button" class="btn-main" id="load-btn">Abrir o painel</button>
  </div>
  <div id="status"></div>

  <div id="report">
    <div class="switch" id="client-switch"></div>
    <p class="readonly-note" id="readonly-note" style="display:none"></p>
    <div id="meta-banner"></div>

    <div class="block"><p class="section-label">Redes sociais — o que mais importa</p><div class="big-grid" id="big-redes"></div></div>
    <div class="block"><p class="section-label">Suas redes, uma por uma</p><div class="cards" id="redes"></div></div>
    <div class="block"><p class="section-label">Uso do aplicativo</p><div class="cards" id="uso"></div></div>

    <div class="cols">
      <div class="col-tasks">
        <p class="section-label">Tarefas</p>
        <div class="card"><div id="add-box" class="add-row"><input type="text" id="task-input" placeholder="Adicionar uma tarefa sua..." maxlength="200" /><button type="button" id="task-add">ADD</button></div><div id="tasks"></div></div>
      </div>
      <div class="col-brief">
        <p class="section-label">Resumo do dia</p>
        <div class="card" id="brief"></div>
      </div>
    </div>
  </div>

  <nav class="action-bar">
    <a class="action-item item-calendario" href="/calendario.html"><div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>Calendário</a>
    <a class="action-item item-redes" href="/contas-conectadas.html"><div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h11"/></svg></div>Redes</a>
    <a class="action-item item-postar" href="/#postar"><div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div>Postar</a>
    <a class="action-item item-relatorio" href="/relatorio-redes.html"><div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div>Relatório</a>
    <a class="action-item active item-ajustes" href="/ajustes.html"><div class="icon-plain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>Ajustes</a>
  </nav>

  <script>
    const HANDOFF_KEY = 'mvo_report_handoff';
    document.getElementById('back-btn').addEventListener('click', (e) => { if (window.history.length > 1) { e.preventDefault(); window.history.back(); } });
    const qs = new URLSearchParams(location.search);
    const CLIENTE = qs.get('cliente') || '';
    const statusEl = document.getElementById('status');
    const manualLoginEl = document.getElementById('manual-login');
    const reportEl = document.getElementById('report');
    const showError = (m) => { statusEl.textContent = m; statusEl.className = 'show'; };
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const int = (n) => Number(n).toLocaleString('pt-BR');
    const plural = (n, one, many) => `${int(n)} ${n === 1 ? one : many}`;
    const brl = (n) => `R$ ${Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const fmtDate = (d) => String(d || '').split('-').reverse().join('/');
    const daysAgo = (iso) => (iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null);
    const ORIGIN_COLOR = { 'Aprovação': '#ff5a36', 'Dica marcada': '#4d9eff', 'Em andamento': '#f5b73d', 'Estratégia': '#8b7cf6', 'Redes': '#33d6cb', 'Métricas': '#f5b73d', 'Conteúdo': '#35d07f', 'Plano': '#ff7a63' };
    let CREDS = null, DATA = null, RO = false;

    const WAIT_CAP = { 'aguardando-meta': 'Aguardando o Meta liberar', 'sem-conexao': 'Conecte direto pelo app', 'permissao': 'Reconecte a rede', 'demorou': 'O Meta demorou, atualize' };

    function renderBanner(panel) {
      const s = panel.meta.estado;
      const box = document.getElementById('meta-banner');
      if (s === 'ok') { box.innerHTML = '<div class="banner good"><strong>Métricas do Meta ativas</strong>Os números do Facebook e do Instagram abaixo são dos últimos 7 dias e atualizam sempre que você abre o painel.</div>'; return; }
      const msgs = {
        'aguardando-meta': ['wait', 'Métricas detalhadas: aguardando a liberação do Meta', 'O Meta ainda não liberou as métricas detalhadas do Facebook e do Instagram para o nosso aplicativo. Já está tudo instalado: quando o Meta liberar, os números aparecem aqui sozinhos, sem você fazer nada. Enquanto isso, os seguidores, as curtidas e os comentários já aparecem.'],
        'sem-conexao': ['conn', 'Conecte o Facebook e o Instagram direto pelo app', 'Pra ver aqui as métricas das suas páginas, conecte o Facebook e o Instagram na aba Redes. O Meta também ainda está liberando as métricas detalhadas: já está tudo instalado, e quando liberar os números aparecem aqui sozinhos.'],
        'permissao': ['wait', 'As métricas detalhadas ainda estão bloqueadas pelo Meta', 'Pode ser a liberação do Meta que ainda não saiu, ou uma conexão antiga. Vale reconectar o Facebook e o Instagram na aba Redes; se os números não aparecerem, é a liberação do Meta, e eles surgem sozinhos quando ela sair. Seguidores, curtidas e comentários já aparecem.'],
        'demorou': ['wait', 'O Meta demorou pra responder', 'Toque em Atualizar daqui a alguns instantes.'],
      };
      const m = msgs[s] || msgs['aguardando-meta'];
      box.innerHTML = `<div class="banner ${m[0]}"><strong>${esc(m[1])}</strong>${esc(m[2])}</div>`;
    }

    function bigCard(label, value, caption, opts = {}) {
      const waiting = value == null;
      const bar = !waiting && opts.bar != null ? `<div class="bar ${opts.bar >= 80 ? 'hot' : ''}"><span style="width:${Math.max(3, Math.min(100, opts.bar))}%"></span></div>` : '';
      return `<div class="big ${waiting ? 'waiting' : ''}"><div class="big-label">${esc(label)}</div><div class="big-num">${waiting ? '—' : esc(value)}</div>${bar}<div class="big-cap">${caption}</div></div>`;
    }

    function renderBig(panel) {
      const n = panel.numbers, w = WAIT_CAP[panel.meta.estado] || 'Aguardando o Meta liberar';
      const seg = n.seguidores;
      const segCap = seg
        ? (seg.delta7d == null ? 'Em todas as redes conectadas direto. O histórico de crescimento começa a aparecer em alguns dias.' : `<span class="${seg.delta7d >= 0 ? 'up' : ''}">${seg.delta7d >= 0 ? '+' : ''}${int(seg.delta7d)}</span> nos últimos 7 dias.`)
        : (panel.meta.estado === 'sem-conexao' ? 'Conecte o Facebook ou o Instagram direto pelo app.' : w);
      const plano = n.plano;
      document.getElementById('big-redes').innerHTML = [
        bigCard('Seguidores', seg ? int(seg.valor) : null, segCap),
        bigCard('Visualizações (7 dias)', n.visualizacoes ? int(n.visualizacoes.valor) : null, n.visualizacoes ? 'Facebook e Instagram somados.' : w),
        bigCard('Alcance (7 dias)', n.alcance ? int(n.alcance.valor) : null, n.alcance ? 'Pessoas diferentes que viram o seu Instagram.' : w),
        bigCard('Interações (7 dias)', n.interacoes ? int(n.interacoes.valor) : null, n.interacoes ? 'Reações, comentários e compartilhamentos nos posts da página.' : w),
        bigCard('Pedidos enviados', int(n.pedidos.total), `${plural(n.pedidos.fotos, 'foto', 'fotos')} e ${plural(n.pedidos.videos, 'vídeo', 'vídeos')} enviados por você.`),
        bigCard('Uso do seu plano', plano ? `${plano.pct}%` : 'Sem limite', plano ? `${esc(plano.nome)}: ${plano.used} de ${plano.limit}.` : 'O seu plano não tem cota que possa acabar.', { bar: plano ? plano.pct : null }),
      ].join('');
    }

    function spark(serie, color) {
      if (!serie || serie.length < 2) return '';
      const max = Math.max(...serie.map((p) => p.value), 1);
      const pts = serie.map((p, i) => `${(i / (serie.length - 1)) * 300},${36 - (p.value / max) * 32}`).join(' ');
      return `<svg class="spark" viewBox="0 0 300 40" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
    }

    const ESTADO_PILL = { ok: ['ok', 'Métricas ativas'], 'aguardando-meta': ['wait', 'Aguardando o Meta'], 'sem-conexao': ['conn', 'Conecte direto'], permissao: ['bad', 'Reconectar'], 'em-breve': ['', 'Métricas em breve'], 'nao-conectada': ['', 'Não conectada'], 'fora-do-plano': ['', 'Fora do plano'] };
    const METRIC_LABELS = { visualizacoes: 'Visualizações', interacoes: 'Interações com posts', visitas: 'Visitas', alcance: 'Alcance', cliques: 'Cliques de contato' };

    function renderRedes(panel) {
      document.getElementById('redes').innerHTML = panel.redes.map((r) => {
        const p = ESTADO_PILL[r.estado] || ['', r.estado];
        const con = r.conexao === 'direta' ? '<span class="pill ok">Conectada direto</span>' : r.conexao === 'equipe' ? '<span class="pill conn">Publicada pela equipe</span>' : '';
        const met = r.metricas ? Object.entries(r.metricas).filter(([, v]) => v != null).map(([k, v]) => `<div class="metric-row"><span>${esc(METRIC_LABELS[k] || k)}</span><b>${int(v)}</b></div>`).join('') : '';
        let nota = '';
        if (!r.metricas) {
          if (r.estado === 'aguardando-meta') nota = 'As métricas de 7 dias aparecem aqui sozinhas assim que o Meta liberar.';
          else if (r.estado === 'sem-conexao') nota = 'Hoje a nossa equipe publica por você. Conecte direto na aba Redes pra ver as métricas aqui.';
          else if (r.estado === 'permissao') nota = 'Reconecte na aba Redes pra liberar as métricas.';
          else if (r.estado === 'em-breve') nota = 'As métricas dessa rede ainda não estão no painel. Vamos trazer em breve.';
          else if (r.estado === 'fora-do-plano') nota = 'Essa rede não faz parte do seu plano.';
          else if (r.estado === 'nao-conectada') nota = 'Ainda não conectada. Conecte na aba Redes.';
        }
        const tops = (r.topPosts && r.topPosts.length) ? `<div class="top-posts"><div class="tp-title">Posts recentes em destaque</div>${r.topPosts.map((t) => `<div class="tp"><a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.legenda || 'Publicação')}</a> <span class="tp-num">· ${int(t.curtidas)} curtidas · ${int(t.comentarios)} comentários</span></div>`).join('')}</div>` : '';
        return `<div class="card"><div class="net-head"><span class="net-name">${esc(r.nome)}</span><span class="net-sub">${esc(r.detalhe)}</span></div><div class="net-head">${con}<span class="pill ${p[0]}">${esc(p[1])}</span></div>${r.seguidores != null ? `<div class="net-followers">${int(r.seguidores)}<small>seguidores</small></div>` : ''}${met}${r.serie ? spark(r.serie, '#4dffa0') : ''}${nota ? `<div class="waiting-note">${esc(nota)}</div>` : ''}${tops}</div>`;
      }).join('');
    }

    function quota(c) {
      return `<div class="quota"><div class="q-top"><span>${esc(c.nome)}</span><b>${int(c.used)} de ${int(c.limit)}</b></div><div class="q-bar ${c.pct >= 80 ? 'hot' : ''}"><span style="width:${Math.max(2, Math.min(100, c.pct))}%"></span></div><div class="q-cap">${c.pct}% usado · ${esc(c.periodo === 'janela' ? 'janela atual do dia' : c.periodo === 'dia' ? 'hoje' : c.periodo === 'mês' ? 'neste mês' : c.periodo)}</div></div>`;
    }
    function renderUso(panel) {
      const u = panel.uso;
      const ult = daysAgo(u.pedidos.ultimo), ace = daysAgo(u.acessos.ultimo);
      const ago = (d) => (d == null ? 'ainda não' : d === 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${d} dias`);
      document.getElementById('uso').innerHTML = `
        <div class="card"><div class="net-name" style="margin-bottom:6px">Seus pedidos</div>
          <div class="use-line"><span>Pedidos enviados</span><b>${int(u.pedidos.enviados)}</b></div>
          <div class="use-line"><span>Fotos enviadas</span><b>${int(u.pedidos.fotos)}</b></div>
          <div class="use-line"><span>Vídeos enviados</span><b>${int(u.pedidos.videos)}</b></div>
          <div class="use-line"><span>Último pedido</span><b>${esc(ago(ult))}</b></div>
          <div class="use-line"><span>Posts agendados</span><b>${int(u.agendados)}</b></div>
          <div class="use-line"><span>Acessos ao app</span><b>${int(u.acessos.total)} · último ${esc(ago(ace))}</b></div></div>
        <div class="card"><div class="net-name" style="margin-bottom:6px">Cota do seu plano${panel.plano.nome ? ` — ${esc(panel.plano.nome)}` : ''}</div>
          ${u.semLimite ? '<div class="empty">O seu plano não tem cota mensal de imagens, vídeos ou posts que possa acabar.</div>' : u.cotas.map(quota).join('')}</div>`;
    }

    function renderTasks(t) {
      const auto = t.auto.map((x) => {
        const c = ORIGIN_COLOR[x.origem] || '#98a2b3';
        const age = x.dias != null && x.dias >= 1 ? `<span class="tag age">há ${x.dias} dia${x.dias === 1 ? '' : 's'}</span>` : '';
        return `<div class="task auto" style="--tc:${c}"><div class="t-body"><div class="t-title">${esc(x.titulo)}</div>${x.dica ? `<div class="t-hint">${esc(x.dica)}</div>` : ''}<div class="t-meta"><span class="tag origin">${esc(x.origem)}</span>${age}<span class="tag">automática</span></div></div></div>`;
      }).join('');
      const open = t.manual.filter((x) => !x.done), done = t.manual.filter((x) => x.done);
      const mine = (x) => `<div class="task ${x.done ? 'done' : ''}"><input type="checkbox" data-toggle="${esc(x.id)}" ${x.done ? 'checked' : ''} ${RO ? 'disabled' : ''} /><div class="t-body"><div class="t-title">${esc(x.title)}</div></div>${RO ? '' : `<button type="button" class="del" data-del="${esc(x.id)}" aria-label="Apagar">×</button>`}</div>`;
      document.getElementById('tasks').innerHTML = `
        <div class="sub-label">Automáticas <span class="count">${t.auto.length}</span></div>
        ${auto || '<div class="empty">Nada pendente. Tudo em dia.</div>'}
        <div class="sub-label">Suas tarefas <span class="count">${open.length}</span></div>
        ${open.map(mine).join('') || '<div class="empty">Nenhuma tarefa sua aberta.</div>'}
        ${done.length ? `<div class="sub-label">Feitas <span class="count">${done.length}</span></div>${done.slice(-6).reverse().map(mine).join('')}` : ''}`;
      document.querySelectorAll('[data-toggle]').forEach((el) => el.addEventListener('change', () => act('toggle', { id: el.dataset.toggle })));
      document.querySelectorAll('[data-del]').forEach((el) => el.addEventListener('click', () => act('delete', { id: el.dataset.del })));
    }

    function renderBrief(panel) {
      const b = panel.brief;
      const h = new Date().getHours();
      const greet = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
      const sub = [b.agenda.length ? plural(b.agenda.length, 'post agendado hoje', 'posts agendados hoje') : 'nenhum post agendado hoje', b.aprovacoes ? plural(b.aprovacoes, 'pedido esperando o seu OK', 'pedidos esperando o seu OK') : null].filter(Boolean).join(' · ');
      const agenda = b.agenda.map((a) => `<div class="row"><span class="r-time">${esc(a.hora)}</span><div class="r-body"><div class="r-what">${esc(a.oQue)}</div></div><span class="r-chip ${a.status === 'pending' ? '' : 'ok'}">${a.status === 'pending' ? 'agendado' : 'publicado'}</span></div>`).join('');
      const f = b.fluxo2;
      const f2 = f ? `<div class="brief-block"><div class="sub-label">Seus anúncios (Fluxo 2)</div><div class="row"><div class="r-body"><div class="r-what">${f.ultimoRegistro ? `Último registro em ${esc(fmtDate(f.ultimoRegistro))}` : 'Ainda sem registro'}${f.conversas ? ` · ${int(f.conversas)} conversas no WhatsApp${f.custo ? ` a ${brl(f.custo)} cada` : ''}` : ''}</div></div><span class="r-chip ${f.dicasHoje ? 'ok' : ''}">${f.dicasHoje ? plural(f.dicasHoje, 'dica hoje', 'dicas hoje') : 'sem dicas hoje'}</span></div></div>` : '';
      document.getElementById('brief').innerHTML = `<p class="greet">${greet}!</p><p class="greet-sub">${esc(sub)}.</p>
        <div class="brief-block"><div class="sub-label">Agenda de hoje</div>${agenda || '<div class="empty">Nenhum post agendado pra hoje.</div>'}</div>
        ${b.aprovacoesFalhou ? '<p class="empty">Não consegui conferir agora se há pedidos esperando o seu OK. Atualize daqui a pouco.</p>' : ''}${f2}`;
    }

    function render(j) {
      DATA = j; RO = !!j.viewing.somenteLeitura;
      const p = j.panel;
      const dia = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('today').textContent = dia.charAt(0).toUpperCase() + dia.slice(1);
      const outro = j.clientes && j.viewing.client !== 'frank';
      const title = outro ? `Painel de ${j.viewing.name}` : 'Meu Painel';
      document.getElementById('page-title').textContent = title; document.title = `${title} — Máquina de Vendas Online`;
      const sw = document.getElementById('client-switch');
      if (j.clientes) {
        sw.style.display = 'flex';
        sw.innerHTML = j.clientes.map((c) => `<button type="button" class="chip-btn ${c.client === j.viewing.client ? 'active' : ''}" data-cli="${esc(c.client)}">${esc(c.name)}</button>`).join('');
        sw.querySelectorAll('[data-cli]').forEach((b) => b.addEventListener('click', () => { location.search = `?cliente=${encodeURIComponent(b.dataset.cli)}`; }));
      }
      const ro = document.getElementById('readonly-note');
      ro.style.display = RO ? 'block' : 'none'; ro.textContent = RO ? `Você está vendo o painel de ${j.viewing.name}, só pra leitura.` : '';
      document.getElementById('add-box').style.display = RO ? 'none' : 'flex';
      renderBanner(p); renderBig(p); renderRedes(p); renderUso(p); renderTasks(p.tarefas); renderBrief(p);
      reportEl.style.display = 'block'; document.getElementById('refresh-btn').style.display = 'inline-block';
    }

    async function call(body) {
      const r = await fetch('/api/meu-painel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifier: CREDS.identifier, password: CREDS.password, ...(CLIENTE ? { cliente: CLIENTE } : {}), ...body }) });
      return { ok: r.ok, status: r.status, j: await r.json() };
    }
    async function act(action, extra) {
      statusEl.className = '';
      try { const r = await call({ action, ...extra }); if (!r.ok) { showError(`Erro: ${r.j.error || 'falha desconhecida'}`); return; } render(r.j); }
      catch (e) { showError(`Erro: ${e.message || e}`); }
    }
    async function load(identifier, password) {
      CREDS = { identifier, password }; statusEl.className = '';
      try {
        const r = await call({});
        if (!r.ok) { showError(`Erro: ${r.j.error || 'falha desconhecida'}`); if (r.status === 401) manualLoginEl.style.display = 'block'; return; }
        manualLoginEl.style.display = 'none'; render(r.j);
      } catch (e) { showError(`Erro: ${e.message || e}`); manualLoginEl.style.display = 'block'; }
    }
    document.getElementById('task-add').addEventListener('click', async () => {
      const input = document.getElementById('task-input'); const title = input.value.trim();
      if (!title) return; input.value = ''; await act('add', { title });
    });
    document.getElementById('task-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('task-add').click(); });
    document.getElementById('refresh-btn').addEventListener('click', () => CREDS && load(CREDS.identifier, CREDS.password));
    document.getElementById('load-btn').addEventListener('click', () => {
      const i = document.getElementById('identifier').value.trim(), p = document.getElementById('password').value;
      if (!i || !p) { showError('Digite e-mail/telefone e senha.'); return; }
      load(i, p);
    });
    (function autoLoad() {
      try { const h = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null'); if (h && h.identifier && h.password) { load(h.identifier, h.password); return; } } catch (e) {}
      manualLoginEl.style.display = 'block';
    })();
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  </script>
</body>
</html>
