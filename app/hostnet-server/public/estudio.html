<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Máquina de Vendas Cut Estúdio</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0d12" />
<link rel="icon" href="/img/icons/favicon-32.png" sizes="32x32" />
<script src="/js/brand.js"></script>
<style>
  /* Estúdio (Franklin, 2026-10-16): editor de imagem e vídeo inspirado no
     CapCut. 2026-10-17: meta de copiar ~80% do CapCut — abas Editar ·
     Modelos · Lab. de IA · Projetos · Postar, ferramentas agrupadas por
     estúdio (design, vídeo, editor, voz, imagem, lote) e saldo do mês no
     topo no lugar dos "créditos". Fase 1: os Modelos de
     efeito e 3 ferramentas (Banner, Criar imagem, Foto em movimento) já
     funcionam, mandando o pedido pelo mesmo /api/commit do Postar (geração +
     aprovação de sempre). As outras ferramentas aparecem como "em breve". */
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --panel-2: #181d28;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --cyan: #33d6cb;
    --violet: #8b7cf6;
    --green: #35d07f;
    --gold: #f5c542;
    --on-accent: #1a0703;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.45;
  }
  .app {
    max-width: 480px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 120px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    display: flex; align-items: center; gap: 10px;
    padding-block: calc(12px + env(safe-area-inset-top, 0px)) 10px; border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 1.3rem; margin: 0; flex: 1; }
  .topbar h1 small { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  /* Selo "Cut", imitando o CapCut (Franklin, 2026-10-17): branco, letra preta e tesourinha. */
  .cut-badge { display: inline-flex; align-items: center; gap: 3px; background: #fff; color: #000; font-weight: 900; border-radius: 6px; padding: 1px 6px 1px 5px; margin: 0 2px; letter-spacing: 0; text-transform: none; vertical-align: middle; }
  .cut-badge svg { width: 1em; height: 1em; fill: none; stroke: #000; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .pill-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text); text-decoration: none;
    border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  button:focus-visible, a:focus-visible, label:focus-within { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .screen { display: grid; gap: 18px; padding-block: 16px 0; }
  .section-title { font-size: 0.78rem; font-weight: 800; color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase; margin: 0; }
  .note { font-size: 0.88rem; color: var(--muted); margin: 0; }

  .big-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .big-btn {
    border: none; border-radius: 20px; padding: 22px 12px; cursor: pointer; font: inherit;
    display: grid; gap: 8px; justify-items: center; font-weight: 800; font-size: 1.05rem;
  }
  .big-btn .ico { font-size: 2rem; line-height: 1; }
  .big-btn.video { background: var(--accent); color: var(--on-accent); }
  .big-btn.image { background: var(--cyan); color: #04211e; }

  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tool {
    position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; color: var(--text);
    padding: 14px 6px; display: grid; gap: 6px; justify-items: center; text-align: center; cursor: pointer; font: inherit; font-size: 0.82rem; font-weight: 700;
  }
  .tool .ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 1.35rem; background: var(--panel-2); }
  .tool.v .ico { background: rgba(255, 90, 54, 0.16); }
  .tool.i .ico { background: rgba(51, 214, 203, 0.16); }
  .tool.a .ico { background: rgba(139, 124, 246, 0.18); }
  .tool .cost { font-size: 0.66rem; font-weight: 700; color: var(--muted); }
  .tool.soon { opacity: 0.55; }
  .tool .soon-tag { position: absolute; top: 6px; right: 6px; font-size: 0.58rem; font-weight: 800; background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 2px 6px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 0.88rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .models { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .model { background: none; border: none; padding: 0; text-align: left; color: var(--text); cursor: pointer; font: inherit; display: grid; gap: 6px; }
  .preview { position: relative; aspect-ratio: 9 / 14; max-width: 100%; border-radius: 16px; overflow: hidden; display: grid; place-items: center; }
  .preview .obj { font-size: 3.2rem; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.5)); }
  .preview .badge { position: absolute; top: 8px; left: 8px; font-size: 0.64rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,0.55); color: #fff; }
  .preview .badge.simple { background: var(--green); color: #052313; }
  .model-name { font-weight: 800; font-size: 0.92rem; }
  .model-sub { font-size: 0.76rem; color: var(--muted); margin-top: -4px; }

  @keyframes rise { 0% { transform: translateY(70%) scale(0.7); } 55%,100% { transform: translateY(0) scale(1); } }
  @keyframes floaty { 0%,100% { transform: translateY(-8px) rotate(-4deg); } 50% { transform: translateY(8px) rotate(4deg); } }
  @keyframes spin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
  @keyframes zoomin { 0% { transform: scale(0.8); } 100% { transform: scale(1.25); } }
  @keyframes slide { 0%,100% { transform: translateX(-60%); } 50% { transform: translateX(60%); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes drop { 0% { transform: translateY(-120%); } 60% { transform: translateY(6%); } 75%,100% { transform: translateY(0); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-3deg); } 75% { transform: translateX(6px) rotate(3deg); } }
  .fx-rise .obj { animation: rise 2.6s ease-out infinite; }
  .fx-float .obj { animation: floaty 3s ease-in-out infinite; }
  .fx-spin .obj { animation: spin 3.2s linear infinite; }
  .fx-zoom .obj { animation: zoomin 3s ease-in-out infinite alternate; }
  .fx-slide .obj { animation: slide 4s ease-in-out infinite; }
  .fx-pulse .obj { animation: pulse 1.4s ease-in-out infinite; }
  .fx-drop .obj { animation: drop 2.4s cubic-bezier(.3,1.4,.5,1) infinite; }
  .fx-shake .obj { animation: shake 0.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .preview .obj { animation: none !important; } }

  .detail .preview { aspect-ratio: 9 / 12; }
  .detail .preview .obj { font-size: 5rem; }
  .detail p { margin: 0; color: var(--muted); }
  .step { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
  .step h3 { margin: 0; font-size: 0.95rem; }
  .step h3 span { color: var(--accent); margin-right: 6px; }
  .upload { position: relative; display: grid; place-items: center; gap: 6px; border: 2px dashed var(--border); border-radius: 14px; padding: 18px; cursor: pointer; color: var(--muted); font-weight: 700; text-align: center; }
  .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .upload .thumbs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .upload img { max-height: 120px; max-width: 100%; border-radius: 10px; }
  textarea.input { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 10px; font: inherit; resize: vertical; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 2px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 999px; padding: 9px 14px; font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  .pill[aria-pressed="true"] { border-color: var(--accent); background: rgba(255, 90, 54, 0.16); }
  .go { border: none; border-radius: 16px; padding: 16px; font: inherit; font-weight: 800; font-size: 1.08rem; background: var(--accent); color: var(--on-accent); cursor: pointer; text-align: center; text-decoration: none; display: block; }
  .go:disabled { opacity: 0.45; cursor: not-allowed; }
  .go.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .hint { font-size: 0.82rem; color: var(--muted); margin: -6px 0 0; }
  .msg { border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 0.9rem; }
  .msg.err { background: rgba(255, 90, 54, 0.14); border: 1px solid var(--accent); }
  .msg.ok { background: rgba(53, 208, 127, 0.14); border: 1px solid var(--green); }

  .mine-list { display: grid; gap: 10px; }
  .mine-item { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: grid; gap: 6px; }
  .mine-item .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .mine-item strong { font-size: 0.95rem; }
  .mine-item time { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { font-size: 0.82rem; font-weight: 800; }
  .status.wait { color: var(--gold); }
  .status.ready { color: var(--cyan); }
  .status.done { color: var(--green); }
  .status.fail { color: var(--accent); }
  .mine-item a { color: var(--cyan); font-weight: 800; font-size: 0.88rem; }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); border: 1px dashed var(--border); border-radius: 16px; }

  /* Saldo do mês (no lugar dos "créditos" do CapCut: o cliente vê quantas
     imagens/vídeos ainda restam no plano). */
  .saldo-pill { font-variant-numeric: tabular-nums; padding: 8px 10px; }
  .saldo { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
  .saldo-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 0.86rem; font-weight: 700; }
  .saldo-row b { font-variant-numeric: tabular-nums; }
  .saldo-bar { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .saldo-bar span { display: block; height: 100%; background: var(--green); }
  .saldo-bar span.low { background: var(--accent); }

  /* Lab. de IA — igual ao CapCut: "O que vamos criar hoje?" + caixa da ideia. */
  .lab-title { font-size: 1.7rem; line-height: 1.15; margin: 4px 0 0; }
  .lab-quick { display: grid; gap: 10px; justify-items: start; }
  .lab-quick button { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 800; cursor: pointer; }
  .idea-box { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 12px; display: grid; gap: 10px; }
  .idea-box textarea { width: 100%; background: transparent; border: none; color: var(--text); font: inherit; font-size: 1.05rem; resize: vertical; min-height: 70px; }
  .idea-box textarea:focus { outline: none; }
  .idea-actions { display: flex; align-items: center; gap: 10px; }
  .idea-actions .upload { border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; flex: 1; justify-items: start; }
  .idea-actions .go { padding: 12px 18px; font-size: 0.95rem; }

  .guide-link { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 2px solid var(--violet); border-radius: 14px; padding: 12px 14px; color: var(--text); font-weight: 800; text-decoration: none; }
  .guide-link span { color: var(--violet); }

  /* Janela do usuário (⋯) */
  .more-btn { font-size: 1.1rem; line-height: 1; padding: 6px 12px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 480px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; max-height: 85vh; overflow-y: auto; }
  .sheet[hidden], .sheet-bg[hidden] { display: none; }
  .sheet-head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .sheet-head strong { display: block; font-size: 1.1rem; }
  .sheet-head span { color: var(--muted); font-size: 0.85rem; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; background: var(--panel-2); }
  .sheet-plan { background: linear-gradient(120deg, rgba(51,214,203,0.22), rgba(139,124,246,0.22)); border-radius: 14px; padding: 12px 14px; font-weight: 800; margin-bottom: 6px; }
  .sheet-plan small { display: block; font-weight: 600; color: var(--muted); }
  .sheet-row, .sheet-link { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 4px; border-bottom: 1px solid var(--border); font-weight: 700; color: var(--text); text-decoration: none; background: none; border-left: 0; border-right: 0; border-top: 0; font: inherit; text-align: left; cursor: pointer; width: 100%; }
  .sheet-row b { color: var(--muted); font-size: 0.88rem; }
  .sheet-out { color: var(--accent); border-bottom: 0; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; }
  .seg button { border: none; background: none; color: var(--muted); font: inherit; font-weight: 800; font-size: 0.85rem; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  /* Editor na hora — palco preto grande em cima, opções roláveis embaixo (CapCut). */
  .stage { position: relative; background: #000; border-radius: 16px; overflow: hidden; display: grid; place-items: center; min-height: 240px; max-height: 58vh; }
  .stage video, .stage img { display: block; max-width: 100%; max-height: 58vh; }
  .stage-empty { cursor: pointer; gap: 8px; color: var(--muted); font-weight: 800; border: 2px dashed var(--border); background: var(--panel); text-align: center; padding: 20px; }
  .stage-empty input, .stage-swap input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .stage-plus { font-size: 2.6rem; color: var(--text); line-height: 1; }
  .stage-swap { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; font-weight: 800; cursor: pointer; }
  .ed-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .ed-strip::-webkit-scrollbar { display: none; }
  .ed-chip { flex: 0 0 auto; border: 2px solid var(--border); background: var(--panel); color: var(--text); border-radius: 12px; padding: 10px 14px; font: inherit; font-weight: 800; font-size: 0.88rem; cursor: pointer; }
  .ed-chip[aria-pressed="true"] { border-color: var(--cyan); background: rgba(51, 214, 203, 0.14); }
  .ed-trim { display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; }
  .ed-trim label { display: grid; gap: 4px; font-weight: 800; font-size: 0.88rem; }
  .ed-trim b { color: var(--cyan); font-variant-numeric: tabular-nums; }
  .ed-trim input[type="range"] { width: 100%; accent-color: var(--cyan); }
  .ed-text { display: grid; gap: 10px; }
  .ed-after { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ed-after #ed-undo { grid-column: 1 / -1; }
  .ed-after .go { font-size: 0.92rem; padding: 13px 8px; }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--panel); border-top: 1px solid var(--border);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
    padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tabbar-inner { max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; }
  .tab { background: none; border: none; color: var(--muted); font: inherit; font-size: 0.72rem; font-weight: 700; display: grid; justify-items: center; gap: 4px; cursor: pointer; padding: 2px 6px; }
  .tab .chip-ico { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; background: var(--panel-2); }
  .tab[aria-current="page"] { color: var(--text); }
  .tab[aria-current="page"] .chip-ico { background: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="pill-btn" id="back-btn" type="button" hidden>← Voltar</button>
    <h1><small>Máquina de Vendas <span class="cut-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/></svg>Cut Estúdio</span></small><span id="screen-title">Criar</span></h1>
    <button class="pill-btn saldo-pill" type="button" id="saldo-pill" hidden title="O que ainda resta no seu plano"></button>
    <a class="pill-btn" href="/" id="home-link">App</a>
    <button class="pill-btn more-btn" type="button" id="more-btn" aria-label="Minha conta" aria-haspopup="dialog">⋯</button>
  </header>
  <!-- Janela do usuário (⋯), igual à aba "Eu" do CapCut. -->
  <div class="sheet-bg" id="sheet-bg" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Minha conta" hidden>
    <div class="sheet-head"><div class="avatar" id="sh-avatar">👤</div><div><strong id="sh-name">Minha conta</strong><span id="sh-id"></span></div></div>
    <div class="sheet-plan" id="sh-plan"></div>
    <div class="sheet-row"><span>🌓 Tema</span><div class="seg" id="sh-tema"><button type="button" data-tema="escuro">Escuro</button><button type="button" data-tema="claro">Claro</button></div></div>
    <div class="sheet-row"><span>🌐 Idioma</span><b>Português (Brasil)</b></div>
    <a class="sheet-link" href="https://maquinadevendasonline.com.br/cut-estudio/" target="_blank" rel="noopener">📖 O que cada ferramenta faz</a>
    <a class="sheet-link" href="/recursos-disponiveis.html">✨ O que o meu plano tem</a>
    <a class="sheet-link" href="/">⚙️ Configurações do aplicativo</a>
    <a class="sheet-link" href="https://wa.me/5521999059608" target="_blank" rel="noopener">💬 Central de ajuda (WhatsApp)</a>
    <a class="sheet-link" href="/terms.html">📄 Termos de uso</a>
    <a class="sheet-link" href="/privacy.html">🔒 Política de privacidade</a>
    <button class="sheet-link sheet-out" type="button" id="sh-out">🚪 Sair</button>
  </div>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Abas do Estúdio">
  <div class="tabbar-inner">
    <button class="tab" type="button" data-tab="criar"><span class="chip-ico">✂️</span>Editar</button>
    <button class="tab" type="button" data-tab="modelos"><span class="chip-ico">✨</span>Modelos</button>
    <button class="tab" type="button" data-tab="lab"><span class="chip-ico">🧪</span>Lab. de IA</button>
    <button class="tab" type="button" data-tab="meus"><span class="chip-ico">📁</span>Projetos</button>
    <button class="tab" type="button" data-tab="postar"><span class="chip-ico">📤</span>Postar</button>
  </div>
</nav>

<script>
(function () {
  const HANDOFF_KEY = 'mvo_report_handoff';
  const MINE_KEY = 'mvo_estudio_pedidos';
  let session = null;
  try {
    session = JSON.parse(localStorage.getItem(HANDOFF_KEY) || localStorage.getItem('mvo_admin_session') || localStorage.getItem('mvo_session') || 'null');
  } catch (e) { session = null; }
  if (!session || !session.identifier) { window.location.href = '/'; return; }

  // Ferramentas. k: v = vídeo, i = imagem, a = IA. send = monta o pedido
  // (sem send = "em breve").
  // Estúdios no mesmo jeito do CapCut (Franklin, 2026-10-17: copiar ~80% do
  // CapCut). g = estúdio onde a ferramenta aparece em "Criar".
  const STUDIOS = [
    { id: 'design', label: '🎨 Estúdio de design' },
    { id: 'video', label: '🎬 Estúdio de vídeo' },
    { id: 'editor', label: '✂️ Editor de vídeo' },
    { id: 'voz', label: '🎙️ Estúdio de voz' },
    { id: 'imagem', label: '🖼️ Estúdio de imagem' },
    { id: 'lote', label: '📚 Edição em lote' }
  ];

  // Texto na foto: desenhado no próprio celular (canvas), sem servidor.
  async function applyText() {
    const txt = document.getElementById('tx-text').value.trim();
    if (!txt) throw new Error('Escreva o texto.');
    const pos = view.querySelector('[data-group="tx-pos"] [aria-pressed="true"]').dataset.value;
    const color = view.querySelector('[data-group="tx-color"] [aria-pressed="true"]').dataset.value;
    const box = view.querySelector('[data-group="tx-box"] [aria-pressed="true"]').dataset.value === '1';
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = URL.createObjectURL(workFile); });
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    const size = Math.round(c.width / 13);
    g.font = '900 ' + size + 'px system-ui, -apple-system, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = [];
    txt.split('\n').forEach((para) => {
      let line = '';
      para.split(' ').forEach((w) => { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > c.width * 0.86 && line) { lines.push(line); line = w; } else line = t; });
      lines.push(line);
    });
    const lh = size * 1.2;
    const blockH = lines.length * lh;
    const y0 = pos === 'top' ? c.height * 0.08 : pos === 'mid' ? (c.height - blockH) / 2 : c.height * 0.92 - blockH;
    if (box) {
      const wMax = Math.max(...lines.map((l) => g.measureText(l).width));
      g.fillStyle = color === '#111111' ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.55)';
      g.fillRect((c.width - wMax) / 2 - size * 0.5, y0 - size * 0.3, wMax + size, blockH + size * 0.6);
    }
    g.fillStyle = color;
    if (!box) { g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = size / 4; }
    lines.forEach((l, i) => g.fillText(l, c.width / 2, y0 + lh * i + lh / 2));
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.92));
    return new File([blob], 'texto-' + Date.now() + '.jpg', { type: 'image/jpeg' });
  }

  async function applyEdit(t) {
    const btn = document.getElementById('ed-apply');
    const msg = document.getElementById('send-msg');
    msg.innerHTML = '';
    btn.disabled = true;
    btn.textContent = isVid(workFile) ? '⏳ Editando o vídeo… (pode levar 1 minuto)' : '⏳ Editando…';
    try {
      let result;
      if (t.edit.ui === 'text') result = await applyText();
      else {
        const opts = {};
        if (t.edit.ui === 'trim') { opts.start = +document.getElementById('trim-start').value; opts.end = +document.getElementById('trim-end').value; }
        const chosen = view.querySelector('[data-group="eopt"] [aria-pressed="true"]');
        if (chosen) opts[t.edit.ui === 'music' ? 'musica' : t.edit.key] = chosen.dataset.value;
        const fd = new FormData();
        fd.append('identifier', session.identifier);
        fd.append('password', session.password);
        fd.append('tool', t.id);
        fd.append('options', JSON.stringify(opts));
        fd.append('files', workFile, workFile.name || 'arquivo');
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 290000);
        const res = await fetch('/api/estudio-edit', { method: 'POST', body: fd, signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) { let m = 'falha desconhecida'; try { m = (await res.json()).error || m; } catch (e) {} throw new Error(m); }
        const blob = await res.blob();
        result = new File([blob], res.headers.get('X-Result-Name') || ('editado-' + Date.now()), { type: blob.type });
      }
      setWork(result, false);
      document.getElementById('send-msg').innerHTML = '<div class="msg ok">✅ Pronto! Veja acima. Pode salvar, postar ou continuar editando.</div>';
    } catch (e) {
      const net = e instanceof TypeError || e.name === 'AbortError';
      msg.innerHTML = '<div class="msg err">' + esc(net ? 'A conexão caiu no meio. Tente num lugar com mais sinal ou wifi.' : e.message) + '</div>';
      btn.disabled = false;
      btn.textContent = '✨ Aplicar';
    }
  }

  function wireEdit(t) {
    const file = document.getElementById('ed-file');
    if (file) file.addEventListener('change', () => { if (file.files[0]) setWork(file.files[0], true); });
    const apply = document.getElementById('ed-apply');

      const au = document.getElementById('ed-audio');
      if (au && g.dataset.group === 'eopt') { au.src = '/audio/musicas/' + p.dataset.value; au.play().catch(() => {}); }
    }));
    const media = document.getElementById('ed-media');
    const s = document.getElementById('trim-start');
    if (media && s) {
      const en = document.getElementById('trim-end');
      const upd = (moved) => {
        if (+s.value > +en.value - 0.5) { if (moved === s) s.value = Math.max(0, +en.value - 0.5); else en.value = Math.min(+en.max, +s.value + 0.5); }
        document.getElementById('trim-a').textContent = fmtTime(+s.value);
        document.getElementById('trim-b').textContent = fmtTime(+en.value);
        const len = +en.value - +s.value;
        document.getElementById('trim-len').textContent = 'Vai ficar com ' + fmtTime(len) + (len > 90 ? ' — passa de 90 s, o fim será cortado em 90 s.' : '');
        if (moved) media.currentTime = +moved.value;
      };
      media.addEventListener('loadedmetadata', () => { s.max = en.max = media.duration.toFixed(1); en.value = media.duration.toFixed(1); upd(); });
      s.addEventListener('input', () => upd(s));
      en.addEventListener('input', () => upd(en));
    }
  }

    btn.disabled = !ok;
    document.getElementById('send-hint').textContent = ok ? 'Pronto! Toque no botão para criar.' : why;
    return top;

  function wire() {
    view.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => push({ type: 'tool', id: b.dataset.tool })));
    view.querySelectorAll('[data-goto]').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.goto)));
    view.querySelectorAll('[data-cat]').forEach((b) => b.addEventListener('click', () => { cat = b.dataset.cat; render(); }));
    view.querySelectorAll('[data-model]').forEach((b) => b.addEventListener('click', () => push({ type: 'modelo', n: +b.dataset.model })));
    view.querySelectorAll('.pills').forEach((g) => g.addEventListener('click', (e) => {

      g.querySelectorAll('.pill').forEach((x) => x.setAttribute('aria-pressed', x === p));
      checkReady();

    const desc = document.getElementById('desc-input');
    if (desc) desc.addEventListener('input', checkReady);

        const img = document.createElement('img'); img.alt = 'Sua foto'; img.src = URL.createObjectURL(f); thumbs.appendChild(img);
      });
      checkReady();
    });
    const send = document.getElementById('send-btn');
    if (send) send.addEventListener('click', sendPedido);
  }

  // Monta o pedido igual ao Postar: o texto vira o instrucoes.txt
  // ("Cliente: ..."), e o vídeo em movimento liga motionVideo+motionExtend
  // (regra: todo vídeo em movimento é o vídeo longo).
  async function sendPedido(opts) {
    const postWork = !!(opts && opts.postWork);
    const top = stack[stack.length - 1];
    const btn = document.getElementById(postWork ? 'ed-post' : 'send-btn');
    const msg = document.getElementById('send-msg');
    let text, motion = false, isVideo = false, title;
    const goalEl = pressed('goal');
    const goalText = goalEl ? GOALS[+goalEl.dataset.goal].text : '';
    if (postWork) {
      // Editado no Estúdio: vai pra aprovação do jeito que está, só com legenda.
      text = 'Publique este ' + (isVid(workFile) ? 'vídeo' : 'foto') + ' exatamente como está (já editado no Cut Estúdio), sem criar banner, vídeo nem narração novos. Só escreva a legenda de cada rede.';
      isVideo = isVid(workFile);
      title = '✂️ Editado no Estúdio';
      pickedFiles = [workFile];
    } else if (!top) {
      // Lab. de IA: a ideia do cliente vai como está. Sem movimento (regra:
      // vídeo em movimento só pelo botão/modelo de movimento).
      text = document.getElementById('desc-input').value.trim();
      title = '🧪 ' + (text.length > 40 ? text.slice(0, 40) + '…' : text);
    } else if (top.type === 'modelo') {
      const c = CATS.find((x) => x.id === cat);
      const m = c.models[top.n];
      motion = !!c.motion; isVideo = true; title = '🎬 ' + m.name;
      text = c.motion
        ? 'Quero um vídeo com o efeito "' + m.name + '". Movimento do vídeo: ' + m.move + '. O produto da foto continua exatamente igual, sem mudar formato, cor nem letras. ' + goalText
        : 'Faça um vídeo com as fotos que anexei (sem vídeo em movimento), efeito "' + m.name + '": ' + m.move + '. ' + goalText;
    } else {
      const t = TOOLS.find((x) => x.id === top.id);
      const opt = (pressed('opt') || {}).dataset ? pressed('opt').dataset.value : t.opts[0];
      const descEl = document.getElementById('desc-input');
      const built = t.send(opt, descEl ? descEl.value.trim() : '');
      text = built.text + (goalText ? ' ' + goalText : '');
      motion = !!built.motion; isVideo = !!(t.video || built.reels); title = t.ico + ' ' + t.name;
    }

    btn.disabled = true;
    btn.textContent = 'Enviando...';
    msg.innerHTML = '';
    const fd = new FormData();
    fd.append('identifier', session.identifier);
    fd.append('password', session.password);
    fd.append('instruction', 'Cliente: ' + text);
    if (motion) { fd.append('motionVideo', 'true'); fd.append('motionExtend', 'true'); }
    if (isVideo) fd.append('format', JSON.stringify(['reels']));
    pickedFiles.forEach((f) => fd.append('files', f, f.name));
    fd.append('requestId', (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2)));
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 180000);
      const res = await fetch('/api/commit', { method: 'POST', body: fd, signal: ctrl.signal });
      clearTimeout(timer);
      const result = await res.json();
      if (!(res.ok || res.status === 207)) throw new Error(result.error || 'falha desconhecida');
      const pasta = String(result.subfolder || '').split('/').pop();
      const list = loadMine();
      list.unshift({ client: result.client, pasta, title, at: Date.now(), status: 'wait' });
      saveMine(list);
      msg.innerHTML = '<div class="msg ok">✅ Pedido enviado! Está sendo criado e aparece em "Meus" pra você aprovar.</div>';
      setTimeout(() => setTab('meus'), 1500);
    } catch (e) {
      const net = e instanceof TypeError || e.name === 'AbortError';
      msg.innerHTML = '<div class="msg err">' + esc(net ? 'A conexão caiu no meio do envio. Tente num lugar com mais sinal ou wifi.' : 'Não deu pra enviar: ' + e.message) + '</div>';
      btn.disabled = false;
      btn.textContent = postWork ? '📤 Postar' : 'Tentar de novo';
    }
  }

  // Atualiza o status de cada pedido do Estúdio olhando a pasta dele.
  async function refreshMine() {
    const list = loadMine();
    let changed = false;
    await Promise.all(list.map(async (p, i) => {
      if (p.status === 'done' || p.status === 'fail') return;
      try {
        const res = await fetch('/api/pedido-folder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ client: p.client, pasta: p.pasta }) });
        const r = await res.json();
        let st = 'wait';
        const rev = r.revisao || [];
        if (rev.some((e) => String(e.name).toUpperCase() === 'APROVADO.TXT')) st = 'done';
        else if (rev.some((e) => e.type === 'file' && /\.(jpe?g|png|webp|mp4|mov)$/i.test(e.name))) st = 'ready';
        else {
          const gs = (r.root || []).find((e) => e.name === 'geracao-status.json');
          if (gs && gs.download_url) {
            try { const s = await (await fetch(gs.download_url)).json(); if (/failed/.test(String(s.status || ''))) st = 'fail'; } catch (e) {}
          }
        }
        if (st !== p.status) { list[i].status = st; changed = true; }
      } catch (e) {}
    }));
    if (changed) saveMine(list);
    if (tab === 'meus' && !stack.length) {
      view.querySelectorAll('.mine-item').forEach((el) => { const p = list[+el.dataset.idx]; if (p) el.querySelector('.st').innerHTML = statusHtml(p.status); });
      if (list.some((p) => p.status === 'wait')) { clearTimeout(refreshMine.t); refreshMine.t = setTimeout(refreshMine, 15000); }
    }
  }

  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  // Atalhos vindos dos botões da área "Máquina de Vendas Estúdio" do app:
  // #meus, #criar, #modelos, #modelos-<categoria>, #tool-<ferramenta>.
  const hash = location.hash.replace('#', '');
  if (hash.startsWith('modelos')) {
    const c = hash.split('-')[1];
    if (CATS.some((x) => x.id === c)) cat = c;
    setTab('modelos');
  } else if (hash.startsWith('tool-') && TOOLS.some((t) => t.id === hash.slice(5))) {
    setTab('criar');
    push({ type: 'tool', id: hash.slice(5) });
  } else {
    setTab(hash === 'meus' || hash === 'lab' ? hash : 'criar');
  }
  loadSaldo();
})();
</script>
