  const AUTOS = window.PEDIDOS_AUTOMATICOS || [];
  function renderAutomaticos() {
    return '<p class="note">Não precisa escrever nada: escolha o que você tem, anexe e o app cria tudo sozinho. Tudo vai pros seus 📁 Minhas criações pra você ver e aprovar antes de postar.</p><div class="pronto-list">' +
      AUTOS.map((a, i) => '<button class="pronto-item" type="button" data-auto="' + i + '"><strong>' + esc(a.when) + '</strong><span>' + esc(a.steps[a.id ? 1 : 0] || '') + '</span></button>').join('') + '</div>';
  }
  function needText(n) {
    const p = [];
    if (n.vid[1]) p.push(n.vid[0] === n.vid[1] ? n.vid[0] + ' vídeo' : n.vid[0] + ' a ' + n.vid[1] + ' vídeos');
    if (n.img[1]) p.push(n.img[0] === n.img[1] ? n.img[0] + (n.img[0] > 1 ? ' fotos' : ' foto') : n.img[0] + ' a ' + n.img[1] + ' fotos');
    return p.join(' + ');
  }
  function renderAuto(i) {
    const a = AUTOS[i];
    titleEl.textContent = 'Pedido automático';
    const accept = a.need.vid[1] && a.need.img[1] ? 'image/*,video/*' : a.need.vid[1] ? 'video/*' : 'image/*';
    return '<div class="screen detail">' +
      '<h2 class="section-title" style="margin:0">' + esc(a.when) + '</h2>' +
      '<div class="step"><h3><span>✦</span>O que o app faz sozinho</h3><ol class="auto-steps">' + a.steps.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ol>' +
        '<p class="hint">Aqui no Cut Studio Pro nada é postado direto: tudo vai pros seus 📁 Minhas criações e você escolhe as redes na hora, em 📤 Postar.</p></div>' +
      '<div class="step"><h3><span>1</span>Anexe ' + needText(a.need) + '</h3>' + uploadBox(a.need.img[1] + a.need.vid[1] > 1, accept).replace(/📎 Toque para escolher [^<]*/, '📎 Toque para escolher ' + needText(a.need)) + '</div>' +
      (a.need.vid[1] ? '<label class="voice-row"><input type="checkbox" id="auto-video-voice"><span><strong>🎙️ Usar a voz do meu vídeo como narração</strong> — a sua voz original vira a narração do vídeo que o app monta, sem voz de IA (até 90 s).</span></label>' : '') +
      '<div id="send-msg"></div>' +
      '<button class="go" type="button" id="send-btn" disabled>⚡ Criar automático</button>' +
      '<p class="hint" id="send-hint">Anexe ' + needText(a.need) + '.</p>' +
    '</div>';
  }

  // 🎬 Vídeo promocional em movimento (o botão da antiga tela de postagem,
  // Franklin 2026-10-02/07, trazido pro Cut Studio Pro em 2026-10-19).
  // Vídeo longo: abre com movimento real (Veo) e continua com o material do
  // cliente, com narração e música, até 90 s. Usa 1 vídeo em movimento.
  function nichoDoCliente() {
    const c = String(session.client || '');
    if (c === 'frank') return 'agencia';
    if (c === 'kleber-construcao') return 'construcao';
    if (/-rjinox$/.test(c)) return 'inox';
    return 'geral';
  }
  const EF_EMPRESA = (window.EFEITOS_POR_NICHO || {})[nichoDoCliente()] || [];
  const EF_PRODUTO = window.EFEITOS_PRODUTO || [];
  function renderPromo() {
    titleEl.textContent = 'Vídeo em movimento';
    const card = (tip, key) => '<button class="pronto-item" type="button" data-efeito="' + key + '"><strong>' + esc(tip.when) + '</strong><span>📷 ' + esc(tip.foto) + '</span></button>';
    return '<div class="screen detail">' +
      '<h2 class="section-title" style="margin:0">🎬 Vídeo em movimento</h2>' +
      '<p><strong>Vídeo longo com efeitos, até 90 s.</strong> Abre com um efeito em movimento real e continua com o material que você anexar (fotos, banners e vídeos), com zoom e transições, trocando a cada 8 segundos. A narração vai do começo ao fim: <strong>acabou a narração, acabou o vídeo</strong>. Se faltar material, a IA cria banners. Usa 1 vídeo em movimento do seu plano.</p>' +
      '<div class="step"><h3><span>1</span>Escolha o efeito ou escreva o movimento</h3>' +
        (EF_EMPRESA.length ? '<p class="ed-label">⭐ Efeitos da sua empresa</p><div class="pronto-list">' + EF_EMPRESA.map((t, i) => card(t, 'n' + i)).join('') + '</div>' : '') +
        '<p class="ed-label">🎬 Efeitos de produto</p><div class="pronto-list">' + EF_PRODUTO.map((t, i) => card(t, 'p' + i)).join('') + '</div>' +
        '<p class="ed-label">✍️ O movimento <small>(escolha acima ou escreva o seu)</small></p><textarea class="input" id="desc-input" rows="4" placeholder="Ex.: areia caindo do caminhão, câmera chegando perto do produto"></textarea></div>' +
      '<div class="step"><h3><span>2</span>Anexe suas fotos ou vídeos <small>(opcional)</small></h3>' + uploadBox(true, 'image/*,video/*').replace('as fotos (até 5)', 'fotos ou vídeos (até 5)') +
        '<p class="hint" id="promo-foto-hint">A 1ª foto é a base do movimento. Sem foto, a IA cria a imagem.</p></div>' +
      '<div class="step"><h3><span>3</span>Narração</h3>' +
        '<textarea class="input" id="promo-narr" rows="3" placeholder="Escreva o que a voz vai falar (opcional). Deixe em branco e a IA escreve."></textarea>' +
        '<label class="voice-row"><input type="checkbox" id="promo-video-voice"><span><strong>🎙️ Usar a voz do meu vídeo como narração</strong> — anexe o vídeo em que você fala: a sua voz vira a narração, sem voz de IA (até 90 s).</span></label>' +
        audioBox({ voz: { group: 'pv-voz', sel: '', allowNone: true }, mus: { group: 'pv-mus', sel: '', allowNone: true }, hint: 'Toque em ▶ pra ouvir. Não quer escolher? A voz sai do mesmo tipo da sua e a música é sorteada.' }) +
      '</div>' +
      '<div id="send-msg"></div>' +
      '<button class="go" type="button" id="send-btn" disabled>🎬 Criar vídeo em movimento</button>' +
      '<p class="hint" id="send-hint">Escolha um efeito ou escreva o movimento.</p>' +
    '</div>';
  }

  function renderModelos() {
    titleEl.textContent = 'Modelos';
    const chipsHtml = '<div class="chips"><button class="chip" type="button" data-cat="prontos" aria-pressed="' + (cat === 'prontos') + '">📝 Pedidos prontos</button><button class="chip" type="button" data-cat="automaticos" aria-pressed="' + (cat === 'automaticos') + '">⚡ Pedidos automáticos</button>' +
      CATS.map((x) => '<button class="chip" type="button" data-cat="' + x.id + '" aria-pressed="' + (x.id === cat) + '">' + esc(x.label) + '</button>').join('') + '</div>';
    if (cat === 'automaticos') return '<div class="screen">' + chipsHtml + renderAutomaticos() + '</div>';
    if (cat === 'prontos') return '<div class="screen">' + chipsHtml + renderProntos() + '</div>';
    const c = CATS.find((x) => x.id === cat);
    return '<div class="screen">' + chipsHtml +
      '<p class="note">' + esc(c.note) + '</p>' +
      '<div class="models">' + c.models.map((m, n) =>
        '<button class="model" type="button" data-model="' + n + '">' +
          '<div class="preview ' + m.fx + '" style="background:' + m.bg + '"><span class="badge' + (c.motion ? '' : ' simple') + '">' + (c.motion ? 'IA' : 'SEM MOVIMENTO IA') + '</span><span class="obj">' + m.obj + '</span></div>' +
          '<span class="model-name">' + esc(m.name) + '</span><span class="model-sub">' + esc(m.sub) + '</span>' +
        '</button>').join('') + '</div>' +
    '</div>';
  }

  function renderModelo(n) {
    const c = CATS.find((x) => x.id === cat);
    const m = c.models[n];
    titleEl.textContent = m.name;
    return '<div class="screen detail">' +
      '<div class="preview ' + m.fx + '" style="background:' + m.bg + '"><span class="badge' + (c.motion ? '' : ' simple') + '">' + (c.motion ? 'IA' : 'SEM MOVIMENTO IA') + '</span><span class="obj">' + m.obj + '</span></div>' +
      '<p>' + esc(m.sub) + '. ' + (c.motion ? 'Usa 1 vídeo em movimento do seu plano.' : 'Conta como 1 vídeo comum do plano.') + '</p>' +
      '<div class="step"><h3><span>1</span>Envie ' + (c.multi ? 'as fotos' : 'a foto do seu produto') + '</h3>' + uploadBox(!!c.multi, 'image/*') + '</div>' +
      '<div class="step"><h3><span>2</span>Pra que é esse vídeo?</h3><div class="pills" data-group="goal">' + GOALS.map((g, i) => '<button class="pill" type="button" aria-pressed="false" data-goal="' + i + '">' + g.label + '</button>').join('') + '</div></div>' +
      '<div id="send-msg"></div>' +
      '<button class="go" type="button" id="send-btn" disabled>Criar meu vídeo</button>' +
      '<p class="hint" id="send-hint">Envie a foto e escolha pra que é o vídeo.</p>' +
    '</div>';
  }

  // ===== Projetos e Postar (Franklin, 2026-10-19: criação separada da
  // postagem). Tudo o que é criado aqui vira projeto no servidor
  // (/api/projetos). Aprovar só guarda; a aba Postar busca o projeto pronto e
  // só escolhe as redes.
  let projetos = null;
  let projErro = '';
  async function api(action, extra) {
    const res = await fetch('/api/projetos', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ identifier: session.identifier, password: session.password, action }, extra || {})) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'falha desconhecida');
    return data;
  }
  async function loadProjetos() {
    try { projetos = (await api('lista')).projetos || []; projErro = ''; }
    catch (e) { projErro = e.message; if (!projetos) projetos = []; }
    if (!stack.length && (tab === 'meus' || tab === 'postar')) render();
    clearTimeout(loadProjetos.t);
    if ((projetos || []).some((p) => p.status === 'criando' || p.postando) && (tab === 'meus' || tab === 'postar')) loadProjetos.t = setTimeout(loadProjetos, 6000);
  }

  function statusHtml(p) {
    if (p.postando) return '<span class="status wait">📤 Postando nas redes…</span>';
    if (p.status === 'postado') return '<span class="status done">📤 Postado ' + new Date(p.postadoEm || p.at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</span>' +
      (p.resultado && p.resultado.length ? '<div class="hint" style="margin:4px 0 0">' + resultadoResumo(p.resultado) + '</div>' : '');
    if (p.status === 'pronto') return '<span class="status done">✅ Pronto pra postar</span>';
    if (p.status === 'aprovar') return '<span class="status ready">🔔 Pronto pra você ver e aprovar</span>';
    if (p.status === 'falhou') return '<span class="status fail">❌ Não deu certo — crie de novo</span>';
    // Criando: barra com a porcentagem e a etapa (Franklin, 2026-10-20).
    const pr = p.progresso || { percent: 3, label: '⏳ Na fila, já vai começar' };
    return '<span class="status wait">⏳ Criando… ' + pr.percent + '%</span>' +
      '<div style="height:10px;border-radius:6px;background:rgba(127,127,127,0.25);overflow:hidden;margin:6px 0 4px"><div style="height:100%;width:' + pr.percent + '%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .8s"></div></div>' +
      '<div class="hint" style="margin:0">' + esc(pr.label) + '</div>';
  }
  // Minhas criações ficam 30 dias (lib/projetos.js apaga as vencidas).
  const AVISO_30 = '<div class="msg" style="border:1px solid var(--gold);background:rgba(255,196,0,0.10)">⏳ As criações ficam guardadas por <strong>30 dias</strong> e depois são apagadas sozinhas. O que já foi postado continua nas redes. Quer guardar? Salve no celular antes.</div>';
  function venceHtml(p) {
    const dias = Math.ceil((p.at + 30 * 86400000 - Date.now()) / 86400000);
    return '<div class="hint" style="margin-top:2px">' + (dias <= 3 ? '⚠️ ' : '🗓️ ') + (dias <= 1 ? 'Apaga amanhã' : 'Fica guardada mais ' + dias + ' dias') + '</div>';
  }
  function dayLabel(at) {
    const d = new Date(at); const hoje = new Date();
    const ontem = new Date(); ontem.setDate(hoje.getDate() - 1);
    if (d.toDateString() === hoje.toDateString()) return 'Criações de hoje';
    if (d.toDateString() === ontem.toDateString()) return 'Ontem';
    return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' });
  }
  function thumbHtml(p) {
    if (!p.thumb) return '<span class="proj-thumb">' + (p.video ? '🎬' : '🖼️') + '</span>';
    return '<span class="proj-thumb">' + (p.video ? '<video src="' + esc(p.thumb) + '#t=0.5" muted preload="metadata" playsinline></video>' : '<img src="' + esc(p.thumb) + '" alt="" loading="lazy">') + '</span>';
  }
  function byDay(list, itemHtml) {
    let last = '';
    return list.map((p) => { const d = dayLabel(p.at); const h = d !== last ? '<p class="day-title">' + esc(d) + '</p>' : ''; last = d; return h + itemHtml(p); }).join('');
  }

  // Projetos (igual ao CapCut): Todos · Vídeos · Fotos · Lixeira, separados por dia.
  let projFiltro = 'todos';
  const PROJ_FILTROS = [['todos', 'Todos'], ['video', '🎬 Vídeos'], ['foto', '🖼️ Fotos'], ['lixeira', '🗑️ Lixeira']];
  function renderMeus() {
    titleEl.textContent = 'Minhas criações';
    if (projetos === null) return '<div class="screen"><div class="empty"><p>⏳ Carregando suas criações…</p></div></div>';
    const all = projetos;
    if (!all.length) {
      return '<div class="screen">' + (projErro ? '<div class="msg err">' + esc(projErro) + '</div>' : '') +
        '<div class="empty"><div style="font-size:2.2rem">📁</div><p>Aqui fica tudo o que você criar no Cut Studio Pro. Depois é só ir em 📤 Postar e escolher.</p></div>' + AVISO_30 +
        '<button class="go" type="button" data-goto="criar">✂️ Criar meu primeiro conteúdo</button></div>';
    }
    const chips = '<div class="chips">' + PROJ_FILTROS.map((f) => '<button class="chip" type="button" data-proj="' + f[0] + '" aria-pressed="' + (f[0] === projFiltro) + '">' + f[1] + '</button>').join('') + '</div>';
    const shown = all.filter((p) => projFiltro === 'lixeira' ? p.trash : !p.trash && (projFiltro === 'todos' || (projFiltro === 'video') === !!p.video));
    return '<div class="screen">' + chips +
      '<p class="note">' + (projFiltro === 'lixeira' ? 'Criações tiradas da lista. Restaure se quiser usar de novo.' : 'Aprovar guarda o conteúdo aqui, sem publicar. Para publicar, vá em 📤 Postar e escolha a criação.') + '</p>' + (projFiltro === 'lixeira' ? '' : AVISO_30) +
      (shown.length ? '<div class="mine-list">' + byDay(shown, (p) => '<div class="mine-item"><div class="proj-row">' + thumbHtml(p) +
        '<div><div class="top"><strong>' + esc(p.titulo || 'Criação') + '</strong><time>' + new Date(p.at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '</time></div>' +
        '<div class="st">' + statusHtml(p) + '</div>' + venceHtml(p) + historicoHtml(p) +
        '<div class="mine-actions">' +
          (p.status === 'aprovar' ? '<a href="/aprovacao.html?client=' + encodeURIComponent(p.client) + '&pasta=' + encodeURIComponent(p.pasta) + '">Ver e aprovar →</a>' : '') +
          (p.status === 'pronto' || p.status === 'postado' ? '<a href="#" data-editcri="' + esc(p.pasta) + '">✏️ Ver e editar</a><a href="#" data-postar="' + esc(p.pasta) + '">📤 ' + (p.status === 'postado' ? 'Postar de novo' : 'Postar') + ' →</a>' : '') +
          '<button type="button" data-lixo="' + esc(p.pasta) + '" data-on="' + (p.trash ? '0' : '1') + '">' + (p.trash ? '↩️ Restaurar' : '🗑️') + '</button>' +
        '</div></div></div></div>') + '</div>'
        : '<div class="empty"><p>Nada aqui.</p></div>') +
      '</div>';
  }
  function wireMeus() {
    view.querySelectorAll('[data-proj]').forEach((b) => b.addEventListener('click', () => { projFiltro = b.dataset.proj; render(); }));
    view.querySelectorAll('[data-lixo]').forEach((b) => b.addEventListener('click', async () => {
      const p = projetos.find((x) => x.pasta === b.dataset.lixo); if (!p) return;
      p.trash = b.dataset.on === '1'; render();
      try { await api('lixeira', { pasta: p.pasta, trash: p.trash }); } catch (e) {}
    }));
    view.querySelectorAll('[data-postar]').forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); pickProjeto(b.dataset.postar); }));
    view.querySelectorAll('[data-editcri]').forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); abrirEditCri(b.dataset.editcri); }));
  }

  // ===== Postar: 1) buscar o projeto pronto; 2) escolher o que vai, as redes,
  // os formatos e o texto de cada rede; 3) publicar.
  const REDE_ICO = { facebook: '📘 Facebook', instagram: '📸 Instagram', youtube: '▶️ YouTube', telegram: '✈️ Telegram', tiktok: '🎵 TikTok',
    'facebook-stories': '📘 Stories do Facebook', 'instagram-stories': '📸 Stories do Instagram', 'tiktok-postiz': '🎵 TikTok',
    'facebook-postiz': '📘 Facebook', 'instagram-postiz': '📸 Instagram' };
  // Onde a criação saiu de verdade (Franklin, 2026-10-20: "Postado" sem dizer
  // onde enganava quando só os Stories tinham sido marcados).
  // Histórico da criação (Franklin, 2026-10-20): pedido, criação, aprovação
  // e cada postagem com onde saiu e onde não saiu. Criações antigas (sem
  // histórico gravado) montam o que dá a partir dos campos que já existiam.
  const FMT_NOME = { post: 'Post', reels: 'Reels', carrossel: 'Carrossel', stories: 'Stories' };
  // A lista se redesenha a cada 6 s enquanto cria: lembra quais estão abertos.
  const histAbertos = new Set();
  document.addEventListener('toggle', (e) => {
    const d = e.target;
    if (!d || !d.dataset || !d.dataset.hist) return;
    if (d.open) histAbertos.add(d.dataset.hist); else histAbertos.delete(d.dataset.hist);
  }, true);
  function eventosDe(p) {
    const ev = Array.isArray(p.historico) ? p.historico.slice() : [];
    if (!ev.length) {
      ev.push({ at: p.at, texto: '📝 Pedido feito: ' + (p.titulo || 'Criação') });
      if (p.postadoEm) ev.push({ at: p.postadoEm, tipo: 'postagem', resultado: p.resultado || [] });
    }
    return ev;
  }
  const quando = (t) => new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  // Já postado? (Franklin, 2026-10-20) Dentro de 30 dias, avisa se a criação
  // já saiu numa das redes/formatos marcados agora — pode postar de novo,
  // mas só depois de confirmar. Passou de 30 dias, não avisa mais.
  const canal = (c) => String(c || '').replace(/-postiz$/, '');
  function canaisMarcados() {
    const out = new Set();
    const plats = [...new Set((post.redes || []).filter((r) => post.redesSel.includes(redeKey(r))).map((r) => r.platform))];
    const feed = post.formats.some((f) => f !== 'stories');
    plats.forEach((pl) => {
      if (pl === 'facebook' || pl === 'instagram') {
        if (feed) out.add(pl);
        if (post.formats.includes('stories')) out.add(pl + '-stories');
      } else out.add(pl);
    });
    return out;
  }
  function jaPostado(p) {
    const limite = Date.now() - 30 * 86400000;
    const marcados = canaisMarcados();
    const achados = [];
    eventosDe(p).filter((e) => e.tipo === 'postagem' && e.at >= limite).forEach((e) => {
      (e.resultado || []).filter((r) => r.status === 'ok' && marcados.has(canal(r.channel))).forEach((r) => {
        const nome = REDE_ICO[r.channel] || r.channel;
        if (!achados.some((a) => a.nome === nome && a.at === e.at)) achados.push({ nome, at: e.at });
      });
    });
    return achados;
  }
  function historicoHtml(p) {
    const ev = eventosDe(p);
    const linhas = ev.slice().reverse().map((e) => {
      let corpo;
      if (e.tipo === 'postagem') {
        const fmts = (e.formatos || []).map((f) => FMT_NOME[f] || f).join(', ');
        const res = (e.resultado || []).map((r) => (r.status === 'ok' ? '✔️ ' : '❌ ') + esc(REDE_ICO[r.channel] || r.channel) + (r.status === 'ok' ? '' : ' — ' + esc(r.error || 'não saiu'))).join('<br>');
        corpo = '📤 <strong>Postagem</strong>' + (fmts ? ' — formato: ' + esc(fmts) : '') + (e.itens ? ' (' + e.itens + ' ' + (e.itens === 1 ? 'arquivo' : 'arquivos') + ')' : '') +
          (e.erro ? '<br>❌ ' + esc(e.erro) : '') + (res ? '<br>' + res : '');
      } else corpo = esc(e.texto || '');
      return '<li style="margin:0 0 8px"><small style="color:var(--muted)">' + quando(e.at) + '</small><br>' + corpo + '</li>';
    }).join('');
    return '<details class="hist" data-hist="' + esc(p.pasta) + '"' + (histAbertos.has(p.pasta) ? ' open' : '') + ' style="margin-top:6px"><summary style="cursor:pointer;font-weight:700">📜 Histórico (' + ev.length + ')</summary>' +
      '<ul style="list-style:none;padding:8px 0 0;margin:0;font-size:0.88rem">' + linhas + '</ul></details>';
  }
  function chkHtml(attr, on, label) {
    return '<button class="chip chk" type="button" ' + attr + ' aria-pressed="' + on + '"><span class="cbx">' + (on ? '✓' : '') + '</span>' + label + '</button>';
  }
  function resultadoResumo(list) {
    const by = {};
    (list || []).forEach((r) => { const k = REDE_ICO[r.channel] || r.channel; by[k] = by[k] || { ok: 0, erro: 0 }; by[k][r.status === 'ok' ? 'ok' : 'erro'] += 1; });
    return Object.entries(by).map(([k, c]) => (c.ok ? '✔️ ' : '❌ ') + esc(k)).join(' · ');
  }
  const FORMATOS = [['post', '🖼️ Post'], ['reels', '🎬 Reels'], ['carrossel', '🔄 Carrossel'], ['stories', '⏱️ Stories']];
  const post = { pasta: null, busca: '', itens: null, sel: [], redes: null, redesSel: [], formats: ['post', 'reels', 'carrossel', 'stories'], legendas: {}, legenda: '', enviando: false, resultado: null, erro: '' };
  const redeKey = (r) => r.platform + (r.viaPostiz ? ':p' : '');

  async function pickProjeto(pasta) {
    Object.assign(post, { pasta, itens: null, sel: [], legendas: {}, legenda: '', resultado: null, erro: '', enviando: false });
    setTab('postar');
    try {
      const [it, rd] = await Promise.all([api('itens', { pasta }), post.redes ? Promise.resolve({ redes: post.redes }) : api('redes')]);
      post.itens = it.itens || [];
      post.sel = post.itens.map((i) => i.name);
      post.legendas = it.legendas || {};
      post.legenda = it.legenda || '';
      post.redes = rd.redes || [];
      if (!post.redesSel.length) post.redesSel = post.redes.map(redeKey);
    } catch (e) { post.erro = e.message; post.itens = []; }
    if (tab === 'postar') render();
  }

  function renderPostar() {
    titleEl.textContent = 'Postar';
    if (!post.pasta) {
      if (projetos === null) return '<div class="screen"><div class="empty"><p>⏳ Carregando suas criações…</p></div></div>';
      const prontos = projetos.filter((p) => !p.trash && (p.status === 'pronto' || p.status === 'postado'));
      const q = post.busca.trim().toLowerCase();
      const achados = q ? prontos.filter((p) => String(p.titulo || '').toLowerCase().includes(q)) : prontos;
      const esperando = projetos.filter((p) => !p.trash && (p.status === 'criando' || p.status === 'aprovar')).length;
      return '<div class="screen">' +
        '<h2 class="section-title">📁 Escolha o conteúdo pronto</h2>' +
        '<p class="note">Aqui você só posta. Criar, editar, narração e música ficam no ✂️ Ferramentas; depois de aprovar, o conteúdo aparece aqui. As criações ficam guardadas por 30 dias.</p>' +
        (prontos.length > 4 ? '<input class="input" id="post-busca" placeholder="🔎 Buscar criação pelo nome" value="' + esc(post.busca) + '">' : '') +
        (esperando ? '<p class="hint">' + esperando + ' criação(ões) ainda sendo feita(s) ou esperando você aprovar — veja em <a href="#" data-goto="meus">📁 Minhas criações</a>.</p>' : '') +
        (achados.length ? '<div class="mine-list">' + byDay(achados, (p) => '<button class="mine-item" type="button" data-pick="' + esc(p.pasta) + '"><div class="proj-row">' + thumbHtml(p) +
          '<div><div class="top"><strong>' + esc(p.titulo || 'Criação') + '</strong><time>' + new Date(p.at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '</time></div><div class="st">' + statusHtml(p) + '</div></div></div></button>') + '</div>'
          : '<div class="empty"><div style="font-size:2.2rem">📭</div><p>' + (q ? 'Nenhuma criação com esse nome.' : 'Nenhum conteúdo pronto ainda. Crie no ✂️ Ferramentas e aprove em 📁 Minhas criações.') + '</p></div>') +
        '</div>';
    }
    const p = (projetos || []).find((x) => x.pasta === post.pasta) || {};
    if (post.itens === null) return '<div class="screen"><div class="empty"><p>⏳ Abrindo a criação…</p></div></div>';
    if (post.resultado) {
      const linhas = post.resultado.map((r) => (r.status === 'ok' ? '✔️ ' : '❌ ') + (REDE_ICO[r.channel] || r.channel) + (r.status === 'ok' ? '' : ' — ' + esc(String(r.error || 'não publicou').slice(0, 140)))).join('<br>');
      return '<div class="screen"><div class="msg ok">📤 Postagem feita!</div><p>' + (linhas || 'Nenhuma rede respondeu.') + '</p>' +
        '<button class="go" type="button" id="post-outro">📁 Postar outra criação</button></div>';
    }
    const itens = post.itens.map((i) => '<button class="post-item" type="button" data-item="' + esc(i.name) + '" aria-pressed="' + post.sel.includes(i.name) + '">' +
      (i.video ? '<video src="' + esc(i.url) + '#t=0.5" muted preload="metadata" playsinline></video>' : '<img src="' + esc(i.url) + '" alt="" loading="lazy">') + '<span class="tick">✓</span></button>').join('');
    const redes = (post.redes || []).length
      ? '<div class="chips">' + post.redes.map((r) => chkHtml('data-rede="' + redeKey(r) + '"', post.redesSel.includes(redeKey(r)), REDE_ICO[r.platform] || r.platform)).join('') + '</div>'
      : '<div class="msg err">Nenhuma rede social conectada. Conecte em Redes no aplicativo.</div>';
    const formatos = '<div class="chips">' + FORMATOS.map((f) => chkHtml('data-fmt="' + f[0] + '"', post.formats.includes(f[0]), f[1])).join('') + '</div>';
    const redesTexto = [...new Set((post.redes || []).filter((r) => post.redesSel.includes(redeKey(r))).map((r) => r.platform))];
    const textos = redesTexto.map((net) => '<details><summary>' + (REDE_ICO[net] || net) + '</summary><textarea class="input" data-texto="' + net + '">' + esc(post.legendas[net] || post.legenda || '') + '</textarea></details>').join('');
    return '<div class="screen">' +
      '<div class="top" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 class="section-title" style="margin:0">' + esc(p.titulo || 'Criação') + '</h2><span style="display:flex;gap:6px"><button class="chip" type="button" id="post-editar">✏️ Editar</button><button class="chip" type="button" id="post-trocar">🔁 Trocar</button></span></div>' +
      (post.erro ? '<div class="msg err">' + esc(post.erro) + '</div>' : '') +
      (p.pasta ? historicoHtml(p) : '') +
      '<p class="ed-label">O que vai ser postado <small>(toque pra tirar)</small></p><div class="post-items">' + (itens || '<p class="hint">Essa criação ficou sem fotos e vídeos.</p>') + '</div>' +
      '<p class="ed-label">Redes sociais</p>' + redes +
      '<p class="ed-label">Formato <small>(✓ marcado = vai publicar; toque pra marcar ou desmarcar)</small></p>' + formatos +
      (post.formats.length && !post.formats.includes('post') && !post.formats.includes('reels')
        ? '<div class="msg err">⚠️ Post e Reels estão desmarcados: a criação não vai aparecer no feed' + (post.formats.includes('stories') ? ', só nos Stories, que somem em 24 horas' : '') + '. Toque em 🖼️ Post ou 🎬 Reels pra marcar.</div>' : '') +
      (post.sel.filter((n) => (post.itens || []).some((i) => i.name === n && i.video)).length > 1
        ? '<p class="hint">🎬 ' + post.sel.filter((n) => (post.itens || []).some((i) => i.name === n && i.video)).length + ' vídeos marcados: cada um sai como uma postagem separada. Toque no vídeo que não quiser pra tirar.</p>' : '') +
      (textos ? '<p class="ed-label">Texto de cada rede <small>(toque pra ver ou mudar)</small></p><div class="post-texts" style="display:grid;gap:8px">' + textos + '</div>' : '') +
      (() => {
        const ja = p.pasta ? jaPostado(p) : [];
        return ja.length ? '<div class="msg err">⚠️ <strong>Essa postagem já foi postada</strong> nos últimos 30 dias:<br>' +
          ja.map((a) => '✔️ ' + esc(a.nome) + ' — ' + quando(a.at)).join('<br>') +
          '<br>Se postar de novo, ela sai repetida nesses lugares. Pra postar só onde ainda não saiu, desmarque esses.</div>' : '';
      })() +
      '<div id="send-msg"></div>' +
      '<button class="go" type="button" id="post-go"' + (post.enviando || !post.sel.length || !post.redesSel.length || !post.formats.length ? ' disabled' : '') + '>' + (post.enviando ? '⏳ Postando… (pode levar 1 a 2 minutos)' : '📤 Publicar agora') + '</button>' +
      '</div>';
  }

  function wirePostar() {
    const busca = document.getElementById('post-busca');
    if (busca) busca.addEventListener('input', () => { post.busca = busca.value; const pos = busca.selectionStart; render(); const b = document.getElementById('post-busca'); if (b) { b.focus(); b.setSelectionRange(pos, pos); } });
    view.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => pickProjeto(b.dataset.pick)));
    const trocar = document.getElementById('post-trocar') || document.getElementById('post-outro');
    if (trocar) trocar.addEventListener('click', () => { post.pasta = null; post.resultado = null; render(); });
    const editar = document.getElementById('post-editar');
    if (editar) editar.addEventListener('click', () => abrirEditCri(post.pasta));
    const toggle = (arr, v) => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); };
    const keepTexts = () => view.querySelectorAll('[data-texto]').forEach((t) => { post.legendas[t.dataset.texto] = t.value; });
    view.querySelectorAll('[data-item]').forEach((b) => b.addEventListener('click', () => { keepTexts(); toggle(post.sel, b.dataset.item); render(); }));
    view.querySelectorAll('[data-rede]').forEach((b) => b.addEventListener('click', () => { keepTexts(); toggle(post.redesSel, b.dataset.rede); render(); }));
    view.querySelectorAll('[data-fmt]').forEach((b) => b.addEventListener('click', () => { keepTexts(); toggle(post.formats, b.dataset.fmt); render(); }));
    const go = document.getElementById('post-go');
    if (go) go.addEventListener('click', async () => {
      keepTexts();
      const projAtual = (projetos || []).find((x) => x.pasta === post.pasta);
      const ja = projAtual ? jaPostado(projAtual) : [];
      if (ja.length && !confirm('⚠️ Essa postagem já foi postada:\n\n' + ja.map((a) => '• ' + a.nome + ' — ' + quando(a.at)).join('\n') + '\n\nPostar de novo nesses lugares mesmo assim?')) return;
      post.enviando = true; post.erro = ''; render();
      try {
        const networks = post.redes.filter((r) => post.redesSel.includes(redeKey(r))).map((r) => ({ platform: r.platform, viaPostiz: r.viaPostiz }));
        const r = await api('postar', { pasta: post.pasta, itens: post.sel, networks, formats: post.formats, legendas: post.legendas });
        post.enviando = false;
        if (r.ok === false) throw new Error(r.error || 'não publicou');
        if (r.postando) {
          post.pasta = null;
          document.getElementById('view').scrollTo && window.scrollTo(0, 0);
          loadProjetos();
          render();
          const m = document.getElementById('send-msg') || view.querySelector('.screen');
          if (m) m.insertAdjacentHTML('afterbegin', '<div class="msg ok">📤 Postando nas redes! Leva alguns minutos — o resultado aparece na criação.</div>');
          return;
        }
        post.resultado = r.results || [];
        loadProjetos();
      } catch (e) {
        post.enviando = false;
        post.erro = (e instanceof TypeError) ? 'A conexão caiu. Confira em 📁 Minhas criações se postou antes de tentar de novo.' : e.message;
      }
      render();
    });
  }

  // Ver e editar uma criação salva antes de postar (Franklin, 2026-10-20,
  // pedido da Jaqueline): abre as fotos/vídeos da criação, escolhe um e usa as
  // ferramentas de edição; "Salvar em Minhas criações" guarda a versão
  // editada como criação nova, e a original continua lá.
  async function abrirEditCri(pasta) {
    const p = (projetos || []).find((x) => x.pasta === pasta) || {};
    stack.push({ type: 'editcri', pasta, titulo: p.titulo || 'Criação', itens: null, sel: -1, carregando: false, erro: '' });
    pickedFiles = []; render(); window.scrollTo(0, 0);
    const top = stack[stack.length - 1];
    try { top.itens = (await api('itens', { pasta })).itens || []; }
    catch (e) { top.itens = []; top.erro = e.message; }
    if (stack[stack.length - 1] === top) { if (top.itens.length === 1) await escolherEditCri(top, 0); else render(); }
  }
  async function escolherEditCri(top, i) {
    const it = top.itens[i]; if (!it) return;
    top.sel = i; top.carregando = true; top.erro = ''; render();
    try {
      const blob = await (await fetch(it.url + (it.url.includes('?') ? '&' : '?') + 't=' + Date.now())).blob();
      const f = new File([blob], it.name, { type: blob.type || (it.video ? 'video/mp4' : 'image/jpeg') });
      workFile = origFile = f;
    } catch (e) { top.erro = 'Não deu pra abrir esse arquivo agora. Tente de novo.'; }
    top.carregando = false;
    if (stack[stack.length - 1] === top) render();
  }
  function renderEditCri(top) {
    titleEl.textContent = '✏️ Ver e editar';
    if (top.itens === null) return '<div class="screen"><div class="empty"><p>⏳ Abrindo a criação…</p></div></div>';
    const thumbs = top.itens.map((it, i) => '<button class="post-item" type="button" data-ec="' + i + '" aria-pressed="' + (i === top.sel) + '">' +
      (it.video ? '<video src="' + esc(it.url) + '#t=0.5" muted preload="metadata" playsinline></video>' : '<img src="' + esc(it.url) + '" alt="" loading="lazy">') + '<span class="tick">✓</span></button>').join('');
    const f = top.sel >= 0 && !top.carregando ? workFile : null;
    const stage = top.carregando ? '<div class="empty"><p>⏳ Abrindo…</p></div>'
      : f ? '<div class="stage">' + (isVid(f) ? '<video src="' + URL.createObjectURL(f) + '" controls playsinline preload="metadata"></video>' : '<img src="' + URL.createObjectURL(f) + '" alt="">') + '</div>' : '';
    const tools = f ? TOOLS.filter((t) => (t.edit && t.edit.ui !== 'autocut' && t.edit.ui !== 'virais' && fitsTool(t, f)) || (t.timeline && isVid(f)))
      .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' })) : [];
    return '<div class="screen">' +
      '<h2 class="section-title" style="margin-top:0">' + esc(top.titulo) + '</h2>' +
      (top.erro ? '<div class="msg err">' + esc(top.erro) + '</div>' : '') +
      (top.itens.length > 1 ? '<p class="ed-label">Toque no que você quer ver ou editar</p><div class="post-items">' + thumbs + '</div>' : '') +
      (!top.itens.length ? '<div class="empty"><p>Essa criação ficou sem fotos e vídeos.</p></div>' : '') +
      stage +
      (tools.length ? '<p class="ed-label">O que você quer mudar?</p><div class="tools">' + tools.map(toolCard).join('') + '</div>' +
        '<p class="hint">Depois de editar, toque em <strong>💾 Salvar em Minhas criações</strong>: a versão editada vira uma criação nova, pronta pra postar. A original continua guardada aqui.</p>' : '') +
      '<button class="go secondary" type="button" id="ec-postar">📤 Está bom assim — postar</button>' +
    '</div>';
  }
  function wireEditCri(top) {
    view.querySelectorAll('[data-ec]').forEach((b) => b.addEventListener('click', () => escolherEditCri(top, +b.dataset.ec)));
    const pb = document.getElementById('ec-postar');
    if (pb) pb.addEventListener('click', () => { stack = []; pickProjeto(top.pasta); });
  }

  function render() {
    const top = stack[stack.length - 1];
    backBtn.hidden = !top;
    document.body.classList.toggle('in-tool', !!top);
    let html;
    if (!top) html = { criar: renderCriar, modelos: renderModelos, lab: renderLab, meus: renderMeus, postar: renderPostar }[tab]();
    else if (top.type === 'tool') { const t = TOOLS.find((x) => x.id === top.id); html = t.timeline ? renderTimeline() : t.promo ? renderPromo() : t.edit ? renderEdit(t) : t.send ? renderTool(t) : renderSoon(t); }
    else if (top.type === 'modelo') html = renderModelo(top.n);
    else if (top.type === 'pronto') html = renderPronto(top.c, top.i);
    else if (top.type === 'auto') html = renderAuto(top.i);
    else if (top.type === 'editcri') html = renderEditCri(top);
    view.innerHTML = html;
    wire();
    if (top && top.type === 'editcri') wireEditCri(top);
    if (top && top.type === 'tool') { const t = TOOLS.find((x) => x.id === top.id); if (t.timeline) wireTimeline(); else if (t.edit) wireEdit(t); }
    if (!top && tab === 'meus') wireMeus();
    if (!top && tab === 'postar') wirePostar();
  }

  function pressed(group) { const p = view.querySelector('[data-group="' + group + '"] .pill[aria-pressed="true"]'); return p || null; }

  function checkReady() {
    const btn = document.getElementById('send-btn');
    if (!btn) return;
    const top = stack[stack.length - 1];
    let ok = true;
    let why = '';
    if (top && top.type === 'auto') {
      const n = AUTOS[top.i].need;
      const v = pickedFiles.filter((f) => isVid(f)).length;
      const im = pickedFiles.length - v;
      const ok2 = v >= n.vid[0] && v <= n.vid[1] && im >= n.img[0] && im <= n.img[1];
      btn.disabled = !ok2;
      document.getElementById('send-hint').textContent = ok2 ? 'Pronto! Toque em Criar automático.' : 'Anexe ' + needText(n) + ' (você anexou ' + (v ? v + ' vídeo(s) e ' : '') + im + ' foto(s)).';
      return top;
    }
    const needsGoal = !!view.querySelector('[data-group="goal"]');
    const desc = document.getElementById('desc-input');
    if (desc) { if (!desc.value.trim()) { ok = false; why = top && top.id === 'promo' ? 'Escolha um efeito ou escreva o movimento.' : top ? 'Descreva a imagem.' : 'Escreva a sua ideia.'; } }
    else if (!pickedFiles.length) { ok = false; why = 'Envie a foto.'; }
    if (ok && needsGoal && !pressed('goal')) { ok = false; why = 'Escolha pra que é o vídeo.'; }
    btn.disabled = !ok;
    document.getElementById('send-hint').textContent = ok ? 'Pronto! Toque no botão para criar.' : why;
    return top;
  }

  function wire() {
    view.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => push({ type: 'tool', id: b.dataset.tool })));
    view.querySelectorAll('[data-goto]').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.goto)));
    view.querySelectorAll('[data-cat]').forEach((b) => b.addEventListener('click', () => { cat = b.dataset.cat; render(); }));
    view.querySelectorAll('[data-model]').forEach((b) => b.addEventListener('click', () => push({ type: 'modelo', n: +b.dataset.model })));
    view.querySelectorAll('[data-pronto]').forEach((b) => b.addEventListener('click', () => { const [c, i] = b.dataset.pronto.split(':').map(Number); push({ type: 'pronto', c, i }); }));
    view.querySelectorAll('[data-auto]').forEach((b) => b.addEventListener('click', () => push({ type: 'auto', i: +b.dataset.auto })));
    view.querySelectorAll('[data-automaticos]').forEach((b) => b.addEventListener('click', () => { cat = 'automaticos'; setTab('modelos'); }));
    view.querySelectorAll('[data-prontos]').forEach((b) => b.addEventListener('click', () => { cat = 'prontos'; setTab('modelos'); }));
    wireAudioBoxes();
    view.querySelectorAll('[data-efeito]').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.efeito;
      const tip = (k[0] === 'n' ? EF_EMPRESA : EF_PRODUTO)[+k.slice(1)];
      view.querySelectorAll('[data-efeito]').forEach((x) => x.classList.toggle('sel', x === b));
      const d = document.getElementById('desc-input');
      d.value = tip.movimento;
      document.getElementById('promo-foto-hint').textContent = '📷 Foto ideal: ' + tip.foto + ' Sem foto, a IA cria a imagem.';
      checkReady();
      d.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }));
    view.querySelectorAll('.pills').forEach((g) => g.addEventListener('click', (e) => {
      const p = e.target.closest('.pill'); if (!p) return;
      g.querySelectorAll('.pill').forEach((x) => x.setAttribute('aria-pressed', x === p));
      checkReady();
    }));
    const desc = document.getElementById('desc-input');
    if (desc) desc.addEventListener('input', checkReady);
    const file = document.getElementById('up-file');
    if (file) file.addEventListener('change', () => {
      pickedFiles = [...file.files].slice(0, file.multiple ? 5 : 1);
      const thumbs = document.getElementById('up-thumbs');
      thumbs.innerHTML = '';
      document.getElementById('up-text').textContent = pickedFiles.length ? '📎 Trocar' : '📎 Toque para escolher';
      pickedFiles.forEach((f) => {
        if (/^video\//.test(f.type)) { const s = document.createElement('span'); s.textContent = '🎬 ' + f.name; thumbs.appendChild(s); return; }
        const img = document.createElement('img'); img.alt = 'Sua foto'; img.src = URL.createObjectURL(f); thumbs.appendChild(img);
      });
      checkReady();
    });
    const send = document.getElementById('send-btn');
    if (send) send.addEventListener('click', sendPedido);
    const linkRead = document.getElementById('link-read');
    if (linkRead) linkRead.addEventListener('click', readLink);
  }

  // Link do produto: o servidor lê a página e devolve nome, descrição e fotos;
  // as fotos viram os anexos do pedido.
  async function readLink() {
    const btn = document.getElementById('link-read');
    const out = document.getElementById('link-out');
    const link = document.getElementById('link-input').value.trim();
    if (!link) { out.innerHTML = '<div class="msg err">Cole o link do produto.</div>'; return; }
    btn.disabled = true; btn.textContent = '⏳ Lendo o produto…'; out.innerHTML = '';
    try {
      const res = await fetch('/api/produto-link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifier: session.identifier, password: session.password, link }) });
      const r = await res.json();
      if (!res.ok) throw new Error(r.error || 'falha desconhecida');
      produtoLido = r;
      pickedFiles = r.imagens.map((im, i) => {
        const bin = atob(im.base64); const arr = new Uint8Array(bin.length);
        for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
        return new File([arr], 'produto-' + (i + 1) + '.' + (im.mime.split('/')[1] || 'jpg').replace('jpeg', 'jpg'), { type: im.mime });
      });
      out.innerHTML = '<div class="prod-card"><strong>' + esc(r.titulo) + '</strong>' + (r.descricao ? '<p>' + esc(r.descricao.slice(0, 180)) + (r.descricao.length > 180 ? '…' : '') + '</p>' : '') +
        (pickedFiles.length ? '<div class="thumbs">' + pickedFiles.map((f) => '<img alt="Foto do produto" src="' + URL.createObjectURL(f) + '">').join('') + '</div>'
          : '<p class="hint">Não achei fotos nesse link. Envie uma foto do produto:</p>' + uploadBox(false, 'image/*')) + '</div>';
      const file = document.getElementById('up-file');
      if (file) file.addEventListener('change', () => { pickedFiles = [...file.files].slice(0, 1); checkReady(); });
    } catch (e) {
      out.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
    }
    btn.disabled = false; btn.textContent = '🔎 Ler produto';
    checkReady();
  }

  // Monta o pedido igual ao Postar: o texto vira o instrucoes.txt
  // ("Cliente: ..."), e o vídeo em movimento liga motionVideo+motionExtend
  // (regra: todo vídeo em movimento é o vídeo longo).
  async function sendPedido(opts) {
    const postWork = !!(opts && opts.postWork);
    const top = stack[stack.length - 1];
    const btn = (opts && opts.btn) || document.getElementById(postWork ? 'ed-post' : 'send-btn');
    const msg = document.getElementById('send-msg');
    let text, motion = false, isVideo = false, title, voice = '', music = '', autoTip = '', videoVoice = false, narration = '';
    const goalEl = pressed('goal');
    const goalText = goalEl ? GOALS[+goalEl.dataset.goal].text : '';
    if (postWork) {
      // Editado na hora no Estúdio: o cliente já viu o resultado, então vai
      // direto pros Projetos (sem aprovar de novo), só com a legenda.
      text = 'Este ' + (isVid(workFile) ? 'vídeo' : 'foto') + ' já está pronto (editado no Cut Studio Pro). Use exatamente como está, sem criar banner, vídeo nem narração novos. Só escreva a legenda de cada rede.';
      isVideo = isVid(workFile);
      title = (opts && opts.title) || (top ? (TOOLS.find((x) => x.id === top.id) || {}).ico + ' ' + (TOOLS.find((x) => x.id === top.id) || {}).name : '✂️ Editado no Estúdio');
      pickedFiles = [workFile];
    } else if (!top) {
      // Lab. de IA: a ideia do cliente vai como está. Sem movimento (regra:
      // vídeo em movimento só pelo botão/modelo de movimento).
      text = document.getElementById('desc-input').value.trim();
      title = '🧪 ' + (text.length > 40 ? text.slice(0, 40) + '…' : text);
    } else if (top.type === 'modelo') {
      const c = CATS.find((x) => x.id === cat);
      const m = c.models[top.n];
      motion = !!c.motion; isVideo = true; title = '🎬 ' + m.name;
      text = c.motion
        ? 'Quero um vídeo com o efeito "' + m.name + '". Movimento do vídeo: ' + m.move + '. O produto da foto continua exatamente igual, sem mudar formato, cor nem letras. ' + goalText
        : 'Faça um vídeo com as fotos que anexei (sem vídeo em movimento), efeito "' + m.name + '": ' + m.move + '. ' + goalText;
    } else if (top.type === 'tool' && top.id === 'promo') {
      text = 'Movimento do vídeo: ' + document.getElementById('desc-input').value.trim() + ' O produto da foto continua exatamente igual, sem mudar formato, cor nem letras.';
      title = '🎬 Vídeo em movimento';
      motion = true; isVideo = true;
      const vz = view.querySelector('[data-group="pv-voz"] [aria-pressed="true"]');
      const ms = view.querySelector('[data-group="pv-mus"] [aria-pressed="true"]');
      voice = vz ? vz.dataset.value : '';
      music = ms ? ms.dataset.value : '';
      narration = document.getElementById('promo-narr').value.trim();
      videoVoice = document.getElementById('promo-video-voice').checked;
      if (videoVoice && !pickedFiles.some((f) => isVid(f))) { msg.innerHTML = '<div class="msg err">🎙️ Você marcou "Usar a voz do meu vídeo": anexe o vídeo em que você fala.</div>'; return; }
    } else if (top.type === 'auto') {
      const a = AUTOS[top.i];
      text = pickedFiles.length === 1 ? 'Anexei 1 arquivo:' : 'Anexei ' + pickedFiles.length + ' arquivos:';
      title = '⚡ ' + a.when.replace(/ —.*$/, '');
      isVideo = !!a.need.vid[1] || a.id === '1.2';
      autoTip = a.id || '';
      const vv = document.getElementById('auto-video-voice');
      videoVoice = !!(vv && vv.checked);
    } else if (top.type === 'pronto') {
      const p = PRONTOS[top.c].items[top.i];
      text = document.getElementById('desc-input').value.trim();
      title = '📝 ' + p.title;
      isVideo = p.format === 'reels' || p.cost === 3;
      const vz = view.querySelector('[data-group="pv-voz"] [aria-pressed="true"]');
      const ms = view.querySelector('[data-group="pv-mus"] [aria-pressed="true"]');
      voice = vz ? vz.dataset.value : '';
      music = ms ? ms.dataset.value : '';
    } else {
      const t = TOOLS.find((x) => x.id === top.id);
      const opt = (pressed('opt') || {}).dataset ? pressed('opt').dataset.value : t.opts[0];
      const descEl = document.getElementById('desc-input');
      const built = t.send(opt, descEl ? descEl.value.trim() : '');
      text = built.text + (goalText ? ' ' + goalText : '');
      motion = !!built.motion; isVideo = !!(built.reels !== undefined ? built.reels : t.video); title = t.ico + ' ' + t.name;
    }

    btn.disabled = true;
    btn.textContent = 'Enviando...';
    msg.innerHTML = '';
    const fd = new FormData();
    fd.append('identifier', session.identifier);
    fd.append('password', session.password);
    fd.append('instruction', 'Cliente: ' + text);
    if (motion) { fd.append('motionVideo', 'true'); fd.append('motionExtend', 'true'); }
    if (autoTip) fd.append('autoTip', autoTip);
    if (narration) fd.append('narrationText', narration);
    if (videoVoice) fd.append('motionVideoVoice', 'true');
    if (voice) fd.append('voice', voice);
    if (music) fd.append('music', music);
    if (isVideo) fd.append('format', JSON.stringify(['reels']));
    pickedFiles.forEach((f) => fd.append('files', f, f.name));
    // Tudo o que sai do Estúdio vira projeto: aprovar só guarda; publicar é na aba Postar.
    fd.append('projeto', 'true');
    fd.append('projetoTitulo', title || 'Criação');
    if (postWork) fd.append('semAprovacao', 'true');
    fd.append('requestId', (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2)));
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 180000);
      const res = await fetch('/api/commit', { method: 'POST', body: fd, signal: ctrl.signal });
      clearTimeout(timer);
      const result = await res.json();
      if (!(res.ok || res.status === 207)) throw new Error(result.error || 'falha desconhecida');
      msg.innerHTML = postWork
        ? '<div class="msg ok">💾 Salvo em Minhas criações! Em instantes fica pronto pra postar em 📤 Postar.</div>'
        : '<div class="msg ok">✅ Pedido enviado! Está sendo criado e aparece em 📁 Minhas criações pra você ver e aprovar.</div>';
      if (btn) btn.textContent = '✔️ Salvo';
      if (!vrClips.length) setTimeout(() => setTab('meus'), 1500);
    } catch (e) {
      const net = e instanceof TypeError || e.name === 'AbortError';
      msg.innerHTML = '<div class="msg err">' + esc(net ? 'A conexão caiu no meio do envio. Tente num lugar com mais sinal ou wifi.' : 'Não deu pra enviar: ' + e.message) + '</div>';
      btn.disabled = false;
      btn.textContent = postWork ? '💾 Salvar em Minhas criações' : 'Tentar de novo';
    }
  }

  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  // Atalhos vindos dos botões da área "Máquina de Vendas Estúdio" do app:
  // #meus, #criar, #modelos, #modelos-<categoria>, #tool-<ferramenta>.
  function openHash() {
    const hash = location.hash.replace('#', '');
    if (/^auto-\d+$/.test(hash) && AUTOS[+hash.slice(5)]) {
      cat = 'automaticos';
      setTab('modelos');
      push({ type: 'auto', i: +hash.slice(5) });
    } else if (hash === 'prontos' || hash === 'automaticos' || hash === 'modelos') {
      cat = hash === 'modelos' ? 'prontos' : hash;
      setTab('modelos');
    } else if (hash.startsWith('modelos')) {
      const c = hash.split('-')[1];
      if (CATS.some((x) => x.id === c)) cat = c;
      setTab('modelos');
    } else if (hash.startsWith('tool-') && TOOLS.some((t) => t.id === hash.slice(5))) {
      setTab('criar');
      push({ type: 'tool', id: hash.slice(5) });
    } else {
      setTab(['meus', 'lab', 'postar'].includes(hash) ? hash : 'criar');
    }
  }
  openHash();
  window.addEventListener('hashchange', openHash);
  loadSaldo();
})();
</script>
</body>
</html>
