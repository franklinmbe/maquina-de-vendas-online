<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Máquina de Vendas Cut Studio Pro</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0d12" />
<link rel="icon" href="/img/icons/favicon-32.png" sizes="32x32" />
<script src="/js/brand.js"></script>
<script src="/js/pedidos-prontos.js"></script>
<script src="/js/pedidos-automaticos.js"></script>
<script src="/js/efeitos-movimento.js"></script>
<style>
  /* Estúdio (Franklin, 2026-10-16): editor de imagem e vídeo inspirado no
     CapCut. 2026-10-17: meta de copiar ~80% do CapCut — abas Editar ·
     Modelos · Lab. de IA · Projetos · Postar, ferramentas agrupadas por
     estúdio (design, vídeo, editor, voz, imagem, lote) e saldo do mês no
     topo no lugar dos "créditos". Fase 1: os Modelos de
     efeito e 3 ferramentas (Banner, Criar imagem, Foto em movimento) já
     funcionam, mandando o pedido pelo mesmo /api/commit do Postar (geração +
     aprovação de sempre). As outras ferramentas aparecem como "em breve". */
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --panel-2: #181d28;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --cyan: #33d6cb;
    --violet: #8b7cf6;
    --green: #35d07f;
    --gold: #f5c542;
    --on-accent: #1a0703;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.45;
  }
  .app {
    max-width: 480px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 120px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    display: flex; align-items: center; gap: 10px;
    padding-block: calc(12px + env(safe-area-inset-top, 0px)) 10px; border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 1.3rem; margin: 0; flex: 1; }
  .topbar h1 small { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  /* Selo "Cut", imitando o CapCut (Franklin, 2026-10-17): branco, letra preta e tesourinha. */
  .cut-badge { display: inline-flex; align-items: center; gap: 3px; background: #fff; color: #000; font-weight: 900; border-radius: 6px; padding: 1px 6px 1px 5px; margin: 0 2px; letter-spacing: 0; text-transform: none; vertical-align: middle; }
  /* Selo animado (Franklin, 2026-10-19): câmera de cinema com rolos girando, flash na lente e fita de filme colorida saindo dos rolos até o PRO. */
  .cut-badge { position: relative; padding: 0.12em 0.55em 0.74em 0.4em !important; }
  .cut-badge svg.cut-cam { width: 1.5em; height: 1.2em; margin: -0.1em 0; overflow: visible; position: relative; z-index: 1; }
  .cut-badge svg.cut-film { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; z-index: 0; pointer-events: none; }
  .cut-badge > b.pro { position: relative; z-index: 1; }
  .cut-badge svg.cut-film path { fill: none; vector-effect: non-scaling-stroke; }
  .cut-film .cf-1 { stroke: #111; stroke-width: 0.62em; }
  .cut-film .cf-2 { stroke: #f5f5f5; stroke-width: 0.52em; stroke-dasharray: 0.1em 0.11em; animation: cutFilmRun 1s linear infinite; }
  .cut-film .cf-3 { stroke: #111; stroke-width: 0.39em; }
  .cut-film .cf-4 { stroke: url(#cut-rainbow); stroke-width: 0.33em; }
  .cut-film .cf-5 { stroke: #fff; stroke-opacity: 0.35; stroke-width: 0.08em; }
  .cut-film .cf-6 { stroke: #111; stroke-width: 0.33em; stroke-dasharray: 0.06em 0.36em; animation: cutFilmRun2 1s linear infinite; }
  @keyframes cutFilmRun { to { stroke-dashoffset: -0.42em; } }
  @keyframes cutFilmRun2 { to { stroke-dashoffset: -0.42em; } }
  @media (prefers-reduced-motion: reduce) { .cut-film path { animation: none; } }
  .cut-badge .pro { background: #1b1e24; color: #fff; border-radius: 4px; padding: 0 5px; font-size: 0.78em; letter-spacing: 0.06em; }
  .pill-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text); text-decoration: none;
    border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  button:focus-visible, a:focus-visible, label:focus-within { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .screen { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 16px 0; }
  .section-title { font-size: 0.78rem; font-weight: 800; color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase; margin: 0; }
  .note { font-size: 0.88rem; color: var(--muted); margin: 0; }

  .big-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .big-btn {
    border: none; border-radius: 20px; padding: 22px 12px; cursor: pointer; font: inherit;
    display: grid; gap: 8px; justify-items: center; font-weight: 800; font-size: 1.05rem;
  }
  .big-btn .ico { font-size: 2rem; line-height: 1; }
  .big-btn.video { background: var(--accent); color: var(--on-accent); }
  .big-btn.image { background: var(--cyan); color: #04211e; }

  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tool {
    position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; color: var(--text);
    padding: 14px 6px; display: grid; gap: 6px; justify-items: center; text-align: center; cursor: pointer; font: inherit; font-size: 0.82rem; font-weight: 700;
  }
  .tool .ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 1.35rem; background: var(--panel-2); }
  .tool.v .ico { background: rgba(255, 90, 54, 0.16); }
  .tool.i .ico { background: rgba(51, 214, 203, 0.16); }
  .tool.a .ico { background: rgba(139, 124, 246, 0.18); }
  .tool .cost { font-size: 0.66rem; font-weight: 700; color: var(--muted); }
  .tool.soon { opacity: 0.55; }
  .tool .soon-tag { position: absolute; top: 6px; right: 6px; font-size: 0.58rem; font-weight: 800; background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 2px 6px; }

  /* Quebra linha em vez de rolar de lado: rolando, as últimas categorias
     ficavam escondidas, parecendo cortadas (Franklin, 2026-10-19). */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 0.88rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  /* Postar: caixinha de marcar do lado (Franklin, 2026-10-20) — marcado =
     verde com ✓, desmarcado = caixa vazia e apagado. */
  .chip.chk { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px 9px 10px; font-size: 0.95rem; }
  .chip.chk .cbx { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 5px; display: grid; place-items: center; font-size: 0.85rem; line-height: 1; }
  .chip.chk[aria-pressed="true"] { background: rgba(53,208,127,0.16); color: var(--text); border: 2px solid var(--green); }
  .chip.chk[aria-pressed="true"] .cbx { background: var(--green); border-color: var(--green); color: #fff; }
  .chip.chk[aria-pressed="false"] { opacity: 0.75; }
  /* Pedidos prontos (vindos da tela de postagem em 2026-10-19) */
  .pronto-cat { margin: 16px 0 8px; font-weight: 900; font-size: 1.05rem; }
  .pronto-list { display: grid; gap: 8px; }
  .pronto-item { text-align: left; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px; cursor: pointer; display: grid; gap: 4px; }
  .pronto-item.sel { border-color: var(--accent); background: rgba(255, 90, 54, 0.12); }
  .pronto-item strong { font-size: 0.95rem; }
  .pronto-item span { font-size: 0.82rem; color: var(--muted); }
  .auto-steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 0.92rem; }
  .voice-row { display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 0.9rem; cursor: pointer; }
  .voice-row input { width: 22px; height: 22px; flex: none; accent-color: var(--green); }
  .cost-tag { font-size: 0.75rem; font-weight: 800; }
  .cost-tag.c1 { color: var(--green); } .cost-tag.c2 { color: var(--gold); } .cost-tag.c3 { color: var(--accent); }
  .models { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .model { background: none; border: none; padding: 0; text-align: left; color: var(--text); cursor: pointer; font: inherit; display: grid; gap: 6px; }
  .preview { position: relative; aspect-ratio: 9 / 14; max-width: 100%; border-radius: 16px; overflow: hidden; display: grid; place-items: center; }
  .preview .obj { font-size: 3.2rem; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.5)); }
  .preview .badge { position: absolute; top: 8px; left: 8px; font-size: 0.64rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,0.55); color: #fff; }
  .preview .badge.simple { background: var(--green); color: #052313; }
  .model-name { font-weight: 800; font-size: 0.92rem; }
  .model-sub { font-size: 0.76rem; color: var(--muted); margin-top: -4px; }

  @keyframes rise { 0% { transform: translateY(70%) scale(0.7); } 55%,100% { transform: translateY(0) scale(1); } }
  @keyframes floaty { 0%,100% { transform: translateY(-8px) rotate(-4deg); } 50% { transform: translateY(8px) rotate(4deg); } }
  @keyframes spin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
  @keyframes zoomin { 0% { transform: scale(0.8); } 100% { transform: scale(1.25); } }
  @keyframes slide { 0%,100% { transform: translateX(-60%); } 50% { transform: translateX(60%); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes drop { 0% { transform: translateY(-120%); } 60% { transform: translateY(6%); } 75%,100% { transform: translateY(0); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-3deg); } 75% { transform: translateX(6px) rotate(3deg); } }
  .fx-rise .obj { animation: rise 2.6s ease-out infinite; }
  .fx-float .obj { animation: floaty 3s ease-in-out infinite; }
  .fx-spin .obj { animation: spin 3.2s linear infinite; }
  .fx-zoom .obj { animation: zoomin 3s ease-in-out infinite alternate; }
  .fx-slide .obj { animation: slide 4s ease-in-out infinite; }
  .fx-pulse .obj { animation: pulse 1.4s ease-in-out infinite; }
  .fx-drop .obj { animation: drop 2.4s cubic-bezier(.3,1.4,.5,1) infinite; }
  .fx-shake .obj { animation: shake 0.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .preview .obj { animation: none !important; } }

  .detail .preview { aspect-ratio: 9 / 12; }
  .detail .preview .obj { font-size: 5rem; }
  .detail p { margin: 0; color: var(--muted); }
  .step { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .step h3 { margin: 0; font-size: 0.95rem; }
  .step h3 span { color: var(--accent); margin-right: 6px; }
  .upload { position: relative; display: grid; place-items: center; gap: 6px; border: 2px dashed var(--border); border-radius: 14px; padding: 18px; cursor: pointer; color: var(--muted); font-weight: 700; text-align: center; }
  .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .upload .thumbs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .upload img { max-height: 120px; max-width: 100%; border-radius: 10px; }
  textarea.input { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 10px; font: inherit; resize: vertical; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 2px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 999px; padding: 9px 14px; font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  .pill[aria-pressed="true"] { border-color: var(--accent); background: rgba(255, 90, 54, 0.16); }
  .go { border: none; border-radius: 16px; padding: 16px; font: inherit; font-weight: 800; font-size: 1.08rem; background: var(--accent); color: var(--on-accent); cursor: pointer; text-align: center; text-decoration: none; display: block; }
  .go:disabled { opacity: 0.45; cursor: not-allowed; }
  .go.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .hint { font-size: 0.82rem; color: var(--muted); margin: -6px 0 0; }
  .msg { border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 0.9rem; }
  .msg.err { background: rgba(255, 90, 54, 0.14); border: 1px solid var(--accent); }
  .msg.ok { background: rgba(53, 208, 127, 0.14); border: 1px solid var(--green); }

  .mine-list { display: grid; gap: 10px; }
  .mine-item { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: grid; gap: 6px; }
  .mine-item .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .mine-item strong { font-size: 0.95rem; }
  .mine-item time { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { font-size: 0.82rem; font-weight: 800; }
  .status.wait { color: var(--gold); }
  .status.ready { color: var(--cyan); }
  .status.done { color: var(--green); }
  .status.fail { color: var(--accent); }
  .mine-item a { color: var(--cyan); font-weight: 800; font-size: 0.88rem; }
  .mine-actions { display: flex; align-items: center; gap: 10px; }
  .mine-actions a { margin-right: auto; }
  .mine-actions button { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
  /* Projetos e Postar (2026-10-19: criação separada da postagem) */
  .day-title { margin: 14px 0 6px; font-size: 0.8rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .proj-row { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; }
  .proj-thumb { width: 64px; height: 84px; border-radius: 10px; object-fit: cover; background: var(--panel-2); display: grid; place-items: center; font-size: 1.4rem; overflow: hidden; }
  .proj-thumb video, .proj-thumb img { width: 100%; height: 100%; object-fit: cover; }
  button.mine-item { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
  button.mine-item:active { border-color: var(--accent); }
  .post-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .post-item { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--border); background: var(--panel-2); aspect-ratio: 9 / 16; cursor: pointer; padding: 0; }
  .post-item img, .post-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .post-item[aria-pressed="true"] { border-color: var(--green); }
  .post-item .tick { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; font-size: 0.8rem; font-weight: 900; }
  .post-item[aria-pressed="true"] .tick { background: var(--green); }
  .post-texts textarea { width: 100%; min-height: 84px; }
  .post-texts details { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .post-texts summary { font-weight: 800; cursor: pointer; }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); border: 1px dashed var(--border); border-radius: 16px; }

  /* Saldo do mês (no lugar dos "créditos" do CapCut: o cliente vê quantas
     imagens/vídeos ainda restam no plano). */
  .saldo-pill { font-variant-numeric: tabular-nums; padding: 8px 10px; }
  body.in-tool .saldo-pill { display: none; }
  .topbar h1 small { white-space: nowrap; }
  .saldo { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
  .saldo-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 0.86rem; font-weight: 700; }
  .saldo-row b { font-variant-numeric: tabular-nums; }
  .saldo-bar { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .saldo-bar span { display: block; height: 100%; background: var(--green); }
  .saldo-bar span.low { background: var(--accent); }

  /* Lab. de IA — igual ao CapCut: "O que vamos criar hoje?" + caixa da ideia. */
  .lab-title { font-size: 1.7rem; line-height: 1.15; margin: 4px 0 0; }
  .lab-quick { display: grid; gap: 10px; justify-items: start; }
  .lab-quick button { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 800; cursor: pointer; }
  .idea-box { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 12px; display: grid; gap: 10px; }
  .idea-box textarea { width: 100%; background: transparent; border: none; color: var(--text); font: inherit; font-size: 1.05rem; resize: vertical; min-height: 70px; }
  .idea-box textarea:focus { outline: none; }
  .idea-actions { display: flex; align-items: center; gap: 10px; }
  .idea-actions .upload { border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; flex: 1; justify-items: start; }
  .idea-actions .go { padding: 12px 18px; font-size: 0.95rem; }

  .guide-link { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 2px solid var(--violet); border-radius: 14px; padding: 12px 14px; color: var(--text); font-weight: 800; text-decoration: none; }
  .guide-link span { color: var(--violet); }

  /* Janela do usuário (⋯) */
  .more-btn { font-size: 1.1rem; line-height: 1; padding: 6px 12px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 480px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; max-height: 85vh; overflow-y: auto; }
  .sheet[hidden], .sheet-bg[hidden] { display: none; }
  .sheet-head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .sheet-head strong { display: block; font-size: 1.1rem; }
  .sheet-head span { color: var(--muted); font-size: 0.85rem; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; background: var(--panel-2); }
  .sheet-plan { background: linear-gradient(120deg, rgba(51,214,203,0.22), rgba(139,124,246,0.22)); border-radius: 14px; padding: 12px 14px; font-weight: 800; margin-bottom: 6px; }
  .sheet-plan small { display: block; font-weight: 600; color: var(--muted); }
  .sheet-row, .sheet-link { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 4px; border-bottom: 1px solid var(--border); font-weight: 700; color: var(--text); text-decoration: none; background: none; border-left: 0; border-right: 0; border-top: 0; font: inherit; text-align: left; cursor: pointer; width: 100%; }
  .sheet-row b { color: var(--muted); font-size: 0.88rem; }
  .sheet-out { color: var(--accent); border-bottom: 0; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; }
  .seg button { border: none; background: none; color: var(--muted); font: inherit; font-weight: 800; font-size: 0.85rem; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  /* Editor na hora — palco preto grande em cima, opções roláveis embaixo (CapCut). */
  .stage { position: relative; background: #000; border-radius: 16px; overflow: hidden; display: grid; place-items: center; min-height: 240px; max-height: 58vh; }
  .stage video, .stage img { display: block; max-width: 100%; max-height: 58vh; }
  .stage-empty { cursor: pointer; gap: 8px; color: var(--muted); font-weight: 800; border: 2px dashed var(--border); background: var(--panel); text-align: center; padding: 20px; }
  .stage-empty input, .stage-swap input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .stage-plus { font-size: 2.6rem; color: var(--text); line-height: 1; }
  .ac-list { font-size: 1.4rem; letter-spacing: 4px; }
  button.stage-swap { border: none; font: inherit; font-size: 0.8rem; font-weight: 800; }
  .stage-swap { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; font-weight: 800; cursor: pointer; }
  /* Caixa de voz e música (igual à da antiga tela de postagem). */
  .voice-music-box { margin-top: 6px; padding: 14px; border: 1px solid rgba(53, 208, 127, 0.5); border-radius: 12px; background: rgba(53, 208, 127, 0.05); }
  .voice-music-title { font-size: 1.1rem; font-weight: 800; margin: 0 0 6px; }

        if (previewBtn === play) { if (previewAudio.paused) { previewAudio.play().catch(() => {}); play.textContent = '⏸'; } else { previewAudio.pause(); play.textContent = '▶'; } return; }
        stopPreview();
        previewAudio = new Audio(play.dataset.src); previewBtn = play;
        previewAudio.addEventListener('ended', stopPreview);
        previewAudio.play().catch(() => {}); play.textContent = '⏸';
        return;
      }
      const pill = e.target.closest('.audio-option-pill'); if (!pill) return;
      const was = pill.getAttribute('aria-pressed') === 'true';
      row.querySelectorAll('.audio-option-pill').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      pill.setAttribute('aria-pressed', String(!(was && row.dataset.allowNone)));
    }));
  }

  let recBlob = null;
  let produtoLido = null;
  let recorder = null;
  const isVid = (f) => !!f && (/^video\//.test(f.type) || /\.(mp4|mov|webm|m4v|3gp)$/i.test(f.name || ''));
  function fitsTool(t, f) { return !!f && (t.edit.media === 'any' || (t.edit.media === 'video') === isVid(f)); }
  function fmtTime(s) { s = Math.max(0, s || 0); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') + ',' + Math.floor((s % 1) * 10); }

  function stageHtml(t) {
    const f = fitsTool(t, workFile) ? workFile : null;
    const accept = t.edit.media === 'video' ? 'video/*' : t.edit.media === 'image' ? 'image/*' : 'image/*,video/*';
    const what = t.edit.media === 'video' ? 'um vídeo' : t.edit.media === 'image' ? 'uma foto' : 'uma foto ou vídeo';
    if (!f) return '<label class="stage stage-empty"><input type="file" id="ed-file" accept="' + accept + '"><span class="stage-plus">＋</span><span>Toque para escolher ' + what + '</span></label>';
    const url = URL.createObjectURL(f);
    return '<div class="stage">' + (isVid(f) ? '<video id="ed-media" src="' + url + '" controls playsinline preload="metadata"></video>' : '<img id="ed-media" src="' + url + '" alt="Sua foto">') +
      '<label class="stage-swap"><input type="file" id="ed-file" accept="' + accept + '">Trocar</label></div>';
  }

  function controlsHtml(t) {
    const e = t.edit;
    if (e.ui === 'trim') return '<div class="ed-trim"><label>Começo <b id="trim-a">0:00,0</b><input type="range" id="trim-start" min="0" max="1" step="0.1" value="0"></label>' +
      '<label>Fim <b id="trim-b">0:00,0</b><input type="range" id="trim-end" min="0" max="1" step="0.1" value="1"></label><p class="hint" id="trim-len"></p></div>';
    if (e.ui === 'music') return audioBox({ title: '🎵 Música de fundo', mus: { group: 'eopt', sel: 'musica-' + MUSICAS[0] + '.mp3' } });
    if (e.ui === 'text') return '<div class="ed-text"><textarea class="input" id="tx-text" rows="2" placeholder="Ex.: Promoção da semana — chame no WhatsApp"></textarea>' +
      '<div class="ed-strip" data-group="tx-pos"><button class="ed-chip" type="button" aria-pressed="false" data-value="top">⬆️ Em cima</button><button class="ed-chip" type="button" aria-pressed="false" data-value="mid">⏺️ No meio</button><button class="ed-chip" type="button" aria-pressed="true" data-value="bot">⬇️ Embaixo</button></div>' +
      '<div class="ed-strip" data-group="tx-color"><button class="ed-chip" type="button" aria-pressed="true" data-value="#ffffff">⚪ Branco</button><button class="ed-chip" type="button" aria-pressed="false" data-value="#ffd60a">🟡 Amarelo</button><button class="ed-chip" type="button" aria-pressed="false" data-value="#111111">⚫ Preto</button><button class="ed-chip" type="button" aria-pressed="false" data-value="#ff3b30">🔴 Vermelho</button></div>' +
      '<div class="ed-strip" data-group="tx-box"><button class="ed-chip" type="button" aria-pressed="true" data-value="1">▭ Com tarja</button><button class="ed-chip" type="button" aria-pressed="false" data-value="0">Sem tarja</button></div></div>';
    if (e.ui === 'tts') return '<textarea class="input" id="tts-text" rows="3" maxlength="900" placeholder="Ex.: Chegou a nova linha de bancadas em inox. Chame a gente no WhatsApp!"></textarea>' +
      audioBox({ title: '🎙️ Voz da narração', voz: { group: 'eopt', sel: 'Kore' } });
    if (e.ui === 'prompt') return '<textarea class="input" id="ia-pedido" rows="3" maxlength="500" placeholder="O que você quer mudar na foto?"></textarea>' +
      '<div class="ed-strip" id="ia-ideias">' + ['Troque o fundo por uma loja bonita', 'Deixe a foto mais iluminada e profissional', 'Coloque o produto numa mesa de madeira', 'Deixe o céu azul e ensolarado'].map((s) => '<button class="ed-chip" type="button" data-ideia="' + esc(s) + '">💡 ' + esc(s) + '</button>').join('') + '</div>';
    if (e.ui === 'rec') return '<div class="rec-box"><button class="rec-btn" type="button" id="rec-btn">🎙️ Gravar</button><span id="rec-time">0:00</span></div><audio id="rec-play" controls hidden></audio>';
    if (e.groups) return e.groups.map((gr) => '<p class="ed-label">' + esc(gr.label) + '</p><div class="ed-strip" data-group="eg-' + gr.key + '">' +
      gr.choices.map((c) => '<button class="ed-chip" type="button" aria-pressed="' + (c[0] === gr.def) + '" data-value="' + esc(c[0]) + '">' + esc(c[1]) + '</button>').join('') + '</div>').join('');
    if (e.choices) return '<div class="ed-strip" data-group="eopt">' + e.choices.map((c) => '<button class="ed-chip" type="button" aria-pressed="' + (c[0] === e.def) + '" data-value="' + esc(c[0]) + '">' + esc(c[1]) + '</button>').join('') + '</div>';
    return '';
  }

  // AutoCut: vários arquivos de entrada (acFiles); o vídeo pronto vira o
  // arquivo aberto no editor, pra continuar editando.
  let acFiles = [];
  let acDone = false;
  function autocutStage() {
    if (acDone && workFile) return '<div class="stage"><video id="ed-media" src="' + URL.createObjectURL(workFile) + '" controls playsinline></video><button class="stage-swap" type="button" id="ac-new">Novo AutoCut</button></div>';
    return '<label class="stage stage-empty"><input type="file" id="ac-files" accept="image/*,video/*" multiple><span class="stage-plus">＋</span>' +
      (acFiles.length ? '<span>' + acFiles.length + ' arquivo(s) escolhido(s) — toque pra trocar</span><span class="ac-list">' + acFiles.map((f) => isVid(f) ? '🎬' : '🖼️').join(' ') + '</span>' : '<span>Toque para escolher de 2 a 8 fotos e vídeos</span>') + '</label>';
  }

  // Cortes virais: um vídeo entra, vários curtos saem (vrClips).
  let vrClips = [];
  function renderVirais(t) {
    titleEl.textContent = t.name;
    if (vrClips.length) {
      return '<div class="screen editor"><div class="msg ok">✅ ' + vrClips.length + ' cortes prontos! Assista, salve ou poste o que gostar.</div>' +
        vrClips.map((c, i) => '<div class="vr-clip"><p class="ed-label">🔥 Corte ' + (i + 1) + ' — ' + esc(c.titulo) + ' <small>(' + fmtS(c.fim - c.inicio) + ')</small></p>' +
          '<div class="stage"><video src="' + c.url + '" controls playsinline preload="metadata"></video></div>' +
          '<div class="ed-after"><button class="go secondary" type="button" data-vr-save="' + i + '">⬇️ Salvar no celular</button>' +
          '<button class="go secondary" type="button" data-vr-post="' + i + '">💾 Salvar em Minhas criações</button></div></div>').join('') +
        '<div id="send-msg"></div><button class="go" type="button" id="vr-new">🔁 Fazer cortes de outro vídeo</button></div>';
    }
    const ready = fitsTool(t, workFile);
    return '<div class="screen editor">' + stageHtml(t) + '<p class="note">' + esc(t.help) + '</p>' + controlsHtml(t) +
      '<p class="hint">Funciona melhor com vídeo em que alguém fala. Sem fala, o vídeo é dividido em partes iguais.</p>' +
      '<div id="send-msg"></div><button class="go" type="button" id="ed-apply"' + (ready ? '' : ' disabled') + '>🔥 Criar cortes virais</button></div>';
  }

  function renderEdit(t) {
    if (t.edit.ui === 'virais') return renderVirais(t);
    titleEl.textContent = t.name;
    const ac = t.edit.ui === 'autocut';
    const done = workFile && origFile && workFile !== origFile;
    const ready = ac ? acFiles.length >= 2 : fitsTool(t, workFile);
    const after = ac ? acDone : fitsTool(t, workFile);
    return '<div class="screen editor">' + (ac ? autocutStage() : stageHtml(t)) +
      '<p class="note">' + esc(t.help) + '</p>' + controlsHtml(t) +
      (ac ? audioBox({ title: '🎵 Música de fundo', mus: { group: 'eopt', sel: 'musica-Upbeat-Happy-Corporate.mp3' } }) : '') +
      '<div id="send-msg"></div>' +
      (ac && acDone ? '' : '<button class="go" type="button" id="ed-apply"' + (ready ? '' : ' disabled') + '>' + (ac ? '⚡ Montar o vídeo' : '✨ Aplicar') + '</button>') +
      (after ? '<div class="ed-after">' +
        '<button class="go secondary" type="button" id="ed-save">⬇️ Salvar no celular</button>' +
        '<button class="go secondary" type="button" id="ed-post">💾 Salvar em Minhas criações</button>' +
        (done && !ac ? '<button class="go secondary" type="button" id="ed-undo">↺ Voltar ao original</button>' : '') +
        '</div><p class="hint">Depois de aplicar, pode abrir outra ferramenta: o arquivo editado continua aberto.</p>' : '') +
    '</div>';
  }

  function setWork(f, isOriginal) { workFile = f; if (isOriginal) origFile = f; render(); }

  // Texto na foto: desenhado no próprio celular (canvas), sem servidor.
  async function applyText() {
    const txt = document.getElementById('tx-text').value.trim();
    if (!txt) throw new Error('Escreva o texto.');
    const pos = view.querySelector('[data-group="tx-pos"] [aria-pressed="true"]').dataset.value;
    const color = view.querySelector('[data-group="tx-color"] [aria-pressed="true"]').dataset.value;
    const box = view.querySelector('[data-group="tx-box"] [aria-pressed="true"]').dataset.value === '1';
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = URL.createObjectURL(workFile); });
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    const size = Math.round(c.width / 13);
    g.font = '900 ' + size + 'px system-ui, -apple-system, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = [];
    txt.split('\n').forEach((para) => {
      let line = '';
      para.split(' ').forEach((w) => { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > c.width * 0.86 && line) { lines.push(line); line = w; } else line = t; });
      lines.push(line);
    });
    const lh = size * 1.2;
    const blockH = lines.length * lh;
    const y0 = pos === 'top' ? c.height * 0.08 : pos === 'mid' ? (c.height - blockH) / 2 : c.height * 0.92 - blockH;
    if (box) {
      const wMax = Math.max(...lines.map((l) => g.measureText(l).width));
      g.fillStyle = color === '#111111' ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.55)';
      g.fillRect((c.width - wMax) / 2 - size * 0.5, y0 - size * 0.3, wMax + size, blockH + size * 0.6);
    }
    g.fillStyle = color;
    if (!box) { g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = size / 4; }
    lines.forEach((l, i) => g.fillText(l, c.width / 2, y0 + lh * i + lh / 2));
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.92));
    return new File([blob], 'texto-' + Date.now() + '.jpg', { type: 'image/jpeg' });
  }

  async function applyEdit(t) {
    const btn = document.getElementById('ed-apply');
    const msg = document.getElementById('send-msg');
    msg.innerHTML = '';
    btn.disabled = true;
    const ac = t.edit.ui === 'autocut';
    btn.textContent = ac ? '⏳ Montando o vídeo… (pode levar 1 minuto)' : t.edit.ui === 'virais' ? '⏳ Escutando o vídeo e escolhendo os melhores momentos… (1 a 2 minutos)' : isVid(workFile) ? '⏳ Editando o vídeo… (pode levar 1 minuto)' : '⏳ Editando…';
    try {
      let result;
      if (t.edit.ui === 'text') result = await applyText();
      else {
        const opts = {};
        if (t.edit.ui === 'trim') { opts.start = +document.getElementById('trim-start').value; opts.end = +document.getElementById('trim-end').value; }
        const chosen = view.querySelector('[data-group="eopt"] [aria-pressed="true"]');
        if (chosen) opts[t.edit.ui === 'music' || ac ? 'musica' : t.edit.ui === 'tts' ? 'voz' : t.edit.key] = chosen.dataset.value;
        if (t.edit.ui === 'tts') { opts.texto = document.getElementById('tts-text').value.trim(); if (!opts.texto) throw new Error('Escreva o texto que a voz vai falar.'); }
        if (t.edit.ui === 'rec' && !recBlob) throw new Error('Grave a sua voz antes de aplicar.');
        if (t.edit.ui === 'prompt') { opts.pedido = document.getElementById('ia-pedido').value.trim(); if (!opts.pedido) throw new Error('Escreva o que você quer mudar na foto.'); }
        (t.edit.groups || []).forEach((gr) => { const c = view.querySelector('[data-group="eg-' + gr.key + '"] [aria-pressed="true"]'); if (c) opts[gr.key] = c.dataset.value; });
        const fd = new FormData();
        fd.append('identifier', session.identifier);
        fd.append('password', session.password);
        fd.append('tool', t.id);
        fd.append('options', JSON.stringify(opts));
        if (ac) acFiles.forEach((f) => fd.append('files', f, f.name || 'arquivo'));
        else fd.append('files', workFile, workFile.name || 'arquivo');
        if (t.edit.ui === 'rec') fd.append('files', recBlob, 'minha-voz.' + (/mp4|aac/.test(recBlob.type) ? 'm4a' : 'webm'));
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 290000);
        const res = await fetch('/api/estudio-edit', { method: 'POST', body: fd, signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) { let m = 'falha desconhecida'; try { m = (await res.json()).error || m; } catch (e) {} throw new Error(m); }
        if (t.edit.ui === 'virais') {
          const data = await res.json();
          vrClips = await Promise.all((data.clips || []).map(async (c) => {
            const blob = await (await fetch('data:video/mp4;base64,' + c.base64)).blob();
            const file = new File([blob], c.name, { type: 'video/mp4' });
            return { titulo: c.titulo, inicio: c.inicio, fim: c.fim, file, url: URL.createObjectURL(file) };
          }));
          render();
          return;
        }
        const blob = await res.blob();
        result = new File([blob], res.headers.get('X-Result-Name') || ('editado-' + Date.now()), { type: blob.type });
      }
      if (ac) acDone = true;
      setWork(result, ac);
      if (/^Usa/.test(t.cost)) loadSaldo();
      document.getElementById('send-msg').innerHTML = '<div class="msg ok">✅ Pronto! Veja acima. Pode salvar, postar ou continuar editando.</div>';
    } catch (e) {
      const net = e instanceof TypeError || e.name === 'AbortError';
      msg.innerHTML = '<div class="msg err">' + esc(net ? 'A conexão caiu no meio. Tente num lugar com mais sinal ou wifi.' : e.message) + '</div>';
      btn.disabled = false;
      btn.textContent = t.edit.ui === 'virais' ? '🔥 Criar cortes virais' : '✨ Aplicar';
    }
  }

  function saveWork() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(workFile);
    a.download = workFile.name || ('cut-estudio' + (isVid(workFile) ? '.mp4' : '.jpg'));
    document.body.appendChild(a); a.click(); a.remove();
  }

  function wireEdit(t) {
    const file = document.getElementById('ed-file');
    if (file) file.addEventListener('change', () => { if (file.files[0]) setWork(file.files[0], true); });
    view.querySelectorAll('[data-ideia]').forEach((b) => b.addEventListener('click', () => { document.getElementById('ia-pedido').value = b.dataset.ideia; }));
    const acIn = document.getElementById('ac-files');
    if (acIn) acIn.addEventListener('change', () => { acFiles = [...acIn.files].slice(0, 8); acDone = false; render(); });
    view.querySelectorAll('[data-vr-save]').forEach((b) => b.addEventListener('click', () => { workFile = vrClips[+b.dataset.vrSave].file; saveWork(); }));
    view.querySelectorAll('[data-vr-post]').forEach((b) => b.addEventListener('click', () => { workFile = origFile = vrClips[+b.dataset.vrPost].file; sendPedido({ postWork: true, btn: b, title: '🔥 ' + vrClips[+b.dataset.vrPost].titulo }); }));
    const vrNew = document.getElementById('vr-new');
    if (vrNew) vrNew.addEventListener('click', () => { vrClips = []; workFile = origFile = null; render(); window.scrollTo(0, 0); });
    const acNew = document.getElementById('ac-new');
    if (acNew) acNew.addEventListener('click', () => { acFiles = []; acDone = false; render(); });
    const apply = document.getElementById('ed-apply');
    if (apply) apply.addEventListener('click', () => applyEdit(t));
    const save = document.getElementById('ed-save');
    if (save) save.addEventListener('click', saveWork);
    const post = document.getElementById('ed-post');
    if (post) post.addEventListener('click', () => sendPedido({ postWork: true }));
    const undo = document.getElementById('ed-undo');
    if (undo) undo.addEventListener('click', () => setWork(origFile, false));
    view.querySelectorAll('.ed-strip').forEach((g) => g.addEventListener('click', (e) => {
      const p = e.target.closest('.ed-chip'); if (!p) return;
      g.querySelectorAll('.ed-chip').forEach((x) => x.setAttribute('aria-pressed', x === p));
      const au = document.getElementById('ed-audio');
      if (au && g.dataset.group === 'eopt') { au.src = p.dataset.sample || ('/audio/musicas/' + p.dataset.value); au.play().catch(() => {}); }
    }));
    const recBtn = document.getElementById('rec-btn');
    if (recBtn) {
      const play = document.getElementById('rec-play');
      const timeEl = document.getElementById('rec-time');
      if (recBlob) { play.src = URL.createObjectURL(recBlob); play.hidden = false; recBtn.textContent = '🎙️ Gravar de novo'; }
      recBtn.addEventListener('click', async () => {
        if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
        let stream;
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch (e) { document.getElementById('send-msg').innerHTML = '<div class="msg err">Libere o microfone pro aplicativo e tente de novo.</div>'; return; }
        const chunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = (ev) => { if (ev.data.size) chunks.push(ev.data); };
        const started = Date.now();
        const tick = setInterval(() => {
          const s = Math.floor((Date.now() - started) / 1000);
          timeEl.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
          if (s >= 90) recorder.stop();
        }, 250);
        recorder.onstop = () => {
          clearInterval(tick);
          stream.getTracks().forEach((tr) => tr.stop());
          recBlob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
          play.src = URL.createObjectURL(recBlob); play.hidden = false;
          recBtn.classList.remove('on'); recBtn.textContent = '🎙️ Gravar de novo';
        };
        recorder.start();
        recBtn.classList.add('on'); recBtn.textContent = '⏹️ Parar';
        play.hidden = true;
      });
    }
    const media = document.getElementById('ed-media');
    const s = document.getElementById('trim-start');
    if (media && s) {
      const en = document.getElementById('trim-end');
      const upd = (moved) => {
        if (+s.value > +en.value - 0.5) { if (moved === s) s.value = Math.max(0, +en.value - 0.5); else en.value = Math.min(+en.max, +s.value + 0.5); }
        document.getElementById('trim-a').textContent = fmtTime(+s.value);
        document.getElementById('trim-b').textContent = fmtTime(+en.value);
        const len = +en.value - +s.value;
        document.getElementById('trim-len').textContent = 'Vai ficar com ' + fmtTime(len) + (len > 90 ? ' — passa de 90 s, o fim será cortado em 90 s.' : '');
        if (moved) media.currentTime = +moved.value;
      };
      media.addEventListener('loadedmetadata', () => { s.max = en.max = media.duration.toFixed(1); en.value = media.duration.toFixed(1); upd(); });
      s.addEventListener('input', () => upd(s));
      en.addEventListener('input', () => upd(en));
    }
  }

  // ===== Editor com linha do tempo (o "Novo vídeo" do CapCut) =====
  const tl = { clips: [], sel: 0, panel: '', musica: '', texto: '', textoPos: 'baixo', result: null };
  const clipLen = (c) => c.isVideo ? (c.end - c.start) / c.speed : c.imgDur;
  const tlTotal = () => tl.clips.reduce((s, c) => s + clipLen(c), 0);
  const fmtS = (s) => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');

  function addClips(files) {
    [...files].slice(0, 12 - tl.clips.length).forEach((f) => {
      const c = { file: f, url: URL.createObjectURL(f), isVideo: isVid(f), dur: 3, start: 0, end: 3, speed: 1, imgDur: 3 };
      if (c.isVideo) {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.onloadedmetadata = () => { c.dur = v.duration || 3; c.end = Math.min(c.dur, 90); render(); };
        v.src = c.url;
      }
      tl.clips.push(c);
    });
    tl.sel = Math.max(0, tl.clips.length - 1);
    tl.result = null;
    render();
  }

  function tlPanelHtml() {
    const c = tl.clips[tl.sel];
    if (!c) return '';
    const chips = (group, list, cur) => '<div class="ed-strip" data-tlgroup="' + group + '">' + list.map((x) => '<button class="ed-chip" type="button" aria-pressed="' + (String(x[0]) === String(cur)) + '" data-value="' + esc(x[0]) + '">' + esc(x[1]) + '</button>').join('') + '</div>';
    switch (tl.panel) {
      case 'cortar': return c.isVideo
        ? '<div class="ed-trim"><label>Começo <b id="tl-a">' + fmtTime(c.start) + '</b><input type="range" id="tl-start" min="0" max="' + c.dur.toFixed(1) + '" step="0.1" value="' + c.start + '"></label><label>Fim <b id="tl-b">' + fmtTime(c.end) + '</b><input type="range" id="tl-end" min="0" max="' + c.dur.toFixed(1) + '" step="0.1" value="' + c.end + '"></label></div>'
        : '<p class="hint">Foto não tem corte. Use "Duração" pra escolher quanto tempo ela aparece.</p>';
      case 'velocidade': return c.isVideo ? chips('speed', [[0.5, '0,5x'], [0.75, '0,75x'], [1, '1x'], [1.25, '1,25x'], [1.5, '1,5x'], [2, '2x'], [3, '3x']], c.speed) : '<p class="hint">Velocidade é só pra vídeo.</p>';
      case 'duracao': return c.isVideo ? '<p class="hint">Vídeo: use "Cortar" pra mudar o tempo.</p>' : chips('imgdur', [[1, '1 s'], [2, '2 s'], [3, '3 s'], [5, '5 s'], [8, '8 s']], c.imgDur);
      case 'musica': return chips('musica', [['', '🔇 Sem música']].concat(MUSICAS.map((m) => ['musica-' + m + '.mp3', '🎵 ' + m.replace(/-/g, ' ')])), tl.musica) + '<audio id="ed-audio" preload="none"></audio>';
      case 'texto': return '<input class="input" id="tl-texto" maxlength="120" placeholder="Texto que aparece no vídeo todo (opcional)" value="' + esc(tl.texto) + '">' + chips('textopos', [['baixo', '⬇️ Embaixo'], ['meio', '⏺️ No meio']], tl.textoPos);
      default: return '<p class="hint">Toque num trecho da faixa e escolha uma ferramenta acima.</p>';
    }
  }

  function renderTimeline() {
    titleEl.textContent = 'Novo vídeo';

    }
    const c = tl.clips[tl.sel];
    const total = tlTotal();
    const stage = !c

    const tools = [['cortar', '✂️', 'Cortar'], ['velocidade', '⏩', 'Velocidade'], ['duracao', '⏱️', 'Duração'], ['duplicar', '📄', 'Duplicar'], ['esq', '⬅️', 'Mover'], ['dir', '➡️', 'Mover'], ['excluir', '🗑️', 'Excluir'], ['musica', '🎵', 'Música'], ['texto', '🔤', 'Texto']];
    return '<div class="screen editor">' + stage +
      (tl.clips.length ? '<p class="tl-total' + (total > 90 ? ' over' : '') + '">Total: ' + fmtS(total) + ' de 1:30' + (tl.musica ? ' · 🎵' : '') + (tl.texto ? ' · 🔤' : '') + '</p>' +

        '<div class="tl-panel">' + tlPanelHtml() + '</div>' : '<p class="note">Coloque vídeos e fotos na linha do tempo. Depois você corta, muda a velocidade, a ordem, põe música e texto, e exporta.</p>') +
      '<div id="send-msg"></div>' +

  function wireTimeline() {
    const add = document.getElementById('tl-add');
    if (add) add.addEventListener('change', () => addClips(add.files));
    view.querySelectorAll('[data-clip]').forEach((b) => b.addEventListener('click', () => { tl.sel = +b.dataset.clip; render(); }));
    view.querySelectorAll('[data-tlt]').forEach((b) => b.addEventListener('click', () => {
      const a = b.dataset.tlt;
      const i = tl.sel;
      if (a === 'duplicar') { tl.clips.splice(i + 1, 0, { ...tl.clips[i] }); tl.sel = i + 1; }
      else if (a === 'esq' && i > 0) { [tl.clips[i - 1], tl.clips[i]] = [tl.clips[i], tl.clips[i - 1]]; tl.sel = i - 1; }
      else if (a === 'dir' && i < tl.clips.length - 1) { [tl.clips[i + 1], tl.clips[i]] = [tl.clips[i], tl.clips[i + 1]]; tl.sel = i + 1; }
      else if (a === 'excluir') { tl.clips.splice(i, 1); tl.sel = Math.max(0, i - 1); }
      else tl.panel = tl.panel === a ? '' : a;
      render();
    }));
    view.querySelectorAll('[data-tlgroup]').forEach((g) => g.addEventListener('click', (e) => {
      const p = e.target.closest('.ed-chip'); if (!p) return;
      const c = tl.clips[tl.sel];
      const v = p.dataset.value;
      if (g.dataset.tlgroup === 'speed') c.speed = +v;
      if (g.dataset.tlgroup === 'imgdur') c.imgDur = +v;
      if (g.dataset.tlgroup === 'textopos') tl.textoPos = v;
      if (g.dataset.tlgroup === 'musica') { tl.musica = v; const au = document.getElementById('ed-audio'); if (au && v) { au.src = '/audio/musicas/' + v; au.play().catch(() => {}); } }
      render();
    }));
    const txt = document.getElementById('tl-texto');
    if (txt) txt.addEventListener('change', () => { tl.texto = txt.value.trim(); render(); });
    const media = document.getElementById('tl-media');
    const c = tl.clips[tl.sel];
    if (media && c) {
      media.addEventListener('loadedmetadata', () => { media.currentTime = c.start; media.playbackRate = c.speed; });
      media.addEventListener('timeupdate', () => { if (media.currentTime >= c.end) { media.pause(); media.currentTime = c.start; } });
    }
    const s = document.getElementById('tl-start');
    if (s && c) {
      const en = document.getElementById('tl-end');
      const upd = (moved) => {
        if (+s.value > +en.value - 0.3) { if (moved === s) s.value = Math.max(0, +en.value - 0.3); else en.value = Math.min(c.dur, +s.value + 0.3); }
        c.start = +s.value; c.end = +en.value;
        document.getElementById('tl-a').textContent = fmtTime(c.start);
        document.getElementById('tl-b').textContent = fmtTime(c.end);
        if (media) media.currentTime = +moved.value;
      };
      s.addEventListener('input', () => upd(s));
      en.addEventListener('input', () => upd(en));
      [s, en].forEach((r) => r.addEventListener('change', render));
    }
    const exp = document.getElementById('tl-export');
    if (exp) exp.addEventListener('click', exportTimeline);
    const back = document.getElementById('tl-back');
    if (back) back.addEventListener('click', () => { tl.result = null; render(); });
    const save = document.getElementById('ed-save');
    if (save) save.addEventListener('click', saveWork);
    const post = document.getElementById('ed-post');
    if (post) post.addEventListener('click', () => sendPedido({ postWork: true }));
  }

  async function exportTimeline() {
    const btn = document.getElementById('tl-export');
    const msg = document.getElementById('send-msg');
    btn.disabled = true; btn.textContent = '⏳ Exportando… (pode levar 1 a 2 minutos)'; msg.innerHTML = '';
    // Cada arquivo vai uma vez só; os trechos apontam pro arquivo deles.
    const files = [];
    const clips = tl.clips.map((c) => {
      let idx = files.indexOf(c.file);
      if (idx < 0) { files.push(c.file); idx = files.length - 1; }
      return c.isVideo ? { file: idx, start: +c.start.toFixed(2), end: +c.end.toFixed(2), speed: c.speed } : { file: idx, dur: c.imgDur };
    });
    try {
      const fd = new FormData();
      fd.append('identifier', session.identifier);
      fd.append('password', session.password);
      fd.append('tool', 'timeline');
      fd.append('options', JSON.stringify({ clips, musica: tl.musica, texto: tl.texto, textoPos: tl.textoPos }));
      files.forEach((f) => fd.append('files', f, f.name || 'arquivo'));
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 290000);
      const res = await fetch('/api/estudio-edit', { method: 'POST', body: fd, signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) { let m = 'falha desconhecida'; try { m = (await res.json()).error || m; } catch (e) {} throw new Error(m); }
      const blob = await res.blob();
      tl.result = new File([blob], res.headers.get('X-Result-Name') || 'cut-estudio.mp4', { type: 'video/mp4' });
      workFile = origFile = tl.result;
      render();
    } catch (e) {
      const net = e instanceof TypeError || e.name === 'AbortError';
      msg.innerHTML = '<div class="msg err">' + esc(net ? 'A conexão caiu no meio. Tente num lugar com mais sinal ou wifi.' : e.message) + '</div>';
      btn.disabled = false; btn.textContent = '⬆️ Exportar vídeo';
    }
  }
