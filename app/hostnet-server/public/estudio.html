<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Estúdio — Máquina de Vendas Online</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0d12" />
<link rel="icon" href="/img/icons/favicon-32.png" sizes="32x32" />
<script src="/js/brand.js"></script>
<style>
  /* Estúdio (Franklin, 2026-10-16): editor de imagem e vídeo inspirado no
     CapCut — abas Criar · Modelos · Meus · Postar. Fase 1: os Modelos de
     efeito e 3 ferramentas (Banner, Criar imagem, Foto em movimento) já
     funcionam, mandando o pedido pelo mesmo /api/commit do Postar (geração +
     aprovação de sempre). As outras ferramentas aparecem como "em breve". */
  :root {
    --bg: #0a0d12;
    --panel: #12161f;
    --panel-2: #181d28;
    --border: #232a37;
    --text: #f2f2f0;
    --muted: #b7bfcc;
    --accent: #ff5a36;
    --cyan: #33d6cb;
    --violet: #8b7cf6;
    --green: #35d07f;
    --gold: #f5c542;
    --on-accent: #1a0703;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.45;
  }
  .app {
    max-width: 480px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 120px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    display: flex; align-items: center; gap: 10px;
    padding-block: calc(12px + env(safe-area-inset-top, 0px)) 10px; border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 1.3rem; margin: 0; flex: 1; }
  .topbar h1 small { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .pill-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text); text-decoration: none;
    border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  button:focus-visible, a:focus-visible, label:focus-within { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .screen { display: grid; gap: 18px; padding-block: 16px 0; }
  .section-title { font-size: 0.78rem; font-weight: 800; color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase; margin: 0; }
  .note { font-size: 0.88rem; color: var(--muted); margin: 0; }

  .big-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .big-btn {
    border: none; border-radius: 20px; padding: 22px 12px; cursor: pointer; font: inherit;
    display: grid; gap: 8px; justify-items: center; font-weight: 800; font-size: 1.05rem;
  }
  .big-btn .ico { font-size: 2rem; line-height: 1; }
  .big-btn.video { background: var(--accent); color: var(--on-accent); }
  .big-btn.image { background: var(--cyan); color: #04211e; }

  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tool {
    position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; color: var(--text);
    padding: 14px 6px; display: grid; gap: 6px; justify-items: center; text-align: center; cursor: pointer; font: inherit; font-size: 0.82rem; font-weight: 700;
  }
  .tool .ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 1.35rem; background: var(--panel-2); }
  .tool.v .ico { background: rgba(255, 90, 54, 0.16); }
  .tool.i .ico { background: rgba(51, 214, 203, 0.16); }
  .tool.a .ico { background: rgba(139, 124, 246, 0.18); }
  .tool .cost { font-size: 0.66rem; font-weight: 700; color: var(--muted); }
  .tool.soon { opacity: 0.55; }
  .tool .soon-tag { position: absolute; top: 6px; right: 6px; font-size: 0.58rem; font-weight: 800; background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 2px 6px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 0.88rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .models { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .model { background: none; border: none; padding: 0; text-align: left; color: var(--text); cursor: pointer; font: inherit; display: grid; gap: 6px; }
  .preview { position: relative; aspect-ratio: 9 / 14; max-width: 100%; border-radius: 16px; overflow: hidden; display: grid; place-items: center; }
  .preview .obj { font-size: 3.2rem; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.5)); }
  .preview .badge { position: absolute; top: 8px; left: 8px; font-size: 0.64rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,0.55); color: #fff; }
  .preview .badge.simple { background: var(--green); color: #052313; }
  .model-name { font-weight: 800; font-size: 0.92rem; }
  .model-sub { font-size: 0.76rem; color: var(--muted); margin-top: -4px; }

  @keyframes rise { 0% { transform: translateY(70%) scale(0.7); } 55%,100% { transform: translateY(0) scale(1); } }
  @keyframes floaty { 0%,100% { transform: translateY(-8px) rotate(-4deg); } 50% { transform: translateY(8px) rotate(4deg); } }
  @keyframes spin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
  @keyframes zoomin { 0% { transform: scale(0.8); } 100% { transform: scale(1.25); } }
  @keyframes slide { 0%,100% { transform: translateX(-60%); } 50% { transform: translateX(60%); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes drop { 0% { transform: translateY(-120%); } 60% { transform: translateY(6%); } 75%,100% { transform: translateY(0); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-3deg); } 75% { transform: translateX(6px) rotate(3deg); } }
  .fx-rise .obj { animation: rise 2.6s ease-out infinite; }
  .fx-float .obj { animation: floaty 3s ease-in-out infinite; }
  .fx-spin .obj { animation: spin 3.2s linear infinite; }
  .fx-zoom .obj { animation: zoomin 3s ease-in-out infinite alternate; }
  .fx-slide .obj { animation: slide 4s ease-in-out infinite; }
  .fx-pulse .obj { animation: pulse 1.4s ease-in-out infinite; }
  .fx-drop .obj { animation: drop 2.4s cubic-bezier(.3,1.4,.5,1) infinite; }
  .fx-shake .obj { animation: shake 0.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .preview .obj { animation: none !important; } }

  .detail .preview { aspect-ratio: 9 / 12; }
  .detail .preview .obj { font-size: 5rem; }
  .detail p { margin: 0; color: var(--muted); }
  .step { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
  .step h3 { margin: 0; font-size: 0.95rem; }
  .step h3 span { color: var(--accent); margin-right: 6px; }
  .upload { position: relative; display: grid; place-items: center; gap: 6px; border: 2px dashed var(--border); border-radius: 14px; padding: 18px; cursor: pointer; color: var(--muted); font-weight: 700; text-align: center; }
  .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .upload .thumbs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .upload img { max-height: 120px; max-width: 100%; border-radius: 10px; }
  textarea.input { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 10px; font: inherit; resize: vertical; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 2px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 999px; padding: 9px 14px; font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  .pill[aria-pressed="true"] { border-color: var(--accent); background: rgba(255, 90, 54, 0.16); }
  .go { border: none; border-radius: 16px; padding: 16px; font: inherit; font-weight: 800; font-size: 1.08rem; background: var(--accent); color: var(--on-accent); cursor: pointer; text-align: center; text-decoration: none; display: block; }
  .go:disabled { opacity: 0.45; cursor: not-allowed; }
  .go.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .hint { font-size: 0.82rem; color: var(--muted); margin: -6px 0 0; }
  .msg { border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 0.9rem; }
  .msg.err { background: rgba(255, 90, 54, 0.14); border: 1px solid var(--accent); }
  .msg.ok { background: rgba(53, 208, 127, 0.14); border: 1px solid var(--green); }

  .mine-list { display: grid; gap: 10px; }
  .mine-item { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: grid; gap: 6px; }
  .mine-item .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .mine-item strong { font-size: 0.95rem; }
  .mine-item time { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { font-size: 0.82rem; font-weight: 800; }
  .status.wait { color: var(--gold); }
  .status.ready { color: var(--cyan); }
  .status.done { color: var(--green); }
  .status.fail { color: var(--accent); }
  .mine-item a { color: var(--cyan); font-weight: 800; font-size: 0.88rem; }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); border: 1px dashed var(--border); border-radius: 16px; }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--panel); border-top: 1px solid var(--border);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
    padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tabbar-inner { max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; }
  .tab { background: none; border: none; color: var(--muted); font: inherit; font-size: 0.76rem; font-weight: 700; display: grid; justify-items: center; gap: 4px; cursor: pointer; padding: 2px 6px; }
  .tab .chip-ico { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; background: var(--panel-2); }
  .tab[aria-current="page"] { color: var(--text); }
  .tab[aria-current="page"] .chip-ico { background: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="pill-btn" id="back-btn" type="button" hidden>← Voltar</button>
    <h1><small>Máquina de Vendas Online</small><span id="screen-title">Estúdio</span></h1>
    <a class="pill-btn" href="/" id="home-link">App</a>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Abas do Estúdio">
  <div class="tabbar-inner">
    <button class="tab" type="button" data-tab="criar"><span class="chip-ico">✏️</span>Criar</button>
    <button class="tab" type="button" data-tab="modelos"><span class="chip-ico">✨</span>Modelos</button>
    <button class="tab" type="button" data-tab="meus"><span class="chip-ico">📁</span>Meus</button>
    <button class="tab" type="button" data-tab="postar"><span class="chip-ico">📤</span>Postar</button>
  </div>
</nav>

<script>
(function () {
  const HANDOFF_KEY = 'mvo_report_handoff';
  const MINE_KEY = 'mvo_estudio_pedidos';
  let session = null;
  try {
    session = JSON.parse(localStorage.getItem(HANDOFF_KEY) || localStorage.getItem('mvo_admin_session') || localStorage.getItem('mvo_session') || 'null');
  } catch (e) { session = null; }
  if (!session || !session.identifier) { window.location.href = '/'; return; }

  // Ferramentas. k: v = vídeo, i = imagem, a = IA. send = monta o pedido
  // (sem send = "em breve").
  const TOOLS = [
    { id: 'movimento', k: 'a', ico: '🎬', name: 'Foto em movimento', cost: 'Usa 1 vídeo em movimento', desc: 'Sua foto vira um vídeo com movimento de verdade, com narração e música.', media: 'image', opts: ['Zoom lento chegando perto', 'Produto girando devagar', 'Produto flutuando'], video: true,
      send: (opt) => ({ text: 'Movimento do vídeo: ' + opt.toLowerCase() + ', câmera suave, o produto da foto continua exatamente igual.', motion: true }) },
    { id: 'banner', k: 'i', ico: '📰', name: 'Banner', cost: 'Usa 1 imagem', desc: 'Sua foto vira um banner pronto pra postar.', media: 'image', opts: ['Oferta', 'Novidade', 'Chamada pro WhatsApp'],
      send: (opt) => ({ text: 'Faça 1 banner com a foto que anexei. Estilo do banner: ' + opt + '. Não crie vídeo, só o banner.' }) },
    { id: 'criar-img', k: 'a', ico: '🖼️', name: 'Criar imagem', cost: 'Usa 1 imagem', desc: 'Descreva e a IA cria a imagem pra você.', media: 'none', opts: ['Foto de produto', 'Banner de promoção', 'Fachada da loja'],
      send: (opt, desc) => ({ text: 'Crie 1 imagem (' + opt.toLowerCase() + '): ' + desc + '. Não crie vídeo, só a imagem.' }) },
    { id: 'cortar', k: 'v', ico: '✂️', name: 'Cortar vídeo', cost: 'Grátis' },
    { id: 'velocidade', k: 'v', ico: '⏩', name: 'Velocidade', cost: 'Grátis' },
    { id: 'musica', k: 'v', ico: '🎵', name: 'Música', cost: 'Grátis' },
    { id: 'narracao', k: 'a', ico: '🎙️', name: 'Narração', cost: 'Grátis' },
    { id: 'legenda', k: 'v', ico: '💬', name: 'Legenda no vídeo', cost: 'Grátis' },
    { id: 'melhorar', k: 'i', ico: '🪄', name: 'Melhorar foto', cost: 'Grátis' },
    { id: 'fundo', k: 'i', ico: '🧽', name: 'Tirar fundo', cost: 'Usa 1 imagem' },
    { id: 'texto', k: 'i', ico: '🔤', name: 'Texto na foto', cost: 'Grátis' },
    { id: 'formato', k: 'i', ico: '📐', name: 'Tamanho certo', cost: 'Grátis' }
  ];

  // Objetivo do vídeo — entra no pedido pra narração/legenda seguirem o tom.
  // Regra fixa: nunca preço (a IA já tira, mas o texto aqui também não pede).
  const GOALS = [
    { label: '💰 Ofertar', text: 'Objetivo do vídeo: ofertar o produto — narração com chamada forte pra comprar agora e chamar no WhatsApp, com urgência.' },
    { label: '👀 Mostrar o produto', text: 'Objetivo do vídeo: mostrar o produto em detalhes — narração destacando qualidade, acabamento e para que serve.' },
    { label: '⭐ Divulgar a marca', text: 'Objetivo do vídeo: divulgar a marca — tom elegante, falando da empresa, confiança e atendimento.' }
  ];

  // move = descrição do movimento mandada pro Veo (vira o pedido do cliente).
  const CATS = [
    { id: 'produto', label: '📦 Efeitos de produto', motion: true, note: 'Seu produto ganha vida com IA. Cada vídeo usa 1 vídeo em movimento do seu plano.', models: [
      { name: 'Surgindo do chão', sub: 'O piso quebra e o produto aparece', obj: '🍳', fx: 'fx-rise', bg: 'linear-gradient(160deg,#1d2230,#05070b)',
        move: 'o piso se quebra em pedaços e o produto da foto surge de baixo do chão, subindo devagar até o centro, com poeira e pedacinhos de piso voando; luz de estúdio dramática' },
      { name: 'Miniaturas trabalhando', sub: 'Operários pequenos cuidando do produto', obj: '🧱', fx: 'fx-shake', bg: 'linear-gradient(160deg,#c9a46b,#6b4a22)',
        move: 'pequenos operários em miniatura, de capacete e colete, trabalham em volta do produto da foto — limpando, polindo e conferindo — enquanto a câmera se aproxima devagar' },
      { name: 'Estúdio de vitrine', sub: 'Luz de estúdio girando em volta', obj: '🧴', fx: 'fx-spin', bg: 'radial-gradient(circle at 50% 30%,#4a4f63,#0b0d14)',
        move: 'o produto da foto num pedestal de estúdio, com refletores acendendo um a um e a câmera girando devagar em volta dele, reflexos brilhando na superfície' },
      { name: 'Flutuando no céu', sub: 'O produto voando entre nuvens', obj: '🎧', fx: 'fx-float', bg: 'linear-gradient(180deg,#6fb7ff,#d9efff)',
        move: 'o produto da foto flutua suavemente entre nuvens brancas num céu azul, balançando de leve, com raios de sol passando por trás' },
      { name: 'Caindo com confete', sub: 'Chega com festa e cor', obj: '🎁', fx: 'fx-drop', bg: 'linear-gradient(160deg,#ff5a36,#8b7cf6)',
        move: 'o produto da foto cai do alto e pousa no centro com um pequeno quique, e uma chuva de confetes coloridos explode em volta' },
      { name: 'Abrindo a caixa', sub: 'Unboxing com brilho', obj: '📦', fx: 'fx-pulse', bg: 'linear-gradient(160deg,#2a1f12,#c98a3a)',
        move: 'uma caixa de presente se abre sozinha e o produto da foto sobe de dentro dela, com brilhos dourados saindo da caixa' }
    ]},
    { id: 'jogo', label: '⚽ Dia de jogo', motion: true, note: 'Ótimo pra comércio de comida: lanche, bebida, combo. Cada vídeo usa 1 vídeo em movimento.', models: [
      { name: 'Combo do jogo', sub: 'O lanche entrando em campo', obj: '🍔', fx: 'fx-rise', bg: 'linear-gradient(180deg,#0d5b2c,#05250f)',
        move: 'o lanche da foto entra num gramado de estádio iluminado à noite, como um jogador entrando em campo, com a torcida ao fundo e refletores acesos' },
      { name: 'Placar da oferta', sub: 'O produto no telão do estádio', obj: '🍕', fx: 'fx-pulse', bg: 'linear-gradient(180deg,#14213d,#000)',
        move: 'o produto da foto aparece no telão gigante de um estádio, com luzes piscando em volta e fumaça de festa subindo' },
      { name: 'Gol de sabor', sub: 'O petisco entra no gol', obj: '🍟', fx: 'fx-drop', bg: 'linear-gradient(180deg,#1a7a3e,#0b3d1f)',
        move: 'o produto da foto voa em câmera lenta em direção ao gol e balança a rede, com papel picado caindo na comemoração' },
      { name: 'Torcida na loja', sub: 'Bandeirinhas e bebida gelada', obj: '🥤', fx: 'fx-shake', bg: 'linear-gradient(160deg,#f5c542,#0d5b2c)',
        move: 'o produto da foto sobre um balcão enfeitado com bandeirinhas verde e amarelo, gotas geladas escorrendo e bandeirinhas balançando com o vento' }
    ]},
    { id: 'gratis', label: '🎁 Efeitos gratuitos', motion: false, multi: true, note: 'Não gastam vídeo em movimento: usam suas fotos com zoom, transições, narração e música. Contam como 1 vídeo comum do plano. Pode mandar até 5 fotos.', models: [
      { name: 'Zoom suave', sub: 'A foto vai chegando perto', obj: '🛋️', fx: 'fx-zoom', bg: 'linear-gradient(160deg,#30384a,#12161f)',
        move: 'zoom suave em cada foto, chegando perto devagar, com transições leves' },
      { name: 'Fotos deslizando', sub: 'Carrossel de fotos em sequência', obj: '🖼️', fx: 'fx-slide', bg: 'linear-gradient(160deg,#1c3a4a,#0a1620)',
        move: 'as fotos passam deslizando de lado, uma depois da outra, como um carrossel' },
      { name: 'Chamada pulsando', sub: 'Ritmo forte de oferta', obj: '🔥', fx: 'fx-pulse', bg: 'linear-gradient(160deg,#5a1a10,#1a0703)',
        move: 'trocas rápidas de foto no ritmo da música, com efeito de pulsar a cada batida' },
      { name: 'Antes e depois', sub: 'Mostra a diferença', obj: '🪣', fx: 'fx-slide', bg: 'linear-gradient(90deg,#3a3f4a 50%,#1f6b5f 50%)',
        move: 'primeira foto como o ANTES e a segunda como o DEPOIS, com uma cortina passando de um lado pro outro revelando a diferença' }
    ]}
  ];

  const view = document.getElementById('view');
  const titleEl = document.getElementById('screen-title');
  const backBtn = document.getElementById('back-btn');
  let tab = 'criar';
  let cat = 'produto';
  let stack = [];
  let pickedFiles = [];

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function loadMine() { try { return JSON.parse(localStorage.getItem(MINE_KEY) || '[]'); } catch (e) { return []; } }
  function saveMine(list) { try { localStorage.setItem(MINE_KEY, JSON.stringify(list.slice(0, 30))); } catch (e) {} }

  function setTab(t) {
    tab = t; stack = [];
    document.querySelectorAll('.tab').forEach((b) => { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    render();
  }
  function push(s) { stack.push(s); pickedFiles = []; render(); window.scrollTo(0, 0); }
  backBtn.addEventListener('click', () => { stack.pop(); pickedFiles = []; render(); });

  function toolCard(t) {
    return '<button class="tool ' + t.k + (t.send ? '' : ' soon') + '" type="button" data-tool="' + t.id + '">' +
      (t.send ? '' : '<span class="soon-tag">em breve</span>') +
      '<span class="ico">' + t.ico + '</span>' + esc(t.name) + '<span class="cost">' + esc(t.cost) + '</span></button>';
  }

  function uploadBox(multi, accept) {
    return '<label class="upload"><input type="file" id="up-file" accept="' + accept + '"' + (multi ? ' multiple' : '') + '>' +
      '<span id="up-text">📎 Toque para escolher ' + (multi ? 'as fotos (até 5)' : 'a foto') + '</span><span class="thumbs" id="up-thumbs"></span></label>';
  }

  function renderCriar() {
    titleEl.textContent = 'Estúdio';
    return '<div class="screen">' +
      '<div class="big-row">' +
        '<button class="big-btn video" type="button" data-goto="modelos"><span class="ico">🎬</span>Novo vídeo</button>' +
        '<button class="big-btn image" type="button" data-tool="banner"><span class="ico">🖼️</span>Nova imagem</button>' +
      '</div>' +
      '<p class="note">Comece por um modelo pronto ou escolha uma ferramenta. Tudo o que você cria passa pela sua aprovação antes de publicar.</p>' +
      '<h2 class="section-title">Ferramentas</h2>' +
      '<div class="tools">' + TOOLS.map(toolCard).join('') + '</div>' +
    '</div>';
  }

  function renderSoon(t) {
    titleEl.textContent = t.name;
    return '<div class="screen detail">' +
      '<div class="empty"><div style="font-size:2.4rem">' + t.ico + '</div><p><strong>' + esc(t.name) + '</strong> chega em breve no Estúdio.</p></div>' +
      '<p>Enquanto isso, você pode pedir pelo Postar: anexe o arquivo e escreva o que quer, como "' + esc(t.name.toLowerCase()) + '".</p>' +
      '<a class="go secondary" href="/">Ir para o Postar</a>' +
    '</div>';
  }

  function renderTool(t) {
    titleEl.textContent = t.name;
    return '<div class="screen detail">' +
      '<p>' + esc(t.desc) + ' <strong>' + esc(t.cost) + '.</strong></p>' +
      (t.media === 'none'
        ? '<div class="step"><h3><span>1</span>Descreva a imagem</h3><textarea class="input" id="desc-input" rows="3" placeholder="Ex.: uma bancada de inox numa cozinha de restaurante, bem iluminada"></textarea></div>'
        : '<div class="step"><h3><span>1</span>Envie a foto</h3>' + uploadBox(false, 'image/*') + '</div>') +
      '<div class="step"><h3><span>2</span>Escolha</h3><div class="pills" data-group="opt">' + t.opts.map((o, n) => '<button class="pill" type="button" aria-pressed="' + (n === 0) + '" data-value="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div></div>' +
      (t.video ? '<div class="step"><h3><span>3</span>Pra que é esse vídeo?</h3><div class="pills" data-group="goal">' + GOALS.map((g, n) => '<button class="pill" type="button" aria-pressed="false" data-goal="' + n + '">' + g.label + '</button>').join('') + '</div></div>' : '') +
      '<div id="send-msg"></div>' +
      '<button class="go" type="button" id="send-btn" disabled>' + (t.video ? 'Criar meu vídeo' : 'Criar') + '</button>' +
      '<p class="hint" id="send-hint">Preencha os passos acima.</p>' +
    '</div>';
  }

  function renderModelos() {
    titleEl.textContent = 'Modelos';
    const c = CATS.find((x) => x.id === cat);
    return '<div class="screen">' +
      '<div class="chips">' + CATS.map((x) => '<button class="chip" type="button" data-cat="' + x.id + '" aria-pressed="' + (x.id === cat) + '">' + esc(x.label) + '</button>').join('') + '</div>' +
      '<p class="note">' + esc(c.note) + '</p>' +
      '<div class="models">' + c.models.map((m, n) =>
        '<button class="model" type="button" data-model="' + n + '">' +
          '<div class="preview ' + m.fx + '" style="background:' + m.bg + '"><span class="badge' + (c.motion ? '' : ' simple') + '">' + (c.motion ? 'IA' : 'SEM MOVIMENTO IA') + '</span><span class="obj">' + m.obj + '</span></div>' +
          '<span class="model-name">' + esc(m.name) + '</span><span class="model-sub">' + esc(m.sub) + '</span>' +
        '</button>').join('') + '</div>' +
    '</div>';
  }

  function renderModelo(n) {
    const c = CATS.find((x) => x.id === cat);
    const m = c.models[n];
    titleEl.textContent = m.name;
    return '<div class="screen detail">' +
      '<div class="preview ' + m.fx + '" style="background:' + m.bg + '"><span class="badge' + (c.motion ? '' : ' simple') + '">' + (c.motion ? 'IA' : 'SEM MOVIMENTO IA') + '</span><span class="obj">' + m.obj + '</span></div>' +
      '<p>' + esc(m.sub) + '. ' + (c.motion ? 'Usa 1 vídeo em movimento do seu plano.' : 'Conta como 1 vídeo comum do plano.') + '</p>' +
      '<div class="step"><h3><span>1</span>Envie ' + (c.multi ? 'as fotos' : 'a foto do seu produto') + '</h3>' + uploadBox(!!c.multi, 'image/*') + '</div>' +
      '<div class="step"><h3><span>2</span>Pra que é esse vídeo?</h3><div class="pills" data-group="goal">' + GOALS.map((g, i) => '<button class="pill" type="button" aria-pressed="false" data-goal="' + i + '">' + g.label + '</button>').join('') + '</div></div>' +
      '<div id="send-msg"></div>' +
      '<button class="go" type="button" id="send-btn" disabled>Criar meu vídeo</button>' +
      '<p class="hint" id="send-hint">Envie a foto e escolha pra que é o vídeo.</p>' +
    '</div>';
  }

  function statusHtml(st) {
    if (st === 'done') return '<span class="status done">✅ Aprovado e publicado</span>';
    if (st === 'ready') return '<span class="status ready">🔔 Pronto pra você aprovar</span>';
    if (st === 'fail') return '<span class="status fail">❌ Não deu certo — tente de novo</span>';
    return '<span class="status wait">⏳ Criando…</span>';
  }

  function renderMeus() {
    titleEl.textContent = 'Meus';
    const list = loadMine();
    if (!list.length) {
      return '<div class="screen"><div class="empty"><div style="font-size:2.2rem">📁</div><p>Aqui aparece tudo o que você criar no Estúdio.</p></div>' +
        '<button class="go" type="button" data-goto="modelos">✨ Criar meu primeiro vídeo</button></div>';
    }
    return '<div class="screen"><p class="note">Toque em "Ver e aprovar" quando ficar pronto. Só publica depois que você aprovar.</p><div class="mine-list">' +
      list.map((p, i) => '<div class="mine-item" data-idx="' + i + '"><div class="top"><strong>' + esc(p.title) + '</strong><time>' + new Date(p.at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</time></div>' +
        '<div class="st">' + statusHtml(p.status) + '</div>' +
        '<a href="/aprovacao.html?client=' + encodeURIComponent(p.client) + '&pasta=' + encodeURIComponent(p.pasta) + '">Ver e aprovar →</a></div>').join('') +
      '</div></div>';
  }

  function renderPostar() {
    titleEl.textContent = 'Postar';
    return '<div class="screen detail">' +
      '<p>O que você cria no Estúdio já vai para a aprovação. Ao aprovar, publica nas suas redes conectadas.</p>' +
      '<p>Para postar uma foto ou vídeo do jeito que já está, use o Postar do aplicativo.</p>' +
      '<a class="go" href="/">📤 Abrir o Postar</a>' +
      '<button class="go secondary" type="button" data-goto="meus">📁 Ver o que eu criei</button>' +
    '</div>';
  }

  function render() {
    const top = stack[stack.length - 1];
    backBtn.hidden = !top;
    let html;
    if (!top) html = { criar: renderCriar, modelos: renderModelos, meus: renderMeus, postar: renderPostar }[tab]();
    else if (top.type === 'tool') { const t = TOOLS.find((x) => x.id === top.id); html = t.send ? renderTool(t) : renderSoon(t); }
    else if (top.type === 'modelo') html = renderModelo(top.n);
    view.innerHTML = html;
    wire();
    if (!top && tab === 'meus') refreshMine();
  }

  function pressed(group) { const p = view.querySelector('[data-group="' + group + '"] .pill[aria-pressed="true"]'); return p || null; }

  function checkReady() {
    const btn = document.getElementById('send-btn');
    if (!btn) return;
    const top = stack[stack.length - 1];
    let ok = true;
    let why = '';
    const needsGoal = !!view.querySelector('[data-group="goal"]');
    const desc = document.getElementById('desc-input');
    if (desc) { if (!desc.value.trim()) { ok = false; why = 'Descreva a imagem.'; } }
    else if (!pickedFiles.length) { ok = false; why = 'Envie a foto.'; }
    if (ok && needsGoal && !pressed('goal')) { ok = false; why = 'Escolha pra que é o vídeo.'; }
    btn.disabled = !ok;
    document.getElementById('send-hint').textContent = ok ? 'Pronto! Toque no botão para criar.' : why;
    return top;
  }

  function wire() {
    view.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => push({ type: 'tool', id: b.dataset.tool })));
    view.querySelectorAll('[data-goto]').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.goto)));
    view.querySelectorAll('[data-cat]').forEach((b) => b.addEventListener('click', () => { cat = b.dataset.cat; render(); }));
    view.querySelectorAll('[data-model]').forEach((b) => b.addEventListener('click', () => push({ type: 'modelo', n: +b.dataset.model })));
    view.querySelectorAll('.pills').forEach((g) => g.addEventListener('click', (e) => {
      const p = e.target.closest('.pill'); if (!p) return;
      g.querySelectorAll('.pill').forEach((x) => x.setAttribute('aria-pressed', x === p));
      checkReady();
    }));
    const desc = document.getElementById('desc-input');
    if (desc) desc.addEventListener('input', checkReady);
    const file = document.getElementById('up-file');
    if (file) file.addEventListener('change', () => {
      pickedFiles = [...file.files].slice(0, file.multiple ? 5 : 1);
      const thumbs = document.getElementById('up-thumbs');
      thumbs.innerHTML = '';
      document.getElementById('up-text').textContent = pickedFiles.length ? '📎 Trocar' : '📎 Toque para escolher';
      pickedFiles.forEach((f) => { const img = document.createElement('img'); img.alt = 'Sua foto'; img.src = URL.createObjectURL(f); thumbs.appendChild(img); });
      checkReady();
    });
    const send = document.getElementById('send-btn');
    if (send) send.addEventListener('click', sendPedido);
  }

  // Monta o pedido igual ao Postar: o texto vira o instrucoes.txt
  // ("Cliente: ..."), e o vídeo em movimento liga motionVideo+motionExtend
  // (regra: todo vídeo em movimento é o vídeo longo).
  async function sendPedido() {
    const top = stack[stack.length - 1];
    const btn = document.getElementById('send-btn');
    const msg = document.getElementById('send-msg');
    let text, motion = false, isVideo = false, title;
    const goalEl = pressed('goal');
    const goalText = goalEl ? GOALS[+goalEl.dataset.goal].text : '';
    if (top.type === 'modelo') {
      const c = CATS.find((x) => x.id === cat);
      const m = c.models[top.n];
      motion = !!c.motion; isVideo = true; title = '🎬 ' + m.name;
      text = c.motion
        ? 'Quero um vídeo com o efeito "' + m.name + '". Movimento do vídeo: ' + m.move + '. O produto da foto continua exatamente igual, sem mudar formato, cor nem letras. ' + goalText
        : 'Faça um vídeo com as fotos que anexei (sem vídeo em movimento), efeito "' + m.name + '": ' + m.move + '. ' + goalText;
    } else {
      const t = TOOLS.find((x) => x.id === top.id);
      const opt = (pressed('opt') || {}).dataset ? pressed('opt').dataset.value : t.opts[0];
      const descEl = document.getElementById('desc-input');
      const built = t.send(opt, descEl ? descEl.value.trim() : '');
      text = built.text + (goalText ? ' ' + goalText : '');
      motion = !!built.motion; isVideo = !!t.video; title = t.ico + ' ' + t.name;
    }

    btn.disabled = true;
    btn.textContent = 'Enviando...';
    msg.innerHTML = '';
    const fd = new FormData();
    fd.append('identifier', session.identifier);
    fd.append('password', session.password);
    fd.append('instruction', 'Cliente: ' + text);
    if (motion) { fd.append('motionVideo', 'true'); fd.append('motionExtend', 'true'); }
    if (isVideo) fd.append('format', JSON.stringify(['reels']));
    pickedFiles.forEach((f) => fd.append('files', f, f.name));
    fd.append('requestId', (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2)));
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 180000);
      const res = await fetch('/api/commit', { method: 'POST', body: fd, signal: ctrl.signal });
      clearTimeout(timer);
      const result = await res.json();
      if (!(res.ok || res.status === 207)) throw new Error(result.error || 'falha desconhecida');
      const pasta = String(result.subfolder || '').split('/').pop();
      const list = loadMine();
      list.unshift({ client: result.client, pasta, title, at: Date.now(), status: 'wait' });
      saveMine(list);
      msg.innerHTML = '<div class="msg ok">✅ Pedido enviado! Está sendo criado e aparece em "Meus" pra você aprovar.</div>';
      setTimeout(() => setTab('meus'), 1500);
    } catch (e) {
      const net = e instanceof TypeError || e.name === 'AbortError';
      msg.innerHTML = '<div class="msg err">' + esc(net ? 'A conexão caiu no meio do envio. Tente num lugar com mais sinal ou wifi.' : 'Não deu pra enviar: ' + e.message) + '</div>';
      btn.disabled = false;
      btn.textContent = 'Tentar de novo';
    }
  }

  // Atualiza o status de cada pedido do Estúdio olhando a pasta dele.
  async function refreshMine() {
    const list = loadMine();
    let changed = false;
    await Promise.all(list.map(async (p, i) => {
      if (p.status === 'done' || p.status === 'fail') return;
      try {
        const res = await fetch('/api/pedido-folder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ client: p.client, pasta: p.pasta }) });
        const r = await res.json();
        let st = 'wait';
        const rev = r.revisao || [];
        if (rev.some((e) => String(e.name).toUpperCase() === 'APROVADO.TXT')) st = 'done';
        else if (rev.some((e) => e.type === 'file' && /\.(jpe?g|png|webp|mp4|mov)$/i.test(e.name))) st = 'ready';
        else {
          const gs = (r.root || []).find((e) => e.name === 'geracao-status.json');
          if (gs && gs.download_url) {
            try { const s = await (await fetch(gs.download_url)).json(); if (/failed/.test(String(s.status || ''))) st = 'fail'; } catch (e) {}
          }
        }
        if (st !== p.status) { list[i].status = st; changed = true; }
      } catch (e) {}
    }));
    if (changed) saveMine(list);
    if (tab === 'meus' && !stack.length) {
      view.querySelectorAll('.mine-item').forEach((el) => { const p = list[+el.dataset.idx]; if (p) el.querySelector('.st').innerHTML = statusHtml(p.status); });
      if (list.some((p) => p.status === 'wait')) { clearTimeout(refreshMine.t); refreshMine.t = setTimeout(refreshMine, 15000); }
    }
  }

  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  // Atalhos vindos dos botões da área "Máquina de Vendas Estúdio" do app:
  // #meus, #criar, #modelos, #modelos-<categoria>, #tool-<ferramenta>.
  const hash = location.hash.replace('#', '');
  if (hash.startsWith('modelos')) {
    const c = hash.split('-')[1];
    if (CATS.some((x) => x.id === c)) cat = c;
    setTab('modelos');
  } else if (hash.startsWith('tool-') && TOOLS.some((t) => t.id === hash.slice(5))) {
    setTab('criar');
    push({ type: 'tool', id: hash.slice(5) });
  } else {
    setTab(hash === 'meus' ? 'meus' : 'criar');
  }
})();
</script>
</body>
</html>
