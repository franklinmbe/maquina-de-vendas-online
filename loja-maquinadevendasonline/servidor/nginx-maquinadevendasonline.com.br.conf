server {
    server_name maquinadevendasonline.com.br www.maquinadevendasonline.com.br;
    client_max_body_size 128M;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/maquinadevendasonline.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maquinadevendasonline.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.maquinadevendasonline.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = maquinadevendasonline.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name maquinadevendasonline.com.br www.maquinadevendasonline.com.br;
    return 404; # managed by Certbot




}